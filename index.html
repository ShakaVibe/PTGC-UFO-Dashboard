    // ===== CoinGecko Pre-fetched Data (from GitHub) =====
    const COINGECKO_DATA_URL = 'https://raw.githubusercontent.com/shakavibe/PTGC-UFO-Dashboard/main/data/coingecko-data.json';
    const LIQUIDITY_HISTORY_URL = 'https://raw.githubusercontent.com/shakavibe/PTGC-UFO-Dashboard/main/data/liquidity-history.json';
    const TRANSACTION_HISTORY_URL = 'https://raw.githubusercontent.com/shakavibe/PTGC-UFO-Dashboard/main/data/transaction-history.json';
    const HOLDER_HISTORY_URL_NEW = 'https://raw.githubusercontent.com/shakavibe/PTGC-UFO-Dashboard/main/data/holder-history.json';
    const TOKENSINLP_HISTORY_URL = 'https://raw.githubusercontent.com/shakavibe/PTGC-UFO-Dashboard/main/data/tokensinlp-history.json';

    let coingeckoDataCache = null;
    let liquidityHistoryCache = null;
    let transactionHistoryCache = null;
    /* ===== MIGRATION: holder-history epoch =====
       holder-history.json still contains the OLD UFO token's snapshots, and we want to
       KEEP them (they're real history for that contract). But blending them with the new
       token's live count produces nonsense — a 5,196 vs 6,602 "decline" between two
       different assets.

       Rather than delete anything, we give UFO an epoch: any snapshot dated before the
       new token's first pool is ignored. Old rows stay on disk, untouched. As the
       generator script writes new rows against the new contract, history rebuilds itself
       and the boxes fill in on their own.

       ufoLaunchMs is learned from DexScreener's pairCreatedAt; the constant is only a
       floor in case that lookup fails. ===== */
    let ufoLaunchMs = null;
    const UFO_LAUNCH_FALLBACK_MS = Date.parse('2026-07-08T00:00:00Z');

    /* SINGLE SOURCE OF TRUTH for "PTGC burned by UFO". The Total Supply Burned panel AND its
       share card both render from this, so they can never drift again (they diverged once, by
       pTGC's own 0.5% burn fee). Prefer the delivered-value scan (it discriminates that fee
       out); fall back to fetchPtgcBurnedByUfo; blend the old contract's pre-launch history from
       the JSON rows, with a launch cutoff and a double-count guard. Pure function of its inputs. */
    const computePtgcBurnedByUfo=(delivered,ptgcByUfoLive,burnHistoryCache,data)=>{
      const ptgcByUFO=burnHistoryCache?.PTGCbyUFO;
      const ptgcTotalSupply=TOKENS.PTGC.totalSupply;
      const oldBurned=ptgcByUFO?.totalBurned||0;
      const dvP=(delivered&&delivered.ok)?delivered.byPeriod:null;
      const ptgcSrc=dvP?{
        total:dvP['90d'].ptgcBurned,h24:dvP['24h'].ptgcBurned,
        d7:dvP['7d'].ptgcBurned,d30:dvP['30d'].ptgcBurned,d90:dvP['90d'].ptgcBurned
      }:(ptgcByUfoLive||null);
      const newBurned=ptgcSrc?ptgcSrc.total:0;
      const totalBurned=oldBurned+newBurned;
      const burnPct=ptgcTotalSupply>0?(totalBurned/ptgcTotalSupply)*100:0;
      const oldRows=burnHistoryCache?.PTGCbyUFORows;
      const mine={};
      if(delivered&&delivered.ok&&delivered.swapbackTxs)delivered.swapbackTxs.forEach(t=>{mine[t]=true;});
      const launchMs=(()=>{const fp=data?.pairs?.reduce((m,pr)=>(pr.pairCreatedAt&&pr.pairCreatedAt<m)?pr.pairCreatedAt:m,Infinity);return (fp&&isFinite(fp))?fp:UFO_LAUNCH_FALLBACK_MS;})();
      const oldFor=hrs=>{
        if(!Array.isArray(oldRows))return null;
        const cut=Date.now()-hrs*3600*1000;
        if(launchMs<=cut)return 0;
        let sum=0;
        for(let i=0;i<oldRows.length;i++){const r=oldRows[i];if(!r||r.t<cut)continue;if(r.t>=launchMs)continue;if(r.tx&&mine[r.tx])continue;sum+=r.a||0;}
        return sum;
      };
      const combine=(neu,hrs)=>{if(neu==null)return null;const old=oldFor(hrs);return old==null?neu:neu+old;};
      const periods=ptgcSrc
        ?{h24:{amount:combine(ptgcSrc.h24,24)},d7:{amount:combine(ptgcSrc.d7,24*7)},d30:{amount:combine(ptgcSrc.d30,24*30)},d90:{amount:combine(ptgcSrc.d90,24*90)}}
        :null;
      const periodsHaveOld=Array.isArray(oldRows);
      return{ptgcSrc,oldBurned,newBurned,totalBurned,burnPct,periods,periodsHaveOld};
    };

    /* Measured Value Generated per bucket for a period — the same delivered on-chain basis as
       the Value Generated panel and the KPI card (each bucket's delivered tokens × price; LP
       buckets are UFO + partner). The share card used volume × tax, which reads $0 while a
       young token has no volume baseline. Returns null until the delivered scan is ready. */
    const computeValueGenBuckets=(period,delivered,realizedFees,prices)=>{
      if(!delivered||!delivered.ok||!realizedFees||!realizedFees.ok)return null;
      const dv=delivered.byPeriod[period],live=realizedFees.byPeriod[period];
      if(!dv||!live)return null;
      const px=k=>prices[k]||0;
      const lp=(sym,quoteKey)=>{const e=dv.lp&&dv.lp[sym];return e?(e.ufo*px('UFO')+e.quote*px(quoteKey)):0;};
      const byKey={
        reflection:(live.tokens?.reflection||0)*px('UFO'),
        ufoBurn:(dv.ufoBurned||0)*px('UFO'),
        ptgcBurn:(dv.ptgcBurned||0)*px('PTGC'),
        plsLP:lp('WPLS','PLS'),
        plsxLP:lp('PLSX','PLSX'),
        wethLP:lp('WETH','WETH')
      };
      const total=byKey.reflection+byKey.ufoBurn+byKey.ptgcBurn+byKey.plsLP+byKey.plsxLP+byKey.wethLP;
      return {byKey,total};
    };
    const historyEpochMs = (tkn) => (tkn === 'UFO') ? (ufoLaunchMs || UFO_LAUNCH_FALLBACK_MS) : 0;

    // Snapshots that legitimately describe `tkn`: after its epoch, with a real count.
    const snapshotsFor = (tkn) => {
      const snaps = holderHistoryCacheNew?.snapshots || [];
      const epoch = historyEpochMs(tkn);
      return snaps.filter(sn => {
        const t = new Date(sn.timestamp).getTime();
        return isFinite(t) && t >= epoch && sn[tkn] > 0;
      });
    };

    let holderHistoryCacheNew = null;
    let tokensInLPHistoryCache = null;

    const fetchCoingeckoData = async () => {
      if (coingeckoDataCache) return coingeckoDataCache;
      try {
        const r = await fetch(COINGECKO_DATA_URL + '?t=' + Date.now());
        coingeckoDataCache = await r.json();
        console.log('CoinGecko data loaded:', coingeckoDataCache.lastUpdated);
        return coingeckoDataCache;
      } catch (e) {
        console.error('Failed to load CoinGecko data:', e);
        return null;
      }
    };

    const fetchLiquidityHistory = async () => {
      if (liquidityHistoryCache) return liquidityHistoryCache;
      try {
        const r = await fetch(LIQUIDITY_HISTORY_URL + '?t=' + Date.now());
        liquidityHistoryCache = await r.json();
        console.log('Liquidity history loaded:', liquidityHistoryCache.snapshots?.length, 'snapshots');
        return liquidityHistoryCache;
      } catch (e) {
        console.error('Failed to load liquidity history:', e);
        return null;
      }
    };

    const fetchTransactionHistory = async () => {
      if (transactionHistoryCache) return transactionHistoryCache;
      try {
        const r = await fetch(TRANSACTION_HISTORY_URL + '?t=' + Date.now());
        transactionHistoryCache = await r.json();
        console.log('Transaction history loaded:', transactionHistoryCache.snapshots?.length, 'snapshots');
        return transactionHistoryCache;
      } catch (e) {
        console.error('Failed to load transaction history:', e);
        return null;
      }
    };

    const fetchHolderHistoryNew = async () => {
      if (holderHistoryCacheNew) return holderHistoryCacheNew;
      try {
        const r = await fetch(HOLDER_HISTORY_URL_NEW + '?t=' + Date.now());
        holderHistoryCacheNew = await r.json();
        console.log('Holder history loaded:', holderHistoryCacheNew.snapshots?.length, 'snapshots');
        return holderHistoryCacheNew;
      } catch (e) {
        console.error('Failed to load holder history:', e);
        return null;
      }
    };

    const fetchTokensInLPHistory = async () => {
      if (tokensInLPHistoryCache) return tokensInLPHistoryCache;
      try {
        const r = await fetch(TOKENSINLP_HISTORY_URL + '?t=' + Date.now());
        tokensInLPHistoryCache = await r.json();
        console.log('TokensInLP history loaded:', tokensInLPHistoryCache.snapshots?.length, 'snapshots');
        return tokensInLPHistoryCache;
      } catch (e) {
        console.error('Failed to load tokensInLP history:', e);
        return null;
      }
    };

    // Find snapshot closest to target time ago
    const findSnapshotAt = (snapshots, hoursAgo) => {
      if (!snapshots || snapshots.length === 0) return null;
      const targetTime = Date.now() - (hoursAgo * 60 * 60 * 1000);
      let closest = null;
      let closestDiff = Infinity;
      for (const snap of snapshots) {
        const snapTime = new Date(snap.timestamp).getTime();
        const diff = Math.abs(snapTime - targetTime);
        if (diff < closestDiff) {
          closestDiff = diff;
          closest = snap;
        }
      }
      // Only return if within 2 hours of target
      return closestDiff < 2 * 60 * 60 * 1000 ? closest : null;
    };

    const getLiquidityChange = (token, hoursAgo = 24) => {
      if (!liquidityHistoryCache?.snapshots || liquidityHistoryCache.snapshots.length < 2) return null;
      const snapshots = liquidityHistoryCache.snapshots;
      const current = snapshots[snapshots.length - 1];
      const past = findSnapshotAt(snapshots, hoursAgo);
      if (!current || !past) return null;
      const currentVal = current[token] || 0;
      const pastVal = past[token] || 0;
      if (pastVal === 0) return null;
      return {
        change: currentVal - pastVal,
        changePercent: ((currentVal - pastVal) / pastVal) * 100,
        current: currentVal,
        past: pastVal
      };
    };

    const getTransactionChange = (token, hoursAgo = 24) => {
      if (!transactionHistoryCache?.snapshots || transactionHistoryCache.snapshots.length < 2) return null;
      const snapshots = transactionHistoryCache.snapshots;
      const current = snapshots[snapshots.length - 1];
      const past = findSnapshotAt(snapshots, hoursAgo);
      if (!current || !past) return null;
      const currentTxns = current[token]?.total || 0;
      const pastTxns = past[token]?.total || 0;
      if (pastTxns === 0) return null;
      return {
        change: currentTxns - pastTxns,
        changePercent: ((currentTxns - pastTxns) / pastTxns) * 100,
        current: current[token],
        past: past[token]
      };
    };

    const getTokensInLPChange = (token, hoursAgo = 24) => {
      if (!tokensInLPHistoryCache?.snapshots || tokensInLPHistoryCache.snapshots.length < 2) return null;
      const snapshots = tokensInLPHistoryCache.snapshots;
      const current = snapshots[snapshots.length - 1];
      const past = findSnapshotAt(snapshots, hoursAgo);
      if (!current || !past) return null;
      const currentVal = current[token] || 0;
      const pastVal = past[token] || 0;
      if (pastVal === 0) return null;
      return {
        change: currentVal - pastVal,
        changePercent: ((currentVal - pastVal) / pastVal) * 100,
        current: currentVal,
        past: pastVal
      };
    };

    const getMultiPeriodChanges = (historyCache, token, getValue) => {
      if (!historyCache?.snapshots || historyCache.snapshots.length < 2) return {};
      const snapshots = historyCache.snapshots;
      const current = snapshots[snapshots.length - 1];
      const currentVal = getValue(current, token);
      const periods = [
        { label: '24H', hours: 24 },
        { label: '7D', hours: 24 * 7 },
        { label: '30D', hours: 24 * 30 },
        { label: '90D', hours: 24 * 90 }
      ];
      const result = {};
      for (const period of periods) {
        const past = findSnapshotAt(snapshots, period.hours);
        if (past) {
          const pastVal = getValue(past, token);
          if (pastVal > 0) {
            result[period.label] = {
              change: currentVal - pastVal,
              changePercent: ((currentVal - pastVal) / pastVal) * 100,
              current: currentVal,
              past: pastVal
            };
          }
        }
      }
      return result;
    };

    const fetchPLSBalance=async(addr)=>{try{const r=await rpcFetch({jsonrpc:'2.0',method:'eth_getBalance',params:[addr,'latest'],id:1});return Number(BigInt(r.result||'0x0'))/1e18}catch{return 0}};
    
    const fetchTokenBalance=async(tokenAddr,walletAddr,decimals)=>{
      try{
        const data='0x70a08231000000000000000000000000'+walletAddr.slice(2).toLowerCase();
        const r=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:tokenAddr,data},'latest'],id:1});

      }catch{return 0}
    };
    
    // Fetch staking data - totalStaked() and totalLocked() from contract
    // Note: totalLocked is a SUBSET of totalStaked, not separate
    const fetchStakingData=async(stakingContract,tokenAddr,decimals,maxSupply)=>{
      try{
        let totalStakedTokens=0;
        let lockedTokens=0;
        
        // totalStaked() = 0x817b1cd2 - returns ALL tokens in staking (including locked)
        const stakedRes=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:stakingContract,data:'0x817b1cd2'},'latest'],id:1});
        console.log('totalStaked() raw:',stakedRes.result);
        if(stakedRes.result&&stakedRes.result!=='0x'&&stakedRes.result.length>2){
          totalStakedTokens=Number(BigInt(stakedRes.result))/Math.pow(10,decimals);
        }
        console.log('Total in staking contract:',totalStakedTokens);
        
        // totalLocked() = 0x56891412 - returns locked tokens (subset of totalStaked)
        const lockedRes=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:stakingContract,data:'0x56891412'},'latest'],id:2});
        console.log('totalLocked() raw:',lockedRes.result);
        if(lockedRes.result&&lockedRes.result!=='0x'&&lockedRes.result.length>2){
          lockedTokens=Number(BigInt(lockedRes.result))/Math.pow(10,decimals);
        }
        console.log('Locked tokens:',lockedTokens);
        
        // Staked (flexible) = totalStaked - totalLocked
        const stakedTokens=Math.max(0,totalStakedTokens-lockedTokens);
        console.log('Staked (flexible) tokens:',stakedTokens);
        
        // Calculate percentages using maxSupply (333,333,333,333)
        const stakedPct=maxSupply>0?(stakedTokens/maxSupply)*100:0;
        const lockedPct=maxSupply>0?(lockedTokens/maxSupply)*100:0;
        
        console.log('Staked %:',stakedPct.toFixed(4)+'%, Locked %:',lockedPct.toFixed(4)+'%');
        
        return{
          staked:stakedTokens,
          stakedPct,
          locked:lockedTokens,
          lockedPct
        };
      }catch(e){
        console.error('Error fetching staking data:',e);
        return{staked:0,stakedPct:0,locked:0,lockedPct:0};
      }
    };
    
    // Management wallet tokens with hardcoded prices (same as ProWeb)
    const MANAGEMENT_TOKENS = [
      { symbol: 'USDC', address: '0x15D38573d2feeb82e7ad5187aB8c1D52810B1f07', decimals: 6, stablecoin: true },
      { symbol: 'USDT', address: '0x0Cb6F5a34ad42ec934882A05265A7d5F59b51A2f', decimals: 6, stablecoin: true },
      { symbol: 'DAI', address: '0xefD766cCb38EaF1dfd701853BFCe31359239F305', decimals: 18, stablecoin: true },
      { symbol: 'PLSX', address: '0x95B303987A60C71504D99Aa1b13B4DA07b0790ab', decimals: 18 },
      { symbol: 'HEX', address: '0x2b591e99afE9f32eAA6214f7B7629768c40Eeb39', decimals: 8 },
      { symbol: 'INC', address: '0x2fa878Ab3F87CC1C9737Fc071108F904c0B0C95d', decimals: 18 },
      { symbol: 'WBTC', address: '0xb17D901469B9208B17d916112988A3FeD19b5cA1', decimals: 8 },
      { symbol: 'WETH', address: '0x02DcdD04e3F455D838cd1249292C58f3B79e3C3C', decimals: 18 },
      { symbol: 'EHEX', address: '0x57fde0a71132198BBeC939B98976993d8D89D225', decimals: 8 },
    ];
    
    // Fetch token price from DexScreener
    const fetchTokenPrice = async (tokenAddress) => {
      try {
        const data = { pairs: await dsPairsFor(tokenAddress) };
        if (data.pairs && data.pairs.length > 0) {
          // Find the pair with highest liquidity for most accurate price
          const sortedPairs = data.pairs
            .filter(p => p.chainId === 'pulsechain' && parseFloat(p.priceUsd) > 0)
            .sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
          if (sortedPairs.length > 0) {
            return parseFloat(sortedPairs[0].priceUsd) || 0;
          }
        }
        return 0;
      } catch (e) {
        console.error(`Error fetching price for ${tokenAddress}:`, e);
        return 0;
      }
    };
    
    // Cache for token prices (refreshed each time fetchDAOData runs)
    let tokenPriceCache = {};
    
    // Fetch DAO data - matching ProWeb exactly
    const fetchDAOData=async(daoContract,managementWallet,plsPrice)=>{
      try{
        // 1. Get DAO contract PLS balance (eth_getBalance)
        const daoBalanceResult=await rpcFetch({jsonrpc:'2.0',method:'eth_getBalance',params:[daoContract,'latest'],id:1});
        const daoBalanceWei=BigInt(daoBalanceResult.result||'0x0');
        const daoBalancePLS=Number(daoBalanceWei)/1e18;
        console.log('DAO contract total:',daoBalancePLS,'PLS');
        
        // 2. Get lockedAmount() from DAO contract - selector 0x6ab28bc8
        let lockedAmountWei=0n;
        try{
          const lockResult=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:daoContract,data:'0x6ab28bc8'},'latest'],id:2});
          console.log('lockedAmount raw result:',lockResult.result);
          if(lockResult.result&&lockResult.result.length>2){
            lockedAmountWei=BigInt(lockResult.result);
          }
        }catch(e){console.error('lockedAmount error:',e)}
        const lockedAmountPLS=Number(lockedAmountWei)/1e18;
        console.log('Locked/pending amount:',lockedAmountPLS,'PLS');
        
        // 2b. Get proposal count and count active ones - proposalCount() selector 0xda35c664
        let pendingCount=0;
        try{
          const pcResult=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:daoContract,data:'0xda35c664'},'latest'],id:5});
          if(pcResult.result&&pcResult.result!=='0x'){
            const proposalCount=parseInt(pcResult.result,16);
            // Check state of recent proposals in parallel - state() selector 0x3e4f49e6
            const startId=Math.max(1,proposalCount-10);
            const statePromises=[];
            for(let i=proposalCount;i>=startId;i--){
              const idHex=i.toString(16).padStart(64,'0');
              statePromises.push(
                rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:daoContract,data:'0x3e4f49e6'+idHex},'latest'],id:6})
                  .then(r=>r.result?parseInt(r.result,16):-1)
                  .catch(()=>-1)
              );
            }
            const states=await Promise.all(statePromises);
            pendingCount=states.filter(s=>s===0||s===1).length;
          }
        }catch(e){console.error('proposalCount error:',e)}
        console.log('Active proposals:',pendingCount);
        
        // 3. Calculate available = total - locked (using BigInt for precision)
        const availableWei=daoBalanceWei>lockedAmountWei?daoBalanceWei-lockedAmountWei:0n;
        const availablePLS=Number(availableWei)/1e18;
        console.log('Available for new proposals:',availablePLS,'PLS');
        
        // 4. Get management wallet PLS balance
        const mgmtBalanceResult=await rpcFetch({jsonrpc:'2.0',method:'eth_getBalance',params:[managementWallet,'latest'],id:3});
        const mgmtPLSWei=BigInt(mgmtBalanceResult.result||'0x0');
        const mgmtPLS=Number(mgmtPLSWei)/1e18;
        console.log('Management wallet PLS:',mgmtPLS);
        
        // 5. Get management wallet token balances in parallel with dynamic prices
        let managementTotalUSD=mgmtPLS*plsPrice;
        const managementTokens=[{symbol:'PLS',balance:mgmtPLS,usdValue:mgmtPLS*plsPrice,price:plsPrice}];
        
        // First, fetch all token prices in parallel from DexScreener
        console.log('Fetching dynamic token prices from DexScreener...');
        const pricePromises = MANAGEMENT_TOKENS.filter(t => !t.stablecoin).map(async (token) => {
          const price = await fetchTokenPrice(token.address);
          console.log(`${token.symbol} price from DexScreener: $${price}`);
          return { symbol: token.symbol, address: token.address, price };
        });
        const priceResults = await Promise.all(pricePromises);
        
        // Build price lookup map
        const priceMap = {};
        priceResults.forEach(p => {
          priceMap[p.address.toLowerCase()] = p.price;
        });
        
        // Now fetch balances and calculate USD values
        const tokenPromises=MANAGEMENT_TOKENS.map(async(token)=>{
          try{
            const data='0x70a08231000000000000000000000000'+managementWallet.slice(2).toLowerCase();
            const tokenResult=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:token.address,data},'latest'],id:4});
            if(tokenResult.result&&tokenResult.result!=='0x'&&tokenResult.result!=='0x0'){
              const balanceWei=BigInt(tokenResult.result);
              const balance=Number(balanceWei)/Math.pow(10,token.decimals);
              if(balance>0.0001){
                // Use stablecoin price of 1, otherwise use dynamic price from DexScreener
                const price = token.stablecoin ? 1 : (priceMap[token.address.toLowerCase()] || 0);
                const usdValue=balance*price;
                console.log(`Management ${token.symbol}: ${balance.toLocaleString()} @ $${price} = $${usdValue.toLocaleString()}`);
                return{symbol:token.symbol,balance,usdValue,price};
              }
            }
          }catch(e){console.error(`Error fetching ${token.symbol}:`,e)}
          return null;
        });
        
        const tokenResults=await Promise.all(tokenPromises);
        tokenResults.forEach(t=>{
          if(t&&t.usdValue>0){
            managementTokens.push(t);
            managementTotalUSD+=t.usdValue;
          }
        });
        console.log('Management wallet total USD:',managementTotalUSD);
        
        // 6. Fetch PTGC balance in treasury wallet (excluded from managementValue, included in totalValue)
        let ptgcBalance=0,ptgcPrice=0,ptgcUSD=0;
        try{
          const ptgcPriceP=fetchTokenPrice(TOKENS.PTGC.address);
          const ptgcData='0x70a08231000000000000000000000000'+managementWallet.slice(2).toLowerCase();
          const ptgcBalP=rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:TOKENS.PTGC.address,data:ptgcData},'latest'],id:7});
          const[ptgcPriceRes,ptgcBalRes]=await Promise.all([ptgcPriceP,ptgcBalP]);
          ptgcPrice=ptgcPriceRes||0;
          if(ptgcBalRes.result&&ptgcBalRes.result!=='0x'&&ptgcBalRes.result!=='0x0'){
            ptgcBalance=Number(BigInt(ptgcBalRes.result))/Math.pow(10,TOKENS.PTGC.decimals);
            ptgcUSD=ptgcBalance*ptgcPrice;
          }
          console.log(`Treasury PTGC: ${ptgcBalance.toLocaleString()} @ $${ptgcPrice} = $${ptgcUSD.toLocaleString()}`);
        }catch(e){console.error('PTGC balance fetch error:',e)}
        
        // 7. Calculate totals (PTGC included in totalValue but not managementValue)
        const availableUSD=availablePLS*plsPrice;
        const pendingUSD=lockedAmountPLS*plsPrice;
        const totalValue=availableUSD+pendingUSD+managementTotalUSD+ptgcUSD;
        
        console.log('Total DAO value:',totalValue);
        
        return{
          availablePLS,
          availableUSD,
          pendingPLS:lockedAmountPLS,
          pendingUSD,
          pendingCount,
          managementValue:managementTotalUSD,
          managementTokens,
          ptgcBalance,
          ptgcPrice,
          ptgcUSD,
          totalValue
        };
      }catch(e){
        console.error('Error fetching DAO data:',e);
        return null;
      }
    };
    
    // Fetch holders - stop after Dolphin tier, calculate rest as Squid & Below
    const fetchHolderTiers=async(addr,cfg,totalHolderCount,lpAddresses=[])=>{
      const counts={Poseidon:0,Whale:0,Shark:0,Dolphin:0};
      let queryOk=true,lastErr=null,complete=false;
      let nextPageParams=null;
      let totalFetched=0;
      const maxPages=20;
      let page=0;
      let countedHolders=0;
      
      // Combine static LP addresses with dynamic ones (exclude LP pools only)
      const allLPAddresses=[...LP_ADDRESSES,...lpAddresses].map(a=>a.toLowerCase());
      
      /* PulseScan occasionally 500s or times out on a single page. That used to end the
         whole scan and render the tiers as a lower bound (the "≥" prefix), with squid unknown.
         Retry a failing page a couple of times with a short backoff before giving up — most
         failures are transient, so this lets the scan reach completeness and show exact counts. */
      /* MIGRATION: UFO's holder pages respond slower than PTGC's (~4.2s vs ~2.8s) and
         PulseScan 500s intermittently, so 3 tries/9s occasionally ran out mid-scan and the
         tiers came back a lower bound ("≥"). More tries + a longer timeout let the scan ride
         out a bad page and finish exact, matching PTGC. Retries are cheap when pages succeed. */
      const HOLDER_PAGE_TRIES=6;
      const fetchPage=async(pageUrl)=>{
        for(let attempt=0;attempt<HOLDER_PAGE_TRIES;attempt++){
          const last=attempt>=HOLDER_PAGE_TRIES-1;
          const controller=new AbortController();
          const timeoutId=setTimeout(()=>controller.abort(),12000);
          try{
            const r=await fetch(pageUrl,{signal:controller.signal});
            clearTimeout(timeoutId);
            if(!r.ok){if(!last){await new Promise(s=>setTimeout(s,600*(attempt+1)));continue;}return{err:`holders API returned ${r.status}`};}
            const j=await r.json();
            if(!j||!Array.isArray(j.items)){if(!last){await new Promise(s=>setTimeout(s,600*(attempt+1)));continue;}return{err:'holders API returned no items array'};}
            return{data:j};
          }catch(e){
            clearTimeout(timeoutId);
            if(!last){await new Promise(s=>setTimeout(s,600*(attempt+1)));continue;}
            return{err:e.message||'holders fetch failed'};
          }
        }
        return{err:'holders fetch failed'};
      };
      
      try{
        while(page<maxPages){
          const url=nextPageParams
            ?`https://api.scan.pulsechain.com/api/v2/tokens/${addr}/holders?${nextPageParams}`
            :`https://api.scan.pulsechain.com/api/v2/tokens/${addr}/holders?limit=50`;
          
          /* fetchPage retries transient failures; it returns {err} only if it truly can't
             read the page, which leaves the tiers a lower bound rather than a false zero. */
          const res=await fetchPage(url);
          if(res.err){queryOk=false;lastErr=res.err;break;}
          const data=res.data;
          const items=data.items;
            
            if(items.length===0){complete=true;break;}
            
            let foundBelowDolphin=false;
            
            for(const holder of items){
              const holderAddr=holder.address?.hash?.toLowerCase();
              if(allLPAddresses.includes(holderAddr))continue;
              if(cfg.stakingContract&&holderAddr===cfg.stakingContract.toLowerCase())continue;
              
              const tokens=parseFloat(holder.value||0)/Math.pow(10,cfg.decimals);
              const pctOfSupply=(tokens/cfg.totalSupply)*100;
              
              // Stop at Dolphin threshold (0.01%)
              if(pctOfSupply<0.01){
                foundBelowDolphin=true;
                break;
              }
              
              if(pctOfSupply>=10)counts.Poseidon++;
              else if(pctOfSupply>=1)counts.Whale++;
              else if(pctOfSupply>=0.1)counts.Shark++;
              else if(pctOfSupply>=0.01)counts.Dolphin++;
              
              countedHolders++;
            }
            
            totalFetched+=items.length;
            
            /* Holders arrive sorted by balance, descending. Once we cross below the Dolphin
               threshold every tier above it is fully counted — the rest of the list cannot
               contain another whale. That, not "we finished the loop", is completeness. */
            if(foundBelowDolphin){complete=true;break;}
            
            if(data.next_page_params){
              const params=new URLSearchParams();
              /* PulseScan returns the cursor `value` as a raw JSON number — a holder balance
                 in wei (>2^53). JSON.parse silently rounds it to the nearest float (e.g.
                 1.3628695280000001e26), so the digits are already wrong by the time we read
                 next_page_params — toLocaleString only reformats the corrupted float, and the
                 API 500s on the mismatched value. The per-holder `value` in items[] IS returned
                 as a STRING (full precision), so build the cursor from the last item's value. */
              const lastItem=items[items.length-1];
              const preciseValue=(lastItem&&lastItem.value!=null)?String(lastItem.value):null;
              Object.entries(data.next_page_params).forEach(([k,v])=>{
                let out;
                if(k==='value'&&preciseValue!=null) out=preciseValue;
                else if(typeof v==='number'&&Math.abs(v)>=1e21) out=v.toLocaleString('fullwide',{useGrouping:false});
                else out=v;
                params.set(k,out);
              });
              nextPageParams=params.toString();
            }else{
              complete=true;   // no more pages: we have seen every holder
              break;
            }
            page++;
        }
      }catch(e){
        console.error('Error fetching holders:',e);
        queryOk=false;lastErr=e.message||'holders fetch failed';
      }
      /* Three outcomes, not two:
           complete            -> the counts are exact
           partial (some pages)-> the counts are a LOWER BOUND. Throwing them away and
                                  printing "—" discards ~400 holders of good data.
           nothing fetched     -> genuinely unknown. */
      if(!queryOk&&complete)console.warn(`holder tiers: ${lastErr}, but every tier above Dolphin was already counted — figures are exact`);
      else if(!queryOk&&countedHolders>0)console.warn(`holder tiers PARTIAL: ${lastErr} — counts are a lower bound over the top ${totalFetched} holders`);
      else if(!queryOk)console.warn(`holder tiers UNAVAILABLE: ${lastErr} — counts are NOT zero, they are unknown`);
      
      // Squid & Below = total holders - counted tiers - LP addresses - staking contract
      const excludedAddresses=allLPAddresses.length+(cfg.stakingContract?1:0);
      const squidAndBelow=Math.max(0,totalHolderCount-countedHolders-excludedAddresses);
      
      return{counts,countedHolders,squidAndBelow,total:totalFetched,
             ok:(queryOk||complete),          // a failure after completion is not a failure
             partial:(!queryOk&&!complete&&countedHolders>0),
             complete,error:lastErr};
    };
    
    const DonutChart=({data,colors,size=120})=>{
      const total=data.reduce((s,d)=>s+d.value,0);
      if(total===0)return<svg width={size} height={size}><circle cx={size/2} cy={size/2} r={size/2-10} fill="none" stroke="#333" strokeWidth={size*0.17}/></svg>;
      let cumulative=0;
      const r=size/2;
      const strokeWidth=r*0.35;
      const radius=r-strokeWidth/2;
      const circumference=2*Math.PI*radius;
      
      return(
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          {data.map((d,i)=>{
            const pct=total>0?(d.value/total)*100:0;
            const offset=circumference*(1-cumulative/100);
            const length=circumference*(pct/100);
            cumulative+=pct;
            return<circle key={i} cx={r} cy={r} r={radius} fill="none" stroke={colors[i%colors.length]} strokeWidth={strokeWidth} strokeDasharray={`${length} ${circumference-length}`} strokeDashoffset={offset} transform={`rotate(-90 ${r} ${r})`}/>;
          })}
          <circle cx={r} cy={r} r={radius-strokeWidth/2} fill="#0a0a0a"/>
        </svg>
      );
    };

                <>
                  <svg viewBox="0 0 100 24" className="w-16 sm:w-20 h-6"><polyline points="0,12 30,12 60,12 100,12" fill="none" stroke="rgba(255,255,255,0.15)" strokeWidth="2" strokeDasharray="4 4"/></svg>

                <>
                  {/* REAL sparkline: prices at t-24h, t-6h, t-1h, t-5m, now, back-computed from
                      DexScreener's % changes against the live price. Previously these points were
                      hardcoded shapes that only matched the 24h direction — a fake chart. If the
                      change data is missing we show a neutral dashed line, never an invented trend. */}
                  {(()=>{
                    const pc=d?.priceChange,price=d?.price||0;
                    const pts=(pc&&price>0)?[
                      ['h24',24],['h6',6],['h1',1],['m5',5/60]
                    ].filter(([k])=>pc[k]!=null&&isFinite(parseFloat(pc[k])))
                     .map(([k,hrs])=>({t:-hrs,p:price/(1+parseFloat(pc[k])/100)}))
                     .concat([{t:0,p:price}]):null;
                    if(!pts||pts.length<2)return<svg viewBox="0 0 100 24" className="w-16 sm:w-20 h-6"><polyline points="0,12 100,12" fill="none" stroke="rgba(255,255,255,0.15)" strokeWidth="2" strokeDasharray="4 4"/></svg>;
                    /* x uses sqrt-time spacing: with linear time the 6h/1h/5m points all land in
                       the last 4% of width and vanish. Sqrt keeps chronological order and real
                       values while making recent movement legible — standard sparkline license. */
                    const tMax=Math.abs(pts[0].t)||1,ps=pts.map(x=>x.p);
                    const pMin=Math.min(...ps),pMax=Math.max(...ps),span=pMax-pMin;
                    const line=pts.map(x=>`${((1-Math.sqrt(Math.abs(x.t)/tMax))*100).toFixed(1)},${span===0?'12.0':(21-((x.p-pMin)/span)*18).toFixed(1)}`).join(' ');

                  })()}

      return(

          <header className="text-center pt-4"><img src={COMBINED_LOGO} alt="PTGC & UFO" className="h-48 sm:h-64 md:h-80 lg:h-96 mx-auto"/><h1 className="font-orbitron text-2xl sm:text-3xl lg:text-4xl font-bold -mt-6 sm:-mt-10" style={{background:'linear-gradient(180deg,#FFF,#808080)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>THE GRAYS</h1><h1 className="font-orbitron text-3xl sm:text-4xl lg:text-5xl font-bold mb-2" style={{background:'linear-gradient(180deg,#FFF,#808080)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>DASHBOARD</h1><p className="text-white/50 text-sm sm:text-lg mb-6 sm:mb-10">A community tool built for The Grays Ecosystem</p></header>
          <div className="flex-1 flex justify-center pb-8"><div className="flex flex-col gap-4 sm:gap-6 max-w-3xl w-full">{loading?<><div className="animate-pulse bg-white/10 rounded-2xl h-32"></div><div className="animate-pulse bg-white/10 rounded-2xl h-32"></div></>:<><Card token="PTGC" d={data.PTGC}/><Card token="UFO" d={data.UFO}/><div className="flex justify-center"><FreshnessBadge lastUpdate={lastUpdate} refreshing={refreshing} error={refreshError} onRefresh={()=>quickRefreshRef.current()}/></div></>}</div></div>

      const match=str.match(/^0\.(0+)([1-9]\d*)/);
      if(match){
        const zeros=match[1].length;
        const sig=match[2].slice(0,4);
        return<>$0.0<sub style={{fontSize:'0.6em',verticalAlign:'baseline'}}>{zeros}</sub>{sig}</>;

      return`$${price.toFixed(6)}`;

    // KPI Content component with dual token support

        try{

          const _ofile=_osnaps.length?_osnaps[_osnaps.length-1][otherToken]:null;
          const h=_ofile!=null?_ofile:await fetchHolders(otherCfg.address);

      // Render a single KPI card

        const volChange=(t===token)

        const valueGen7d=valueGenMeasured?valueGen7dUsd:(()=>{const vol7d=volumeByPeriod?.vol7d;if(vol7d!=null&&vol7d>0)return vol7d*c.taxRate;const ba=bp.d7||0;const pr=d?.price||0;const br=isPTGC?0.005:0.01;const v=ba>0?(ba*pr)/br:0;return v*c.taxRate;})();

                  <span className="text-sm text-gray-300 font-semibold">PulseChain</span>

          </div>
        );
      };
      
      // Get other token's burn periods from the shared cache
      const otherBurnPeriods=getOtherBurnPeriods();
      
      // Twitter Card Component for screenshot
      const TwitterCard=({t,c,d,b,bp,h})=>{
        const isPTGC=t==='PTGC';
        const pc=isPTGC?'#D4AF37':'#7CFC00';

          if (liqChange) setLiquidityChange24h(liqChange.changePercent);
          
          const txnChange = getTransactionChange(token, 24);
          if (txnChange) setTxnChange24h(txnChange.changePercent);
          
          const tilpChange = getTokensInLPChange(token, 24);
          if (tilpChange) setTokensInLPChange24h(tilpChange.changePercent);
          
          // Start these in parallel after initial load
          if(cfg.stakingContract){
            fetchStakingData(cfg.stakingContract,cfg.address,cfg.decimals,cfg.totalSupply).then(staking=>setStakingData(staking));
          }
          
          // Holder tiers — three-tier sourcing, fastest-and-freshest first:
          //   1) prebuilt file (token-allocation.json, rebuilt server-side every few hours) —
          //      instant for EVERY visitor, no live scan. This is the intended steady state.
          //   2) localStorage cache from a prior live scan (<2h) — instant for a returning browser.
          //   3) live PulseScan scan (~14-18 pages / ~50s) — last resort; caches a complete result.
          // Until the Action publishes the file, step 1 simply misses and we behave as before.
          const lpPairAddresses=d?.pairs?.map(p=>p.pairAddress).filter(Boolean)||[];
          const tierCacheKey='grays_tiers_'+cfg.address.toLowerCase();
          const ALLOC_FILE='https://raw.githubusercontent.com/shakavibe/PTGC-UFO-Dashboard/main/data/token-allocation.json';
          const applyTiers=(tierObj,cache)=>{
            setHolderTiers(tierObj);
            if(cache){try{localStorage.setItem(tierCacheKey,JSON.stringify({ts:Date.now(),tiers:tierObj}));}catch(e){}}
          };
          (async()=>{
            // 1) Prebuilt file (cache-busted hourly)
            try{
              const r=await fetch(ALLOC_FILE+'?t='+Math.floor(Date.now()/3600000));
              if(r.ok){
                const j=await r.json();
                const t=j&&j.tokens&&j.tokens[token]&&j.tokens[token].tiers;
                if(t&&typeof t.Whale==='number'){
                  applyTiers({Poseidon:t.Poseidon||0,Whale:t.Whale||0,Shark:t.Shark||0,Dolphin:t.Dolphin||0,SquidAndBelow:(t.SquidAndBelow!=null?t.SquidAndBelow:null),ok:true,partial:false,error:null},true);
                  return;
                }
              }
            }catch(e){}
            // 2) localStorage cache from a prior live scan
            try{const raw=localStorage.getItem(tierCacheKey);if(raw){const o=JSON.parse(raw);if(o&&o.ts&&(Date.now()-o.ts)<7200000&&o.tiers){setHolderTiers(o.tiers);return;}}}catch(e){}
            // 3) Live scan (slow; caches a complete result for next time)
            fetchHolderTiers(cfg.address,cfg,h,lpPairAddresses).then(result=>{
              /* Exact -> the number. Partial -> a lower bound, still worth showing.
                 Nothing at all -> null, and the tiles print "—". Zero whales is a claim,
                 and a failed query is no basis for it. */
              const v=n=>(result.ok||result.partial)?(n||0):null;
              applyTiers({
                Poseidon:v(result.counts.Poseidon),
                Whale:v(result.counts.Whale),
                Shark:v(result.counts.Shark),
                Dolphin:v(result.counts.Dolphin),
                SquidAndBelow:result.ok?(result.squidAndBelow||0):null,  // needs a complete count
                ok:result.ok,partial:!!result.partial,error:result.error
              },result.ok);
            });
          })();
          
          if(cfg.hasDAO&&cfg.daoContract){
            setDaoLoading(true);
            fetchDAOData(cfg.daoContract,cfg.daoTreasury,p).then(dao=>{
              setDaoData(dao);
              setDaoLoading(false);
            });
          }
          
          // For UFO, fetch PTGC + LP partner-asset USD prices.
          if(token==='UFO'){
            /* All three prices come from the /tokens/{addr} endpoint (a `.pairs` array) —
               the robust path the working PLSX/WETH prices already use. The old PTGC read
               hit /pairs/{pair} and took d.pair?.priceUsd, but DexScreener's singular `.pair`
               field is being retired (fetchDex already guards `if(d.pair)` for exactly this),
               so a missing field would silently zero every PTGC USD on the page. */
            const usdOf=async(addr)=>{
              try{
                const d={pairs:await dsPairsFor(addr)};
                const ps=(d.pairs||[]).filter(p=>p.chainId==='pulsechain'&&parseFloat(p.priceUsd)>0);
                if(!ps.length)return 0;
                ps.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0));
                return parseFloat(ps[0].priceUsd)||0;
              }catch{return 0;}
            };
            // A failed/empty lookup returns 0; don't let it overwrite a good PTGC price.
            usdOf(TOKENS.PTGC.address).then(p=>{if(p>0)setPtgcPrice(p);}).catch(()=>{});
            usdOf(PLSX_ADDRESS).then(setPlsxPrice).catch(()=>{});
            usdOf(UFO_WETH).then(setWethPrice).catch(()=>{});
            // Re-read live fees each refresh so founder changes appear without a redeploy.
            fetchUfoFees(cfg.address).then(f=>{
              if(f){cfg.taxRate=f.taxRate;cfg.taxBreakdown=f.breakdown;setFeeVersion(v=>v+1);}
            }).catch(()=>{});
          }
          
          // Use pre-fetched CoinGecko data for volume (7d, 30d, 90d)
          /* MIGRATION: coingecko-data.json in the repo was built for the OLD UFO token.
             Feeding its 7d/30d/90d volume into Value Generated overstates everything.
             Two guards, both of which any honest series must pass:
               (a) never quote a window longer than the token has actually existed;
               (b) a longer window can never contain less volume than the 24h inside it.
             Either guard failing means the cached series doesn't describe this token,
             so we return null and the panel shows "Data unavailable" instead of a number. */
          const v24 = d?.vol || 0;
          const _vFirstPool = d?.pairs?.reduce((m,p)=>(p.pairCreatedAt&&p.pairCreatedAt<m)?p.pairCreatedAt:m, Infinity);
          const _ageDays = (_vFirstPool && isFinite(_vFirstPool)) ? (Date.now()-_vFirstPool)/86400000 : null;
          const gateVol = (windowDays, val) => {
            if (val == null || !isFinite(val) || val <= 0) return null;
            if (_ageDays == null || _ageDays < windowDays) return null;  // younger than the window
            if (val < v24) return null;                                   // incoherent => stale series
            return val;
          };
          if (coingeckoDataCache && coingeckoDataCache[token]) {
            const cv = coingeckoDataCache[token].volume || {};
            setVolumeByPeriod({
              vol24h: v24,
              vol7d:  gateVol(7,  cv.vol7d),
              vol30d: gateVol(30, cv.vol30d),
              vol90d: gateVol(90, cv.vol90d)
            });
          } else {
            // Fallback - only show 24h
            setVolumeByPeriod({ vol24h: v24, vol7d: null, vol30d: null, vol90d: null });
          }
          
          // Calculate holder history from snapshots
          const _epochSnaps = snapshotsFor(token); // MIGRATION: this token's era only
          if (_epochSnaps.length > 0) {
            const snapshots = _epochSnaps;
            const now = Date.now();
            const newest = snapshots[snapshots.length - 1];
            const newestTime = new Date(newest.timestamp).getTime();
            
            // Find snapshots closest to 7d, 30d, 90d ago
            const findClosestSnapshot = (daysAgo) => {
              const targetTime = newestTime - (daysAgo * 24 * 60 * 60 * 1000);
              let closest = null;
              let closestDiff = Infinity;
              for (const snap of snapshots) {
                const snapTime = new Date(snap.timestamp).getTime();
                if (snapTime > newestTime) continue;
                const diff = Math.abs(snapTime - targetTime);
                if (diff < closestDiff && snap[token] > 0) {
                  closestDiff = diff;
                  closest = snap;
                }
              }
              // Only return if we found something within reasonable range (within 2 days of target)
              if (closest && closestDiff < 2 * 24 * 60 * 60 * 1000) {
                return closest[token];
              }
              return null;
            };
            
            // Calculate average holder count over a period
            const calcAverage = (daysAgo) => {
              const cutoffTime = newestTime - (daysAgo * 24 * 60 * 60 * 1000);
              const relevantSnapshots = snapshots.filter(snap => {
                const snapTime = new Date(snap.timestamp).getTime();
                return snapTime >= cutoffTime && snapTime <= newestTime && snap[token] > 0;
              });
              if (relevantSnapshots.length === 0) return null;
              const sum = relevantSnapshots.reduce((acc, snap) => acc + snap[token], 0);
              return sum / relevantSnapshots.length;
            };
            
            setHoldersByPeriod({
              current: (newest&&newest[token]!=null?newest[token]:h),/* MIGRATION: file-first — the holder-history snapshot is the source of truth (reliable, written all day); the live PulseScan counter is only a fallback, since it 500s intermittently. */
              d1Ago: findClosestSnapshot(1),
              d7Ago: findClosestSnapshot(7),
              d30Ago: findClosestSnapshot(30),
              d90Ago: findClosestSnapshot(90),
              avg7d: calcAverage(7),
              avg30d: calcAverage(30),
              avg90d: calcAverage(90)
            });
          } else {
            setHoldersByPeriod({ current: h, d1Ago: null, d7Ago: null, d30Ago: null, d90Ago: null, avg7d: null, avg30d: null, avg90d: null });
          }
        };
        load();
      },[token]);

      /* ===== AUTO-REFRESH (quick path) =====
       * The full load() above runs log scans and cache comparisons — far too heavy to
       * repeat. This quick path re-fetches only the cheap live numbers (DexScreener,
       * holder counter, burn balance, PLS price) every 5 minutes, plus on tab re-focus
       * after >5 min away. Failures NEVER overwrite good data: a null fetchDex keeps the last
       * result on screen and flips the freshness badge to "refresh failed" instead. */
      const[refreshing,setRefreshing]=useState(false);
      const[refreshError,setRefreshError]=useState(false);
      const refreshBusyRef=useRef(false);
      const lastUpdateRef=useRef(Date.now());
      useEffect(()=>{lastUpdateRef.current=lastUpdate?.getTime?.()||Date.now()},[lastUpdate]);
      const quickRefresh=async()=>{
        if(refreshBusyRef.current)return;
        refreshBusyRef.current=true;setRefreshing(true);
        try{
          const[d,h,b,p]=await Promise.all([
            fetchDex(cfg.address,cfg.mainPair).catch(()=>null),
            fetchHolders(cfg.address).catch(()=>null),
            fetchBurn(cfg.address,cfg.decimals).catch(()=>null),
            fetchPLS().catch(()=>0)
          ]);
          if(d){setData(prev=>mergeDex(prev,d));setLastUpdate(new Date());setRefreshError(false);}
          else setRefreshError(true);
          // No-op guards: identical values return the previous reference → no re-render.
          if(h!=null)setHolders(prev=>h===prev?prev:h);
          if(b&&b.supply>0)setBurn(prev=>(prev&&prev.burned===b.burned&&prev.supply===b.supply)?prev:b);
          if(p>0)setPls(prev=>p===prev?prev:p);
        }finally{refreshBusyRef.current=false;setRefreshing(false);}
      };
      const quickRefreshRef=useRef();quickRefreshRef.current=quickRefresh;
      useEffect(()=>{
        const id=setInterval(()=>{if(!document.hidden)quickRefreshRef.current();},300000); // 5 min — per site owner's preference
        const onVis=()=>{if(!document.hidden&&Date.now()-lastUpdateRef.current>300000)quickRefreshRef.current();};
        document.addEventListener('visibilitychange',onVis);
        return()=>{clearInterval(id);document.removeEventListener('visibilitychange',onVis);};
      },[token]);
      /* ===== END AUTO-REFRESH ===== */
      
      const sorted=useMemo(()=>{if(!data?.pairs)return[];return[...data.pairs].sort((a,b)=>{let av,bv;switch(sortBy){case'ratio':av=a.liq>0?a.vol/a.liq:0;bv=b.liq>0?b.vol/b.liq:0;break;case'volume':av=a.vol;bv=b.vol;break;case'liquidity':av=a.liq;bv=b.liq;break;case'change':av=a.priceChange?.h24||0;bv=b.priceChange?.h24||0;break;default:av=a.vol;bv=b.vol}return sortDir==='desc'?bv-av:av-bv})},[data?.pairs,sortBy,sortDir]);
      
      // Filter for RH Cores if enabled
      const filteredSorted=useMemo(()=>{
        // First, add rhCore property to all pairs (including from _rhCore placeholder)
        const withRhCore=sorted.map(p=>{
          if(p._rhCore)return{...p,rhCore:p._rhCore};
          const baseSymbol=(p.baseToken?.symbol||'').toUpperCase();
          const quoteSymbol=(p.quoteToken?.symbol||'').toUpperCase();
          const matchedCore=RH_CORES.find(core=>baseSymbol===core||quoteSymbol===core);
          if(matchedCore)return{...p,rhCore:matchedCore};
          return p;
        });
        
        if(!showRHCores)return withRhCore;
        // Filter to RH Cores pairs only
        const rhPairs=withRhCore.filter(p=>p.rhCore);
        // Dedupe: keep only highest liquidity pair for each RH core
        const seen=new Map();
        rhPairs.forEach(p=>{
          const existing=seen.get(p.rhCore);
          if(!existing||p.liq>existing.liq){
            seen.set(p.rhCore,p);
          }
        });
        return Array.from(seen.values()).sort((a,b)=>b.liq-a.liq);
      },[sorted,showRHCores]);
      
      // Calculate totals based on filter
      const filteredVol=filteredSorted.reduce((s,p)=>s+(p.vol||0),0);
      const filteredLiq=filteredSorted.reduce((s,p)=>s+(p.liq||0),0);
      
      // RH Cores pairs (always computed for modal)
      const rhCoresPairs=useMemo(()=>{
        const rhPairs=sorted.map(p=>{
          if(p._rhCore)return{...p,rhCore:p._rhCore};
          const baseSymbol=(p.baseToken?.symbol||'').toUpperCase();
          const quoteSymbol=(p.quoteToken?.symbol||'').toUpperCase();
          const matchedCore=RH_CORES.find(core=>baseSymbol===core||quoteSymbol===core);
          if(matchedCore)return{...p,rhCore:matchedCore};
          return null;
        }).filter(Boolean);
        const seen=new Map();
        rhPairs.forEach(p=>{
          const existing=seen.get(p.rhCore);
          if(!existing||p.liq>existing.liq){
            seen.set(p.rhCore,p);
          }
        });
        return Array.from(seen.values()).sort((a,b)=>b.liq-a.liq);
      },[sorted]);
      const rhCoresLiq=rhCoresPairs.reduce((s,p)=>s+(p.liq||0),0);
      
      const high=filteredSorted.filter(p=>p.liq>=MIN_LIQ||p.rhCore||p._fromChain),low=filteredSorted.filter(p=>p.liq<MIN_LIQ&&!p.rhCore&&!p._fromChain);
      const[showLow,setShowLow]=useState(false);
      const creatures=getBurnC(burn?.pct||0,'Squid');
      const plsRatio=data?.price&&pls?(data.price/pls).toFixed(2):'\u2014';
      const priceUp=(data?.change||0)>=0;
      const _hdrFirstPool=data?.pairs?.reduce((m,p)=>(p.pairCreatedAt&&p.pairCreatedAt<m)?p.pairCreatedAt:m,Infinity);
      const hdrDaysOld=(_hdrFirstPool&&isFinite(_hdrFirstPool))?Math.max(0,Math.floor((Date.now()-_hdrFirstPool)/86400000)):null;
      
      // X's to ATH: try coingecko cache first, then hardcoded fallback
      const athPrice=coingeckoDataCache?.[token]?.ath||ATH_PRICES[token]||0;
      const xToATH=data?.price>0&&athPrice>data.price?(athPrice/data.price).toFixed(1):'\u2014';
      // X's to a Penny
      const xToPenny=data?.price>0&&data.price<0.01?(0.01/data.price).toFixed(1):'\u2014';
      // Format large X values with abbreviations
      const fmtX=v=>{if(v==='\u2014')return'\u2014';const n=parseFloat(v);if(isNaN(n))return'\u2014';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e4)return(n/1e3).toFixed(0)+'K';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n>=100?Math.round(n)+'x':n.toFixed(1)+'x';};
      const liqMcapRatio=data?.mcap>0?((data.liq/data.mcap)*100).toFixed(2):'\u2014';
      const whaleProgress=getWhaleProgress(burn?.pct||0);
      const tokensInLP=data?.tokensInLP||0;
      const tokensInLPPct=cfg.totalSupply>0?((tokensInLP/cfg.totalSupply)*100).toFixed(2):'0';
      
      const burnedPct=cfg.totalSupply>0?(burn?.total||0)/cfg.totalSupply*100:0;
      const lpPct=cfg.totalSupply>0?(tokensInLP/cfg.totalSupply)*100:0;
      const stakedTokens=stakingData?.staked||0;
      const lockedTokens=stakingData?.locked||0;
      const stakedPct=stakingData?.stakedPct||0;
      const lockedPct=stakingData?.lockedPct||0;
      const heldTokens=Math.max(0,cfg.totalSupply-(burn?.total||0)-tokensInLP-stakedTokens-lockedTokens);
      const heldPct=cfg.totalSupply>0?(heldTokens/cfg.totalSupply)*100:0;
      
      console.log('Token Allocation:', {
        burned: (burn?.total||0).toLocaleString() + ' (' + burnedPct.toFixed(2) + '%)',
        lp: tokensInLP.toLocaleString() + ' (' + lpPct.toFixed(2) + '%)',
        staked: stakedTokens.toLocaleString() + ' (' + stakedPct.toFixed(2) + '%)',
        locked: lockedTokens.toLocaleString() + ' (' + lockedPct.toFixed(2) + '%)',
        held: heldTokens.toLocaleString() + ' (' + heldPct.toFixed(2) + '%)'
      });
      
      const chartColors=cfg.stakingContract?['#f97316','#3b82f6','#a855f7','#ec4899',cfg.colorHex]:['#f97316','#3b82f6',cfg.colorHex];
      const chartData=cfg.stakingContract?[
        {label:'Burned',value:burnedPct,tokens:burn?.total||0},
        {label:'In LP',value:lpPct,tokens:tokensInLP},
        {label:'Staked',value:stakedPct,tokens:stakedTokens},
        {label:'Lock & Stk',value:lockedPct,tokens:lockedTokens},
        {label:'Held',value:heldPct,tokens:heldTokens}
      ]:[
        {label:'Burned',value:burnedPct,tokens:burn?.total||0},
        {label:'In LP',value:lpPct,tokens:tokensInLP},
        {label:'Held',value:100-burnedPct-lpPct,tokens:cfg.totalSupply-(burn?.total||0)-tokensInLP}
      ];
      
      if(loading)return<div className="min-h-screen flex items-center justify-center"><div className="text-center"><div className={`w-16 h-16 mx-auto mb-4 rounded-full border-4 ${theme.border} border-t-transparent animate-spin`}></div><div className={`font-orbitron text-lg ${theme.text}`}>Loading {token}...</div></div></div>;
      
      return(
        <div className="min-h-screen">
          
          {/* ===== HEADER (Option A mobile layout) =====
              Desktop/tablet (sm+): this header is sticky, exactly as before.
              Phones: it is NOT sticky — the identity block, Buy/Switch, and ratio
              stats scroll away with the page, and the slim bar below (sm:hidden)
              is what stays pinned. */}
          <header className="sm:sticky top-0 z-50 bg-[#0a0a0a]/95 backdrop-blur-md border-b border-white/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4">

              {/* Row 1: ONE continuous data strip — packed, no justify-between. Stats use flex-1 to absorb slack. */}
              <div className="flex items-center gap-2 sm:gap-3 lg:gap-5 flex-wrap">

                {/* Back arrow — minimal, no pill */}
                <button onClick={onBack} className="group flex items-center text-white/40 hover:text-white transition-colors p-1 -ml-1 shrink-0">
                  <span className="text-xl group-hover:-translate-x-0.5 transition-transform">{'\u2190'}</span>
                </button>

                {/* Logo with subtle halo */}
                <div className="relative shrink-0">
                  <div className="absolute inset-0 rounded-full blur-xl opacity-30 scale-110" style={{background:`radial-gradient(circle, ${cfg.colorHex} 0%, transparent 60%)`}}></div>
                  <img src={cfg.logo} alt={token} className="relative w-14 h-14 sm:w-20 sm:h-20 lg:w-24 lg:h-24"/>
                </div>

                {/* Token name + address */}
                <div className="shrink-0">
                  <div className={`font-orbitron text-3xl sm:text-4xl lg:text-5xl font-bold leading-none tracking-wide ${isGold?'metallic-gold':theme.text}`}>{token}</div>
                  <div className="flex items-center gap-1.5 mt-2">
                    <span className="text-white/40 text-xs font-mono tabular-nums">{cfg.address.slice(0,6)}...{cfg.address.slice(-4)}</span>
                    <button onClick={copyAddress} className="text-white/40 hover:text-white/80 transition-colors text-xs">{copied?'\u2713':'\u{1F4CB}'}</button>
                  </div>
                  {hdrDaysOld!=null&&(<div className="mt-1.5"><div className={`inline-flex items-center gap-1.5 rounded-full border py-1 pl-1.5 pr-2.5 ${isGold?'border-[#D4AF37]/40 bg-[#D4AF37]/10':'border-[#7CFC00]/40 bg-[#7CFC00]/10'}`} style={{boxShadow:`0 0 16px -5px ${cfg.colorHex}`}}><span className="w-1.5 h-1.5 rounded-full" style={{background:cfg.colorHex,boxShadow:`0 0 6px ${cfg.colorHex}`}}></span><span className="text-white/45 text-[9px] font-bold uppercase tracking-[0.2em]">Day</span><span className={`font-orbitron text-sm font-bold leading-none tabular-nums ${isGold?'text-[#D4AF37]':'text-[#7CFC00]'}`}>{hdrDaysOld.toLocaleString()}</span></div></div>)}
                </div>

                {/* hairline divider */}
                <div className="hidden md:block w-px self-stretch bg-white/10 mx-1"></div>

                {/* Price + change (stacked) */}
                <div className="shrink-0">
                  <Price p={data?.price} c={`font-bold leading-none tabular-nums text-2xl sm:text-3xl lg:text-4xl ${isGold?'metallic-gold':theme.text}`}/>
                  <div className={`mt-2 text-xs sm:text-sm lg:text-base font-bold tabular-nums ${priceUp?'text-emerald-400':'text-rose-400'}`}>
                    {priceUp?'\u2191':'\u2193'} {Math.abs(data?.change||0).toFixed(2)}%
                  </div>
                </div>

                {/* hairline divider */}
                <div className="hidden lg:block w-px self-stretch bg-white/10 mx-1"></div>

                {/* Stats — flex-1 absorbs slack into spacing instead of leaving a void */}
                <div className="hidden lg:flex items-center flex-1 min-w-0 justify-around gap-4">
                  <div className="flex flex-col items-start gap-0.5">
                    <span className="text-xs uppercase tracking-[0.2em] text-white/60 font-semibold whitespace-nowrap">PLS Ratio</span>
                    <span className={`text-3xl font-bold tabular-nums leading-none ${isGold?'metallic-gold':theme.text}`}>{plsRatio}</span>
                  </div>
                  <div className="flex flex-col items-start gap-0.5">
                    <span className="text-xs uppercase tracking-[0.2em] text-white/60 font-semibold whitespace-nowrap">X's to ATH</span>
                    <span className={`text-3xl font-bold tabular-nums leading-none ${isGold?'metallic-gold':theme.text}`}>{fmtX(xToATH)}</span>
                  </div>
                  <div className="flex flex-col items-start gap-0.5">
                    <span className="text-xs uppercase tracking-[0.2em] text-white/60 font-semibold whitespace-nowrap">X's to a Penny</span>
                    <span className={`text-3xl font-bold tabular-nums leading-none ${isGold?'metallic-gold':theme.text}`}>{fmtX(xToPenny)}</span>
                  </div>
                </div>

                {/* hairline divider */}
                <div className="hidden lg:block w-px self-stretch bg-white/10 mx-1"></div>

                {/* Actions — packed right next to stats, no gap created by justify-between */}
                <div className="flex items-center gap-2 shrink-0 ml-auto lg:ml-0">
