    // Find snapshot closest to target time ago
    const findSnapshotAt = (snapshots, hoursAgo) => {
      if (!snapshots || snapshots.length === 0) return null;
      const targetTime = Date.now() - (hoursAgo * 60 * 60 * 1000);
      let closest = null;
      let closestDiff = Infinity;
      for (const snap of snapshots) {
        const snapTime = new Date(snap.timestamp).getTime();
        const diff = Math.abs(snapTime - targetTime);
        if (diff < closestDiff) {
          closestDiff = diff;
          closest = snap;
        }
      }
      // Only return if within 2 hours of target
      return closestDiff < 2 * 60 * 60 * 1000 ? closest : null;
    };

      if (!current || !past) return null;
      const currentVal = current[token] || 0;
      const pastVal = past[token] || 0;
      if (pastVal === 0) return null;
      return {
        change: currentVal - pastVal,
        changePercent: ((currentVal - pastVal) / pastVal) * 100,

    // Fetch holders - stop after Dolphin tier, calculate rest as Squid & Below
    const fetchHolderTiers=async(addr,cfg,totalHolderCount,lpAddresses=[])=>{
      const counts={Poseidon:0,Whale:0,Shark:0,Dolphin:0};
      let nextPageParams=null;
      let totalFetched=0;
      const maxPages=20;
      let page=0;
      let countedHolders=0;
      
      // Combine static LP addresses with dynamic ones (exclude LP pools only)
      const allLPAddresses=[...LP_ADDRESSES,...lpAddresses].map(a=>a.toLowerCase());
      
      try{
        while(page<maxPages){
          const url=nextPageParams
            ?`https://api.scan.pulsechain.com/api/v2/tokens/${addr}/holders?${nextPageParams}`
            :`https://api.scan.pulsechain.com/api/v2/tokens/${addr}/holders?limit=50`;
          
          // Add timeout to prevent hanging
          const controller=new AbortController();
          const timeoutId=setTimeout(()=>controller.abort(),8000);
          
          try{
            const r=await fetch(url,{signal:controller.signal});
            clearTimeout(timeoutId);
            const data=await r.json();
            const items=data.items||[];
            
            if(items.length===0)break;
            
            let foundBelowDolphin=false;
            
            for(const holder of items){
              const holderAddr=holder.address?.hash?.toLowerCase();
              if(allLPAddresses.includes(holderAddr))continue;
              if(cfg.stakingContract&&holderAddr===cfg.stakingContract.toLowerCase())continue;
              
              const tokens=parseFloat(holder.value||0)/Math.pow(10,cfg.decimals);
              const pctOfSupply=(tokens/cfg.totalSupply)*100;
              
              // Stop at Dolphin threshold (0.01%)
              if(pctOfSupply<0.01){
                foundBelowDolphin=true;
                break;
              }
              
              if(pctOfSupply>=10)counts.Poseidon++;
              else if(pctOfSupply>=1)counts.Whale++;
              else if(pctOfSupply>=0.1)counts.Shark++;
              else if(pctOfSupply>=0.01)counts.Dolphin++;
              
              countedHolders++;
            }
            
            totalFetched+=items.length;
            
            if(foundBelowDolphin)break;
            
            if(data.next_page_params){
              const params=new URLSearchParams();
              Object.entries(data.next_page_params).forEach(([k,v])=>params.set(k,v));
              nextPageParams=params.toString();
            }else{
              break;
            }
            page++;
          }catch(fetchError){
            clearTimeout(timeoutId);
            break;
          }
        }
      }catch(e){
        console.error('Error fetching holders:',e);
      }
      
      // Squid & Below = total holders - counted tiers - LP addresses - staking contract
      const excludedAddresses=allLPAddresses.length+(cfg.stakingContract?1:0);
      const squidAndBelow=Math.max(0,totalHolderCount-countedHolders-excludedAddresses);
      
      return{counts,countedHolders,squidAndBelow,total:totalFetched};
    };

            return<circle key={i} cx={r} cy={r} r={radius} fill="none" stroke={colors[i%colors.length]} strokeWidth={strokeWidth} strokeDasharray={`${length} ${circumference-length}`} strokeDashoffset={offset} transform={`rotate(-90 ${r} ${r})`}/>;

                  borderColor:cfg.colorHex,
                  borderWidth:1,
                  titleColor:'#fff',
                  bodyColor:cfg.colorHex,

      const str=price.toFixed(12);
      const match=str.match(/^0\.(0+)([1-9]\d*)/);
      if(match){
        const zeros=match[1].length;
        const sig=match[2].slice(0,4);

      return`$${price.toFixed(6)}`;

      const[fetchTotal,setFetchTotal]=useState(0);
      const[fetchDone,setFetchDone]=useState(false);
      const chartRef=useRef(null);
      const chartInstanceRef=useRef(null);

      const COLORS=['#818cf8','#34d399','#f472b6','#fb923c','#60a5fa','#a78bfa','#4ade80','#fbbf24','#f87171','#38bdf8','#e879f9','#2dd4bf','#fb7185','#a3e635','#22d3ee'];

      // Fetch buyer (from) address for each tx via RPC eth_getTransactionByHash
      useEffect(()=>{
        const txsWithHash=allTx.filter(tx=>tx.txHash);
        if(!txsWithHash.length){setFetchDone(true);return;}
        setFetchTotal(txsWithHash.length);
        let done=0;
        const map={};
        // Process in batches of 5 to avoid flooding RPC
        const BATCH=5;
        const processBatch=async(batch)=>{
          await Promise.all(batch.map(async tx=>{
            try{
              const res=await rpcFetch({jsonrpc:'2.0',method:'eth_getTransactionByHash',params:[tx.txHash],id:1},8000);
              const fromAddr=res?.result?.from;
              if(fromAddr){
                const addr=fromAddr.toLowerCase();
                if(!map[addr])map[addr]={wallet:fromAddr,ptgc:0,usd:0,buys:0};
                map[addr].ptgc+=(tx.ptgcAmount||0);
                map[addr].usd+=(tx.usdAmount||0);
                map[addr].buys+=1;
              }
            }catch(e){/* skip failed lookups */}
            done++;
            setFetchProgress(done);
          }));
        };
        (async()=>{
          for(let i=0;i<txsWithHash.length;i+=BATCH){
            await processBatch(txsWithHash.slice(i,i+BATCH));
            setWalletMap({...map});
          }
          setFetchDone(true);
        })();
      },[]);

      const walletData=Object.values(walletMap);

      const totals={
        ptgc:walletData.reduce((s,w)=>s+w.ptgc,0),
        usd:walletData.reduce((s,w)=>s+w.usd,0),
        buys:walletData.reduce((s,w)=>s+w.buys,0),
      };

      const sortedWallets=useMemo(()=>{
        const getV=(w)=>metric==='ptgc'?w.ptgc:metric==='usd'?w.usd:w.buys;
        return[...walletData].sort((a,b)=>getV(b)-getV(a));
      },[walletData,metric]);

      const getVal=(w)=>metric==='ptgc'?w.ptgc:metric==='usd'?w.usd:w.buys;
      const totalVal=metric==='ptgc'?totals.ptgc:metric==='usd'?totals.usd:totals.buys;

      // Trophy logic (same as referrer card header)
      const trophyMap={Whale:'logos/ptgc/trophy_whale_gold.png',Shark:'logos/ptgc/trophy_shark_silver.png',Dolphin:'logos/ptgc/trophy_dolphin_gold.png'};
      const creature=referrerDetails?getCreatureForPtgc(referrerDetails.totalPtgc):null;
      const trophyImg=creature?trophyMap[creature.name]:null;

      // CopyBtn inline for header wallet
      const[headerCopied,setHeaderCopied]=useState(false);

      // Chart
      useEffect(()=>{
        if(!chartRef.current||sortedWallets.length===0)return;
        if(chartInstanceRef.current)chartInstanceRef.current.destroy();
        const getV=(w)=>metric==='ptgc'?w.ptgc:metric==='usd'?w.usd:w.buys;
        const tot=sortedWallets.reduce((s,w)=>s+getV(w),0);
        const ctx=chartRef.current.getContext('2d');
        chartInstanceRef.current=new Chart(ctx,{
          type:'pie',
          data:{
            labels:sortedWallets.map(w=>`${w.wallet.slice(0,6)}...${w.wallet.slice(-4)}`),
            datasets:[{
              data:sortedWallets.map(w=>getV(w)),
              backgroundColor:COLORS.slice(0,Math.min(sortedWallets.length,COLORS.length)),
              borderWidth:2,borderColor:'#111'
            }]
          },
          options:{
            responsive:false,animation:{duration:400},
            plugins:{
              legend:{display:false},
              tooltip:{callbacks:{label:(ctx)=>{
                const w=sortedWallets[ctx.dataIndex];
                const pct=tot>0?((getV(w)/tot)*100).toFixed(1):'0';
                const valStr=metric==='ptgc'?fmtAbbr(getV(w))+' PTGC':metric==='usd'?fmtDollar(getV(w)):getV(w)+' buys';
                return` ${pct}% — ${valStr}`;
              }}}
            }
          }
        });
        return()=>{if(chartInstanceRef.current){chartInstanceRef.current.destroy();chartInstanceRef.current=null;}};
      },[sortedWallets,metric]);

      const progressPct=fetchTotal>0?Math.round((fetchProgress/fetchTotal)*100):0;

      return(
        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/80" style={{backdropFilter:'blur(6px)'}} onClick={onClose}>
          <div className="bg-[#111] border border-[#D9CA5D]/30 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl" onClick={e=>e.stopPropagation()}>

            {/* Header — matches referrer card style */}
            <div className="flex items-center justify-between p-4 border-b border-white/10">
              <div className="flex items-center gap-4 flex-1 min-w-0">
                <img src="06_PTGC_V1_transparent_bg.png" alt="PTGC" className="w-16 h-16 flex-shrink-0"/>
                <div className="flex items-center gap-3 flex-1 min-w-0">
                  <div className="flex-shrink-0">
                    <h2 className="text-[26px] font-bold text-white leading-tight">{referrerDetails?.username||'—'}</h2>
                    <div className="flex items-center gap-1.5">
                      <code className="text-gray-500 text-[10px]">{referrerDetails?.wallet?`${referrerDetails.wallet.slice(0,6)}...${referrerDetails.wallet.slice(-4)}`:'—'}</code>
                      {referrerDetails?.wallet&&(
                        <button onClick={(e)=>{e.stopPropagation();navigator.clipboard.writeText(referrerDetails.wallet);setHeaderCopied(true);setTimeout(()=>setHeaderCopied(false),1500);}} className="text-gray-500 hover:text-white transition inline-flex items-center" title="Copy wallet">
                          {headerCopied?<svg className="w-3 h-3 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>:<svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={1.5}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>}
                        </button>
                      )}
                    </div>
                  </div>
                  {trophyImg&&(
                    <div className="flex-shrink-0" title={`${creature.name} x${creature.count}`}>
                      <img src={trophyImg} alt={creature.name} className="h-[55px] w-auto" style={{filter:'drop-shadow(0 0 6px rgba(217,202,93,0.4))'}}/>
                    </div>
                  )}
                  <div className="flex-1 text-right">
                    <div className="inline-flex flex-col items-center px-4 py-2 rounded-lg" style={{background:'linear-gradient(135deg,rgba(139,92,246,0.25),rgba(109,40,217,0.2))',border:'1px solid rgba(139,92,246,0.45)'}}>
                      <span className="text-purple-300 font-bold text-[15px] leading-tight whitespace-nowrap">Buyer Distribution</span>
                      <span className="text-purple-400/70 font-semibold text-[11px] leading-tight whitespace-nowrap">PTGC Affiliate Program</span>
                    </div>
                  </div>
                </div>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl transition leading-none ml-4 flex-shrink-0">×</button>
            </div>

            {/* Fetch progress */}
            {!fetchDone&&(
              <div className="mx-4 mt-4 bg-black/40 border border-white/10 rounded-xl p-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-white/70 text-sm">Fetching buyer wallets from chain...</span>
                  <span className="text-[#D9CA5D] font-bold text-sm">{fetchProgress}/{fetchTotal}</span>
                </div>
                <div className="h-2 bg-black/50 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-[#D9CA5D] to-yellow-400 rounded-full transition-all duration-300" style={{width:`${progressPct}%`}}/>
                </div>
                <div className="text-gray-500 text-xs mt-1 text-center">{progressPct}% complete — partial results shown below</div>
              </div>
            )}

            {/* Summary Bar */}
            {(fetchDone||walletData.length>0)&&(
              <div className="mx-4 mt-4 bg-black/40 border border-white/10 rounded-xl p-4">
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <div>
                    <div className="text-3xl font-bold text-[#D9CA5D]">
                      {metric==='ptgc'?`${fmtAbbr(totals.ptgc)} PTGC`:metric==='usd'?fmtDollar(totals.usd):`${totals.buys} buys`}
                    </div>
                    <div className="text-gray-400 text-base mt-0.5">
                      {metric==='ptgc'?'total PTGC volume':metric==='usd'?'total USD volume':'total transactions'}
                    </div>
                  </div>
                  <div className="text-right">
                    <div className="text-white font-bold text-2xl">{sortedWallets.length} unique buyer wallet{sortedWallets.length!==1?'s':''}</div>
                    <div className="text-gray-400 text-base mt-0.5">{fmtDollar(totals.usd)} / {fmtAbbr(totals.ptgc)} PTGC external</div>
                  </div>
                </div>
              </div>
            )}

            {/* Metric Toggle */}
            <div className="flex gap-2 mx-4 mt-3">
              {[{k:'ptgc',label:'PTGC'},{k:'usd',label:'USD'},{k:'buys',label:'Buy Count'}].map(({k,label})=>(
                <button key={k} onClick={()=>setMetric(k)}
                  className={`px-4 py-1.5 rounded-lg text-sm font-bold transition-all ${metric===k?'bg-[#D9CA5D] text-black shadow-lg':'bg-white/10 text-white/60 hover:bg-white/20'}`}>
                  {label}
                </button>
              ))}
            </div>

            {/* Chart + Wallet List */}
            {sortedWallets.length>0?(
              <div className="flex gap-4 p-4 items-start">
                <div className="flex-shrink-0">
                  <canvas ref={chartRef} width="190" height="190"/>
                </div>
                <div className="flex-1 space-y-1.5 overflow-y-auto buyer-dist-wallets" style={{maxHeight:'240px'}}>
                  {sortedWallets.map((w,i)=>{
                    const val=getVal(w);
                    const pct=totalVal>0?((val/totalVal)*100).toFixed(1):'0.0';
                    return(
                      <div key={w.wallet} className="flex items-center justify-between px-3 py-2.5 bg-black/30 border border-white/5 rounded-lg hover:bg-white/5 transition-all group">
                        <div className="flex items-center gap-2 min-w-0">
                          <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{backgroundColor:COLORS[i%COLORS.length]}}/>
                          <code className="text-gray-300 text-xs font-mono truncate">{w.wallet.slice(0,8)}...{w.wallet.slice(-4)}</code>
                          <button
                            onClick={(e)=>{e.stopPropagation();navigator.clipboard.writeText(w.wallet);setCopiedWallet(w.wallet);setTimeout(()=>setCopiedWallet(null),1500);}}
                            className="text-gray-500 hover:text-[#D9CA5D] transition flex-shrink-0" title="Copy wallet address"
                          >
                            {copiedWallet===w.wallet
                              ?<svg className="w-3 h-3 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                              :<svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={1.5}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            }
                          </button>
                        </div>
                        <div className="text-right flex-shrink-0 ml-3 flex items-baseline gap-2">
                          <div className="text-[#D9CA5D] font-bold text-lg">{pct}%</div>
                          <div className="text-gray-300 text-base font-semibold">
                            {metric==='ptgc'?fmtAbbr(w.ptgc)+' PTGC':metric==='usd'?fmtDollar(w.usd):w.buys+' buy'+(w.buys!==1?'s':'')}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ):(
              fetchDone&&<div className="p-8 text-center text-white/40">No transaction hashes found to look up buyer wallets.</div>
            )}

            <div className="px-4 pb-4 pt-1">
              <button onClick={onClose} className="w-full py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-xl transition font-medium">Close</button>
            </div>
          </div>
        </div>
      );
    };

    const AffiliatesPage=({onBack})=>{
      const[data,setData]=useState(null);
      const[loading,setLoading]=useState(true);
      const[error,setError]=useState(null);
      const[searchTerm,setSearchTerm]=useState('');
      const[selectedReferrer,setSelectedReferrer]=useState(null);
      const[activeTab,setActiveTab]=useState('payments');
      const[viewingMonth,setViewingMonth]=useState(null);
      const[expandedReceipts,setExpandedReceipts]=useState(new Set());
      const[expandedMonthTx,setExpandedMonthTx]=useState(null);
      const[sortCol,setSortCol]=useState('ptgc');
      const[sortDir,setSortDir]=useState('desc');
      const[showRegistry,setShowRegistry]=useState(false);
      const[commLogMonth,setCommLogMonth]=useState(null);
      const[expandedEntries,setExpandedEntries]=useState(new Set());
      const[showLeaderboard,setShowLeaderboard]=useState(false);
      const[showPayments,setShowPayments]=useState(false);
      const[registrySearch,setRegistrySearch]=useState('');
      const[leaderboardMonth,setLeaderboardMonth]=useState(null);
      const[expandedTxMonths,setExpandedTxMonths]=useState(new Set());
      const[showAllReceipts,setShowAllReceipts]=useState(false);
      const[showAllCurrentMonthTx,setShowAllCurrentMonthTx]=useState(false);
      const[recentActivityExpanded,setRecentActivityExpanded]=useState(false);
      const[commSortCol,setCommSortCol]=useState('ptgc');
      const[commSortDir,setCommSortDir]=useState('desc');
      const[showBuyerDist,setShowBuyerDist]=useState(false);
      
      // Current month key - USE UTC TIME
      const currentMonth=new Date().toISOString().slice(0,7);
      
      useEffect(()=>{
        const fetchData=async()=>{
          try{
            const res=await fetch('https://ptgcapi.ptgctools.workers.dev/public/commissions');
            if(!res.ok)throw new Error('Failed to fetch');
            const json=await res.json();
            setData(json);
            // Set to current UTC month
            const utcMonth=new Date().toISOString().slice(0,7);
            setCommLogMonth(utcMonth);
            setViewingMonth(utcMonth);
          }catch(e){
            setError(e.message);
          }finally{
            setLoading(false);
          }
        };
        fetchData();
      },[]);
      
      // Get all months from data - include current month even if no data exists yet
      const allMonths=useMemo(()=>{
        if(!data?.monthlyLogs)return[currentMonth];
        const months=Object.keys(data.monthlyLogs);
        if(!months.includes(currentMonth)){
          months.push(currentMonth);
        }
        return months.sort().reverse();
      },[data,currentMonth]);
      
      // Get current month settings
      const currentMonthSettings=useMemo(()=>{
        if(!data?.monthlyLogs?.[currentMonth])return{commissionRate:2,threshold:10,thresholdType:'usd',coverFee:true};
        return data.monthlyLogs[currentMonth].settings||{commissionRate:2,threshold:10,thresholdType:'usd',coverFee:true};
      },[data,currentMonth]);
      
      // Helper: is an entry fully paid? Uses same logic as getEntryStatus
      const isEntryPaid=(e)=>{
        if(!e.buys?.length)return e.status==='paid';
        const qualify=e.buys.filter(b=>b.ptgcAmount>0&&b.meetsThreshold!==false);
        if(!qualify.length)return false;
        return qualify.filter(b=>b.paid).length===qualify.length;
      };
      
      // Helper: get the commission amount for an entry (entry-level, NOT from buys array)
      const getEntryComm=(e,fallbackRate)=>{
        return e.commissionPtgc||((e.ptgcAmount||0)*((e.commissionRate||fallbackRate)/100));
      };
      const getEntryCommUsd=(e,fallbackRate)=>{
        return(e.usdAmount||0)*((e.commissionRate||fallbackRate)/100);
      };
      
      // Calculate stats from data based on viewing period
      const stats=useMemo(()=>{
        if(!data)return null;
        const referrers=Object.entries(data.referrers||{});
        const totalReferrers=referrers.length;
        
        // Calculate all-time from monthlyLogs
        let allTimeBuys=0,allTimeUsd=0,allTimePtgc=0,allTimeCommission=0;
        let totalPaid=0,totalPaidUsd=0;
        if(data.monthlyLogs){
          Object.values(data.monthlyLogs).forEach(month=>{
            const entries=month.entries||[];
            const rate=month.settings?.commissionRate||2;
            allTimeBuys+=entries.reduce((sum,e)=>sum+(e.buysCount||0),0);
            allTimeUsd+=entries.reduce((sum,e)=>sum+(e.usdAmount||0),0);
            allTimePtgc+=entries.reduce((sum,e)=>sum+(e.ptgcAmount||0),0);
            allTimeCommission+=entries.reduce((sum,e)=>sum+getEntryComm(e,rate),0);
            // FIX: Sum entry-level commission for PAID entries only, with fee coverage
            entries.forEach(e=>{
              if(isEntryPaid(e)){
                totalPaid+=getEntryComm(e,rate);
                totalPaidUsd+=getEntryCommUsd(e,rate);
              }
            });
          });
        }
        console.log('[PTGC-FIX] All-time totalPaid:',totalPaid,'allTimeCommission:',allTimeCommission);
        
        // Fallback to referrers totals if no monthlyLogs
        if(allTimeBuys===0&&allTimeUsd===0){
          allTimeBuys=referrers.reduce((sum,[,r])=>sum+(r.totalBuys||0),0);
          allTimeUsd=referrers.reduce((sum,[,r])=>sum+(r.totalUsd||0),0);
          allTimePtgc=referrers.reduce((sum,[,r])=>sum+(r.totalPtgc||0),0);
        }
        
        // Viewing period stats
        const selectedMonth=viewingMonth||currentMonth;
        let periodBuys=0,periodUsd=0,periodPtgc=0,periodReferrers=0,periodPaid=0,periodCommission=0;
        
        if(selectedMonth){
          const monthLog=data.monthlyLogs?.[selectedMonth];
          const entries=monthLog?.entries||[];
          const rate=monthLog?.settings?.commissionRate||2;
          periodBuys=entries.reduce((sum,e)=>sum+(e.buysCount||0),0);
          periodPtgc=entries.reduce((sum,e)=>sum+(e.ptgcAmount||0),0);
          periodUsd=entries.reduce((sum,e)=>sum+(e.usdAmount||0),0);
          periodCommission=entries.reduce((sum,e)=>sum+getEntryComm(e,rate),0);
          periodReferrers=entries.length;
          // FIX: Sum entry-level commission for PAID entries only, with fee coverage
          entries.forEach(e=>{
            if(isEntryPaid(e)){
              periodPaid+=getEntryComm(e,rate);
            }
          });
          console.log('[PTGC-FIX] Period',selectedMonth,'periodPaid:',periodPaid,'periodCommission:',periodCommission);
        }
        
        // Current month stats
        const currentMonthLog=data.monthlyLogs?.[currentMonth];
        const activeThisMonth=(currentMonthLog?.entries||[]).length;
        
        // Leaderboard sorted by total PTGC (always all-time for leaderboard)
        const leaderboard=referrers.map(([username,r])=>({username,...r})).sort((a,b)=>(b.totalPtgc||0)-(a.totalPtgc||0));
        
        return{totalReferrers,allTimeBuys,allTimeUsd,allTimePtgc,allTimeCommission,totalPaid,totalPaidUsd,periodBuys,periodUsd,periodPtgc,periodCommission,periodReferrers,periodPaid,activeThisMonth,leaderboard,currentMonth};
      },[data,viewingMonth,currentMonth]);
      
      const truncateWallet=(w)=>w?`${w.slice(0,6)}...${w.slice(-4)}`:'—';
      
      
      // Copy icon SVG component
      const CopyIcon=({className="w-3.5 h-3.5"})=>(
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={1.5}>
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      );
      
      // Copy button component for addresses
      const CopyBtn=({text,className="text-gray-400 hover:text-white"})=>{
        const[copied,setCopied]=useState(false);
        return(
          <button
            onClick={(e)=>{
              e.stopPropagation();
              navigator.clipboard.writeText(text);
              setCopied(true);
              setTimeout(()=>setCopied(false),1500);
            }}
            className={`${className} transition inline-flex items-center`}
            title="Copy"
          >
            {copied?<svg className="w-3.5 h-3.5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>:<CopyIcon/>}
          </button>
        );
      };
      const formatDate=(d)=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
      const formatDateTime=(d)=>d?new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
      const formatMonthYear=(m)=>m?new Date(m+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}):'—';
      
      // Filter leaderboard by search
      const filteredLeaderboard=useMemo(()=>{
        if(!stats?.leaderboard)return[];
        if(!searchTerm)return stats.leaderboard;
        const term=searchTerm.toLowerCase();
        return stats.leaderboard.filter(r=>r.username.toLowerCase().includes(term)||r.wallet?.toLowerCase().includes(term));
      },[stats?.leaderboard,searchTerm]);
      
      // Get referrer details with their monthly breakdown and transaction details
      const getReferrerDetails=(username)=>{
        if(!data)return null;
        const referrer=data.referrers?.[username];
        if(!referrer)return null;
        
        const monthlyEntries=[];
        let lifetimeBuys=0;
        let lifetimePtgc=0;
        let lifetimeUsd=0;
        
        Object.entries(data.monthlyLogs||{}).forEach(([month,log])=>{
          const entry=(log.entries||[]).find(e=>e.username===username);
          if(entry){
            monthlyEntries.push({month,settings:log.settings,...entry});
            lifetimeBuys+=(entry.buysCount||0);
            lifetimePtgc+=(entry.ptgcAmount||0);
            lifetimeUsd+=(entry.usdAmount||0);
          }
        });
        monthlyEntries.sort((a,b)=>b.month.localeCompare(a.month));
        
        const receipts=(data.receipts||[]).filter(r=>r.username===username).sort((a,b)=>new Date(b.date)-new Date(a.date));
        
        // Calculate total commissions paid from entry-level data (with fee coverage)
        let totalCommPaid=0,totalCommPaidUsd=0;
        monthlyEntries.forEach(me=>{
          const rate=me.commissionRate||me.settings?.commissionRate||2;
          if(isEntryPaid(me)){
            totalCommPaid+=getEntryComm(me,rate);
            totalCommPaidUsd+=getEntryCommUsd(me,rate);
          }
        });
        
        return{...referrer,username,monthlyEntries,receipts,totalCommPaid,totalCommPaidUsd,totalBuys:lifetimeBuys,totalPtgc:lifetimePtgc,totalUsd:lifetimeUsd};
      };
      
      // Group receipts by date
      const receiptsByDate=useMemo(()=>{
        if(!data?.receipts)return{};
        const grouped={};
        data.receipts.forEach(r=>{
          const dateKey=r.date?r.date.split('T')[0]:'unknown';
          if(!grouped[dateKey])grouped[dateKey]=[];
          grouped[dateKey].push(r);
        });
        return grouped;
      },[data?.receipts]);
      
      const sortedReceiptDates=useMemo(()=>Object.keys(receiptsByDate).sort().reverse(),[receiptsByDate]);
      
      // Referrer stats for registry
      const referrerStats=useMemo(()=>{
        if(!data)return[];
        const referrers=Object.entries(data.referrers||{});
        return referrers.map(([username,r])=>{
          let pending=0,commPaid=0,commPaidUsd=0;
          Object.values(data.monthlyLogs||{}).forEach(log=>{
            const entry=(log.entries||[]).find(e=>e.username===username);
            if(entry){
              const rate=entry.commissionRate||log.settings?.commissionRate||2;
              const entryComm=getEntryComm(entry,rate);
              const entryCommUsd=getEntryCommUsd(entry,rate);
              if(isEntryPaid(entry)){
                commPaid+=getEntryComm(entry,rate);
                commPaidUsd+=getEntryCommUsd(entry,rate);
              }else{
                // Not fully paid - check if below threshold
                const isBelowThreshold=entry.buys?.length?
                  entry.buys.filter(b=>b.ptgcAmount>0&&b.meetsThreshold!==false).length===0:
                  entry.meetsThreshold===false;
                if(!isBelowThreshold)pending+=entryComm;
              }
            }
          });
          return{name:username,wallet:r.wallet,buys:r.totalBuys||0,ptgc:r.totalPtgc||0,usd:r.totalUsd||0,commPaid,commPaidUsd,pending};
        });

      const sortedRegistry=useMemo(()=>{
        if(!referrerStats.length)return[];
        return[...referrerStats].sort((a,b)=>{
          let av,bv;
          switch(sortCol){
            case'name':av=a.name.toLowerCase();bv=b.name.toLowerCase();break;
            case'buys':av=a.buys;bv=b.buys;break;
            case'ptgc':av=a.ptgc;bv=b.ptgc;break;
            case'usd':av=a.usd;bv=b.usd;break;
            case'commPaid':av=a.commPaid;bv=b.commPaid;break;
            case'commPaidUsd':av=a.commPaidUsd;bv=b.commPaidUsd;break;
            case'pending':av=a.pending;bv=b.pending;break;
            default:av=a.name;bv=b.name;
          }
          if(sortDir==='asc')return av>bv?1:av<bv?-1:0;
          return av<bv?1:av>bv?-1:0;
        });
      },[referrerStats,sortCol,sortDir]);
      
      // Get commission log settings for selected month
      const commLogSettings=useMemo(()=>{
        const cm=commLogMonth||currentMonth;
        if(!cm||!data?.monthlyLogs?.[cm])return{commissionRate:2,threshold:10,thresholdType:'usd',coverFee:true};
        return data.monthlyLogs[cm].settings||{commissionRate:2,threshold:10,thresholdType:'usd',coverFee:true};
      },[data,commLogMonth,currentMonth]);
      
      const commLogEntries=useMemo(()=>{
        const cm=commLogMonth||currentMonth;
        if(!cm||!data?.monthlyLogs?.[cm])return[];
        return data.monthlyLogs[cm].entries||[];
      },[data,commLogMonth,currentMonth]);
      
      // Recent transactions for current month (latest 3)
      const recentTransactions=useMemo(()=>{
        if(!data?.monthlyLogs?.[currentMonth])return[];
        const entries=data.monthlyLogs[currentMonth].entries||[];
        const allTx=[];
        entries.forEach(entry=>{
          (entry.buys||[]).forEach(b=>{
            if(b.ptgcAmount>0){
              allTx.push({...b,username:entry.username,wallet:entry.wallet});
            }
          });
        });
        allTx.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
        return allTx.slice(0,10);
      },[data,currentMonth]);
      
      // Helper functions
      const toggleSort=(col)=>{
        if(sortCol===col)setSortDir(sortDir==='asc'?'desc':'asc');
        else{setSortCol(col);setSortDir(col==='name'?'asc':'desc');}
      };
      
      const SortIcon=({col})=>sortCol!==col?<span className="text-gray-600 ml-1">↕</span>:<span className="text-[#D9CA5D] ml-1">{sortDir==='asc'?'↑':'↓'}</span>;
      
      const toggleCommSort=(col)=>{
        if(commSortCol===col)setCommSortDir(commSortDir==='asc'?'desc':'asc');
        else{setCommSortCol(col);setCommSortDir(col==='username'?'asc':'desc');}
      };
      
      const CommSortIcon=({col})=>commSortCol!==col?<span className="text-gray-600 ml-1">↕</span>:<span className="text-[#D9CA5D] ml-1">{commSortDir==='asc'?'↑':'↓'}</span>;
      
      const getEntryStatus=(e)=>{
        if(!e.buys?.length){if(e.meetsThreshold===false)return'below';return e.status||'unpaid';}
        const valid=e.buys.filter(b=>b.ptgcAmount>0);
        const qualify=valid.filter(b=>b.meetsThreshold!==false);
        if(!qualify.length)return'below';
        const paid=qualify.filter(b=>b.paid).length;
        if(paid===qualify.length)return'paid';
        if(paid>0)return'partial';
        return'unpaid';
      };
      
      const sortedCommLogEntries=useMemo(()=>{
        if(!commLogEntries.length)return[];
        const statusOrder={paid:0,partial:1,unpaid:2,below:3};
        return[...commLogEntries].sort((a,b)=>{
          let av,bv;
          switch(commSortCol){
            case'username':av=a.username?.toLowerCase()||'';bv=b.username?.toLowerCase()||'';break;
            case'buys':av=a.buysCount||0;bv=b.buysCount||0;break;
            case'ptgc':av=a.ptgcAmount||0;bv=b.ptgcAmount||0;break;
            case'usd':av=a.usdAmount||0;bv=b.usdAmount||0;break;
            case'commission':av=a.commissionPtgc||0;bv=b.commissionPtgc||0;break;
            case'status':av=statusOrder[getEntryStatus(a)]??9;bv=statusOrder[getEntryStatus(b)]??9;break;
            default:av=a.ptgcAmount||0;bv=b.ptgcAmount||0;
          }
          if(commSortDir==='asc')return av>bv?1:av<bv?-1:0;
          return av<bv?1:av>bv?-1:0;
        });
      },[commLogEntries,commSortCol,commSortDir]);
      
      if(loading){
        return(
          <div className="min-h-screen bg-[#0a0a0a] flex items-center justify-center">
            <div className="text-center">
              <div className="w-16 h-16 border-4 border-[#D9CA5D]/30 border-t-[#D9CA5D] rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-[#D9CA5D] font-orbitron">Loading Affiliate Data...</p>
            </div>
          </div>
        );

      if(error){
        return(
          <div className="min-h-screen bg-[#0a0a0a] flex items-center justify-center">
            <div className="text-center">
              <div className="text-6xl mb-4">⚠️</div>

              <button onClick={onBack} className="px-6 py-2 bg-[#D9CA5D] text-black font-bold rounded-lg">Go Back</button>
            </div>
          </div>

      return(
        <div className="min-h-screen bg-gradient-to-b from-gray-900 via-[#0a0a0a] to-gray-900">
          {/* Referrer Detail Modal */}
          {selectedReferrer&&(()=>{
            const details=getReferrerDetails(selectedReferrer);
            if(!details)return null;
            
            // Get all transactions for this referrer across all months (deduplicated)
            const allTx=[];
            const seenTxKeys=new Set();
            Object.entries(data.monthlyLogs||{}).forEach(([month,log])=>{

              if(entry?.buys){
                entry.buys.forEach(b=>{
                  const key=b.txHash||`${b.date}-${b.ptgcAmount}-${b.buyer||''}-${month}`;
                  if(!seenTxKeys.has(key)){
                    seenTxKeys.add(key);
                    allTx.push({...b,month,rate:entry.commissionRate||log.settings?.commissionRate||2});

            // Calculate pending from entry-level data (not buys array sums)

                  me.meetsThreshold===false;
                if(!isBelowThreshold){
                  pending+=getEntryComm(me,rate);
                  pendingUsd+=getEntryCommUsd(me,rate);
                }
              }

            const monthlyBreakdown=details.monthlyEntries.map(me=>{

                            <div className="flex items-center gap-2">
                              <h2 className="text-[31px] font-bold text-white">{details.username}</h2>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <code className="text-gray-500 text-[10px]">{truncateWallet(details.wallet)}</code>
                              <CopyBtn text={details.wallet} className="text-gray-500 hover:text-white"/>
                            </div>

                          {(()=>{
                            const creature=getCreatureForPtgc(details.totalPtgc);
                            if(!creature)return null;
                            const trophyMap={Whale:'logos/ptgc/trophy_whale_gold.png',Shark:'logos/ptgc/trophy_shark_silver.png',Dolphin:'logos/ptgc/trophy_dolphin_gold.png'};

                            if(!trophyImg)return null;
                            return(
                              <div className="relative ml-2" title={`${creature.name} x${creature.count}`}>
                                <img src={trophyImg} alt={creature.name} className="h-[67px] w-auto" style={{filter:'drop-shadow(0 0 6px rgba(217,202,93,0.4))'}}/>
                              </div>
                            );
                          })()}
                        </div>
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      {/* Affiliate Link Button */}
                      <button

                          btn.innerHTML='<span class="text-green-400">✓ Copied!</span>';

                        title="Click to copy affiliate link"

                        <span className="text-purple-300 font-semibold text-sm">{details.username}'s Referral Link</span>
                        <span className="text-purple-400/60 text-xs">Click to copy</span>

                      <button onClick={()=>{setSelectedReferrer(null);setExpandedTxMonths(new Set());setShowAllReceipts(false);setShowAllCurrentMonthTx(false);setShowBuyerDist(false);}} className="text-gray-400 hover:text-white text-2xl">×</button>
                    </div>
                  </div>
                  
                  {/* Stats Grid */}

                      <div className="text-2xl font-bold text-blue-400">{details.totalBuys||0}</div>
                    </div>
                    <div className="bg-black/40 border border-white/10 rounded-lg p-3">
                      <div className="text-gray-400 text-sm uppercase mb-1">PTGC Bought</div>
                      <div className="flex items-center justify-between">
                        <span className="text-2xl font-bold text-[#D9CA5D]">{fmtAbbr(details.totalPtgc)}</span>
                        {(()=>{
                          const creature=getCreatureForPtgc(details.totalPtgc);
                          return creature?(
                            <span className="flex items-center gap-1" title={creature.name}>
                              <span className="text-xl">{creature.emoji}</span>
                              <span className="text-white/60 text-sm">x{creature.count}</span>
                            </span>
                          ):null;
                        })()}
                      </div>
                      <div className="text-gray-400 text-sm">{fmtDollar(details.totalUsd||0)}</div>
                    </div>
                    <div className="bg-black/40 border border-white/10 rounded-lg p-3">
                      <div className="text-gray-400 text-sm uppercase mb-1">Commission Paid</div>
                      <div className="text-2xl font-bold text-green-400">{fmtAbbr(details.totalCommPaid)}</div>
                      <div className="text-gray-400 text-sm">{fmtDollar(details.totalCommPaidUsd||details.receipts.reduce((s,r)=>s+(r.usdValue||0),0))}</div>
                    </div>
                    <div className="bg-black/40 border border-white/10 rounded-lg p-3 relative">
                      <div className="flex items-center gap-1 mb-1">
                        <div className="text-gray-400 text-sm uppercase">Owed (Pending)</div>
                        <div className="group relative">
                          <span className="text-gray-500 hover:text-white cursor-help text-xs">ⓘ</span>
                          <div className="absolute bottom-full right-0 mb-2 px-3 py-2 bg-black border border-white/20 rounded-lg text-xs text-white/80 w-52 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 shadow-xl">
                            <p className="font-semibold text-orange-400 mb-1">Threshold Required</p>
                            <p>Your total monthly referral volume must meet or exceed the minimum threshold to qualify for commission payment.</p>
                          </div>
                        </div>
                      </div>
                      <div className="text-2xl font-bold text-orange-400">{fmtComma(pending,2)}</div>
                      <div className="text-gray-400 text-sm">{fmtDollar(pendingUsd)}</div>
                    </div>
                  </div>
                  
                  {/* Current Month Progress Bar */}
                  {(()=>{

                    const threshold=currentMonthLog?.settings?.threshold||10;
                    const thresholdType=currentMonthLog?.settings?.thresholdType||'usd';
                    const rate=currentMonthLog?.settings?.commissionRate||2;
                    
                    // Get unpaid transactions for current month
                    const currentMonthTx=allTx.filter(tx=>tx.month===currentMonth&&!tx.paid&&tx.meetsThreshold!==false);
                    const unpaidPtgc=currentMonthTx.reduce((s,tx)=>s+(tx.ptgcAmount||0),0);
                    const unpaidUsd=currentMonthTx.reduce((s,tx)=>s+(tx.usdAmount||0),0);
                    const unpaidComm=unpaidPtgc*(rate/100);
                    
                    // Progress calculation based on threshold type
                    const progressValue=thresholdType==='usd'?unpaidUsd:unpaidPtgc;
                    const progressPct=Math.min((progressValue/threshold)*100,100);
                    const hasMetThreshold=progressValue>=threshold;
                    const remaining=Math.max(threshold-progressValue,0);
                    
                    return(

                            <span className="text-white font-semibold">Current Month Progress</span>

                        {/* Progress Bar */}
                        <div className="relative h-6 bg-black/50 rounded-full overflow-hidden border border-white/10">

                            style={{width:`${progressPct}%`}}

                          <div className={`absolute inset-0 flex items-center justify-center text-sm font-bold drop-shadow-lg ${progressPct>=50?'text-purple-900':'text-white'}`}>

                          </div>
                        </div>
                        
                        {/* Stats Row */}
                        <div className="flex items-center justify-between mt-3 text-sm">
                          <div className="flex items-center gap-4">
                            <span className="text-gray-400">Unpaid Txns: <span className="text-white font-bold">{currentMonthTx.length}</span></span>
                            <span className="text-gray-400">Pending Commission: <span className="text-purple-400 font-bold">{fmtComma(unpaidComm)} PTGC</span></span>

                            Min: {thresholdType==='usd'?`$${threshold}`:`${threshold} PTGC`} per txn @ {rate}% rate
                          </div>
                        </div>
                      </div>
                    );
                  })()}
                  
                  {/* Transaction History - Grouped by Month */}
                  <div className="p-4 border-t border-white/10">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="font-semibold text-white flex items-center gap-2"><span>📊</span> Transaction History ({allTx.length})</h3>
                      {allTx.length>0&&(
                        <button
                          onClick={(e)=>{e.stopPropagation();setShowBuyerDist(true);}}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold transition-all"
                          style={{background:'linear-gradient(135deg,rgba(99,102,241,0.25),rgba(139,92,246,0.2))',border:'1px solid rgba(99,102,241,0.45)',color:'#a5b4fc',boxShadow:'0 0 12px rgba(99,102,241,0.15)'}}

                          onMouseLeave={e=>{e.currentTarget.style.background='linear-gradient(135deg,rgba(99,102,241,0.25),rgba(139,92,246,0.2))';e.currentTarget.style.boxShadow='0 0 12px rgba(99,102,241,0.15)';}}
                        >
                          <span>🫧</span> Buyer Distribution
                        </button>
                      )}
                    </div>
                    {allTx.length>0?(()=>{

                      return(
                        <div className="space-y-3">

                                <div 
                                  onClick={()=>{

                                    const newSet=new Set(expandedTxMonths);

                                    else newSet.add(month);
                                    setExpandedTxMonths(newSet);

                                  className={`flex items-center justify-between p-3 ${isCurrentMonth?'bg-green-500/10 border-b border-white/10':'bg-black/40 cursor-pointer hover:bg-white/5'}`}
                                >
                                  <div className="flex items-center gap-3">
                                    {!isCurrentMonth&&<span className="text-gray-400">{isExpanded?'▼':'▶'}</span>}
                                    {isCurrentMonth&&<span className="text-green-400 text-xs px-2 py-0.5 bg-green-500/20 rounded">CURRENT</span>}
                                    <span className="text-white font-medium">{formatMonthYear(month)}</span>
                                    <span className="text-gray-500 text-sm">({monthTxs.length} transactions)</span>
                                  </div>
                                  {isCurrentMonth?(
                                    <div className="flex items-center gap-4 sm:gap-6 text-xs flex-wrap justify-end">
                                      <div className="flex items-center gap-1.5">

              <p>
                <span className="text-yellow-400 font-semibold">Not Financial Advice:</span> Nothing on this site constitutes financial, investment, legal, or tax advice. Do not make any investment or financial decision based solely on information shown here. Always do your own research (DYOR) and consult a qualified professional before investing.
              </p>

              <p>
                <span className="text-yellow-400 font-semibold">No Liability:</span> The creators of this dashboard accept no responsibility or liability for any losses, damages, or decisions made based on information displayed here — including but not limited to incorrect data, failed transactions, or market movements.
              </p>

              <p>
                <span className="text-yellow-400 font-semibold">Crypto Risk:</span> Cryptocurrency investments are highly speculative and volatile. You may lose some or all of your investment. Never invest more than you can afford to lose.
              </p>

              <p>
                <span className="text-yellow-400 font-semibold">Use at Your Own Risk:</span> By using this dashboard, you acknowledge that you understand and accept all of the above, and agree to use it entirely at your own discretion.
              </p>
            </div>
            
            <div className="flex flex-col gap-3">
              <button 
                onClick={onAccept}
                className="w-full py-3 px-6 bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-black font-bold rounded-lg transition-all text-lg"
              >
                I Understand & Accept
              </button>
              <p className="text-white/40 text-xs text-center">
                By clicking above, you acknowledge these terms. This message will not appear again on this device.
              </p>
            </div>
          </div>
        </div>
      );
    };
    
    const App=()=>{
      const[view,setView]=useState(()=>{
        const p=new URLSearchParams(window.location.search).get('token');
        if(p==='PTGC'||p==='UFO'){
          try{const v=localStorage.getItem('ptgc_nav_view');if(v==='affiliates'){localStorage.removeItem('ptgc_nav_view');window.history.replaceState({},'',window.location.pathname);return'affiliates'}}catch(e){}
          window.history.replaceState({},'',window.location.pathname);return'dashboard'
        }
        return'home';
      });
      const[token,setToken]=useState(()=>{
        const p=new URLSearchParams(window.location.search).get('token');
        if(p==='PTGC'||p==='UFO')return p;
        return null;
      });
      const[lastToken,setLastToken]=useState(null);
      const[disclaimerAccepted,setDisclaimerAccepted]=useState(()=>{
        try{return localStorage.getItem('ptgc_ufo_disclaimer_accepted')==='true';}catch(e){return false;}
      });
      
      const handleAcceptDisclaimer=()=>{
        try{localStorage.setItem('ptgc_ufo_disclaimer_accepted','true');}catch(e){}
        setDisclaimerAccepted(true);
      };
      
      if(!disclaimerAccepted){
        return<DisclaimerModal onAccept={handleAcceptDisclaimer}/>;
      }
      
      if(view==='affiliates')return(
        <AffiliatesPage onBack={()=>{const t=token||lastToken;if(t){setToken(t);setView('dashboard');try{localStorage.setItem('ptgc_last_token',t)}catch(e){}}else{setView('home')}}}/>
      );
      
      if(view==='dashboard'&&token)return(
          <Dashboard token={token} onBack={()=>{setView('home');setToken(null);try{localStorage.removeItem('ptgc_last_token')}catch(e){}}} onSwitch={(t)=>{setToken(t);try{localStorage.setItem('ptgc_last_token',t)}catch(e){}}} onAffiliates={()=>{setLastToken(token);setView('affiliates')}}/>
      );
      return(
          <Home onSelect={t=>{setToken(t);setView('dashboard');try{localStorage.setItem('ptgc_last_token',t)}catch(e){}}}/>
      );
    };
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
