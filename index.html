                  </div>

                  <div className="flex-1 flex flex-col">
                  {(()=>{
                    const isVolumeLoading=volumeByPeriod.vol24h===0&&loading;
                    const volAmounts={'24h':volumeByPeriod.vol24h,'7d':volumeByPeriod.vol7d,'30d':volumeByPeriod.vol30d,'90d':volumeByPeriod.vol90d};
                    const periodVol=volAmounts[valueGenPeriod];
                    const hasData=periodVol!==null&&periodVol!==undefined;
                    const totalGen=hasData?periodVol*cfg.taxRate:0;

                    const orderedItems=buildValueGenItems(token,cfg);
                    const vgPrices={UFO:data?.price||0,PTGC:ptgcPrice,PLS:pls,PLSX:plsxPrice,WETH:wethPrice};

                    /* MIGRATION: realized mode. Values come from summed on-chain fee transfers,
                       attributed with the fee rates actually in force at each block.
                       The chain read does NOT depend on the price feed: token amounts are
                       exact without it. Gating `live` on ufoPx>0 used to make a dropped
                       price feed look like "Data unavailable" when the fees were fine. */
                    const ufoPx=data?.price||0;
                    const livePeriod=(token==='UFO'&&realizedFees&&realizedFees.ok)?realizedFees.byPeriod[valueGenPeriod]:null;
                    const live=livePeriod||null;
                    const showLive=!!live;
                    const priceless=showLive&&!(ufoPx>0);
                    const ex=realizedFees&&realizedFees.ok?realizedFees.excluded:null;

                    /* ---------------------------------------------------------
                       ACCRUED vs DELIVERED.

                       Accrued: every bucket is 1% of the same taxed volume, so
                       every bucket accrues the SAME number of UFO. Printing that
                       six times is printing total/6. It is the input.

                       Delivered: what each bucket actually produced, measured at
                       the point of delivery. Only `Holders` has no event of its
                       own — reflections shift an index rather than transfer — so
                       it alone is derived from the accrual stream.
                       --------------------------------------------------------- */
                    const dv=(token==='UFO'&&delivered&&delivered.ok)?delivered.byPeriod[valueGenPeriod]:null;
                    const px=k=>vgPrices[k]||0;
                    const lpOf=sym=>(dv&&dv.lp[sym])||null;
                    const haveDelivered=!!(showLive&&dv);

                    /* THE QUEUE.
                       Reflections are delivered the instant they accrue — they shift an index,
                       nothing to swap. The other five buckets are UFO sitting in the contract
                       until the balance crosses swapThreshold. So `Holders` shows the front of
                       the pipe and everything else shows the back, and the panel never said so.
                       That, not a bug, is why Holders reads ~1.8x Burn UFO.

                       The contract's UFO balance belongs to the five contract-bound buckets
                       pro-rata by their basis points. */
                    const healthNow=health||((feeAudit&&feeAudit.ok)?feeAudit.health:null);
                    const bps=k=>{const t=cfg.taxBreakdown.find(x=>x.key===k);return t?(t.bps!=null?t.bps:t.pct*100):0;};
                    const contractBpsNow=UFO_FEE_BUCKETS.filter(b=>b.key!=='reflection').reduce((s,b)=>s+bps(b.key),0);
                    const queuedUfoTotal=(token==='UFO'&&healthNow&&healthNow.contractUfoBalance!=null)?healthNow.contractUfoBalance:null;
                    const queuedFor=k=>(queuedUfoTotal==null||k==='reflection'||contractBpsNow<=0)
                      ?0:queuedUfoTotal*(bps(k)/contractBpsNow);

                    /* While the delivery scan is in flight (or if it failed) fall back to the
                       accrued view rather than rendering nothing. `liveItems` must never be
                       null when showLive is true — the grid maps over it. */
                    const liveItems=showLive?UFO_FEE_BUCKETS.map(b=>{
                      const cur=cfg.taxBreakdown.find(x=>x.key===b.key);
                      const pct=cur?cur.pct:0;
                      const accruedUfo=live.tokens[b.key]||0;
                      if(!haveDelivered){
                        /* Delivery scan still in flight. Holders is instant and correct now.
                           The other five are being measured; showing the accrued figure for
                           each renders six identical numbers, then they all change at once — a
                           jarring flash. So mark the five as pending and let the tile show a
                           dash until real delivery arrives. */
                        if(b.key==='reflection'){
                          return{...b,pct,usd:accruedUfo*px('UFO'),parts:[{qty:accruedUfo,symbol:'UFO'}],
                                 accruedUfo,measured:false,queuedUfo:0,instant:true,delivered:true,pending:false};
                        }
                        return{...b,pct,usd:0,parts:[],accruedUfo,measured:false,queuedUfo:0,
                               instant:false,delivered:true,pending:true};
                      }
                      let usd=0,parts=[],measured=true;
                      if(b.key==='reflection'){
                        usd=accruedUfo*px('UFO');
                        parts=[{qty:accruedUfo,symbol:'UFO'}];
                        measured=false;                                  // derived, no event exists
                      }else if(b.key==='ufoBurn'){
                        usd=dv.ufoBurned*px('UFO');
                        parts=[{qty:dv.ufoBurned,symbol:'UFO'}];
                      }else if(b.key==='ptgcBurn'){
                        usd=dv.ptgcBurned*px('PTGC');
                        parts=[{qty:dv.ptgcBurned,symbol:'PTGC'}];
                      }else{
                        const sym=b.key==='plsLP'?'WPLS':b.key==='plsxLP'?'PLSX':'WETH';
                        const e=lpOf(sym);
                        if(e){
                          usd=e.ufo*px('UFO')+e.quote*px(b.priceKey);
                          parts=[{qty:e.ufo,symbol:'UFO'},{qty:e.quote,symbol:sym==='WPLS'?'PLS':sym}];
                        }
                      }
                      return{...b,pct,usd,parts,accruedUfo,measured,
                             queuedUfo:queuedFor(b.key),
                             instant:b.key==='reflection',
                             delivered:(b.key==='reflection')||usd>0};
                    }).filter(i=>i.usd>0||i.pct>0):null;

                    const accruedUsd=live?live.totalTokens*ufoPx:0;
                    const deliveredUsd=haveDelivered?liveItems.reduce((s,i)=>s+i.usd,0):0;
                    const gapUsd=Math.max(0,accruedUsd-deliveredUsd);
                    const liveTotalUsd=haveDelivered?deliveredUsd:accruedUsd;
                    /* Which LP buckets reverted is no longer INFERRED from the failure
                       event's action string — it is measured. A failed add emits no Mint,
                       so its bucket delivers nothing and reads $0. `undelivered` here is
                       derived from the measurement, not from a decoded label. */
                    const undelivered={};
                    if(haveDelivered)liveItems.forEach(i=>{if(!i.delivered)undelivered[i.key]=true;});
                    const failedActions=(feeAudit&&feeAudit.ok&&feeAudit.swapbackFailQueryOk)
                      ?Object.keys(feeAudit.swapbackFailures||{}):[];

                    return(
                      <>
                        <div className="flex items-baseline gap-2 mb-2 flex-wrap">
                          {showLive?(
                            <>
                              {priceless?(
                                <span className={`text-2xl sm:text-3xl font-bold tabular-nums leading-none ${theme.text}`}>{fmtAbbr(Math.round(live.totalTokens))} UFO</span>
                              ):(
                                <span className={`text-2xl sm:text-3xl font-bold tabular-nums leading-none ${theme.text}`}>{fmtUSD(liveTotalUsd)}</span>
                              )}
                              <span className="text-white/45 text-sm sm:text-base">
                                {haveDelivered&&!priceless?'delivered':`from ${live.txCount.toLocaleString()} taxed transfer${live.txCount===1?'':'s'}`}
                              </span>
                              {priceless&&<span className="text-amber-300/70 text-[11px]">price feed unavailable — token amounts are still exact</span>}
                              {live.feeChanges>0&&<span className="text-white/35 text-[10px]">{live.feeChanges} fee change{live.feeChanges===1?'':'s'} in this window</span>}
                            </>
                          ):realizedLoading&&token==='UFO'?(
                            <span className="text-base text-white/40">Reading fees from chain…</span>
                          ):(hasData&&token!=='UFO')?(
                            <>
                              <span className={`text-2xl sm:text-3xl font-bold tabular-nums leading-none ${theme.text}`}>{fmtUSD(totalGen)}</span>
                              <span className="text-white/45 text-sm sm:text-base">from {fmtUSD(periodVol)} vol</span>
                            </>
                          ):(token==='UFO'&&realizedFees&&!realizedFees.ok)?(
                            <div className="flex flex-col gap-1">
                              <span className="text-base text-amber-300/80">Couldn't read fees from chain</span>
                              <span className="text-white/35 text-[11px]">{realizedFees.error}</span>
                              <button onClick={()=>setFeeRetry(n=>n+1)} className="self-start mt-1 px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-white/10 text-white/70 hover:bg-white/20">RETRY</button>
                            </div>
                          ):(
                            <span className="text-base text-white/40">Data unavailable for {valueGenPeriod}</span>
                          )}
                        </div>
                        {/* Removed at the owner's request: the accrued/queued summary, the
                            pricing caveat, the exclusion report, the swaps-taxed line and the
                            swapback-failure strip. All are OPERATOR information, not holder
                            information, and they were crowding the six numbers people come to
                            read. Every one of them still prints to the console, and the full
                            figures live on the `realizedFees`, `delivered` and `feeAudit`
                            objects. Per-bucket "queued" lines stay, because they are the only
                            reason Holders does not look anomalous next to Burn UFO.

                            The two banners BELOW are NOT operator information and must never be
                            hidden: they say a number on this panel is untrustworthy. A bucket
                            reading $0 because a query failed is a lie, not a warning. */}
                        {/* The fee/swap-volume reconciliation used to render here. It is a
                            developer integrity check, not holder information, and cleanly
                            separating trade fees from LP-add / wallet-to-wallet fees turned out
                            to be hard to do exactly from logs alone (a swapback tx contains the
                            contract's own sells and buybacks; a multicall can bundle a trade and
                            an LP add). Three visible versions were wrong. It now lives in the
                            console only — see the "reconciliation" line from fetchDeliveredValue,
                            which reports the ratio and its inputs on every load. If it needs a UI
                            again it belongs behind UFO_MAINTENANCE, never in the public panel. */}

                        {showLive&&haveDelivered&&delivered&&!delivered.mintQueryOk&&(
                          <div className="mb-3 px-3 py-2 rounded-lg bg-red-500/15 border border-red-400/40 text-[11px] text-red-300">
                            a Mint query failed for at least one pair — an LP bucket reading $0 is NOT trustworthy. See console.
                          </div>
                        )}
                        {showLive&&!haveDelivered&&token==='UFO'&&delivered&&!delivered.ok&&(
                          <div className="mb-3 text-[11px] text-amber-300/70">
                            showing fees <span className="font-semibold">accrued</span>, not delivered — {delivered.error}
                          </div>
                        )}
                        {/* MAINT-MIGRATION: the dev audit table lived here. It has been removed.
                            What survives is the part that has to survive: swapback failures and
                            the balances that corroborate them. This renders ONLY when something
                            is actually wrong, so it costs nothing on a healthy contract and it
                            disappears by itself once the contract is fixed. Handoff section 3.5
                            says the way to verify a fix is that this box stops appearing. */}
                        {/* A failed liquidity query must never be presented as "no liquidity moves". */}
                        {token==='UFO'&&feeAudit&&feeAudit.ok&&!feeAudit.liqDetectionOk&&(
                          <div className="mb-3 px-3 py-2 rounded-lg bg-amber-500/10 border border-amber-400/30 text-[11px] text-amber-300">
                            liquidity detection failed — swap/LP classification below is not trustworthy. See console.
                          </div>
                        )}
                        {/* No spacer. The grid absorbs the panel's height and each tile
                            stretches to fill it, so the six numbers are the panel rather
                            than a footnote pinned to the bottom of it. */}
                        {(showLive||(hasData&&token!=='UFO'))&&<div className="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-2.5 flex-1 mt-2">
                          {((showLive?liveItems:orderedItems)||[]).map((item,i)=>{
                            const dollarVal=showLive?item.usd:periodVol*(item.pct/100);
                            const parts=showLive?item.parts:valueGenParts(token,item,dollarVal,vgPrices);
                            const partsLabel=(parts&&parts.length)
                              ?parts.map(pt=>`${fmtTokenQty(pt.qty)} ${pt.symbol}`).join(' + ')
                              :null;
                            const stuck=showLive&&!!undelivered[item.key];
                            /* Everything that used to be printed under the tile now lives here.
                               The queue is still the reason Holders reads higher than Burn UFO;
                               it just doesn't need six lines of chrome to say so. */
                            const qTip=showLive?[
                              partsLabel,
                              item.instant?'Paid to holders the instant the fee is taken — reflections shift an index, so there is nothing to swap and nothing to queue.':null,
                              (!item.instant&&item.queuedUfo>0)?`${fmtAbbr(Math.round(item.queuedUfo))} UFO still waiting in the contract for the next swapback${ufoPx>0?` (${fmtUSD(item.queuedUfo*ufoPx)})`:''}`:null,
                              stuck?`Accrued but never delivered — no Mint was emitted for this pool. ${fmtAbbr(Math.round(item.accruedUfo))} UFO accrued.`:null
                            ].filter(Boolean).join('\n'):undefined;
                            return(
                              <div key={i} className={`bg-white/[0.04] border ${stuck?'border-red-400/40':item.isTotal?'border-emerald-400/40':'border-white/[0.08]'} rounded-lg px-3 py-3 sm:py-4 min-w-0 h-full flex flex-col justify-between gap-2`}>
                                <div className="flex items-center gap-1.5 min-w-0">
                                  {item.isLP&&bucketLogoSrc(item.priceKey)
                                    ?<PairLogo priceKey={item.priceKey} size={26}/>
                                    :<span className="flex items-center gap-1 shrink-0">
                                       <span className="text-base leading-none">{item.emoji}</span>
                                       {item.key==='ufoBurn'&&<img src={TOKENS.UFO.logo} alt="UFO" className="w-6 h-6 rounded-full object-contain shrink-0"/>}
                                       {item.key==='ptgcBurn'&&<img src={TOKENS.PTGC.logo} alt="PTGC" className="w-6 h-6 rounded-full object-contain shrink-0"/>}
                                     </span>}
                                  <span className="text-white/55 text-xs sm:text-sm truncate">{item.name} <span className="text-white/35 tabular-nums">({item.pct}%)</span></span>
                                  {showLive&&item.instant&&<span className="text-emerald-300/50 text-[9px] shrink-0 uppercase tracking-wider" title="reflections shift an index rather than transfer tokens — holders are paid the instant the fee is taken, with nothing to queue and no event to measure">instant</span>}
                                  {stuck&&<span className="text-red-400 text-[10px] shrink-0" title="accrued but never delivered — no Mint was emitted for this pool">⚠</span>}
                                </div>
                                {/* USD mode shows the dollar amount and nothing else — the TOK toggle
                                    at the top of the panel carries the token detail, and the queued
                                    figure lives in the tooltip rather than under every tile. */}
                                {item.pending?(
                                  <div className="text-lg sm:text-2xl font-semibold text-right text-white/20 leading-none animate-pulse" title="measuring delivery from chain…">—</div>
                                ):(valueGenShowTokens||priceless)&&partsLabel?(
                                  <div className={`font-semibold text-base sm:text-lg text-right tabular-nums leading-tight ${theme.text} truncate`}
                                       title={qTip}>{partsLabel}</div>
                                ):(
                                  <div className={`text-lg sm:text-2xl font-semibold text-right tabular-nums leading-none ${stuck?'text-red-300/70':theme.text} truncate`}
                                       title={qTip}>{fmtUSD(dollarVal)}</div>
                                )}
                              </div>
                            );
                          })}
                        </div>}
                      </>
                    );
                  })()}
                  </div>
                </div>
              </section>

              {/* === Token Allocation panel === */}
              <section className="relative bg-[#050505] border border-purple-400/45 rounded-2xl overflow-hidden">
                <div className="absolute top-0 left-6 right-6 h-px bg-gradient-to-r from-transparent via-purple-400/90 to-transparent"></div>
                <div className="p-5 sm:p-6">
                  <div className="flex justify-between items-start mb-4">
                    <h3 className="font-orbitron text-xs sm:text-sm uppercase tracking-[0.18em] text-white/85 flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-purple-400 shadow-[0_0_8px_rgba(192,132,252,0.7)]"></span>
                      Token Allocation
                      <span className="text-white/55 font-normal tracking-normal normal-case ml-0.5">/ {token}</span>
                      <button onClick={()=>setShowAllocationShareModal(true)} className="text-xs opacity-40 hover:opacity-100 transition-opacity ml-1">{'\u{1F4F7}'}</button>
                    </h3>
                    <button onClick={()=>setShowTierInfo(true)} className="px-2.5 py-1 rounded-md text-[11px] font-semibold tracking-wider uppercase text-purple-300 border border-purple-400/30 bg-purple-500/10 hover:bg-purple-500/20 hover:border-purple-400/60 transition-colors">Leagues</button>
                  </div>

                  <div className="flex items-center gap-4 sm:gap-6 flex-wrap">
                    <DonutChart data={chartData} colors={chartColors} size={100}/>
                    <div className="space-y-2 min-w-0">
                      {chartData.map((d,i)=>(
                        <div key={i} className="flex items-center gap-2.5 text-sm sm:text-base flex-wrap">
                          <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{background:chartColors[i]}}></div>
                          <span className="text-white/55">{d.label}:</span>
                          <span className="text-zinc-300 tabular-nums">{fmtAbbr(d.tokens)}</span>
                          <span className={`font-semibold tabular-nums ${theme.text}`}>{d.value.toFixed(2)}%</span>
                        </div>
                      ))}
                    </div>
                    <div className="w-full sm:w-auto sm:border-l border-white/[0.08] sm:pl-6 sm:ml-auto pt-3 sm:pt-0 border-t sm:border-t-0 border-white/[0.08]">
                      {(holderTiers?.Poseidon===0&&holderTiers?.Whale===0&&holderTiers?.Shark===0&&holderTiers?.Dolphin===0&&holderTiers?.SquidAndBelow===0&&holderTiers?.ok!==false)?(
                        <div className="flex items-center gap-2">
                          <div className="w-4 h-4 border-2 border-t-transparent rounded-full animate-spin" style={{borderColor:`${cfg.colorHex} transparent transparent transparent`}}></div>
                          <span className="text-white/40 text-xs">Loading...</span>
                        </div>
                      ):(
                        <div className="grid grid-cols-3 gap-x-4 sm:gap-x-5 gap-y-2.5 text-center">
                          <div><div className="text-2xl sm:text-3xl">{'\u{1F531}'}</div><div className={`text-sm sm:text-base font-semibold tabular-nums ${theme.text}`}>{holderTiers?.Poseidon==null?'\u2014':(holderTiers.partial?'\u2265':'')+holderTiers.Poseidon}</div></div>
                          <div><div className="text-2xl sm:text-3xl">{'\u{1F40B}'}</div><div className={`text-sm sm:text-base font-semibold tabular-nums ${theme.text}`}>{holderTiers?.Whale==null?'\u2014':(holderTiers.partial?'\u2265':'')+holderTiers.Whale}</div></div>
                          <div><div className="text-2xl sm:text-3xl">{'\u{1F988}'}</div><div className={`text-sm sm:text-base font-semibold tabular-nums ${theme.text}`}>{holderTiers?.Shark==null?'\u2014':(holderTiers.partial?'\u2265':'')+holderTiers.Shark}</div></div>
                          <div><div className="text-2xl sm:text-3xl">{'\u{1F42C}'}</div><div className={`text-sm sm:text-base font-semibold tabular-nums ${theme.text}`}>{holderTiers?.Dolphin==null?'\u2014':(holderTiers.partial?'\u2265':'')+holderTiers.Dolphin}</div></div>
                          <div className="col-span-2"><div className="text-xl sm:text-2xl">{'\u{1F991}'}<span className="text-white/60 mx-0.5">{'\u2192'}</span>{'\u{1F41A}'}</div><div className={`text-sm sm:text-base font-semibold tabular-nums ${theme.text}`}>{holderTiers?.SquidAndBelow==null?'\u2014':fmtAbbr(holderTiers.SquidAndBelow)}</div></div>
                        </div>
                      )}
                    </div>
                  </div>

                  {!cfg.hasDAO&&(
                    <div className="mt-5 pt-4 border-t border-white/[0.06] flex-1 flex flex-col justify-center gap-4">
                      {/* A single bar carries what the donut carries, but reads left-to-right and
                          fills the width. Same three colours as the legend above it. */}
                      {(()=>{
                        const max=cfg.totalSupply||1;
                        const b=(burn?.total||0)/max*100;
                        const l=(tokensInLP||0)/max*100;

                        return(
                          <div>
                            <div className="flex h-2 rounded-full overflow-hidden bg-white/[0.06]">

                            <div className="flex justify-between mt-1.5 text-[10px] text-white/30 tabular-nums">
                              <span>0</span><span>{fmtAbbr(cfg.totalSupply)} max supply</span>
                            </div>
                          </div>
                        );
                      })()}
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <div className="text-xs sm:text-sm uppercase tracking-[0.18em] text-white/55 font-semibold mb-1.5">Max Total Supply</div>
                          <div className={`text-lg sm:text-2xl font-semibold tabular-nums leading-none ${theme.text}`}>{fmtAbbr(cfg.totalSupply)}</div>

                          <div className="text-xs sm:text-sm uppercase tracking-[0.18em] text-white/55 font-semibold mb-1.5">Circulating Supply</div>
                          <div className={`text-lg sm:text-2xl font-semibold tabular-nums leading-none ${theme.text}`}>{fmtAbbr(cfg.totalSupply-(burn?.total||0))}</div>

              {/* === DAO Treasury (PTGC) / PTGC Burned by UFO (UFO) === */}
              {cfg.hasDAO?(

                  <div className="p-5 sm:p-6">

                        <span className="w-1.5 h-1.5 rounded-full bg-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.7)]"></span>

                        <span className="text-white/55 font-normal tracking-normal normal-case ml-0.5">/ {token}</span>

                    </div>
                    {daoLoading?(

                            <div className={`text-lg sm:text-xl font-medium tabular-nums leading-none ${theme.text} truncate`}>{fmtUSD(daoData?.availableUSD||0)}</div>

    // Affiliates Dashboard Page
    // Module-level helper (used by BuyerDistributionModal and AffiliatesPage)
    const PTGC_SUPPLY_GLOBAL=333333333333;
    const getCreatureForPtgc=(ptgcAmount)=>{
      if(!ptgcAmount||ptgcAmount<=0)return null;
      const pct=(ptgcAmount/PTGC_SUPPLY_GLOBAL)*100;
      for(const c of BURN_C){
        if(pct>=c.p){
          const cnt=c.p>0?Math.floor(pct/c.p):1;
          return{emoji:c.e,name:c.n,count:Math.max(1,cnt)};

      return{emoji:'🐚',name:'Shell',count:1};
    };

    // ===== BUYER DISTRIBUTION MODAL =====
    const BuyerDistributionModal=({allTx,referrerDetails,onClose})=>{
      const[metric,setMetric]=useState('ptgc');
      const[copiedWallet,setCopiedWallet]=useState(null);
      const[walletMap,setWalletMap]=useState({});
      const[fetchProgress,setFetchProgress]=useState(0);
      const[fetchTotal,setFetchTotal]=useState(0);
      const[fetchDone,setFetchDone]=useState(false);

      const COLORS=['#818cf8','#34d399','#f472b6','#fb923c','#60a5fa','#a78bfa','#4ade80','#fbbf24','#f87171','#38bdf8','#e879f9','#2dd4bf','#fb7185','#a3e635','#22d3ee'];

      // Fetch buyer (from) address for each tx via RPC eth_getTransactionByHash
      useEffect(()=>{
        const txsWithHash=allTx.filter(tx=>tx.txHash);
        if(!txsWithHash.length){setFetchDone(true);return;}
        setFetchTotal(txsWithHash.length);
        let done=0;
        const map={};
        // Process in batches of 5 to avoid flooding RPC
        const BATCH=5;
        const processBatch=async(batch)=>{
          await Promise.all(batch.map(async tx=>{
            try{
              const res=await rpcFetch({jsonrpc:'2.0',method:'eth_getTransactionByHash',params:[tx.txHash],id:1},8000);
              const fromAddr=res?.result?.from;
              if(fromAddr){
                const addr=fromAddr.toLowerCase();
                if(!map[addr])map[addr]={wallet:fromAddr,ptgc:0,usd:0,buys:0};
                map[addr].ptgc+=(tx.ptgcAmount||0);
                map[addr].usd+=(tx.usdAmount||0);
                map[addr].buys+=1;
              }
            }catch(e){/* skip failed lookups */}
            done++;
            setFetchProgress(done);
          }));
        };
        (async()=>{
          for(let i=0;i<txsWithHash.length;i+=BATCH){
            await processBatch(txsWithHash.slice(i,i+BATCH));
            setWalletMap({...map});
          }
          setFetchDone(true);
        })();
      },[]);

      const walletData=Object.values(walletMap);

      const totals={
        ptgc:walletData.reduce((s,w)=>s+w.ptgc,0),
        usd:walletData.reduce((s,w)=>s+w.usd,0),
        buys:walletData.reduce((s,w)=>s+w.buys,0),
      };

      const sortedWallets=useMemo(()=>{
        const getV=(w)=>metric==='ptgc'?w.ptgc:metric==='usd'?w.usd:w.buys;
        return[...walletData].sort((a,b)=>getV(b)-getV(a));
      },[walletData,metric]);

      const getVal=(w)=>metric==='ptgc'?w.ptgc:metric==='usd'?w.usd:w.buys;
      const totalVal=metric==='ptgc'?totals.ptgc:metric==='usd'?totals.usd:totals.buys;

      // Trophy logic (same as referrer card header)
      const trophyMap={Whale:'logos/ptgc/trophy_whale_gold.png',Shark:'logos/ptgc/trophy_shark_silver.png',Dolphin:'logos/ptgc/trophy_dolphin_gold.png'};
      const creature=referrerDetails?getCreatureForPtgc(referrerDetails.totalPtgc):null;
      const trophyImg=creature?trophyMap[creature.name]:null;

      // CopyBtn inline for header wallet
      const[headerCopied,setHeaderCopied]=useState(false);

      // Chart
      useEffect(()=>{
        if(!chartRef.current||sortedWallets.length===0)return;
        if(chartInstanceRef.current)chartInstanceRef.current.destroy();
        const getV=(w)=>metric==='ptgc'?w.ptgc:metric==='usd'?w.usd:w.buys;
        const tot=sortedWallets.reduce((s,w)=>s+getV(w),0);
        const ctx=chartRef.current.getContext('2d');
        chartInstanceRef.current=new Chart(ctx,{
          type:'pie',
          data:{
            labels:sortedWallets.map(w=>`${w.wallet.slice(0,6)}...${w.wallet.slice(-4)}`),
            datasets:[{
              data:sortedWallets.map(w=>getV(w)),
              backgroundColor:COLORS.slice(0,Math.min(sortedWallets.length,COLORS.length)),
              borderWidth:2,borderColor:'#111'
            }]
          },
          options:{
            responsive:false,animation:{duration:400},
            plugins:{
              legend:{display:false},
              tooltip:{callbacks:{label:(ctx)=>{
                const w=sortedWallets[ctx.dataIndex];
                const pct=tot>0?((getV(w)/tot)*100).toFixed(1):'0';
                const valStr=metric==='ptgc'?fmtAbbr(getV(w))+' PTGC':metric==='usd'?fmtDollar(getV(w)):getV(w)+' buys';
                return` ${pct}% — ${valStr}`;
              }}}
            }
          }
        });
        return()=>{if(chartInstanceRef.current){chartInstanceRef.current.destroy();chartInstanceRef.current=null;}};
      },[sortedWallets,metric]);

      const progressPct=fetchTotal>0?Math.round((fetchProgress/fetchTotal)*100):0;

      return(
        <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 sm:p-4 bg-black/80" style={{backdropFilter:'blur(6px)'}} onClick={onClose}>
          <div className="bg-[#111] border border-[#D4AF37]/30 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl" onClick={e=>e.stopPropagation()}>

                    </div>

                  <div className="flex-1 text-right">
                    <div className="inline-flex flex-col items-center px-4 py-2 rounded-lg" style={{background:'linear-gradient(135deg,rgba(139,92,246,0.25),rgba(109,40,217,0.2))',border:'1px solid rgba(139,92,246,0.45)'}}>
                      <span className="text-purple-300 font-bold text-[15px] leading-tight whitespace-nowrap">Buyer Distribution</span>
                      <span className="text-purple-400/70 font-semibold text-[11px] leading-tight whitespace-nowrap">PTGC Affiliate Program</span>
                    </div>
                  </div>
                </div>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl transition leading-none ml-4 flex-shrink-0">×</button>
            </div>

            {/* Fetch progress */}
            {!fetchDone&&(
              <div className="mx-4 mt-4 bg-black/40 border border-white/10 rounded-xl p-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-white/70 text-sm">Fetching buyer wallets from chain...</span>
                  <span className="text-[#D4AF37] font-bold text-sm">{fetchProgress}/{fetchTotal}</span>
                </div>
                <div className="h-2 bg-black/50 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-[#D4AF37] to-yellow-400 rounded-full transition-all duration-300" style={{width:`${progressPct}%`}}/>
                </div>
                <div className="text-gray-500 text-xs mt-1 text-center">{progressPct}% complete — partial results shown below</div>
              </div>
            )}

            {/* Summary Bar */}
            {(fetchDone||walletData.length>0)&&(
              <div className="mx-3 sm:mx-4 mt-4 bg-black/40 border border-white/10 rounded-xl p-3 sm:p-4">
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <div className="min-w-0">
                    <div className="text-xl sm:text-3xl font-bold text-[#D4AF37] truncate">
                      {metric==='ptgc'?`${fmtAbbr(totals.ptgc)} PTGC`:metric==='usd'?fmtDollar(totals.usd):`${totals.buys} buys`}

                    <div className="text-gray-400 text-xs sm:text-base mt-0.5">
                      {metric==='ptgc'?'total PTGC volume':metric==='usd'?'total USD volume':'total transactions'}

                  <div className="text-right min-w-0">
                    <div className="text-white font-bold text-base sm:text-2xl truncate">{sortedWallets.length} unique buyer wallet{sortedWallets.length!==1?'s':''}</div>
                    <div className="text-gray-400 text-xs sm:text-base mt-0.5 truncate">{fmtDollar(totals.usd)} / {fmtAbbr(totals.ptgc)} PTGC external</div>
                  </div>
                </div>
              </div>
            )}

            {/* Metric Toggle */}
            <div className="flex gap-2 mx-3 sm:mx-4 mt-3 flex-wrap">
              {[{k:'ptgc',label:'PTGC'},{k:'usd',label:'USD'},{k:'buys',label:'Buy Count'}].map(({k,label})=>(
                <button key={k} onClick={()=>setMetric(k)}
                  className={`px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all ${metric===k?'bg-[#D4AF37] text-black shadow-lg':'bg-white/10 text-white/60 hover:bg-white/20'}`}>
                  {label}
                </button>
              ))}
            </div>

            {/* Chart + Wallet List */}
            {sortedWallets.length>0?(
              <div className="flex flex-col sm:flex-row gap-4 p-3 sm:p-4 items-center sm:items-start">
                <div className="flex-shrink-0">
                  <canvas ref={chartRef} width="190" height="190"/>

                <div className="flex-1 space-y-1.5 overflow-y-auto buyer-dist-wallets w-full" style={{maxHeight:'240px'}}>
                  {sortedWallets.map((w,i)=>{

    const AffiliatesPage=({onBack})=>{

      const[searchTerm,setSearchTerm]=useState('');
      const[selectedReferrer,setSelectedReferrer]=useState(null);
      const[activeTab,setActiveTab]=useState('payments');
      const[viewingMonth,setViewingMonth]=useState(null);
      const[expandedReceipts,setExpandedReceipts]=useState(new Set());
      const[expandedMonthTx,setExpandedMonthTx]=useState(null);
      const[sortCol,setSortCol]=useState('ptgc');
      const[sortDir,setSortDir]=useState('desc');
      const[showRegistry,setShowRegistry]=useState(false);
      const[commLogMonth,setCommLogMonth]=useState(null);
      const[expandedEntries,setExpandedEntries]=useState(new Set());
      const[showLeaderboard,setShowLeaderboard]=useState(false);
      const[showPayments,setShowPayments]=useState(false);
      const[registrySearch,setRegistrySearch]=useState('');
      const[leaderboardMonth,setLeaderboardMonth]=useState(null);
      const[expandedTxMonths,setExpandedTxMonths]=useState(new Set());
      const[showAllReceipts,setShowAllReceipts]=useState(false);
      const[showAllCurrentMonthTx,setShowAllCurrentMonthTx]=useState(false);
      const[recentActivityExpanded,setRecentActivityExpanded]=useState(false);
      const[commSortCol,setCommSortCol]=useState('ptgc');
      const[commSortDir,setCommSortDir]=useState('desc');
      const[showBuyerDist,setShowBuyerDist]=useState(false);
      
      // Current month key - USE UTC TIME
      const currentMonth=new Date().toISOString().slice(0,7);
      
      useEffect(()=>{
        const fetchData=async()=>{
          try{
            const res=await fetch('https://ptgcapi.ptgctools.workers.dev/public/commissions');
            if(!res.ok)throw new Error('Failed to fetch');
            const json=await res.json();
            setData(json);
            // Set to current UTC month
            const utcMonth=new Date().toISOString().slice(0,7);
            setCommLogMonth(utcMonth);
            setViewingMonth(utcMonth);
          }catch(e){
            setError(e.message);
          }finally{
            setLoading(false);
          }
        };
        fetchData();
      },[]);
      
      // Get all months from data - include current month even if no data exists yet
      const allMonths=useMemo(()=>{
        if(!data?.monthlyLogs)return[currentMonth];
        const months=Object.keys(data.monthlyLogs);
        if(!months.includes(currentMonth)){
          months.push(currentMonth);
        }
        return months.sort().reverse();
      },[data,currentMonth]);
      
      // Get current month settings
      const currentMonthSettings=useMemo(()=>{
        if(!data?.monthlyLogs?.[currentMonth])return{commissionRate:2,threshold:10,thresholdType:'usd',coverFee:true};
        return data.monthlyLogs[currentMonth].settings||{commissionRate:2,threshold:10,thresholdType:'usd',coverFee:true};
      },[data,currentMonth]);
      
      // Helper: is an entry fully paid? Uses same logic as getEntryStatus
      const isEntryPaid=(e)=>{
        if(!e.buys?.length)return e.status==='paid';
        const qualify=e.buys.filter(b=>b.ptgcAmount>0&&b.meetsThreshold!==false);
        if(!qualify.length)return false;
        return qualify.filter(b=>b.paid).length===qualify.length;
      };
      
      // Helper: get the commission amount for an entry (entry-level, NOT from buys array)
      const getEntryComm=(e,fallbackRate)=>{
        return e.commissionPtgc||((e.ptgcAmount||0)*((e.commissionRate||fallbackRate)/100));
      };
      const getEntryCommUsd=(e,fallbackRate)=>{
        return(e.usdAmount||0)*((e.commissionRate||fallbackRate)/100);
      };
      
      // Calculate stats from data based on viewing period
      const stats=useMemo(()=>{
        if(!data)return null;
        const referrers=Object.entries(data.referrers||{});
        const totalReferrers=referrers.length;
        
        // Calculate all-time from monthlyLogs
        let allTimeBuys=0,allTimeUsd=0,allTimePtgc=0,allTimeCommission=0;
        let totalPaid=0,totalPaidUsd=0;
        if(data.monthlyLogs){
          Object.values(data.monthlyLogs).forEach(month=>{
            const entries=month.entries||[];
            const rate=month.settings?.commissionRate||2;
            allTimeBuys+=entries.reduce((sum,e)=>sum+(e.buysCount||0),0);
            allTimeUsd+=entries.reduce((sum,e)=>sum+(e.usdAmount||0),0);
            allTimePtgc+=entries.reduce((sum,e)=>sum+(e.ptgcAmount||0),0);
            allTimeCommission+=entries.reduce((sum,e)=>sum+getEntryComm(e,rate),0);
            // FIX: Sum entry-level commission for PAID entries only, with fee coverage
            entries.forEach(e=>{
              if(isEntryPaid(e)){
                totalPaid+=getEntryComm(e,rate);
                totalPaidUsd+=getEntryCommUsd(e,rate);
              }
            });
          });
        }
        console.log('[PTGC-FIX] All-time totalPaid:',totalPaid,'allTimeCommission:',allTimeCommission);
        
        // Fallback to referrers totals if no monthlyLogs
        if(allTimeBuys===0&&allTimeUsd===0){
          allTimeBuys=referrers.reduce((sum,[,r])=>sum+(r.totalBuys||0),0);
          allTimeUsd=referrers.reduce((sum,[,r])=>sum+(r.totalUsd||0),0);
          allTimePtgc=referrers.reduce((sum,[,r])=>sum+(r.totalPtgc||0),0);
        }
        
        // Viewing period stats
        const selectedMonth=viewingMonth||currentMonth;
        let periodBuys=0,periodUsd=0,periodPtgc=0,periodReferrers=0,periodPaid=0,periodCommission=0;
        
        if(selectedMonth){
          const monthLog=data.monthlyLogs?.[selectedMonth];
          const entries=monthLog?.entries||[];
          const rate=monthLog?.settings?.commissionRate||2;
          periodBuys=entries.reduce((sum,e)=>sum+(e.buysCount||0),0);
          periodPtgc=entries.reduce((sum,e)=>sum+(e.ptgcAmount||0),0);
          periodUsd=entries.reduce((sum,e)=>sum+(e.usdAmount||0),0);
          periodCommission=entries.reduce((sum,e)=>sum+getEntryComm(e,rate),0);
          periodReferrers=entries.length;
          // FIX: Sum entry-level commission for PAID entries only, with fee coverage
          entries.forEach(e=>{
            if(isEntryPaid(e)){
              periodPaid+=getEntryComm(e,rate);
            }
          });
          console.log('[PTGC-FIX] Period',selectedMonth,'periodPaid:',periodPaid,'periodCommission:',periodCommission);
        }
        
        // Current month stats
        const currentMonthLog=data.monthlyLogs?.[currentMonth];
        const activeThisMonth=(currentMonthLog?.entries||[]).length;
        
        // Leaderboard sorted by total PTGC (always all-time for leaderboard)
        const leaderboard=referrers.map(([username,r])=>({username,...r})).sort((a,b)=>(b.totalPtgc||0)-(a.totalPtgc||0));
        
        return{totalReferrers,allTimeBuys,allTimeUsd,allTimePtgc,allTimeCommission,totalPaid,totalPaidUsd,periodBuys,periodUsd,periodPtgc,periodCommission,periodReferrers,periodPaid,activeThisMonth,leaderboard,currentMonth};
      },[data,viewingMonth,currentMonth]);
      
      const truncateWallet=(w)=>w?`${w.slice(0,6)}...${w.slice(-4)}`:'—';
      
      
      // Copy icon SVG component
      const CopyIcon=({className="w-3.5 h-3.5"})=>(
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={1.5}>
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      );
      
      // Copy button component for addresses
      const CopyBtn=({text,className="text-gray-400 hover:text-white"})=>{
        const[copied,setCopied]=useState(false);
        return(
          <button
            onClick={(e)=>{
              e.stopPropagation();
              navigator.clipboard.writeText(text);
              setCopied(true);
              setTimeout(()=>setCopied(false),1500);
            }}
            className={`${className} transition inline-flex items-center`}
            title="Copy"
          >
            {copied?<svg className="w-3.5 h-3.5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>:<CopyIcon/>}
          </button>
        );
      };
      const formatDate=(d)=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
      const formatDateTime=(d)=>d?new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
      const formatMonthYear=(m)=>m?new Date(m+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}):'—';
      
      // Filter leaderboard by search
      const filteredLeaderboard=useMemo(()=>{
        if(!stats?.leaderboard)return[];
        if(!searchTerm)return stats.leaderboard;
        const term=searchTerm.toLowerCase();
        return stats.leaderboard.filter(r=>r.username.toLowerCase().includes(term)||r.wallet?.toLowerCase().includes(term));
      },[stats?.leaderboard,searchTerm]);
      
      // Get referrer details with their monthly breakdown and transaction details
      const getReferrerDetails=(username)=>{
        if(!data)return null;
        const referrer=data.referrers?.[username];
        if(!referrer)return null;
        
        const monthlyEntries=[];
        let lifetimeBuys=0;
        let lifetimePtgc=0;
        let lifetimeUsd=0;
        
        Object.entries(data.monthlyLogs||{}).forEach(([month,log])=>{
          const entry=(log.entries||[]).find(e=>e.username===username);
          if(entry){
            monthlyEntries.push({month,settings:log.settings,...entry});
            lifetimeBuys+=(entry.buysCount||0);
            lifetimePtgc+=(entry.ptgcAmount||0);
            lifetimeUsd+=(entry.usdAmount||0);
          }
        });
        monthlyEntries.sort((a,b)=>b.month.localeCompare(a.month));
        
        const receipts=(data.receipts||[]).filter(r=>r.username===username).sort((a,b)=>new Date(b.date)-new Date(a.date));
        
        // Calculate total commissions paid from entry-level data (with fee coverage)
        let totalCommPaid=0,totalCommPaidUsd=0;
        monthlyEntries.forEach(me=>{
          const rate=me.commissionRate||me.settings?.commissionRate||2;
          if(isEntryPaid(me)){
            totalCommPaid+=getEntryComm(me,rate);
            totalCommPaidUsd+=getEntryCommUsd(me,rate);
          }
        });
        
        return{...referrer,username,monthlyEntries,receipts,totalCommPaid,totalCommPaidUsd,totalBuys:lifetimeBuys,totalPtgc:lifetimePtgc,totalUsd:lifetimeUsd};
      };
      
      // Group receipts by date
      const receiptsByDate=useMemo(()=>{
        if(!data?.receipts)return{};
        const grouped={};
        data.receipts.forEach(r=>{
          const dateKey=r.date?r.date.split('T')[0]:'unknown';
          if(!grouped[dateKey])grouped[dateKey]=[];
          grouped[dateKey].push(r);
        });
        return grouped;
      },[data?.receipts]);
      
      const sortedReceiptDates=useMemo(()=>Object.keys(receiptsByDate).sort().reverse(),[receiptsByDate]);
      
      // Referrer stats for registry
      const referrerStats=useMemo(()=>{
        if(!data)return[];
        const referrers=Object.entries(data.referrers||{});
        return referrers.map(([username,r])=>{
          let pending=0,commPaid=0,commPaidUsd=0;
          Object.values(data.monthlyLogs||{}).forEach(log=>{
            const entry=(log.entries||[]).find(e=>e.username===username);
            if(entry){
              const rate=entry.commissionRate||log.settings?.commissionRate||2;
              const entryComm=getEntryComm(entry,rate);
              const entryCommUsd=getEntryCommUsd(entry,rate);
              if(isEntryPaid(entry)){
                commPaid+=getEntryComm(entry,rate);
                commPaidUsd+=getEntryCommUsd(entry,rate);
              }else{
                // Not fully paid - check if below threshold
                const isBelowThreshold=entry.buys?.length?
                  entry.buys.filter(b=>b.ptgcAmount>0&&b.meetsThreshold!==false).length===0:
                  entry.meetsThreshold===false;
                if(!isBelowThreshold)pending+=entryComm;
              }
            }
          });
          return{name:username,wallet:r.wallet,buys:r.totalBuys||0,ptgc:r.totalPtgc||0,usd:r.totalUsd||0,commPaid,commPaidUsd,pending};
        });
      },[data]);
      
      const sortedRegistry=useMemo(()=>{
        if(!referrerStats.length)return[];
        return[...referrerStats].sort((a,b)=>{
          let av,bv;
          switch(sortCol){
            case'name':av=a.name.toLowerCase();bv=b.name.toLowerCase();break;
            case'buys':av=a.buys;bv=b.buys;break;
            case'ptgc':av=a.ptgc;bv=b.ptgc;break;
            case'usd':av=a.usd;bv=b.usd;break;
            case'commPaid':av=a.commPaid;bv=b.commPaid;break;
            case'commPaidUsd':av=a.commPaidUsd;bv=b.commPaidUsd;break;
            case'pending':av=a.pending;bv=b.pending;break;
            default:av=a.name;bv=b.name;
          }
          if(sortDir==='asc')return av>bv?1:av<bv?-1:0;
          return av<bv?1:av>bv?-1:0;
        });
      },[referrerStats,sortCol,sortDir]);
      
      // Get commission log settings for selected month
      const commLogSettings=useMemo(()=>{
        const cm=commLogMonth||currentMonth;
        if(!cm||!data?.monthlyLogs?.[cm])return{commissionRate:2,threshold:10,thresholdType:'usd',coverFee:true};
        return data.monthlyLogs[cm].settings||{commissionRate:2,threshold:10,thresholdType:'usd',coverFee:true};
      },[data,commLogMonth,currentMonth]);
      
      const commLogEntries=useMemo(()=>{
        const cm=commLogMonth||currentMonth;
        if(!cm||!data?.monthlyLogs?.[cm])return[];
        return data.monthlyLogs[cm].entries||[];
      },[data,commLogMonth,currentMonth]);
      
      // Recent transactions for current month (latest 3)
      const recentTransactions=useMemo(()=>{
        if(!data?.monthlyLogs?.[currentMonth])return[];
        const entries=data.monthlyLogs[currentMonth].entries||[];
        const allTx=[];
        entries.forEach(entry=>{
          (entry.buys||[]).forEach(b=>{
            if(b.ptgcAmount>0){
              allTx.push({...b,username:entry.username,wallet:entry.wallet});
            }
          });
        });
        allTx.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
        return allTx.slice(0,10);
      },[data,currentMonth]);
      
      // Helper functions
      const toggleSort=(col)=>{
        if(sortCol===col)setSortDir(sortDir==='asc'?'desc':'asc');
        else{setSortCol(col);setSortDir(col==='name'?'asc':'desc');}
      };
      
      const SortIcon=({col})=>sortCol!==col?<span className="text-gray-600 ml-1">↕</span>:<span className="text-[#D4AF37] ml-1">{sortDir==='asc'?'↑':'↓'}</span>;
      
      const toggleCommSort=(col)=>{
        if(commSortCol===col)setCommSortDir(commSortDir==='asc'?'desc':'asc');
        else{setCommSortCol(col);setCommSortDir(col==='username'?'asc':'desc');}
      };
      
      const CommSortIcon=({col})=>commSortCol!==col?<span className="text-gray-600 ml-1">↕</span>:<span className="text-[#D4AF37] ml-1">{commSortDir==='asc'?'↑':'↓'}</span>;
      
      const getEntryStatus=(e)=>{
        if(!e.buys?.length){if(e.meetsThreshold===false)return'below';return e.status||'unpaid';}
        const valid=e.buys.filter(b=>b.ptgcAmount>0);
        const qualify=valid.filter(b=>b.meetsThreshold!==false);
        if(!qualify.length)return'below';
        const paid=qualify.filter(b=>b.paid).length;
        if(paid===qualify.length)return'paid';
        if(paid>0)return'partial';
        return'unpaid';
      };
      
      const sortedCommLogEntries=useMemo(()=>{
        if(!commLogEntries.length)return[];
        const statusOrder={paid:0,partial:1,unpaid:2,below:3};
        return[...commLogEntries].sort((a,b)=>{
          let av,bv;
          switch(commSortCol){
            case'username':av=a.username?.toLowerCase()||'';bv=b.username?.toLowerCase()||'';break;
            case'buys':av=a.buysCount||0;bv=b.buysCount||0;break;
            case'ptgc':av=a.ptgcAmount||0;bv=b.ptgcAmount||0;break;
            case'usd':av=a.usdAmount||0;bv=b.usdAmount||0;break;
            case'commission':av=a.commissionPtgc||0;bv=b.commissionPtgc||0;break;
            case'status':av=statusOrder[getEntryStatus(a)]??9;bv=statusOrder[getEntryStatus(b)]??9;break;
            default:av=a.ptgcAmount||0;bv=b.ptgcAmount||0;
          }
          if(commSortDir==='asc')return av>bv?1:av<bv?-1:0;
          return av<bv?1:av>bv?-1:0;
        });
      },[commLogEntries,commSortCol,commSortDir]);
      
      if(loading){
        return(
          <div className="min-h-screen bg-[#0a0a0a] flex items-center justify-center">
            <div className="text-center">
              <div className="w-16 h-16 border-4 border-[#D4AF37]/30 border-t-[#D4AF37] rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-[#D4AF37] font-orbitron">Loading Affiliate Data...</p>
            </div>
          </div>
        );
      }
      
      if(error){
        return(
          <div className="min-h-screen bg-[#0a0a0a] flex items-center justify-center">
            <div className="text-center">
              <div className="text-6xl mb-4">⚠️</div>
              <p className="text-red-400 font-orbitron mb-4">Error Loading Data</p>
              <p className="text-white/50 mb-6">{error}</p>
              <button onClick={onBack} className="px-6 py-2 bg-[#D4AF37] text-black font-bold rounded-lg">Go Back</button>
            </div>
          </div>
        );
      }
      
      return(
        <div className="min-h-screen bg-gradient-to-b from-gray-900 via-[#0a0a0a] to-gray-900">
          {/* Referrer Detail Modal */}
          {selectedReferrer&&(()=>{
            const details=getReferrerDetails(selectedReferrer);
            if(!details)return null;
            
            // Get all transactions for this referrer across all months (deduplicated)
            const allTx=[];
            const seenTxKeys=new Set();
            Object.entries(data.monthlyLogs||{}).forEach(([month,log])=>{
              const entry=(log.entries||[]).find(e=>e.username===selectedReferrer);
              if(entry?.buys){
                entry.buys.forEach(b=>{
                  const key=b.txHash||`${b.date}-${b.ptgcAmount}-${b.buyer||''}-${month}`;
                  if(!seenTxKeys.has(key)){
                    seenTxKeys.add(key);
                    allTx.push({...b,month,rate:entry.commissionRate||log.settings?.commissionRate||2});
                  }
                });
              }
            });
            allTx.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
            
            // Calculate pending from entry-level data (not buys array sums)
            let pending=0,pendingUsd=0;
            details.monthlyEntries.forEach(me=>{
              const rate=me.commissionRate||me.settings?.commissionRate||2;
              if(!isEntryPaid(me)){
                const isBelowThreshold=me.buys?.length?
                  me.buys.filter(b=>b.ptgcAmount>0&&b.meetsThreshold!==false).length===0:
                  me.meetsThreshold===false;
                if(!isBelowThreshold){
                  pending+=getEntryComm(me,rate);
                  pendingUsd+=getEntryCommUsd(me,rate);
                }
              }
            });
            
            // Monthly breakdown using entry-level commission
            const monthlyBreakdown=details.monthlyEntries.map(me=>{
              const paidTx=me.buys?.filter(b=>b.paid).length||0;
              const totalTx=me.buys?.length||0;
              const rate=me.commissionRate||me.settings?.commissionRate||2;
              const paidComm=isEntryPaid(me)?getEntryComm(me,rate):0;
              return{...me,paidTx,totalTx,paidComm};
            });
            
            return(
              <>
              <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90" onClick={()=>{setSelectedReferrer(null);setExpandedTxMonths(new Set());setShowAllReceipts(false);setShowAllCurrentMonthTx(false);setShowBuyerDist(false);}}>
                <div className="bg-[#111] border border-[#D4AF37]/30 rounded-2xl max-w-3xl w-full max-h-[90vh] shadow-2xl flex flex-col" onClick={e=>e.stopPropagation()}>
                  <div className="overflow-y-auto flex-1">
                  {/* Header */}
                  <div className="flex items-center justify-between p-4 border-b border-white/10">
                    <div className="flex items-center gap-4">
                      <img src="06_PTGC_V1_transparent_bg.png" alt="PTGC" className="w-20 h-20"/>
                      <div>
                        <div className="flex items-end gap-3">
                          <div>
                            <div className="flex items-center gap-2">
                              <h2 className="text-[31px] font-bold text-white">{details.username}</h2>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <code className="text-gray-500 text-[10px]">{truncateWallet(details.wallet)}</code>
                              <CopyBtn text={details.wallet} className="text-gray-500 hover:text-white"/>
                            </div>
                          </div>
                          {(()=>{
                            const creature=getCreatureForPtgc(details.totalPtgc);
                            if(!creature)return null;
                            const trophyMap={Whale:'logos/ptgc/trophy_whale_gold.png',Shark:'logos/ptgc/trophy_shark_silver.png',Dolphin:'logos/ptgc/trophy_dolphin_gold.png'};
                            const trophyImg=trophyMap[creature.name];
                            if(!trophyImg)return null;
                            return(
                              <div className="relative ml-2" title={`${creature.name} x${creature.count}`}>
                                <img src={trophyImg} alt={creature.name} className="h-[67px] w-auto" style={{filter:'drop-shadow(0 0 6px rgba(212,175,55,0.4))'}}/>
                              </div>
                            );
                          })()}
                        </div>
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      {/* Affiliate Link Button */}
                      <button 
                        onClick={(e)=>{
                          e.stopPropagation();
                          navigator.clipboard.writeText(`https://goptgc.com/#/ptgc-onboarding?referid=${details.username}`);
                          const btn=e.currentTarget;
                          const originalHTML=btn.innerHTML;
                          btn.innerHTML='<span class="text-green-400">✓ Copied!</span>';
                          setTimeout(()=>{btn.innerHTML=originalHTML;},1500);
                        }}
                        className="flex flex-col items-center bg-gradient-to-r from-purple-500/20 to-purple-600/20 border border-purple-500/40 hover:border-purple-400/60 rounded-lg px-4 py-2 transition-all hover:shadow-lg hover:shadow-purple-500/20"
                        title="Click to copy affiliate link"
                      >
                        <span className="text-purple-300 font-semibold text-sm">{details.username}'s Referral Link</span>
                        <span className="text-purple-400/60 text-xs">Click to copy</span>
                      </button>
                      <button onClick={()=>{setSelectedReferrer(null);setExpandedTxMonths(new Set());setShowAllReceipts(false);setShowAllCurrentMonthTx(false);setShowBuyerDist(false);}} className="text-gray-400 hover:text-white text-2xl">×</button>
                    </div>
                  </div>
                  
                  {/* Stats Grid */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 p-3 sm:p-4">
                    <div className="bg-black/40 border border-white/10 rounded-lg p-2 sm:p-3 min-w-0">
                      <div className="text-gray-400 text-xs sm:text-sm uppercase mb-1">Total Buys</div>
                      <div className="text-lg sm:text-2xl font-bold text-blue-400 truncate">{details.totalBuys||0}</div>
                    </div>
                    <div className="bg-black/40 border border-white/10 rounded-lg p-2 sm:p-3 min-w-0">
                      <div className="text-gray-400 text-xs sm:text-sm uppercase mb-1">PTGC Bought</div>
                      <div className="flex items-center justify-between gap-1">
                        <span className="text-lg sm:text-2xl font-bold text-[#D4AF37] truncate">{fmtAbbr(details.totalPtgc)}</span>
                        {(()=>{
                          const creature=getCreatureForPtgc(details.totalPtgc);
                          return creature?(
                            <span className="flex items-center gap-1 shrink-0" title={creature.name}>
                              <span className="text-base sm:text-xl">{creature.emoji}</span>
                              <span className="text-white/60 text-xs sm:text-sm">x{creature.count}</span>
                            </span>
                          ):null;
                        })()}
                      </div>
                      <div className="text-gray-400 text-xs sm:text-sm truncate">{fmtDollar(details.totalUsd||0)}</div>
                    </div>
                    <div className="bg-black/40 border border-white/10 rounded-lg p-2 sm:p-3 min-w-0">
                      <div className="text-gray-400 text-xs sm:text-sm uppercase mb-1">Commission Paid</div>
                      <div className="text-lg sm:text-2xl font-bold text-green-400 truncate">{fmtAbbr(details.totalCommPaid)}</div>
                      <div className="text-gray-400 text-xs sm:text-sm truncate">{fmtDollar(details.totalCommPaidUsd||details.receipts.reduce((s,r)=>s+(r.usdValue||0),0))}</div>
                    </div>
                    <div className="bg-black/40 border border-white/10 rounded-lg p-2 sm:p-3 relative min-w-0">
                      <div className="flex items-center gap-1 mb-1">
                        <div className="text-gray-400 text-xs sm:text-sm uppercase">Owed (Pending)</div>

                                            </td>

                                            <td className="py-2 px-4 text-right" style={{width:'15%'}}><span className="text-[#D4AF37]">{fmtAbbr(tx.ptgcAmount)}</span></td>
                                            <td className="py-2 px-4 text-right" style={{width:'15%'}}><span className="text-white/70">{fmtDollar(tx.usdAmount||0)}</span></td>
                                            <td className="py-2 px-4 text-right" style={{width:'15%'}}><span className="text-purple-400">{fmtComma((tx.ptgcAmount||0)*(rate/100))}</span></td>

                                              <span className={`px-2 py-0.5 rounded text-xs font-bold ${txStatus==='paid'?'bg-green-500/20 text-green-400':txStatus==='below'?'bg-red-500/20 text-red-400':'bg-yellow-500/20 text-yellow-400'}`}>{txStatus==='below'?'BELOW':txStatus.toUpperCase()}</span>
                                            </td>

                      })}
                    </tbody>
                  </table>
                </div>
              ):<div className="p-8 text-center text-white/50">No commission entries for {formatMonthYear(commLogMonth||currentMonth)}</div>}
            </div>
          </div>
            
          <footer className="text-center py-8 border-t border-white/10 mt-8">
            <a href="https://goptgc.com/#/ptgc-onboarding" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 mb-4 px-5 py-2 bg-purple-500/20 border border-purple-500/30 rounded-lg text-purple-400 font-medium hover:bg-purple-500/30 transition text-base">

            </a>

    };
    
    // ===== PORTFOLIO PAGE =====
    // DAO Ledger Page - Hidden Feature
    // Disclaimer Modal Component

      return(
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/95">
          <div className="bg-[#111] border border-yellow-500/30 rounded-2xl max-w-lg w-full p-6 shadow-2xl" style={{maxHeight:'90vh',overflowY:'auto'}}>
            <div className="text-center mb-6">
              <div className="text-4xl mb-3">⚠️</div>

              <p className="text-white/40 text-xs mt-2">Please read before using this dashboard</p>

            <div className="space-y-4 text-white/80 text-sm mb-6">
              <p>

            <div className="flex flex-col gap-3">
              <button 
                onClick={onAccept}

              >

                By clicking above, you acknowledge these terms. This message will not appear again on this device.

      );
    };
    
    /* ===== HASH ROUTING =====
     * Routes:  #/            → home
     *          #/ptgc        → PTGC dashboard    #/ptgc/kpi    #/ptgc/social
     *          #/ufo         → UFO dashboard     #/ufo/kpi     #/ufo/social
     *          #/affiliates  → affiliates page
     * The hash is the single source of truth for view/token/tab. Every navigation
     * assigns location.hash (which creates a history entry, so the browser back/
     * forward buttons work), and one hashchange listener maps the hash back into
     * state. Legacy ?token= links — still emitted by calculators.html and
     * portfolio.html to return here — are converted to the equivalent hash once at
     * boot, so the sibling pages and any old bookmarks keep working unchanged. */
    const routeFromHash=()=>{
      const h=(window.location.hash||'').replace(/^#\/?/,'').toLowerCase();
      const[seg1,seg2]=h.split('/');
      if(seg1==='affiliates')return{view:'affiliates',token:null,tab:'dashboard'};
      if(seg1==='ptgc'||seg1==='ufo'){
        const tok=seg1.toUpperCase();
        /* MAINT-MIGRATION: while UFO is hidden a shared #/ufo deep link must not leak
           the dashboard. The secret dot sets a session flag before navigating so the
           operator still gets in. This guard is inert while UFO_MAINTENANCE is false. */
        if(tok==='UFO'&&UFO_MAINTENANCE){
          let op=false;try{op=sessionStorage.getItem('ufo_operator')==='1'}catch(e){}
          if(!op)return{view:'home',token:null,tab:'dashboard'};
        }
        return{view:'dashboard',token:tok,tab:(seg2==='kpi'||seg2==='social')?seg2:'dashboard'};
      }
      return{view:'home',token:null,tab:'dashboard'};
    };
    const hashForRoute=(view,token,tab)=>{
      if(view==='affiliates')return'#/affiliates';
      if(view==='dashboard'&&token)return'#/'+token.toLowerCase()+((tab&&tab!=='dashboard')?('/'+tab):'');
      return'#/';
    };

    const App=()=>{
      const[route,setRoute]=useState(()=>{
        /* Legacy handoff: calculators.html / portfolio.html send the user back with
           ?token=X (+ optional localStorage view flag). Convert it to a hash once,
           then the hash rules from here on. */
        const p=new URLSearchParams(window.location.search).get('token');
        if(p==='PTGC'||p==='UFO'){
          let target={view:'dashboard',token:p,tab:'dashboard'};
          try{const v=localStorage.getItem('ptgc_nav_view');if(v==='affiliates'){localStorage.removeItem('ptgc_nav_view');target={view:'affiliates',token:null,tab:'dashboard'};}}catch(e){}
          window.history.replaceState({},'',window.location.pathname+hashForRoute(target.view,target.token,target.tab));
          return target;
        }
        return routeFromHash();
      });
      const[lastToken,setLastToken]=useState(null);
      useEffect(()=>{
        const onHash=()=>setRoute(routeFromHash());
        window.addEventListener('hashchange',onHash);
        return()=>window.removeEventListener('hashchange',onHash);
      },[]);
      const navigate=(view,token,tab)=>{
        const h=hashForRoute(view,token,tab);
        if(window.location.hash===h){setRoute(routeFromHash());return;}
        window.location.hash=h;   // fires hashchange → setRoute
      };
      const[disclaimerAccepted,setDisclaimerAccepted]=useState(()=>{
        try{return localStorage.getItem('ptgc_ufo_disclaimer_accepted')==='true';}catch(e){return false;}
      });
      
      const handleAcceptDisclaimer=()=>{
        try{localStorage.setItem('ptgc_ufo_disclaimer_accepted','true');}catch(e){}
        setDisclaimerAccepted(true);
      };
      
      const{view,token,tab}=route;
      /* SEO: the disclaimer used to REPLACE the page, so first-time visitors — including
         Google's crawler — saw nothing but disclaimer text, and that's what got indexed
         as the site's snippet. Now the real view renders underneath and the modal (which
         is a fixed, near-opaque overlay) sits on top. Same gate for humans, real content
         for crawlers. */
      const overlay=!disclaimerAccepted?<DisclaimerModal onAccept={handleAcceptDisclaimer}/>:null;
      if(view==='affiliates')return(<>
        <AffiliatesPage onBack={()=>{const t=lastToken;if(t){try{localStorage.setItem('ptgc_last_token',t)}catch(e){}navigate('dashboard',t,'dashboard')}else{navigate('home')}}}/>
      {overlay}</>);
      
      if(view==='dashboard'&&token)return(<>
          <Dashboard token={token} routeTab={tab}
            onTabRoute={(t)=>navigate('dashboard',token,t)}
            onBack={()=>{try{localStorage.removeItem('ptgc_last_token')}catch(e){}navigate('home')}}
            onSwitch={(t)=>{try{localStorage.setItem('ptgc_last_token',t)}catch(e){}navigate('dashboard',t,tab)}}
            onAffiliates={()=>{setLastToken(token);navigate('affiliates')}}/>
      {overlay}</>);
      return(<>
          <Home onSelect={t=>{try{localStorage.setItem('ptgc_last_token',t)}catch(e){}navigate('dashboard',t,'dashboard')}}/>
      {overlay}</>);
    };
    
    /* ===================== MIGRATION: boot-time on-chain resolution =====================
     * Before first render we ask the chain for:
     *   1. UFO's three PulseX pairs (they are `private immutable` in the contract, so the
     *      factory is the only way to get them). The UFO/WPLS pair becomes mainPair.
     *   2. The six live fee values, which overwrite the fallback taxRate/taxBreakdown.
     * If either call fails we render anyway using the config fallbacks, so a flaky RPC
     * degrades the numbers rather than blanking the whole site.
     * =================================================================================== */
    const bootstrapUFO=async()=>{
      const ufo=TOKENS.UFO;
      const[pairs,fees]=await Promise.all([
        resolveUfoPairs(ufo.address).catch(()=>null),
        fetchUfoFees(ufo.address).catch(()=>null)
      ]);
      if(pairs&&pairs.length){
        // Reconcile the chain's answer against the seeded addresses. The chain is
        // authoritative; a mismatch means a seeded constant is stale, so shout about it.
        pairs.forEach(cp=>{
          const seeded=HARDCODED_UFO_PAIRS.find(h=>h.quoteSymbol===cp.quoteSymbol);
          if(seeded&&seeded.address.toLowerCase()!==cp.address.toLowerCase()){
            console.warn(`UFO/${cp.quoteSymbol} pair mismatch — seeded ${seeded.address}, chain says ${cp.address}. Using chain value.`);
          }
          if(seeded){seeded.address=cp.address;}
          else{HARDCODED_UFO_PAIRS.push(cp);}
          const lc=cp.address.toLowerCase();
          if(!LP_ADDRESSES.includes(lc))LP_ADDRESSES.push(lc);
        });
        const wpls=pairs.find(p=>p.quoteSymbol==='WPLS');
        if(wpls)ufo.mainPair=wpls.address;
      }else{
        console.warn('UFO pair resolution failed; using seeded pair addresses.');
      }
      if(fees){
        ufo.taxRate=fees.taxRate;
        ufo.taxBreakdown=fees.breakdown;
      }else{
        console.warn('UFO fee read failed; falling back to config defaults (1% each).');
      }
    };

    const mountApp=(()=>{let done=false;return()=>{if(done)return;done=true;ReactDOM.createRoot(document.getElementById('root')).render(<App/>);};})();
    // Never let a slow RPC block first paint. Whichever finishes first wins; the app
    // renders once and only once. Late-arriving fee data still lands via Dashboard's refresh.
    Promise.race([bootstrapUFO(),new Promise(r=>setTimeout(r,5000))]).then(mountApp,mountApp);
  </script>
