  <style>
    body{font-family:'Rajdhani',sans-serif;background:#0a0a0a;min-height:100vh}
    .font-orbitron{font-family:'Orbitron',monospace}
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:#1a1a1a}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    .animate-pulse-slow{animation:pulse 1.5s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.animate-pulse-slow{animation:none}}   /* c29 (Audit III) */
    /* v2 header, the portfolio-only pieces (2026-10-03; h2.css has the rest): two coins, the gold→green PORTFOLIO title,
       PTGC / UFO / PLS quotes in the stat slots, the page's three buttons as glass pills */
    .h2 .h2-pfcoins{display:flex;align-items:center;flex:none}
    .h2 .h2-pfc{position:relative;flex:none;width:calc(150*var(--u));height:calc(150*var(--u))}
    .h2 .h2-pfc+.h2-pfc{margin-left:calc(-30*var(--u))}
    .h2 .h2-pfc .h2-coin{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) scale(.77)}
    .h2 .h2-pftitle{background-image:linear-gradient(90deg,#F8DB7C 0%,#E7B843 38%,#C8FF78 62%,#7CFC00 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
    .h2-desk .h2-pftitle{font-size:calc(62*var(--u))}
    .h2 .h2-pfsub{margin-top:calc(10*var(--u));font-size:max(calc(22*var(--u)),.75rem);font-weight:500;color:rgba(255,255,255,.8);text-shadow:0 1px 3px #000}
    /* each quote keeps its own token's price gradient whatever the band's colour (the h2 root takes the ?from= token) — the
       PTGC / UFO pair = h2.css's h2-tprice gradients; the sub-zero digit prints solid (the h2-tprice sub rule) */
    .h2 .h2-pfq.ptgc .h2-tprice{background-image:linear-gradient(180deg,#FFF6D6 0%,#FBE6B0 24%,#F8D88C 42%,#F6C866 58%,#EEB852 74%,#E3A945 90%,#D69C40 100%)}.h2 .h2-pfq.ptgc .h2-tprice sub{-webkit-text-fill-color:#F0BE5E;color:#F0BE5E}
    .h2 .h2-pfq.ufo .h2-tprice{background-image:linear-gradient(180deg,#F4FFE4 0%,#E0FFB8 24%,#CBFF8C 42%,#B2F760 58%,#9BEA45 74%,#86D83A 90%,#76C634 100%)}.h2 .h2-pfq.ufo .h2-tprice sub{-webkit-text-fill-color:#A8EE55;color:#A8EE55}
    .h2 .h2-pfq.pls .h2-tprice{background-image:linear-gradient(180deg,#FFFFFF 0%,#ECEAF6 36%,#CFCBE0 66%,#AEA9C4 100%)}.h2 .h2-pfq.pls .h2-tprice sub{-webkit-text-fill-color:#C9C6DA;color:#C9C6DA}

    /* ===== Portfolio v2 (2026-10-13, design/portfolio/mock-portfolio-v4.html) — hidden behind the faint dot until PF_V2_LIVE ===== */

  <script type="text/babel" data-presets="react">
    const {useState,useEffect,useMemo}=React;
    
    // ===== Minimal TOKENS config (logos and pair addresses needed by portfolio) =====
    const TOKENS={
      PTGC:{name:'PTGC',logo:'logos/ptgc/logo-512.webp',mainPair:'0xf5A89A6487D62df5308CDDA89c566C5B5ef94C11'},
      UFO:{name:'UFO',logo:'logos/ufo/logo-512.webp',mainPair:'0xE221e6fC30e5787F0d551f980B4da1055D832A03'}
    };
    
    // ===== RPC & Helpers =====
    /* RPC ENDPOINT POOL (a12, 2026-09-18) — index.html's three PulseChain endpoints with the same rules:
       a transport failure (network, timeout, non-2xx, non-JSON) rotates to the next endpoint, a
       well-formed JSON-RPC error reply is returned as-is (the log scan bisects on those), the chosen
       endpoint is sticky for 2 min then drifts back to the primary. All three down → {result:null},
       which the reflections path treats as "unavailable" — never a fake 0. */
    const RPC_ENDPOINTS=[
      'https://rpc.pulsechain.com',
      'https://rpc-pulsechain.g4mm4.io',
      'https://pulsechain-rpc.publicnode.com'
    ];
    const RPC=RPC_ENDPOINTS[0];
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    let _rpcIdx=0,_rpcSince=0;
    const RPC_STICKY_MS=120000;
    const _rpcOnce=async(url,body,timeout)=>{
      const controller=new AbortController();
      const timeoutId=setTimeout(()=>controller.abort(),timeout);
      try{
        const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
        if(!res.ok)throw new Error('HTTP '+res.status);
        const txt=await res.text();
        let j;
        try{j=JSON.parse(txt);}catch{throw new Error('non-JSON response');}
        if(!j||typeof j!=='object')throw new Error('bad payload');
        return j;
      }finally{clearTimeout(timeoutId);}
    };
    const rpcFetch=async(body,timeout=8000)=>{
      if(_rpcIdx!==0&&Date.now()-_rpcSince>RPC_STICKY_MS){_rpcIdx=0;}
      const n=RPC_ENDPOINTS.length;
      let lastErr=null;
      for(let i=0;i<n;i++){
        const idx=(_rpcIdx+i)%n;
        try{
          const j=await _rpcOnce(RPC_ENDPOINTS[idx],body,timeout);
          if(idx!==_rpcIdx){_rpcIdx=idx;_rpcSince=Date.now();console.warn('RPC failover → '+RPC_ENDPOINTS[idx]);}
          return j;
        }catch(e){lastErr=e;console.warn('RPC '+RPC_ENDPOINTS[idx]+' failed: '+e.message);}
      }
      console.error('RPC error (all '+n+' endpoints failed):',lastErr&&lastErr.message);
      return{result:null};
    };

    const fmtUSD=n=>n==null||isNaN(n)?'\u2014':'$'+Math.floor(Number(n)).toLocaleString('en-US');
    const fmtComma=(n,dec=2)=>n==null||isNaN(n)?'\u2014':Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    const fmtDollar=(n,dec=2)=>n==null||isNaN(n)?'\u2014':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    const fmtAbbr=n=>{if(n==null||isNaN(n))return'\u2014';const num=Number(n);if(num>=1e12)return(num/1e12).toFixed(2)+'T';if(num>=1e9)return(num/1e9).toFixed(2)+'B';if(num>=1e6)return(num/1e6).toFixed(2)+'M';if(num>=1e3)return(num/1e3).toFixed(2)+'K';return Math.floor(num).toLocaleString('en-US')};
    // Abbreviated price with subscript-zero notation, e.g. $0.0₅3764 for very small prices. Returns a React node.
    const fmtPriceNode=(p)=>{
      if(p==null||isNaN(p)||p<=0)return'\u2014';
      const n=Number(p);
      if(n>=1)return'$'+n.toFixed(2);
      if(n>=0.01)return'$'+n.toFixed(4);
      const s=n.toExponential(4);
      const[m,e]=s.split('e');
      const exp=Math.abs(parseInt(e));
      return<span>$0.0<sub style={{fontSize:'0.6em'}}>{exp-1}</sub>{parseFloat(m).toFixed(4).replace('.','').slice(0,4)}</span>;
    };
    const getLogo=a=>a?`https://dd.dexscreener.com/ds-data/tokens/pulsechain/${a.toLowerCase()}.png`:null;
    const WPLS_ADDR='0xA1077a294dDE1B09bB078844df40758a5D0f9a27';
    // Robust USD price: read the /tokens/{addr} `.pairs` array (the path index.html uses), pick the
    // pair per pricePair below. Returns null on failure/empty — NEVER a fake 0, so a failed lookup renders
    // as "—" instead of masquerading as a real $0. (The old /pairs/{pair} `.pair?.priceUsd` read is being
    // retired by DexScreener.)
    /* 2026-09-29: which pair prices a token — the same rule as index.html's dsPricePair. Only pairs where the token is
       the BASE (a quote-side priceUsd is the other token's price), only pairs that trade (fake pools such as
       WPLS/NananaX claim ~$2M "liquidity" with no volume and a stale price — it put PLS ~4% high here), deepest of
       those; PTGC and UFO use their dashboard main pair so the portfolio matches the dashboard. */
    const PRICE_MAIN_PAIRS={'0x94534eeee131840b1c0f61847c572228bdfdde93':'0xf5a89a6487d62df5308cdda89c566c5b5ef94c11','0x49ed499433bee42dd34c169470fef2c8f9fae6e6':'0xe221e6fc30e5787f0d551f980b4da1055d832a03'};
    const pricePair=(pairs,addr)=>{
      const a=String(addr||'').toLowerCase();
      const ps=(pairs||[]).filter(p=>p&&p.chainId==='pulsechain'&&parseFloat(p.priceUsd)>0&&String(p.baseToken?.address||'').toLowerCase()===a);
      if(!ps.length)return null;
      const mp=PRICE_MAIN_PAIRS[a]&&ps.find(p=>String(p.pairAddress||'').toLowerCase()===PRICE_MAIN_PAIRS[a]);
      if(mp)return mp;
      const vol=p=>parseFloat(p.volume?.h24)||0,liq=p=>parseFloat(p.liquidity?.usd)||0;
      const floor=Math.max(100,0.02*Math.max(...ps.map(vol)));
      const live=ps.filter(p=>vol(p)>=floor);
      return live.length?live.sort((x,y)=>liq(y)-liq(x))[0]:ps.sort((x,y)=>vol(y)-vol(x))[0];
    };
    /* Header design (2026-10-03): 'classic' = the sticky header below; 'v2' = PortfolioHeaderV2 — the dashboard's art banner with both
       coins, the PTGC / UFO / PLS quotes and the page's three buttons, then the gold tab band. Flip = 'v2' here, in index.html,
       calculators.html and charts.html in the SAME push. Until then this device shows v2 only with the dashboard's preview flag. */

    // ===== UFO reflections reconstruction =====
    // The UFO contract (TheGraysUFO) is a classic RFI reflection token: reflections accrue silently into
    // balanceOf and there is NO on-chain per-wallet "reflections earned" getter. So we reconstruct it from
    // the wallet's Transfer-log history: reflections = balanceOf(now) - net principal transferred in.
    //
    // FEE STRUCTURE — derived empirically from on-chain logs (the contract is NOT verified on the explorer,
    // so this was measured, not assumed). A fee-paying transfer emits TWO Transfer events from the sender:
    //   Transfer(sender, recipient, 94% of gross)  and  Transfer(sender, tokenContract, 5% of gross)
    // The 1% reflection fee (tFee) is NEVER emitted — it only shrinks _rTotal. Across every fee-paying send
    // sampled, the two emitted legs sit at exactly 94/99 = 94.9495% and 5/99 = 5.0505% of the emitted
    // total, which confirms the 94/5/1 split to 6 significant figures.
    //
    // CONSEQUENCE: the emitted legs sum to only 99% of what actually left the sender's balance. Summing
    // them raw under-counts outflow by 1% of every fee-paying send, which inflates "net received" and drives
    // reflections down — often below zero, where the clamp turned it into a flat 0. That is why wallets
    // that had ever sold showed nothing.
    //
    // CORRECTION: the fee legs are unambiguous (they are the only sends addressed to the token contract),
    // so fee-paying gross = feeLegs / 0.05, and true outflow = emittedTotal + feeLegs / 5. This is exact and
    // degrades gracefully: fee-free sends have no fee leg, so they pass through at face value, and a tx
    // mixing fee-paying and fee-free sends still resolves correctly because the correction is driven purely by
    // the fee legs rather than by assuming every send was fee-paying.
    //
    // VERIFIED: on fee-excluded accounts (LP pairs / router), which by definition earn zero reflections,
    // the reconstruction must land on exactly 0. Before the correction it was off by -85,108,352 and
    // -46,551,638 tokens; after it, 258 wei and 111 wei — pure integer-division dust, one wei per fee-paying
    // send. All arithmetic below is BigInt wei so nothing is lost to float rounding.
    //
    // Every failure returns null (renders "—"), never a fake 0.
    const TRANSFER_TOPIC='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
    // Exact block TheGraysUFO was deployed at, found by bisecting eth_getCode on-chain: first block with
    // bytecode = 26989200 (2026-07-09 14:26 UTC). Nothing involving this token can exist before it, so it
    // is the correct hard floor for the scan and guarantees FULL history coverage. This replaces an
    // estimate derived from a launch timestamp and an assumed 3s block time — PulseChain actually runs
    // ~10.8s, so that estimate over-reached by ~3.5x and grew every day until it blew the range budget.
    const UFO_LAUNCH_BLOCK=26989200;
    const cacheBucket=()=>Math.floor(Date.now()/(5*60*1000));
    // Chunking is ADAPTIVE: the chunk size is derived from the span so the number of ranges can never
    // exceed the budget, no matter how far the chain advances. A fixed chunk size is what caused the
    // original outage — the window outgrew a hard cap and the whole read failed. Oversized chunks are
    // self-correcting, since getLogsRange bisects on error or on a suspiciously full batch.
    const LOG_CHUNK=100000, MAX_LOG_RANGES=100;
    const LOG_CAP_SUSPECTS=[100,128,200,250,256,500,512,1000,1024,2000,2048,4096,5000,10000];
    const looksTruncated=(n)=>n>=900||LOG_CAP_SUSPECTS.indexOf(n)>=0;
    let lastLogError='';
    // Public RPCs cap eth_getLogs by block span AND by result size (and silently truncate). Try a range;
    // on error or a suspiciously full batch, bisect and retry. Any hard failure returns null (never []).
    const getLogsRange=async(address,topics,a,b,depth,headBlock)=>{
      const toParam=(b>=headBlock)?'latest':('0x'+b.toString(16));
      const r=await rpcFetch({jsonrpc:'2.0',method:'eth_getLogs',
        params:[{address,fromBlock:'0x'+a.toString(16),toBlock:toParam,topics}],id:1},20000);
      if(r&&Array.isArray(r.result)){
        if(looksTruncated(r.result.length)&&(b-a)>1&&depth<14){
          const mid=Math.floor((a+b)/2);
          const left=await getLogsRange(address,topics,a,mid,depth+1,headBlock);
          if(left===null)return null;
          const right=await getLogsRange(address,topics,mid+1,b,depth+1,headBlock);
          if(right===null)return null;
          return left.concat(right);
        }
        return r.result;
      }
      const msg=(r&&r.error&&r.error.message)||'no result field';
      if(depth<6&&(b-a)>250){
        const mid=Math.floor((a+b)/2);
        const left=await getLogsRange(address,topics,a,mid,depth+1,headBlock);
        if(left===null)return null;
        const right=await getLogsRange(address,topics,mid+1,b,depth+1,headBlock);
        if(right===null)return null;
        return left.concat(right);
      }
      lastLogError=`eth_getLogs failed (blocks ${a}-${b}): ${msg}`;
      console.warn(lastLogError);
      return null;
    };
    const logsInflight={};
    const getLogsChunked=async(address,topics,fromBlock,toBlock)=>{
      if(toBlock<fromBlock)return[];
      const key=`${address}|${JSON.stringify(topics)}|${fromBlock}|${toBlock}|${cacheBucket()}`;
      if(logsInflight[key])return logsInflight[key];
      const p=_getLogsChunked(address,topics,fromBlock,toBlock);
      logsInflight[key]=p;
      p.then(r=>{if(r===null)delete logsInflight[key];},()=>{delete logsInflight[key];});
      return p;
    };
    const _getLogsChunked=async(address,topics,fromBlock,toBlock)=>{
      if(toBlock<fromBlock)return[];
      // Derive the chunk size from the span instead of failing when a fixed size needs too many ranges.
      // This is the guard that previously hard-failed and blanked the reflections display.
      const span=toBlock-fromBlock+1;
      const chunk=Math.max(LOG_CHUNK,Math.ceil(span/MAX_LOG_RANGES));
      const ranges=[];
      for(let s=fromBlock;s<=toBlock;s+=chunk)ranges.push([s,Math.min(s+chunk-1,toBlock)]);
      const out=[];const CONC=3;
      for(let i=0;i<ranges.length;i+=CONC){

        for(const r of res){ if(r===null)return null; out.push(...r); }
      }
      return out;

    // and reflections are a tiny fraction of balance, exactly where that drift would matter most.
    // Returns null on any read failure so the UI shows "—"/"calculating" rather than a fake number.
    const computeUfoReflectionsWei=async(address,balanceWei)=>{
      if(balanceWei==null)return null;         // balance read failed -> can't derive
      if(balanceWei<=0n)return 0;              // nothing held -> nothing earned
      const head=await getHeadBlock();

      // Scan the token's ENTIRE history, from its deploy block to head. No estimate, no sliding window:
      // no transfer involving this token can predate the block its bytecode first appeared in.
      const fromBlock=UFO_LAUNCH_BLOCK;
      const wtopic='0x'+padAddr(address);
      const [recv,sent]=await Promise.all([
        getLogsChunked(UFO_TOKEN_ADDR,[TRANSFER_TOPIC,null,wtopic],fromBlock,head),   // to = wallet
        getLogsChunked(UFO_TOKEN_ADDR,[TRANSFER_TOPIC,wtopic,null],fromBlock,head),   // from = wallet
      ]);
      if(recv===null||sent===null)return null; // hard chain-read failure -> unavailable, never a fake 0
      const sumWei=(logs)=>logs.reduce((s,l)=>s+parseWord(l.data),0n);
      const contractTopic=('0x'+padAddr(UFO_TOKEN_ADDR)).toLowerCase();
      const inWei=sumWei(recv);                                 // received amounts are emitted at face value
      const outEmitted=sumWei(sent);                            // = 99% of gross on fee-paying sends
      // The 5% contract-fee legs are the only sends addressed to the token itself. gross = fee/0.05,
      // so the unemitted 1% reflection slice = fee/5. Adding it back makes outflow exact.
      const feeLegs=sumWei(sent.filter(l=>(l.topics[2]||'').toLowerCase()===contractTopic));
      const outWei=outEmitted+feeLegs/5n;
      try{(window.pfUfoRecv=window.pfUfoRecv||{})[address.toLowerCase()]=toNum(inWei);}catch(e){}   // Portfolio v2 round 6: yield denominator

      PTGC:{address:'0x94534EeEe131840b1c0F61847c572228bdfDDE93',decimals:18},

    /* Expects from PfLeagues.jsx (loaded first): PF_ADDR, PF_TOKEN_ADDR, PF_SUPPLY, pfAbbr, pfAddr, pfLsSet, PfModal. Used by PfTx.jsx

    /* ===== Portfolio v2 — VALUE HISTORY (2026-10-13, Shaka's option C: "real balances read from the chain") =====
       For every counted wallet, the PTGC and UFO balanceOf AT PAST BLOCKS (archive eth_call, batched), times that moment's
       price (data/charts-data.json daily ≤ 365 d, data/charts-intraday.json hourly ≤ 14 d — the Charts page's prebuilt files),
       summed. Sells show as drops, buys as rises. PTGC staked / locked stay in balanceOf (the staking contract never moves
       them), so the PTGC line is the whole bag. UFO before its contract existed reads 0x → 0.
       Past points never change, so every balance is cached per wallet + token + timestamp in localStorage (PFH_LS); a reload
       only reads what is new. Points are aligned to UTC (6 h steps on 7D, days on 30D / 90D, 4 days on 1Y) so they repeat.

    const PFH_RPC=['https://rpc.pulsechain.com','https://rpc-pulsechain.g4mm4.io'];
    const PFH_LS='grays_pf_hist_v1';
    const PFH_TOK=PF_TOKEN_ADDR;   // round 27 (audit E2): one source (PfLeagues.jsx)
    const PFH_RAW='https://raw.githubusercontent.com/shakavibe/PTGC-UFO-Dashboard/main/data/';
    const PFH_H=3600e3,PFH_D=86400e3,PFH_BLOCK_MS=10300,PFH_RPC_TIMEOUT=20000,PFH_BATCH=80;   // PulseChain ~10.3 s blocks; batched eth_call size
    const PFH_PERIODS={'7D':{step:6*PFH_H,n:28,unit:6*PFH_H},'30D':{step:PFH_D,n:30,unit:PFH_D},'90D':{step:PFH_D,n:90,unit:PFH_D},'1Y':{step:4*PFH_D,n:92,unit:4*PFH_D}};   // round 24 (audit B5): 1Y points on 4-day boundaries so they repeat day to day
    let pfhCache=null;   // {v:{'addr|TOK':{ts:bal}}}
    const pfhLoad=()=>{if(pfhCache)return pfhCache;try{const s=localStorage.getItem(PFH_LS);pfhCache=s?JSON.parse(s):{v:{}};if(!pfhCache.v)pfhCache={v:{}};}catch(e){pfhCache={v:{}};}
      /* round 24 (audit B5): the cache grew forever — drop points older than 400 days, and 6-hour (7D) points older than 15 days */
      try{const now=Date.now();let n=0;Object.values(pfhCache.v).forEach(m=>Object.keys(m).forEach(k=>{const t=+k;if(now-t>400*PFH_D||(t%PFH_D!==0&&now-t>15*PFH_D)){delete m[k];n++;}}));if(n)pfhSave();}catch(e){}
      return pfhCache;};
    let pfhSaveT=null;
    /* round 27 (audit E3): on quota, drop the OLDEST points (not a third of the wallets) until it fits — same idea as the tx cache */
    const pfhSave=()=>{clearTimeout(pfhSaveT);pfhSaveT=setTimeout(()=>pfLsSet(PFH_LS,pfhCache,c=>{const all=[];Object.entries(c.v).forEach(([k,m])=>Object.keys(m).forEach(t=>all.push([+t,k])));if(!all.length)return false;all.sort((a,b)=>a[0]-b[0]);all.slice(0,Math.max(1,Math.ceil(all.length/10))).forEach(([t,k])=>{delete c.v[k][t];});return true;}),800);};
    let pfhEp=0;
    const pfhRpc=async(body,tries=3)=>{
      for(let t=0;t<tries;t++){
        const ep=PFH_RPC[(pfhEp+t)%PFH_RPC.length];
        try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),PFH_RPC_TIMEOUT);
          const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ac.signal});clearTimeout(to);
          if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();

    };
    /* timestamp → block: anchors at the head and ~7 / 30 / 90 / 180 / 365 / 420 days back, linear between them */
    let pfhAnchors=null,pfhAnchorsAt=0,pfhAnchorsP=null;
    /* round 24 (audit B2): one request at a time — the chart, the 24 h tiles and the Details window all ask at mount */
    const pfhGetAnchors=()=>{
      if(pfhAnchors&&Date.now()-pfhAnchorsAt<10*60e3)return Promise.resolve(pfhAnchors);
      if(pfhAnchorsP)return pfhAnchorsP;

    };
    const pfhGetAnchors0=async()=>{
      const head=await pfhRpc({jsonrpc:'2.0',id:1,method:'eth_getBlockByNumber',params:['latest',false]});
      const hn=parseInt(head.result.number,16),ht=parseInt(head.result.timestamp,16)*1000;
      const nums=[7,30,90,180,365,420].map(d=>Math.max(1,hn-Math.round(d*PFH_D/PFH_BLOCK_MS)));
      const res=await pfhRpc(nums.map((n,i)=>({jsonrpc:'2.0',id:i,method:'eth_getBlockByNumber',params:['0x'+n.toString(16),false]})));
      const a=[[hn,ht]];res.forEach(r=>{if(r&&r.result)a.push([parseInt(r.result.number,16),parseInt(r.result.timestamp,16)*1000]);});

    /* round 15 (Shaka: "there was an old UFO contract and a new one … hopefully it includes the old one"): reflections earned on

       airdrop as tokens RECEIVED, and that airdrop was each wallet's old balance — old reflections included — so without this
       they were principal. Prebuilt once by tools/ufo-v1-earned.py (the old contract is frozen; the method and every on-chain
       check are in that file); sharded by the address's first hex digit so a visit loads only the 1–16 small files it needs.

    const pfV1Shard={};

      useEffect(()=>{let live=true;const cs=[...new Set(addrs.map(a=>a.toLowerCase()[2]))];

        Promise.all(cs.map(c=>pfV1Shard[c]||(pfV1Shard[c]=get(c).catch(e=>{delete pfV1Shard[c];throw e;}))))
          .then(ms=>{if(live)setSt({state:'ok',m:Object.assign({},...ms)});}).catch(()=>{if(live)setSt({state:'failed',m:{}});});
        return()=>{live=false;};},[key,nonce]);

    /* prices: the Charts page's prebuilt files (refetched every 30 min) */

      if(pfhPxP)return pfhPxP;   // round 24 (audit B2): was fetched up to 5× at first paint
      pfhPxP=pfhPrices0().finally(()=>{pfhPxP=null;});return pfhPxP;
    };
    const pfhPrices0=async()=>{
      const g=async f=>{try{const r=await fetch(PFH_RAW+f,{cache:'no-cache'});return r.ok?await r.json():null;}catch(e){return null;}};
      const[d,h]=await Promise.all([g('charts-data.json'),g('charts-intraday.json')]);
      if(!d&&!h){pfhPx=null;throw new Error('price files unavailable');}   // round 23 (audit A3): a failed load is not cached for 30 min
      const ser=(o,k,tier)=>{try{const s=tier?o.tokens[k][tier].series:o.tokens[k].series;return(s||[]).filter(p=>p&&p[1]>0).sort((x,y)=>x[0]-y[0]);}catch(e){return[];}};
      pfhPx={daily:{PTGC:ser(d,'PTGC'),UFO:ser(d,'UFO')},hourly:{PTGC:ser(h,'PTGC','hourly'),UFO:ser(h,'UFO','hourly')}};pfhPxAt=Date.now();
      return pfhPx;
    };
    const pfhNear=(s,ts,maxGap)=>{if(!s||!s.length||ts<s[0][0]-maxGap)return null;let lo=0,hi=s.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(s[m][0]<=ts)lo=m;else hi=m-1;}
      let best=s[lo];if(lo+1<s.length&&Math.abs(s[lo+1][0]-ts)<Math.abs(best[0]-ts))best=s[lo+1];return Math.abs(best[0]-ts)<=maxGap?best[1]:null;};
    const pfhPriceAt=(px,tok,ts)=>{const h=pfhNear(px.hourly[tok],ts,3*PFH_H);return h!=null?h:pfhNear(px.daily[tok],ts,2*PFH_D);};
    /* read the balances not in the cache; in-flight reads are shared between the chart and the tiles */
    const pfhInflight=new Map();
    const pfhRead=async(jobs,onProgress)=>{
      const c=pfhLoad();const need=[];const waits=[];
      jobs.forEach(j=>{const k=j.addr+'|'+j.tok;const hit=c.v[k]&&c.v[k][j.ts]!=null;if(hit)return;const ik=k+'|'+j.ts;if(pfhInflight.has(ik)){waits.push(pfhInflight.get(ik));return;}need.push(j);});
      let done=0;const total=need.length;onProgress&&onProgress(total?0:1);

      const run=async batch=>{
        let res=null;try{res=await pfhRpc(batch.map((j,i)=>({jsonrpc:'2.0',id:i,method:'eth_call',params:[{to:PFH_TOK[j.tok],data:'0x70a08231'+j.addr.slice(2).padStart(64,'0')},'0x'+j.block.toString(16)]})));}catch(e){res=null;}

    const pfhLocalMidnight=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
    const pfhTimes=period=>{const P=PFH_PERIODS[period];const now=Date.now();const out=[];

      else{const d0=new Date(pfhLocalMidnight(now));for(let k=P.n-1;k>=0;k--){const d=new Date(d0);d.setDate(d0.getDate()-k);out.push(d.getTime());}}
      return out.filter(t=>t<now-60e3);};
    /* the series for a set of wallets + period: [{t,p,u,v}] (null v = a gap), plus the live "now" point added by the caller */
    const usePfSeries=(addrs,period,enabled=true)=>{
      const[st,setSt]=useState({state:'idle',pts:[],progress:0});
      const key=addrs.slice().sort().join(',')+'|'+period;
      const[nonce,setNonce]=useState(0);
      useEffect(()=>{
        if(!enabled||!addrs.length){setSt({state:addrs.length?'idle':'empty',pts:[],progress:0});return;}
        let live=true;

          setSt(s=>({...s,state:'loading',progress:0}));

            const[a,px]=await Promise.all([pfhGetAnchors(),pfhPrices()]);
            const times=pfhTimes(period);
            const jobs=[];times.forEach(ts=>{const block=pfhBlockAt(a,ts);addrs.forEach(addr=>['PTGC','UFO'].forEach(tok=>jobs.push({addr,tok,ts,block})));});
            await pfhRead(jobs,pr=>{if(live)setSt(s=>({...s,progress:pr}));});

              let p=0,u=0,ok=true;

              if(!ok)return{t:ts,v:null};
              const pp=p>0?pfhPriceAt(px,'PTGC',ts):0,pu=u>0?pfhPriceAt(px,'UFO',ts):0;
              if(pp==null||pu==null)return{t:ts,v:null};

    /* round 37 (Shaka picked A of mock-ufo-row6-v1, "Reflections, last 7 days"): the UFO balance of the counted wallets at the

    const usePfUfo7=(addrs,tick)=>{

    };

    /* ===== Portfolio v2 — RECENT TRANSACTIONS (round 9, rewritten through round 27) =====
       PulseScan's token-transfer list per counted wallet and token (PTGC, UFO) — /api/v2/addresses/{w}/token-transfers, CORS
       open, 50 per page, paged back up to a year (round 18), cached per wallet+token in localStorage (round 24). Transfers of
       one tx + token are netted for the wallet (a UFO sell is the pair leg + the fee leg → one "Sell"). Types (pftClassify):
       Claim (from the staking contract, named by function), Unstake, Buy / Sell (a contract counterparty AND another token
       moved in the tx), Add / Remove LP, Move (between two of YOUR wallets), Receive / Send. Value = amount × that hour's /
       day's price (the history's price files). Shown as an activity feed (round 17) and handed to the value chart's strip
       and the Details window (rows, flows, coverage). Expects from the other files: PF_ADDR, pfAddr, pfCopy (PfLeagues),
       PFH_TOK, pfhPrices, pfhPriceAt (PfHistory). */
    /* round 18 (Shaka: "a lot of dots are still missing on the chart"): ONE page (the latest 50 transfers) was all we read, and a
       busy wallet's 50 reach back only hours — so the chart had no trades for most of the week. Now each wallet + token is read
       page by page back a year (PFT_BACK) or PFT_PAGES pages, whichever comes first: page 1 for everyone first (the list paints
       fast), then the deeper pages in the background. A cached entry keeps {items, next (PulseScan's next_page_params), done};
       a refresh reads only the newest page(s) and merges them in until it meets what is already cached. */
    /* round 27 (audit E6): the one place that says whether a wallet+token's transaction list reaches back to time t.
       cov[addr|TOK]: undefined = not read yet · 0 = PulseScan ran out of pages (whole history) · a timestamp = complete back to it */
    const pftCovered=(txs,addr,tok,t)=>{const c=txs&&txs.cov?txs.cov[addr+'|'+tok]:undefined;return c!==undefined&&t>=c;};
    const PFT_LS='grays_pf_tx_v4:';   // v4 (round 24): one key per wallet+token (v3 was one blob)
    const PFT_API='https://api.scan.pulsechain.com/api/v2/addresses/';
    const PFT_STAKING=PF_ADDR.STAKING.toLowerCase();
    const PFT_TTL=5*60e3,PFT_BACK=365*864e5,PFT_PAGES=20;
    try{['grays_pf_tx_v1','grays_pf_tx_v2','grays_pf_tx_v3'].forEach(k=>localStorage.removeItem(k));}catch(e){}
    /* round 23 (audit A5): the cache used to be WIPED on a quota error (a 20-wallet portfolio is ~4 MB), so big portfolios never
       kept one and re-read everything every visit. Now: saves are debounced, and on quota the least recently read wallet+token
       entries are dropped one at a time until it fits. */
    /* round 24 (audit B3): one localStorage key per wallet+token (PFT_LS + key) — a landed page writes only its own entry
       instead of re-serialising the whole multi-MB cache; on quota the least recently read OTHER entries go first. */
    const pftCache=(()=>{const m={};let loaded=false,t=null;const dirty=new Set();
      const load=()=>{if(loaded)return;loaded=true;try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith(PFT_LS)){try{m[k.slice(PFT_LS.length)]=JSON.parse(localStorage.getItem(k));}catch(e){}}}}catch(e){}};
      const write=()=>{for(const k of [...dirty]){dirty.delete(k);const e=m[k];if(!e)continue;for(let i=0;i<40;i++){try{localStorage.setItem(PFT_LS+k,JSON.stringify(e));break;}
        catch(err){const ks=Object.keys(m).filter(x=>x!==k);if(!ks.length)break;const old=ks.sort((a,b)=>(m[a].at||0)-(m[b].at||0))[0];delete m[old];try{localStorage.removeItem(PFT_LS+old);}catch(e2){}}}}};
      return{get(){load();return m;},save(k){dirty.add(k);clearTimeout(t);t=setTimeout(write,400);},flush(){clearTimeout(t);write();}};})();
    const pftPage=async(addr,tok,next)=>{
      const ac=new AbortController();const to=setTimeout(()=>ac.abort(),25000);
      try{
        const q=next?'&'+Object.entries(next).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&'):'';
        let r=await fetch(`${PFT_API}${addr}/token-transfers?type=ERC-20&token=${PFH_TOK[tok]}${q}`,{signal:ac.signal});
        if(r.status===429){await new Promise(res=>setTimeout(res,2500));r=await fetch(`${PFT_API}${addr}/token-transfers?type=ERC-20&token=${PFH_TOK[tok]}${q}`,{signal:ac.signal});}   // round 24 (audit B6): one polite retry when PulseScan rate-limits
        if(!r.ok)throw new Error('HTTP '+r.status);
        const j=await r.json();
        const items=(j.items||[]).map(x=>({h:x.tx_hash,t:Date.parse(x.timestamp),f:(x.from&&x.from.hash||'').toLowerCase(),to:(x.to&&x.to.hash||'').toLowerCase(),fc:!!(x.from&&x.from.is_contract),tc:!!(x.to&&x.to.is_contract),m:x.method||'',v:(()=>{try{return Number(BigInt(x.total.value))/Math.pow(10,+x.total.decimals||18);}catch(e){return 0;}})(),li:x.log_index}));
        return{items,next:j.next_page_params||null};
      }finally{clearTimeout(to);}
    };
    const pftKey=i=>i.h+'|'+(i.li!=null?i.li:i.f+i.to+i.v);
    const pftDone=(e)=>!e.next||e.pages>=PFT_PAGES||(e.items.length&&Date.now()-e.items[e.items.length-1].t>PFT_BACK);
    /* page 1 (fresh or merged into the cache) */
    const pftFetch=async(addr,tok,force)=>{
      const k=addr+'|'+tok,c=pftCache.get(),hit=c[k];
      if(!force&&hit&&Date.now()-hit.at<PFT_TTL)return hit;
      try{
        let pg=await pftPage(addr,tok,null),e;
        if(hit&&hit.items.length){
          const have=new Set(hit.items.map(pftKey));let fresh=pg.items.filter(i=>!have.has(pftKey(i))),n=1;
          /* the newest page didn't reach the cache yet → keep reading (a few pages at most) */
          while(fresh.length===pg.items.length&&pg.next&&n<5){pg=await pftPage(addr,tok,pg.next);n++;fresh=fresh.concat(pg.items.filter(i=>!have.has(pftKey(i))));}
          e=fresh.length===pg.items.length*n&&pg.next?{at:Date.now(),items:fresh,next:pg.next,pages:n}   // still a gap → start over from here
            :{...hit,at:Date.now(),items:fresh.concat(hit.items)};
        }else e={at:Date.now(),items:pg.items,next:pg.next,pages:1};
        e.done=pftDone(e);c[k]=e;pftCache.save(k);return e;
      }catch(err){if(hit)return hit;throw err;}
    };
    /* one more (older) page */
    const pftMore=async(addr,tok)=>{
      const k=addr+'|'+tok,c=pftCache.get(),e=c[k];if(!e||e.done)return e;
      const pg=await pftPage(addr,tok,e.next);
      const have=new Set(e.items.map(pftKey));
      const n={...e,items:e.items.concat(pg.items.filter(i=>!have.has(pftKey(i)))),next:pg.next,pages:(e.pages||1)+1};
      n.done=pftDone(n);c[k]=n;pftCache.save(k);return n;
    };
    /* round 13 (Shaka: "double check your types … those ones from 0bd0 show as Stake, but they were sells"). Checked live on
       PulseScan: EVERY PTGC transfer — sells, buys, plain sends — splits off fee legs to the token contract, the staking contract
       and the burn address, so "a leg went to the staking contract" meant nothing; and routers often show a bare selector
       (0xe25d4a18) instead of a "swap…" method name, so the method can't be trusted either. Now: fee legs are left out when
       finding who the wallet traded WITH (they still count in the amount — it is what left the wallet); the main counterparty is
       the biggest remaining leg. From the staking contract = Claim; one of your own wallets = Move; method add/removeLiquidity =
       Add LP / Remove LP; a CONTRACT (DEX pair, router, aggregator) = Buy (tokens in) / Sell (tokens out); a person = Receive / Send. */
    /* round 14 — lessons from pulsechain_monitor.py (the trade monitor we built earlier, every rule verified on chain there):
       · claims are named by the FUNCTION, not the contract (staking and locking share 0xc71f…): withdrawReward = staking
         rewards, withdrawRewardLock = lock rewards. (round 14b, Shaka: the DAO has nothing to do with a personal wallet —
         the monitor's DAO claim / DAO lock rules are left out.)
       · PTGC staking is balance-lock style: an UNSTAKE (withdraw(uint256) on the staking contract) moves no principal — only the
         reward out and the unstake fee in — so it is labelled Unstake and its principal is read from the call (see pftDetail).
       · the 1 % HOLDERS share of the fee (reflections) leaves the sender with NO Transfer event — it is paid by shrinking
         everyone's balance-rate, not by a transfer. PTGC fee 5 %: emitted = 2.5 % to the token contract (2 % DAO + 0.5 %
         liquidity), 1 % to the staking contract, 0.5 % to 0x…369 (burn); hidden = 1 % holders = the same size as the staking
         leg. UFO fee 6 %: emitted = 5 % to the UFO contract (burns + liquidity); hidden = 1 % holders = that leg ÷ 5.
         Checked on chain 2026-10-13: a PTGC sell (tx 0x91968a23…, block 27,789,557) logged 14,850 out, the wallet's balanceOf
         fell 15,000; three UFO sells fell by emitted + exactly the fee leg ÷ 5. Sell / Send amounts are grossed up by it.
       · LP adds made through a helper / zapper look like a Sell — the tell is LP tokens minted to the wallet in the same tx
         (pftDetail checks the tx's other transfers). */
    const PFT_FEE=new Set(['0x0000000000000000000000000000000000000000','0x0000000000000000000000000000000000000369','0x000000000000000000000000000000000000dead',PFT_STAKING]);
    const PFT_CLAIM_SUB={withdrawreward:'staking',withdrawrewardlock:'lock'};
    const pftClassify=(legs,addr,own,tok)=>{
      let net=0;legs.forEach(l=>{if(l.to===addr)net+=l.v;if(l.f===addr)net-=l.v;});
      const tokAddr=PFH_TOK[tok].toLowerCase();
      const m=(legs[0]&&legs[0].m||'').toLowerCase();
      const fromSt=legs.some(l=>l.f===PFT_STAKING&&l.to===addr);
      /* round 23 (audit A12, checked on PulseScan): the staking contract's withdraw(uint256) is NOT decoded there — real unstakes
         come back with method null and the bare selector 0x2e1a7d4d, so match the selector as well */
      if((m==='withdraw'||m==='0x2e1a7d4d')&&legs.some(l=>l.f===PFT_STAKING||l.to===PFT_STAKING))return{type:'Unstake',net};
      if(fromSt)return{type:'Claim',net,sub:PFT_CLAIM_SUB[m]||''};
      const main=legs.filter(l=>(l.to===addr||l.f===addr)).map(l=>l.to===addr?{a:l.f,c:l.fc,v:l.v}:{a:l.to,c:l.tc,v:l.v})

    /* per-tx detail, fetched only for the rows on screen that need it, cached for good (past txs never change):

    const pftDetail=async(h,addr,tok)=>{

    /* round 28 (Shaka: "mouse over or click on the little daily bars and it pops a window showing the day's moves"): the feed

    const pftWhoOf=(nameOf,r)=>r.type==='Move'&&r.cp?(r.dir>=0?nameOf(r.cp)+' → '+nameOf(r.addr):nameOf(r.addr)+' → '+nameOf(r.cp)):nameOf(r.addr);
    /* round 35 (Shaka: "so much dead space between the text on the left and the dollar value on the right" — picked A of

    const PfTxColh=()=><div className="pf2-colh" aria-hidden="true"><span></span><span>ACTION</span><span>WALLET</span><span>PRICE</span><span>TIME</span><span className="r">VALUE</span><span></span></div>;
    /* the "copied ✓" flash shared by the feed and the day window: returns [copiedId, copy(r)] */

    const PFT_TYPE={Buy:['#39E15A','▲'],Sell:['#FF6B73','▼'],Receive:['#39E15A','↙'],Send:['#FF6B73','↗'],Claim:['#5AB8FF','⬇'],'Add LP':['#F2D35B','\u2295'],Unstake:['#B9C4FF','\u21E7'],'Remove LP':['#F2D35B','\u2296'],Move:['#B26BFF','⇄']};
    const PfRecentTx=({wallets,prices,onRows,onProgress})=>{   // round 30: onProgress({done,total,pd,pt,ud,ut,failed}) during the first read (the chart's loader)
      const pxNow=React.useRef(prices);pxNow.current=prices;

      useEffect(()=>{
        if(!wallets.length){setSt({state:'empty',rows:[],failed:0,done:0,total:0});return;}
        let live=true,tellT=null;const forceNow=force.current;force.current=false;
        (async()=>{

          const jobs=[];wallets.forEach(w=>['PTGC','UFO'].forEach(tok=>jobs.push({addr:w.address.toLowerCase(),tok})));
          const prog=()=>{if(!onProgress||!live)return;const n=t=>jobs.filter(j=>j.tok===t).length,d=t=>got.filter(g=>g.tok===t).length;onProgress({done,total:jobs.length,pd:d('PTGC'),pt:n('PTGC'),ud:d('UFO'),ut:n('UFO'),failed});};

          const px=await pfhPrices().catch(()=>null);
          let flows=[];   // round 20: every tx's net per wallet + token (moves on BOTH sides) — the Earned details' UFO maths
          const build=()=>{
            const rows=[];flows=[];
            got.forEach(({addr,tok,items})=>{
              const by={};items.forEach(it=>{(by[it.h]=by[it.h]||[]).push(it);});
              Object.values(by).forEach(legs=>{const{type,net,cp:mcp,sub}=pftClassify(legs,addr,own,tok);flows.push({addr,tok,t:legs[0].t,net});if(Math.abs(net)<1e-9&&type!=='Move')return;
                const t=legs[0].t;let p=px?pfhPriceAt(px,tok,t):null;
                /* newer than the price files (they refresh hourly) → today's price */
                if(p==null){const ser=px&&px.hourly[tok];const last=ser&&ser.length?ser[ser.length-1][0]:null;const cur=pxNow.current&&pxNow.current[tok==='PTGC'?'ptgc':'ufo'];if(last!=null&&t>=last&&cur>0)p=cur;}   // round 23 (audit A3): never "today's price" for old rows when the price files failed
                const cp=mcp;
                rows.push({id:addr+legs[0].h+tok,t,addr,cp:type==='Move'?cp:null,dir:net>=0?1:-1,tok,type,sub,amt:net,p,usd:p==null?null:Math.abs(net)*p,h:legs[0].h});});   // round 25 (audit C3): the name is looked up at render, so a rename shows at once

    /* Expects (all defined before this file runs): PfLeagues.jsx, PfHistory.jsx, PfTx.jsx, plus the classic page's globals

    /* ===== PORTFOLIO v2 (2026-10-13) — the page body of design/portfolio/mock-portfolio-v4.html, built by tools/pf-v2.py =====

      // On mount: fetch prices and LP staking address

        const init=async()=>{

      // Auto-fetch data for saved wallets on load

      const fetchWalletData=async(address)=>{
        const addr=address.toLowerCase();
        const gen=(genRef.current[addr]||0)+1;genRef.current[addr]=gen;
        dropReflScans(addr);
        setLoadingAddrs(prev=>({...prev,[addr]:true}));
        try{
          const data=await fetchPortfolioData(address);

          if(genRef.current[addr]===gen)setPortfolioData(prev=>({...prev,[addr]:{error:String(e&&e.message||e),at:Date.now()}}));

        }});

      /* Retry only the reflections scans that failed (the balances are fine) — the "unavailable — Retry" button. */

      // Aggregate data across checked wallets only
      const agg=useMemo(()=>{
        const result={

          ufo:{balance:0,reflections:null,reflState:'ok',reflPending:0,reflFailed:0,reflDone:0} // reflState: ok | pending | failed | none (a12)
        };
        let ufoRefSum=0,ufoRefAny=false,ufoRefPending=0,ufoRefFailed=0;

              <div className="bg-[#111] border border-[#D9CA5D]/30 rounded-2xl max-w-lg w-full p-6" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold text-[#D9CA5D]">{'\u{1F4CB}'} Portfolio Code</h2>
                  <button onClick={()=>setShowCodeModal(false)} className="text-white/60 hover:text-white text-2xl">{'\u00D7'}</button>
                </div>
                <p className="text-white/60 text-base mb-3">Save this code to restore your portfolio on any device:</p>
                <div className="bg-black/50 border border-white/10 rounded-lg p-4 mb-4">
                  <code className="text-[#D9CA5D] text-sm font-mono break-all select-all">{generatedCode}</code>
                </div>
                <button onClick={copyCode} className={`w-full py-2.5 rounded-lg font-bold transition-all ${codeCopied?'bg-green-500 text-black':'bg-[#D9CA5D] text-black hover:opacity-90'}`}>
                  {codeCopied?'\u2713 Copied!':'Copy to Clipboard'}
                </button>
              </div>
            </div>
          )}
          
          {/* Load Code Modal */}
          {showLoadModal&&(
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" onClick={()=>setShowLoadModal(false)}>
              <div className="bg-[#111] border border-[#D9CA5D]/30 rounded-2xl max-w-lg w-full p-6" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold text-[#D9CA5D]">{'\u{1F4E5}'} Load Portfolio</h2>
                  <button onClick={()=>setShowLoadModal(false)} className="text-white/60 hover:text-white text-2xl">{'\u00D7'}</button>
                </div>
                <p className="text-white/60 text-base mb-3">Paste your portfolio code below:</p>
                <input value={codeInput} onChange={e=>setCodeInput(e.target.value)} placeholder="GRAY-..." className="w-full bg-black/50 border border-white/20 rounded-lg px-4 py-3 text-white font-mono text-base placeholder-white/30 focus:border-[#D9CA5D]/50 focus:outline-none focus-visible:outline-white/60 mb-3" onKeyDown={e=>e.key==='Enter'&&handleLoadCode()}/>
                {codeError&&<div className="text-red-400 text-base mb-3">{codeError}</div>}
                <button onClick={handleLoadCode} className="w-full py-3 rounded-lg font-bold text-lg bg-gradient-to-r from-[#D9CA5D] to-[#7CFC00] text-black hover:opacity-90 transition-all">Load Portfolio</button>
                <p className="text-white/40 text-sm text-center mt-3">This will replace your current portfolio</p>
              </div>
            </div>
          )}
          
          {/* Edit Wallet Modal */}
          {editingWallet&&(
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" onClick={()=>setEditingWallet(null)}>
              <div className="bg-[#111] border border-[#D9CA5D]/30 rounded-2xl max-w-lg w-full p-6" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold text-[#D9CA5D]">{'\u270F\uFE0F'} Edit Wallet</h2>
                  <button onClick={()=>setEditingWallet(null)} className="text-white/60 hover:text-white text-2xl">{'\u00D7'}</button>
                </div>
                <div className="mb-4">
                  <div className="text-white/40 text-sm uppercase mb-1">Wallet Address</div>
                  <div className="bg-black/50 border border-white/10 rounded-lg px-4 py-2.5 text-white/70 font-mono text-sm break-all select-all">{wallets.find(w=>w.address.toLowerCase()===editingWallet)?.address||editingWallet}</div>
                </div>
                <div className="mb-5">
                  <div className="text-white/40 text-sm uppercase mb-1">Label</div>
                  <input value={editWalletName} onChange={e=>setEditWalletName(e.target.value)} placeholder="Enter a name for this wallet..." className="w-full bg-black/50 border border-white/20 rounded-lg px-4 py-3 text-white text-base placeholder-white/30 focus:border-[#D9CA5D]/50 focus:outline-none focus-visible:outline-white/60" autoFocus onKeyDown={e=>e.key==='Enter'&&saveEditWallet()}/>
                </div>
                <div className="flex gap-3">
                  <button onClick={()=>setEditingWallet(null)} className="flex-1 py-2.5 rounded-lg font-bold text-base bg-white/10 text-white hover:bg-white/20 transition-all">Cancel</button>
                  <button onClick={saveEditWallet} className="flex-1 py-2.5 rounded-lg font-bold text-base bg-gradient-to-r from-[#D9CA5D] to-[#7CFC00] text-black hover:opacity-90 transition-all">Save</button>
                </div>
              </div>
            </div>
          )}
          
          {/* PTGC Leagues Modal */}
          {showPtgcLeagues&&(
            <PortfolioLeaguesModal token="PTGC" price={dp.ptgc||prices.ptgc} close={()=>setShowPtgcLeagues(false)}/>
          )}
          
          {/* UFO Leagues Modal */}
          {showUfoLeagues&&(
            <PortfolioLeaguesModal token="UFO" price={dp.ufo||prices.ufo} close={()=>setShowUfoLeagues(false)}/>
          )}
          
          {!PF_V2_LIVE&&<PfV2Dot on={pfV2} toggle={togglePfV2}/>}
          {/* Footer */}
          {!pfV2&&<footer className="text-center py-6 border-t border-white/10 mt-4">
            <p className="text-white/30 text-sm">Portfolio data is read directly from the PulseChain blockchain. Not financial advice.</p>
            <p className="text-white/25 text-sm mt-1">Your portfolio is saved locally in your browser.</p>
          </footer>}
        </div>
      );
    };
    
    // DAO Ledger Page - Hidden Feature
    // Disclaimer Modal Component
    const DisclaimerModal=({onAccept})=>{
      return(
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/95">
          <div className="bg-[#111] border border-yellow-500/30 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <div className="text-center mb-6">
              <div className="text-4xl mb-3">⚠️</div>
              <h2 className="text-2xl font-bold text-yellow-400 font-orbitron">Disclaimer</h2>
            </div>
            
            <div className="space-y-4 text-white/80 text-sm mb-6">
              <p>
                <span className="text-yellow-400 font-semibold">Community Project:</span> This dashboard is built by and for the community. It is not an official product and is not affiliated with or endorsed by any token team or project.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">No Guarantees:</span> While we strive for accuracy, we cannot guarantee that all data displayed is correct, complete, or up-to-date. Data is sourced from third-party APIs and blockchain queries which may contain errors or delays.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">Not Financial Advice:</span> Nothing on this site constitutes financial, investment, or legal advice. Always do your own research (DYOR) before making any investment decisions.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">No Liability:</span> The creators of this dashboard accept no responsibility or liability for any losses, damages, or decisions made based on information displayed here.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">Use at Your Own Risk:</span> By using this dashboard, you acknowledge that you understand these risks and agree to use it at your own discretion.
              </p>
            </div>
            
            <div className="flex flex-col gap-3">
              <button 
                onClick={onAccept}
                className="w-full py-3 px-6 bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-black font-bold rounded-lg transition-all text-lg"
              >
                I Understand & Accept
              </button>
              <p className="text-white/40 text-xs text-center">
                By clicking above, you agree to these terms. This message will not appear again.
              </p>
            </div>
          </div>
        </div>
      );
    };
    
    // ===== Standalone App =====
    const App=()=>{
      const goBack=()=>{
        // If we have browser history, go back naturally (preserves dashboard state)
        if(window.history.length>1){
          window.history.back();
        }else{
          // Fallback: try URL param, sessionStorage, localStorage, then home
          const fromToken=new URLSearchParams(window.location.search).get('from')
            ||(()=>{try{return sessionStorage.getItem('portfolio_from_token')}catch{return null}})()
            ||(()=>{try{return localStorage.getItem('ptgc_last_token')}catch{return null}})();
          window.location.href=fromToken?`index.html?token=${fromToken}`:'index.html';
        }
      };
      
      // Save the from token to sessionStorage as backup
      React.useEffect(()=>{
        const fromToken=new URLSearchParams(window.location.search).get('from');
        if(fromToken){try{sessionStorage.setItem('portfolio_from_token',fromToken)}catch{}}
      },[]);
      
      return <PortfolioBoundary><PortfolioPage onBack={goBack}/></PortfolioBoundary>;
    };

    /* a10: a render error used to unmount the whole tree — a black page with nothing to click.
       The boundary keeps the header and offers the two things that fix it: reload, or clear the saved
       wallet list (the one piece of state that can poison every later visit). */
    class PortfolioBoundary extends React.Component{
      constructor(p){super(p);this.state={error:null};}
      static getDerivedStateFromError(error){return{error};}
      componentDidCatch(error,info){console.error('Portfolio render error:',error,info&&info.componentStack);}
      render(){
        if(!this.state.error)return this.props.children;
        const msg=String(this.state.error&&this.state.error.message||this.state.error);
        return(
          <div className="min-h-screen flex items-center justify-center p-6">
            <div role="alert" className="max-w-md w-full text-center bg-[#111]/80 border border-white/10 rounded-2xl p-8">
              <div className="text-lg text-[#D9CA5D] font-bold mb-2">Something went wrong</div>
              <p className="text-white/60 text-sm mb-1">The portfolio page hit an error while drawing.</p>
              <p className="text-white/35 text-xs font-mono break-all mb-6">{msg}</p>
              <div className="flex flex-wrap justify-center gap-3">
                <button onClick={()=>window.location.reload()} className="px-5 py-2 rounded-xl border border-[#D9CA5D]/40 text-[#D9CA5D] font-semibold hover:bg-white/5">Reload</button>
                <button onClick={()=>{try{localStorage.removeItem(PORTFOLIO_STORAGE_KEY);}catch(e){}window.location.reload();}} className="px-5 py-2 rounded-xl border border-white/15 text-white/70 hover:bg-white/5">Clear saved wallets &amp; reload</button>
              </div>
            </div>
          </div>
        );
      }
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
