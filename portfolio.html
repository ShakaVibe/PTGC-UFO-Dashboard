  <style>
    body{font-family:'Rajdhani',sans-serif;background:#0a0a0a;min-height:100vh}
    .font-orbitron{font-family:'Orbitron',monospace}
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:#1a1a1a}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    .animate-pulse-slow{animation:pulse 1.5s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.animate-pulse-slow{animation:none}}   /* c29 (Audit III) */
    /* v2 header, the portfolio-only pieces (2026-10-03; h2.css has the rest): two coins, the gold→green PORTFOLIO title,
       PTGC / UFO / PLS quotes in the stat slots, the page's three buttons as glass pills */
    .h2 .h2-pfcoins{display:flex;align-items:center;flex:none}
    .h2 .h2-pfc{position:relative;flex:none;width:calc(150*var(--u));height:calc(150*var(--u))}
    .h2 .h2-pfc+.h2-pfc{margin-left:calc(-30*var(--u))}
    .h2 .h2-pfc .h2-coin{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) scale(.77)}
    .h2 .h2-pftitle{background-image:linear-gradient(90deg,#F8DB7C 0%,#E7B843 38%,#C8FF78 62%,#7CFC00 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
    .h2-desk .h2-pftitle{font-size:calc(62*var(--u))}
    .h2 .h2-pfsub{margin-top:calc(10*var(--u));font-size:max(calc(22*var(--u)),.75rem);font-weight:500;color:rgba(255,255,255,.8);text-shadow:0 1px 3px #000}
    /* each quote keeps its own token's price gradient whatever the band's colour (the h2 root takes the ?from= token) — the
       PTGC / UFO pair = h2.css's h2-tprice gradients; the sub-zero digit prints solid (the h2-tprice sub rule) */
    .h2 .h2-pfq.ptgc .h2-tprice{background-image:linear-gradient(180deg,#FFF6D6 0%,#FBE6B0 24%,#F8D88C 42%,#F6C866 58%,#EEB852 74%,#E3A945 90%,#D69C40 100%)}.h2 .h2-pfq.ptgc .h2-tprice sub{-webkit-text-fill-color:#F0BE5E;color:#F0BE5E}
    .h2 .h2-pfq.ufo .h2-tprice{background-image:linear-gradient(180deg,#F4FFE4 0%,#E0FFB8 24%,#CBFF8C 42%,#B2F760 58%,#9BEA45 74%,#86D83A 90%,#76C634 100%)}.h2 .h2-pfq.ufo .h2-tprice sub{-webkit-text-fill-color:#A8EE55;color:#A8EE55}
    .h2 .h2-pfq.pls .h2-tprice{background-image:linear-gradient(180deg,#FFFFFF 0%,#ECEAF6 36%,#CFCBE0 66%,#AEA9C4 100%)}.h2 .h2-pfq.pls .h2-tprice sub{-webkit-text-fill-color:#C9C6DA;color:#C9C6DA}

  <script type="text/babel" data-presets="react">
    const {useState,useEffect,useMemo}=React;
    
    // ===== Minimal TOKENS config (logos and pair addresses needed by portfolio) =====
    const TOKENS={
      PTGC:{name:'PTGC',logo:'logos/ptgc/logo-512.webp',mainPair:'0xf5A89A6487D62df5308CDDA89c566C5B5ef94C11'},
      UFO:{name:'UFO',logo:'logos/ufo/logo-512.webp',mainPair:'0xE221e6fC30e5787F0d551f980B4da1055D832A03'}
    };
    
    // ===== RPC & Helpers =====
    /* RPC ENDPOINT POOL (a12, 2026-09-18) — index.html's three PulseChain endpoints with the same rules:
       a transport failure (network, timeout, non-2xx, non-JSON) rotates to the next endpoint, a
       well-formed JSON-RPC error reply is returned as-is (the log scan bisects on those), the chosen
       endpoint is sticky for 2 min then drifts back to the primary. All three down → {result:null},
       which the reflections path treats as "unavailable" — never a fake 0. */
    const RPC_ENDPOINTS=[
      'https://rpc.pulsechain.com',
      'https://rpc-pulsechain.g4mm4.io',
      'https://pulsechain-rpc.publicnode.com'
    ];
    const RPC=RPC_ENDPOINTS[0];
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    let _rpcIdx=0,_rpcSince=0;
    const RPC_STICKY_MS=120000;
    const _rpcOnce=async(url,body,timeout)=>{
      const controller=new AbortController();
      const timeoutId=setTimeout(()=>controller.abort(),timeout);
      try{
        const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
        if(!res.ok)throw new Error('HTTP '+res.status);
        const txt=await res.text();
        let j;
        try{j=JSON.parse(txt);}catch{throw new Error('non-JSON response');}
        if(!j||typeof j!=='object')throw new Error('bad payload');
        return j;
      }finally{clearTimeout(timeoutId);}
    };
    const rpcFetch=async(body,timeout=8000)=>{
      if(_rpcIdx!==0&&Date.now()-_rpcSince>RPC_STICKY_MS){_rpcIdx=0;}
      const n=RPC_ENDPOINTS.length;
      let lastErr=null;
      for(let i=0;i<n;i++){
        const idx=(_rpcIdx+i)%n;
        try{
          const j=await _rpcOnce(RPC_ENDPOINTS[idx],body,timeout);
          if(idx!==_rpcIdx){_rpcIdx=idx;_rpcSince=Date.now();console.warn('RPC failover → '+RPC_ENDPOINTS[idx]);}
          return j;
        }catch(e){lastErr=e;console.warn('RPC '+RPC_ENDPOINTS[idx]+' failed: '+e.message);}
      }
      console.error('RPC error (all '+n+' endpoints failed):',lastErr&&lastErr.message);
      return{result:null};
    };

    const fmtUSD=n=>n==null||isNaN(n)?'\u2014':'$'+Math.floor(Number(n)).toLocaleString('en-US');

    //

    // The 1% reflection fee (tFee) is NEVER emitted — it only shrinks _rTotal. Across every fee-paying send

    // total, which confirms the 94/5/1 split to 6 significant figures.
    //

    // degrades gracefully: fee-free sends have no fee leg, so they pass through at face value, and a tx

    //

    const UFO_LAUNCH_BLOCK=26989200;

    // self-correcting, since getLogsRange bisects on error or on a suspiciously full batch.
    const LOG_CHUNK=100000, MAX_LOG_RANGES=100;
    const LOG_CAP_SUSPECTS=[100,128,200,250,256,500,512,1000,1024,2000,2048,4096,5000,10000];

    const getLogsRange=async(address,topics,a,b,depth,headBlock)=>{

          if(right===null)return null;

      }

        const left=await getLogsRange(address,topics,a,mid,depth+1,headBlock);
        if(left===null)return null;
        const right=await getLogsRange(address,topics,mid+1,b,depth+1,headBlock);
        if(right===null)return null;
        return left.concat(right);

      if(logsInflight[key])return logsInflight[key];
      const p=_getLogsChunked(address,topics,fromBlock,toBlock);
      logsInflight[key]=p;
      p.then(r=>{if(r===null)delete logsInflight[key];},()=>{delete logsInflight[key];});

      if(toBlock<fromBlock)return[];
      // Derive the chunk size from the span instead of failing when a fixed size needs too many ranges.
      // This is the guard that previously hard-failed and blanked the reflections display.
      const span=toBlock-fromBlock+1;
      const chunk=Math.max(LOG_CHUNK,Math.ceil(span/MAX_LOG_RANGES));
      const ranges=[];
      for(let s=fromBlock;s<=toBlock;s+=chunk)ranges.push([s,Math.min(s+chunk-1,toBlock)]);

      const n=parseInt(r.result,16);
      return isFinite(n)?n:null;
    };
    // Reflections earned for one wallet. Takes the raw balance in wei (BigInt) so the whole computation
    // stays in exact integer arithmetic — a float64 can't hold 1e12 tokens at 18 decimals without drift,
    // and reflections are a tiny fraction of balance, exactly where that drift would matter most.
    // Returns null on any read failure so the UI shows "—"/"calculating" rather than a fake number.
    const computeUfoReflectionsWei=async(address,balanceWei)=>{
      if(balanceWei==null)return null;         // balance read failed -> can't derive
      if(balanceWei<=0n)return 0;              // nothing held -> nothing earned
      const head=await getHeadBlock();
      if(head==null)return null;
      // Scan the token's ENTIRE history, from its deploy block to head. No estimate, no sliding window:
      // no transfer involving this token can predate the block its bytecode first appeared in.
      const fromBlock=UFO_LAUNCH_BLOCK;
      const wtopic='0x'+padAddr(address);
      const [recv,sent]=await Promise.all([
        getLogsChunked(UFO_TOKEN_ADDR,[TRANSFER_TOPIC,null,wtopic],fromBlock,head),   // to = wallet
        getLogsChunked(UFO_TOKEN_ADDR,[TRANSFER_TOPIC,wtopic,null],fromBlock,head),   // from = wallet
      ]);
      if(recv===null||sent===null)return null; // hard chain-read failure -> unavailable, never a fake 0
      const sumWei=(logs)=>logs.reduce((s,l)=>s+parseWord(l.data),0n);
      const contractTopic=('0x'+padAddr(UFO_TOKEN_ADDR)).toLowerCase();
      const inWei=sumWei(recv);                                 // received amounts are emitted at face value
      const outEmitted=sumWei(sent);                            // = 99% of gross on fee-paying sends
      // The 5% contract-fee legs are the only sends addressed to the token itself. gross = fee/0.05,
      // so the unemitted 1% reflection slice = fee/5. Adding it back makes outflow exact.
      const feeLegs=sumWei(sent.filter(l=>(l.topics[2]||'').toLowerCase()===contractTopic));
      const outWei=outEmitted+feeLegs/5n;
      try{(window.pfUfoRecv=window.pfUfoRecv||{})[address.toLowerCase()]=toNum(inWei);}catch(e){}   // Portfolio v2 round 6: yield denominator
      const reflWei=balanceWei-(inWei-outWei);
      return reflWei>0n?toNum(reflWei):0;
    };

    // Pair display names for UFO LP
    const UFO_PAIR_NAMES=['WPLS','PTGC','INC','PLSX','HEX','EHEX','DAI'];

      INC:{address:'0x2fa878Ab3F87CC1C9737Fc071108F904c0B0C95d',decimals:18},
      PLSX:{address:'0x95B303987A60C71504D99Aa1b13B4DA07b0790ab',decimals:18},
      HEX:{address:'0x2b591e99afE9f32eAA6214f7B7629768c40Eeb39',decimals:8},

    /* a10 (2026-09-16): a saved-wallet entry without a valid address used to be persisted and then

    const isValidAddr=a=>typeof a==='string'&&/^0x[0-9a-fA-F]{40}$/.test(a);
    const sanitizeWallets=(list)=>{
      if(!Array.isArray(list))return{wallets:[],dropped:0};

      list.forEach(w=>{
        const address=w&&(typeof w==='object')?(w.address||w.a):null;

      });

    // Decode portfolio code → {wallets,dropped} | null (not a GRAY- code / not JSON)
    const decodePortfolio=(code)=>{

    // Fetch all portfolio data for a single wallet
    const fetchPortfolioData=async(address)=>{
      const addr=padAddr(address);
      
      // ===== PTGC calls in parallel =====
      const[ptgcBal,ptgcSend,ptgcRecv,ptgcUserInfo,ptgcPendingStake,ptgcLockCountRes]=await Promise.all([
        callContract(PTGC_TOKEN_ADDR,SEL.balanceOf+addr),
        callContract(PTGC_TOKEN_ADDR,SEL.totalSend+addr),
        callContract(PTGC_TOKEN_ADDR,SEL.totalReceived+addr),
        callContract(PTGC_STAKING_ADDR,SEL.mapUserInfo+addr),
        callContract(PTGC_STAKING_ADDR,SEL.pendingReward+addr),

      /* a11 (2026-09-16): a failed eth_call (rpcFetch gives {result:null}, or '0x' on a revert) used to
         parse as 0n — balance 0 ("No PTGC holdings"), or reflections = balance + everything ever sent
         when only totalReceived failed — and the result was cached so it never retried. A read that is
         not a full 32-byte word is a failure: the whole wallet is marked failed (see fetchWalletData),
         shows a red dot with a retry, and is not cached as data. Same rule the UFO read already had. */
      const okWord=h=>!!h&&h!=='0x'&&h.length>=66;
      if(![ptgcBal,ptgcSend,ptgcRecv,ptgcUserInfo,ptgcPendingStake,ptgcLockCountRes].every(okWord)){
        throw new Error('PTGC read failed (RPC returned no result)');
      }
      const balance=toNum(parseWord(ptgcBal));
      const tSend=toNum(parseWord(ptgcSend));
      const tRecv=toNum(parseWord(ptgcRecv));
      const reflections=Math.max(0,balance+tSend-tRecv);
      
      // Parse mapUserInfo: amount, rewardDebt, startTime, claimed, lockClaimed, locked, pendingToClaimed
      const uiAmount=toNum(parseWord(ptgcUserInfo,0));
      const uiClaimed=toNum(parseWord(ptgcUserInfo,3));
      const uiLockClaimed=toNum(parseWord(ptgcUserInfo,4));
      const uiLocked=toNum(parseWord(ptgcUserInfo,5));
      const uiPendingToClaimed=toNum(parseWord(ptgcUserInfo,6));
      const pendingStake=toNum(parseWord(ptgcPendingStake))+uiPendingToClaimed;
      const staked=uiAmount; // total in staking contract (includes locked)
      const stakedOnly=Math.max(0,uiAmount-uiLocked); // staked but not locked (for donut)
      
      // Fetch lock details
      const lockCountNum=Number(parseWord(ptgcLockCountRes));
      let locks=[];
      let pendingLocks=0;
      if(lockCountNum>0){
        const lockPromises=[];
        for(let i=1;i<=lockCountNum;i++){
          lockPromises.push(
            Promise.all([
              callContract(PTGC_STAKING_ADDR,SEL.mapUserInfoLock+addr+padUint(i)),
              callContract(PTGC_STAKING_ADDR,SEL.pendingRewardLock+addr+padUint(i))
            ]).then(([info,pend])=>{
              const amt=toNum(parseWord(info,0));
              const startTime=Number(parseWord(info,1));
              const endTime=Number(parseWord(info,2));
              const pending=toNum(parseWord(pend));
              if(amt>0)return{id:i,amount:amt,startTime,endTime,pending};
              return null;
            })
          );
        }
        const lockResults=await Promise.all(lockPromises);
        locks=lockResults.filter(Boolean);
        pendingLocks=locks.reduce((s,l)=>s+l.pending,0);
      }
      
      // ===== UFO (new RFI reflection contract): balance only =====
      // The new contract has no LP-staking module and no totalSend/totalReceived getters. Reflections
      // accrue silently into balanceOf and aren't separately readable; the per-wallet "reflections earned"
      // figure is reconstructed elsewhere from Transfer-log history (deferred until validated). We never
      // fabricate that number, so it stays null for now.
      const ufoBal=await callContract(UFO_TOKEN_ADDR,SEL.balanceOf+addr);
      // Distinguish a failed/reverted call (null or '0x') from a genuine zero balance (a full 32-byte word),
      // so a read failure shows "—" instead of a fake 0.
      const ufoOk=(ufoBal&&ufoBal!=='0x'&&ufoBal.length>=66);
      const ufoBalanceWei=ufoOk?parseWord(ufoBal):null;
      const ufoBalance=ufoOk?toNum(ufoBalanceWei):null;

         ONE wallet at a time (reflQueue below), so five saved wallets no longer fire ten concurrent
         eth_getLogs pipelines at a public RPC. Until it lands, reflections is `undefined` = pending;
         the queue writes a number, or `null` + reflError when the chain read failed. */
      
      return{
        ptgc:{
          balance,reflections,
          staked,stakedOnly,locked:uiLocked,
          pendingStake,pendingLocks,
          totalPending:pendingStake+pendingLocks,
          claimed:uiClaimed,lockClaimed:uiLockClaimed,
          lifetimeEarned:uiClaimed+uiLockClaimed,
          received:tRecv,   // Portfolio v2 round 6: the reflection-yield denominator
          locks,
          // balanceOf already includes locked/staked tokens (they never leave the wallet), so
          // walletFree = balance - uiAmount (staked+locked); totalHolding = full balance.
          walletFree:Math.max(0,balance-uiAmount),

        },
        ufo:{
          balance:ufoBalance,
          balanceWei:ufoBalanceWei==null?null:ufoBalanceWei.toString(),   // for the reflections queue (exact)
          reflections:undefined,    // pending — see reflQueue
          reflError:null,

    /* ===== a12: reflections queue — one wallet's Transfer-log scan at a time =====

       written only if the wallet still has that gen, so a Refresh or a removed wallet can't be
       overwritten by a scan that started earlier. */
    const reflQueue=[];

    const runReflQueue=async()=>{

        while(reflQueue.length){
          const job=reflQueue.shift();
          reflRunning.addr=job.addr;

          let value=null,error=null;
          try{

            value=await computeUfoReflectionsWei(job.address,job.balanceWei==null?null:BigInt(job.balanceWei));

          reflRunning.addr=null;
          job.done(value,error);
        }
      }finally{reflBusy=false;}
    };
    const enqueueReflScan=(job)=>{reflQueue.push(job);runReflQueue();};
    const dropReflScans=(addr)=>{for(let i=reflQueue.length-1;i>=0;i--)if(addr==null||reflQueue[i].addr===addr)reflQueue.splice(i,1);};

    // ===== Portfolio Leagues Modal =====

    /* ===== Portfolio v2 — VALUE HISTORY (2026-10-13, Shaka's option C: "real balances read from the chain") =====
       For every counted wallet, the PTGC and UFO balanceOf AT PAST BLOCKS (archive eth_call, batched), times that moment's
       price (data/charts-data.json daily ≤ 365 d, data/charts-intraday.json hourly ≤ 14 d — the Charts page's prebuilt files),
       summed. Sells show as drops, buys as rises. PTGC staked / locked stay in balanceOf (the staking contract never moves
       them), so the PTGC line is the whole bag. UFO before its contract existed reads 0x → 0.
       Past points never change, so every balance is cached per wallet + token + timestamp in localStorage (PFH_LS); a reload
       only reads what is new. Points are aligned to UTC (6 h steps on 7D, days on 30D / 90D, 4 days on 1Y) so they repeat.
       A point with any wallet unread is a GAP, never a guess. Only the archive nodes (rpc.pulsechain.com, g4mm4) are used —
       publicnode answers "missing trie node" for old blocks (tested 2026-10-13). */
    const PFH_RPC=['https://rpc.pulsechain.com','https://rpc-pulsechain.g4mm4.io'];

    const PFH_TOK={PTGC:'0x94534EeEe131840b1c0F61847c572228bdfDDE93',UFO:'0x49eD499433Bee42DD34C169470feF2C8f9fAe6e6'};

    let pfhCache=null;   // {v:{'addr|TOK':{ts:bal}}}
    const pfhLoad=()=>{if(pfhCache)return pfhCache;try{const s=localStorage.getItem(PFH_LS);pfhCache=s?JSON.parse(s):{v:{}};if(!pfhCache.v)pfhCache={v:{}};}catch(e){pfhCache={v:{}};}return pfhCache;};
    let pfhSaveT=null;

    let pfhEp=0;
    const pfhRpc=async(body,tries=3)=>{
      for(let t=0;t<tries;t++){

          const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ac.signal});clearTimeout(to);

    /* timestamp → block: anchors at the head and ~7 / 30 / 90 / 180 / 365 / 420 days back, linear between them */
    let pfhAnchors=null,pfhAnchorsAt=0;
    const pfhGetAnchors=async()=>{
      if(pfhAnchors&&Date.now()-pfhAnchorsAt<10*60e3)return pfhAnchors;
      const head=await pfhRpc({jsonrpc:'2.0',id:1,method:'eth_getBlockByNumber',params:['latest',false]});

      const nums=[7,30,90,180,365,420].map(d=>Math.max(1,hn-Math.round(d*PFH_D/10300)));
      const res=await pfhRpc(nums.map((n,i)=>({jsonrpc:'2.0',id:i,method:'eth_getBlockByNumber',params:['0x'+n.toString(16),false]})));

    const pfhBlockAt=(a,ts)=>{

    /* round 15 (Shaka: "there was an old UFO contract and a new one … hopefully it includes the old one"): reflections earned on
       the OLD UFO contract up to the migration snapshot (block 26,963,880, 2026-07-06). The new-contract scan counts the migration
       airdrop as tokens RECEIVED, and that airdrop was each wallet's old balance — old reflections included — so without this
       they were principal. Prebuilt once by tools/ufo-v1-earned.py (the old contract is frozen; the method and every on-chain
       check are in that file); sharded by the address's first hex digit so a visit loads only the 1–16 small files it needs.
       Returns {state:'loading'|'ok'|'failed', of(addr) → whole tokens (0 if the wallet earned none there)}. */
    const pfV1Shard={};
    const usePfUfoV1=addrs=>{
      const key=addrs.map(a=>a.toLowerCase()).sort().join(',');
      const[st,setSt]=useState({state:'loading',m:{}});
      useEffect(()=>{let live=true;const cs=[...new Set(addrs.map(a=>a.toLowerCase()[2]))];
        if(!cs.length){setSt({state:'ok',m:{}});return;}
        Promise.all(cs.map(c=>pfV1Shard[c]||(pfV1Shard[c]=fetch(PFH_RAW+'ufo-v1-earned/'+c+'.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).catch(e=>{delete pfV1Shard[c];throw e;}))))
          .then(ms=>{if(live)setSt({state:'ok',m:Object.assign({},...ms)});}).catch(()=>{if(live)setSt({state:'failed',m:{}});});
        return()=>{live=false;};},[key]);

    };
    /* prices: the Charts page's prebuilt files (refetched every 30 min) */
    let pfhPx=null,pfhPxAt=0;
    const pfhPrices=async()=>{
      if(pfhPx&&Date.now()-pfhPxAt<30*60e3)return pfhPx;
      const g=async f=>{try{const r=await fetch(PFH_RAW+f,{cache:'no-cache'});return r.ok?await r.json():null;}catch(e){return null;}};
      const[d,h]=await Promise.all([g('charts-data.json'),g('charts-intraday.json')]);
      const ser=(o,k,tier)=>{try{const s=tier?o.tokens[k][tier].series:o.tokens[k].series;return(s||[]).filter(p=>p&&p[1]>0).sort((x,y)=>x[0]-y[0]);}catch(e){return[];}};
      pfhPx={daily:{PTGC:ser(d,'PTGC'),UFO:ser(d,'UFO')},hourly:{PTGC:ser(h,'PTGC','hourly'),UFO:ser(h,'UFO','hourly')}};pfhPxAt=Date.now();

    };
    const pfhNear=(s,ts,maxGap)=>{if(!s||!s.length||ts<s[0][0]-maxGap)return null;let lo=0,hi=s.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(s[m][0]<=ts)lo=m;else hi=m-1;}
      let best=s[lo];if(lo+1<s.length&&Math.abs(s[lo+1][0]-ts)<Math.abs(best[0]-ts))best=s[lo+1];return Math.abs(best[0]-ts)<=maxGap?best[1]:null;};
    const pfhPriceAt=(px,tok,ts)=>{const h=pfhNear(px.hourly[tok],ts,3*PFH_H);return h!=null?h:pfhNear(px.daily[tok],ts,2*PFH_D);};
    /* read the balances not in the cache; in-flight reads are shared between the chart and the tiles */
    const pfhInflight=new Map();
    const pfhRead=async(jobs,onProgress)=>{
      const c=pfhLoad();const need=[];const waits=[];
      jobs.forEach(j=>{const k=j.addr+'|'+j.tok;const hit=c.v[k]&&c.v[k][j.ts]!=null;if(hit)return;const ik=k+'|'+j.ts;if(pfhInflight.has(ik)){waits.push(pfhInflight.get(ik));return;}need.push(j);});
      let done=0;const total=need.length;onProgress&&onProgress(total?0:1);
      const B=80,batches=[];for(let i=0;i<need.length;i+=B)batches.push(need.slice(i,i+B));
      const run=async batch=>{
        let res=null;try{res=await pfhRpc(batch.map((j,i)=>({jsonrpc:'2.0',id:i,method:'eth_call',params:[{to:PFH_TOK[j.tok],data:'0x70a08231'+j.addr.slice(2).padStart(64,'0')},'0x'+j.block.toString(16)]})));}catch(e){res=null;}
        const byId={};(res||[]).forEach(r=>{if(r)byId[r.id]=r;});
        batch.forEach((j,i)=>{const r=byId[i];if(!r||r.error||r.result==null)return;const k=j.addr+'|'+j.tok;let v=0;try{v=r.result==='0x'?0:Number(BigInt(r.result))/1e18;}catch(e){return;}(c.v[k]=c.v[k]||{})[j.ts]=Math.round(v*100)/100;});
        done+=batch.length;onProgress&&onProgress(total?done/total:1);
      };
      const ps=[];let q=0;const worker=async()=>{while(q<batches.length){const b=batches[q++];await run(b);}};
      const p=Promise.all([worker(),worker()]).then(()=>pfhSave());
      need.forEach(j=>pfhInflight.set(j.addr+'|'+j.tok+'|'+j.ts,p));

    const pfhTimes=period=>{const P=PFH_PERIODS[period];const now=Date.now();const last=Math.floor(now/P.unit)*P.unit;const out=[];for(let k=P.n-1;k>=0;k--)out.push(last-k*P.step);return out.filter(t=>t<now-60e3);};
    /* the series for a set of wallets + period: [{t,p,u,v}] (null v = a gap), plus the live "now" point added by the caller */
    const usePfSeries=(addrs,period,enabled=true)=>{
      const[st,setSt]=useState({state:'idle',pts:[],progress:0});
      const key=addrs.slice().sort().join(',')+'|'+period;
      const[nonce,setNonce]=useState(0);
      useEffect(()=>{
        if(!enabled||!addrs.length){setSt({state:addrs.length?'idle':'empty',pts:[],progress:0});return;}
        let live=true;
        (async()=>{
          setSt(s=>({...s,state:'loading',progress:0}));
          try{
            const[a,px]=await Promise.all([pfhGetAnchors(),pfhPrices()]);
            const times=pfhTimes(period);
            const jobs=[];times.forEach(ts=>{const block=pfhBlockAt(a,ts);addrs.forEach(addr=>['PTGC','UFO'].forEach(tok=>jobs.push({addr,tok,ts,block})));});
            await pfhRead(jobs,pr=>{if(live)setSt(s=>({...s,progress:pr}));});
            const c=pfhLoad();

              let p=0,u=0,ok=true;
              addrs.forEach(addr=>{const bp=(c.v[addr+'|PTGC']||{})[ts],bu=(c.v[addr+'|UFO']||{})[ts];if(bp==null||bu==null){ok=false;return;}p+=bp;u+=bu;});
              if(!ok)return{t:ts,v:null};
              const pp=p>0?pfhPriceAt(px,'PTGC',ts):0,pu=u>0?pfhPriceAt(px,'UFO',ts):0;
              if(pp==null||pu==null)return{t:ts,v:null};

            });
            if(!live)return;
            const gaps=pts.filter(x=>x.v==null).length;

        for(let i=0;i<addrs.length;i++)for(let k=0;k<2;k++){const r=by[i*2+k];if(!r||r.error||r.result==null)throw new Error('read');const x=r.result==='0x'?0:Number(BigInt(r.result))/1e18;if(k===0)p+=x;else u+=x;}
        const pp=p>0?pfhPriceAt(px,'PTGC',ts):0,pu=u>0?pfhPriceAt(px,'UFO',ts):0;if(pp==null||pu==null)throw new Error('price');

    };
    const pfhMoney=v=>v==null?'—':v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e4?'$'+Math.round(v/1e3)+'K':v>=1e3?'$'+(v/1e3).toFixed(1)+'K':'$'+Math.round(v);

    const PfSpark=({vals,col})=>{

      const mn=Math.min(...v),mx=Math.max(...v),W=96,H=46;const pts=v.map((y,i)=>[i/(v.length-1)*W,H-4-(mx>mn?(y-mn)/(mx-mn):.5)*(H-10)]);
      const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');const id='pfs'+col.slice(1);
      return(<svg className="pf2-spk" viewBox={`0 0 ${W} ${H}`} aria-hidden="true"><defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={col} stopOpacity=".42"/><stop offset="1" stopColor={col} stopOpacity="0"/></linearGradient></defs><path d={d+`L${W} ${H}L0 ${H}Z`} fill={`url(#${id})`}/><path d={d} fill="none" stroke={col} strokeWidth="1.6" strokeLinejoin="round" style={{filter:`drop-shadow(0 0 3px ${col})`}}/></svg>);
    };

    const PfHistChart=({pts,period,txs})=>{

    /* ===== Portfolio v2 — RECENT TRANSACTIONS (2026-10-13, round 9) =====
       PulseScan's token-transfer list per counted wallet and token (PTGC, UFO) — /api/v2/addresses/{w}/token-transfers, CORS
       open, the latest 50 per call (tested live: ~1–10 s a call). Up to 3 calls in flight; answers cached 5 min in
       localStorage (PFT_LS) so a reload paints at once. Transfers of one tx + token are netted for the wallet (a UFO sell is
       the pair leg + the fee leg to the token contract → one "Sell"). Types: Claim (from the PTGC staking contract — staking
       or lock reward), Stake (to it), Buy / Sell (the tx called a swap), Move (between two of YOUR wallets),
       Receive / Send (anything else). Value = amount × that hour's / day's price (the history's price files). */
    /* round 18 (Shaka: "a lot of dots are still missing on the chart"): ONE page (the latest 50 transfers) was all we read, and a
       busy wallet's 50 reach back only hours — so the chart had no trades for most of the week. Now each wallet + token is read
       page by page back a year (PFT_BACK) or PFT_PAGES pages, whichever comes first: page 1 for everyone first (the list paints
       fast), then the deeper pages in the background. A cached entry keeps {items, next (PulseScan's next_page_params), done};
       a refresh reads only the newest page(s) and merges them in until it meets what is already cached. */
    const PFT_LS='grays_pf_tx_v3';   // v3 (round 18): entries carry next / done (paging)
    const PFT_API='https://api.scan.pulsechain.com/api/v2/addresses/';
    const PFT_STAKING='0xc71f597a2ac39e47f07102e849d18489c96f39ef';
    const PFT_TTL=5*60e3,PFT_BACK=365*864e5,PFT_PAGES=20;
    try{localStorage.removeItem('grays_pf_tx_v2');}catch(e){}
    const pftCache=(()=>{let c=null;return{get(){if(c)return c;try{c=JSON.parse(localStorage.getItem(PFT_LS)||'{}')||{};}catch(e){c={};}return c;},save(){try{localStorage.setItem(PFT_LS,JSON.stringify(c));}catch(e){try{c={};localStorage.removeItem(PFT_LS);}catch(e2){}}}};})();
    const pftPage=async(addr,tok,next)=>{
      const ac=new AbortController();const to=setTimeout(()=>ac.abort(),25000);
      try{
        const q=next?'&'+Object.entries(next).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&'):'';
        const r=await fetch(`${PFT_API}${addr}/token-transfers?type=ERC-20&token=${PFH_TOK[tok]}${q}`,{signal:ac.signal});
        if(!r.ok)throw new Error('HTTP '+r.status);
        const j=await r.json();
        const items=(j.items||[]).map(x=>({h:x.tx_hash,t:Date.parse(x.timestamp),f:(x.from&&x.from.hash||'').toLowerCase(),to:(x.to&&x.to.hash||'').toLowerCase(),fc:!!(x.from&&x.from.is_contract),tc:!!(x.to&&x.to.is_contract),m:x.method||'',v:(()=>{try{return Number(BigInt(x.total.value))/Math.pow(10,+x.total.decimals||18);}catch(e){return 0;}})(),li:x.log_index}));
        return{items,next:j.next_page_params||null};
      }finally{clearTimeout(to);}
    };
    const pftKey=i=>i.h+'|'+(i.li!=null?i.li:i.f+i.to+i.v);
    const pftDone=(e)=>!e.next||e.pages>=PFT_PAGES||(e.items.length&&Date.now()-e.items[e.items.length-1].t>PFT_BACK);
    /* page 1 (fresh or merged into the cache) */
    const pftFetch=async(addr,tok,force)=>{
      const k=addr+'|'+tok,c=pftCache.get(),hit=c[k];
      if(!force&&hit&&Date.now()-hit.at<PFT_TTL)return hit;
      try{
        let pg=await pftPage(addr,tok,null),e;
        if(hit&&hit.items.length){
          const have=new Set(hit.items.map(pftKey));let fresh=pg.items.filter(i=>!have.has(pftKey(i))),n=1;
          /* the newest page didn't reach the cache yet → keep reading (a few pages at most) */
          while(fresh.length===pg.items.length&&pg.next&&n<5){pg=await pftPage(addr,tok,pg.next);n++;fresh=fresh.concat(pg.items.filter(i=>!have.has(pftKey(i))));}
          e=fresh.length===pg.items.length*n&&pg.next?{at:Date.now(),items:fresh,next:pg.next,pages:n}   // still a gap → start over from here
            :{...hit,at:Date.now(),items:fresh.concat(hit.items)};
        }else e={at:Date.now(),items:pg.items,next:pg.next,pages:1};
        e.done=pftDone(e);c[k]=e;pftCache.save();return e;
      }catch(err){if(hit)return hit;throw err;}
    };
    /* one more (older) page */
    const pftMore=async(addr,tok)=>{
      const k=addr+'|'+tok,c=pftCache.get(),e=c[k];if(!e||e.done)return e;
      const pg=await pftPage(addr,tok,e.next);
      const have=new Set(e.items.map(pftKey));
      const n={...e,items:e.items.concat(pg.items.filter(i=>!have.has(pftKey(i)))),next:pg.next,pages:(e.pages||1)+1};
      n.done=pftDone(n);c[k]=n;pftCache.save();return n;
    };
    /* round 13 (Shaka: "double check your types … those ones from 0bd0 show as Stake, but they were sells"). Checked live on
       PulseScan: EVERY PTGC transfer — sells, buys, plain sends — splits off fee legs to the token contract, the staking contract
       and the burn address, so "a leg went to the staking contract" meant nothing; and routers often show a bare selector
       (0xe25d4a18) instead of a "swap…" method name, so the method can't be trusted either. Now: fee legs are left out when
       finding who the wallet traded WITH (they still count in the amount — it is what left the wallet); the main counterparty is
       the biggest remaining leg. From the staking contract = Claim; one of your own wallets = Move; method add/removeLiquidity =
       Add LP / Remove LP; a CONTRACT (DEX pair, router, aggregator) = Buy (tokens in) / Sell (tokens out); a person = Receive / Send. */
    /* round 14 — lessons from pulsechain_monitor.py (the trade monitor we built earlier, every rule verified on chain there):
       · claims are named by the FUNCTION, not the contract (staking and locking share 0xc71f…): withdrawReward = staking
         rewards, withdrawRewardLock = lock rewards. (round 14b, Shaka: the DAO has nothing to do with a personal wallet —
         the monitor's DAO claim / DAO lock rules are left out.)
       · PTGC staking is balance-lock style: an UNSTAKE (withdraw(uint256) on the staking contract) moves no principal — only the
         reward out and the unstake fee in — so it is labelled Unstake and its principal is read from the call (see pftDetail).
       · the 1 % HOLDERS share of the fee (reflections) leaves the sender with NO Transfer event — it is paid by shrinking
         everyone's balance-rate, not by a transfer. PTGC fee 5 %: emitted = 2.5 % to the token contract (2 % DAO + 0.5 %
         liquidity), 1 % to the staking contract, 0.5 % to 0x…369 (burn); hidden = 1 % holders = the same size as the staking
         leg. UFO fee 6 %: emitted = 5 % to the UFO contract (burns + liquidity); hidden = 1 % holders = that leg ÷ 5.
         Checked on chain 2026-10-13: a PTGC sell (tx 0x91968a23…, block 27,789,557) logged 14,850 out, the wallet's balanceOf
         fell 15,000; three UFO sells fell by emitted + exactly the fee leg ÷ 5. Sell / Send amounts are grossed up by it.
       · LP adds made through a helper / zapper look like a Sell — the tell is LP tokens minted to the wallet in the same tx
         (pftDetail checks the tx's other transfers). */
    const PFT_FEE=new Set(['0x0000000000000000000000000000000000000000','0x0000000000000000000000000000000000000369','0x000000000000000000000000000000000000dead',PFT_STAKING]);
    const PFT_CLAIM_SUB={withdrawreward:'staking',withdrawrewardlock:'lock'};
    const pftClassify=(legs,addr,own,tok)=>{
      let net=0;legs.forEach(l=>{if(l.to===addr)net+=l.v;if(l.f===addr)net-=l.v;});
      const tokAddr=PFH_TOK[tok].toLowerCase();
      const m=(legs[0]&&legs[0].m||'').toLowerCase();
      const fromSt=legs.some(l=>l.f===PFT_STAKING&&l.to===addr);
      if(m==='withdraw'&&legs.some(l=>l.f===PFT_STAKING||l.to===PFT_STAKING))return{type:'Unstake',net};
      if(fromSt)return{type:'Claim',net,sub:PFT_CLAIM_SUB[m]||''};
      const main=legs.filter(l=>(l.to===addr||l.f===addr)).map(l=>l.to===addr?{a:l.f,c:l.fc,v:l.v}:{a:l.to,c:l.tc,v:l.v})
        .filter(x=>x.a&&x.a!==addr&&x.a!==tokAddr&&!PFT_FEE.has(x.a)).sort((x,y)=>y.v-x.v)[0];
      /* the hidden reflection slice of a send (see above) */
      if(net<0){if(tok==='PTGC'){const stLeg=legs.filter(l=>l.f===addr&&l.to===PFT_STAKING).reduce((a,l)=>a+l.v,0);net-=stLeg;}
        else{const fee=legs.filter(l=>l.f===addr&&l.to===tokAddr).reduce((a,l)=>a+l.v,0);net-=fee/5;}}
      let type;
      if(main&&own.has(main.a))type='Move';
      else if(/addliquidity/.test(m))type='Add LP';
      else if(/removeliquidity/.test(m))type='Remove LP';
      else if(main&&main.c)type=net>=0?'Buy':'Sell';
      else type=net>=0?'Receive':'Send';
      return{type,net,cp:main&&main.a};
    };
    /* per-tx detail, fetched only for the rows on screen that need it, cached for good (past txs never change):
       Sell / Buy → was it really an LP add / remove through a helper (LP tokens minted to / returned by the wallet)?
       Unstake → the principal, decoded from withdraw(uint256)'s argument. */
    const PFT_DLS='grays_pf_txd_v1';
    const pftD=(()=>{let c=null;return{get(){if(c)return c;try{c=JSON.parse(localStorage.getItem(PFT_DLS)||'{}')||{};}catch(e){c={};}return c;},save(){try{localStorage.setItem(PFT_DLS,JSON.stringify(c));}catch(e){}}};})();
    const pftDetail=async(h,addr)=>{
      const c=pftD.get(),k=h+'|'+addr;if(c[k])return c[k];
      const g=async u=>{const r=await fetch(PFT_API.replace('addresses/','')+u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();};
      const out={};
      const tx=await g('transactions/'+h);
      const raw=tx&&tx.raw_input||'';
      if(raw.startsWith('0x2e1a7d4d')&&raw.length>=74){try{out.principal=Number(BigInt('0x'+raw.slice(10,74)))/1e18;}catch(e){}}
      const tt=await g('transactions/'+h+'/token-transfers');
      (tt.items||[]).forEach(x=>{const sym=(x.token&&x.token.symbol||''),nm=(x.token&&x.token.name||'');if(!(sym==='PLP'||/LP/.test(nm)))return;
        const f=(x.from&&x.from.hash||'').toLowerCase(),t=(x.to&&x.to.hash||'').toLowerCase();
        if(t===addr&&/^0x0{40}$/.test(f))out.lp='add';else if(f===addr)out.lp='remove';});
      c[k]=out;pftD.save();return out;
    };
    const PFT_TYPE={Buy:['#39E15A','▲'],Sell:['#FF6B73','▼'],Receive:['#39E15A','↙'],Send:['#FF6B73','↗'],Claim:['#5AB8FF','⬇'],'Add LP':['#F2D35B','\u2295'],Unstake:['#B9C4FF','\u21E7'],'Remove LP':['#F2D35B','\u2296'],Move:['#B26BFF','⇄']};
    const PfRecentTx=({wallets,prices,onRows})=>{
      const pxNow=React.useRef(prices);pxNow.current=prices;
      const[st,setSt]=useState({state:'idle',rows:[],failed:0,done:0,total:0});
      const[lim,setLim]=useState(10);      // round 17: rows shown (10, +30 per Show more)
      const[flt,setFlt]=useState('All');    // round 17: filter chip
      const[cp,setCp]=useState(null);       // round 17: the row whose wallet address was just copied
      const[nonce,setNonce]=useState(0);
      const key=wallets.map(w=>w.address.toLowerCase()).sort().join(',');
      useEffect(()=>{
        if(!wallets.length){setSt({state:'empty',rows:[],failed:0,done:0,total:0});return;}
        let live=true;
        (async()=>{
          const own=new Set(wallets.map(w=>w.address.toLowerCase()));
          const names={};wallets.forEach(w=>{names[w.address.toLowerCase()]=w.name||(w.address.slice(0,6)+'…'+w.address.slice(-4));});
          const jobs=[];wallets.forEach(w=>['PTGC','UFO'].forEach(tok=>jobs.push({addr:w.address.toLowerCase(),tok})));
          setSt(s=>({...s,state:s.rows.length?'ok':'loading',done:0,total:jobs.length}));
          const got=[];let failed=0,done=0,q=0;
          const px=await pfhPrices().catch(()=>null);
          const build=()=>{
            const rows=[];
            got.forEach(({addr,tok,items})=>{
              const by={};items.forEach(it=>{(by[it.h]=by[it.h]||[]).push(it);});
              Object.values(by).forEach(legs=>{const{type,net,cp:mcp,sub}=pftClassify(legs,addr,own,tok);if(Math.abs(net)<1e-9&&type!=='Move')return;
                const t=legs[0].t;let p=px?pfhPriceAt(px,tok,t):null;
                /* newer than the price files (they refresh hourly) → today's price */
                if(p==null){const last=px&&px.hourly[tok]&&px.hourly[tok].length?px.hourly[tok][px.hourly[tok].length-1][0]:0;const cur=pxNow.current&&pxNow.current[tok==='PTGC'?'ptgc':'ufo'];if(t>=last&&cur>0)p=cur;}
                const cp=mcp;
                rows.push({id:addr+legs[0].h+tok,t,addr,who:type==='Move'&&cp?(net>=0?(names[cp]||cp.slice(0,6))+' \u2192 '+names[addr]:names[addr]+' \u2192 '+(names[cp]||cp.slice(0,6))):names[addr],tok,type,sub,amt:net,p,usd:p==null?null:Math.abs(net)*p,h:legs[0].h});});
            });
            /* a Move shows once (the receiving side), not twice */
            const seen=new Set();const out=[];
            rows.sort((a,b)=>b.t-a.t).forEach(r=>{if(r.type==='Move'){const k=r.h+r.tok;if(seen.has(k))return;seen.add(k);if(r.amt<0){r.amt=-r.amt;}}out.push(r);});

          const cov=()=>{const o={};got.forEach(g=>{o[g.addr+'|'+g.tok]=g.done?0:(g.items.length?g.items[g.items.length-1].t:Date.now());});return o;};
          const tell=()=>{if(onRows&&live)onRows({rows:build(),cov:cov(),failed});};
          const worker=async()=>{while(q<jobs.length){const j=jobs[q++];try{const e=await pftFetch(j.addr,j.tok,nonce>0);got.push({...j,items:e.items,done:e.done});}catch(e){failed++;}done++;if(live)setSt({state:'ok',rows:build(),failed,done,total:jobs.length});}};

          let q2=0;const deep=got.filter(g=>!g.done);

      },[key,nonce]);
      /* round 17 (Shaka picked option B of mock-tx-v1): an activity feed — one plain-words line per transaction ("Sold 8.91M PTGC"),
         a round type icon with the token's logo on its corner, the wallet (with a copy button) and time underneath, the dollar value
         on the right; grouped by day; filter chips with counts; "Show 30 more". The same layout on a phone. */
      const PFT_F={All:null,Buys:['Buy'],Sells:['Sell'],Claims:['Claim','Unstake'],LP:['Add LP','Remove LP'],Transfers:['Move','Receive','Send']};
      const[det,setDet]=useState({});

      const fix=r=>{const d=det[r.h+'|'+r.addr];if(!d)return r;
        if(d.lp&&(r.type==='Sell'||r.type==='Buy'))return{...r,type:d.lp==='add'?'Add LP':'Remove LP'};
        if(r.type==='Unstake'&&d.principal>0)return{...r,net:r.amt,amt:d.principal,unstake:true,usd:r.p==null?null:d.principal*r.p};
        return r;};
      const all=st.rows.map(fix);
      const cnt=k=>PFT_F[k]?all.filter(r=>PFT_F[k].includes(r.type)).length:all.length;
      const list=PFT_F[flt]?all.filter(r=>PFT_F[flt].includes(r.type)):all;

      const ufRecv=(()=>{if(!okW.length)return null;let t=0;for(const w of counted){const a=w.address.toLowerCase(),d=portfolioData[a];if(!d||d.error)continue;if(!(d.ufo.balance>0))continue;const r=(window.pfUfoRecv||{})[a];if(typeof r!=='number')return null;t+=r;}return t;})();

         migration airdrop sits inside ufRecv, and the old reflections are the part of it that was earned — so

         new contract alone and says so. */

              {/* round 19 (option A of mock-r18-v1, cards on a phone): tokens with $ under each, Pending to claim in PTGC yellow, UFO as one

              {bdOpen&&(()=>{const COL=['#B26BFF','#F2D35B','#22D3EE','#FF8A3D','#EC4899','#7CFC00','#6FA8FF','#FF6B73'];
                const rows=counted.map((w,i)=>{const a=w.address.toLowerCase(),d=portfolioData[a];if(!d||d.error)return null;
                  const pT=d.ptgc.totalHolding||0,pc=d.ptgc.totalPending||0,uT=d.ufo.balance||0,p$=usd(pT,dp.ptgc)||0,u$=usd(uT,dp.ufo)||0;
                  return{w,a,c:COL[i%COL.length],pT,pc,uT,p$,c$:usd(pc,dp.ptgc)||0,u$,t$:p$+u$};}).filter(Boolean);
                const S=k=>rows.reduce((t,r)=>t+r[k],0),all=S('t$');
                const cpy=a=>{try{navigator.clipboard.writeText(a);}catch(e){}setBdCp(a);setTimeout(()=>setBdCp(x=>x===a?null:x),1400);};
                const who=r=><><div className="n"><i style={{background:r.c}}></i>{r.w.name||truncAddr(r.w.address)}</div>

                      <div className="sb"><b style={{width:(r.t$>0?r.p$/r.t$*100:0)+'%',background:'#F2D35B'}}></b><b style={{width:(r.t$>0?r.u$/r.t$*100:0)+'%',background:'#7CFC00'}}></b></div>
                      <div className="cols"><div className="cl"><div className="l">PTGC</div>{cell(r.pT,r.p$,'p')}</div><div className="cl"><div className="l">Pending to claim</div>{cell(r.pc,r.c$,'p')}</div><div className="cl"><div className="l">UFO</div>{cell(r.uT,r.u$,'u')}</div></div></div>)}
                    {rows.length>1&&<div className="wsum"><span className="l">ALL WALLETS</span><b>{fmtDollar(all)}</b></div>}</div>

        {edit&&(()=>{const w=wallets.find(x=>x.address.toLowerCase()===edit);return w?<PfEditWallet w={w} groups={gNames} save={patch=>{p.updateWallet(edit,patch);setEdit(null);}} remove={()=>{removeWallet(w.address);setEdit(null);}} close={()=>setEdit(null)}/>:null;})()}

            <h2>HOW IT WORKS</h2>

            <p><b>PTGC</b> holdings are the wallet's full balance; the PTGC staking contract tells us how much of it is staked or locked, and what rewards are waiting to be claimed. <b>Reflections</b> (PTGC and UFO) are worked out from the chain: what the wallet holds now, plus everything it ever sent, minus everything it ever received.</p>
            <p><b>Lifetime earned</b> is every reward: PTGC staking + locking + reflections (UFO pays reflections only). UFO{'\u2019'}s principal / reflections split of today{'\u2019'}s bag is pro rata to everything ever received and earned. UFO reflections cover UFO{'\u2019'}s whole life, including the time before the Jul 2026 contract migration.</p>
            <p><b>Leagues</b> show your bag in sea creatures {'—'} a whale is 1 % of the supply, a shark 0.1 %, and so on down.</p>
            <p><b>Your list is saved in this browser only.</b> Use <b>Get Code</b> in the header to back it up, and <b>Load Code</b> to restore it on another device.</p>

    const PortfolioPage=({onBack})=>{
      const[wallets,setWallets]=useState(()=>{
        try{const s=localStorage.getItem(PORTFOLIO_STORAGE_KEY);return s?sanitizeWallets(JSON.parse(s)).wallets:[];}catch{return[]}
      });
      const[inputAddr,setInputAddr]=useState('');
      const[inputName,setInputName]=useState('');
      const[inputGroup,setInputGroup]=useState('Default');
      const[portfolioData,setPortfolioData]=useState({});
      const[loading,setLoading]=useState(false);
      const[loadingAddrs,setLoadingAddrs]=useState({});   // a12: several wallets load at once — a set, not one address
      const genRef=React.useRef({});                          // a12: per-wallet load generation (see reflQueue)
      const[scanningAddr,setScanningAddr]=useState(null);     // a12: the wallet whose reflections scan is running now
      const[prices,setPrices]=useState({ptgc:null,ufo:null,pls:null});
      const[changes,setChanges]=useState({ptgc:null,ufo:null,pls:null});   // 24h %, for the v2 header's quotes (2026-10-03)
      const[codeInput,setCodeInput]=useState('');
      const[showCodeModal,setShowCodeModal]=useState(false);
      const[showLoadModal,setShowLoadModal]=useState(false);
      const[generatedCode,setGeneratedCode]=useState('');
      const[codeCopied,setCodeCopied]=useState(false);
      const[codeError,setCodeError]=useState('');
      const[editGroup,setEditGroup]=useState(null);
      const[newGroupName,setNewGroupName]=useState('');
      const[initialLoad,setInitialLoad]=useState(true);
      const[checkedWallets,setCheckedWallets]=useState({});
      const[editingWallet,setEditingWallet]=useState(null);
      const[editWalletName,setEditWalletName]=useState('');
      const[showWalletBreakdown,setShowWalletBreakdown]=useState(false);
      const[moonMathActive,setMoonMathActive]=useState(false);
      const[customPrices,setCustomPrices]=useState({ptgc:'',ufo:'',pls:''});
      const[showPtgcLeagues,setShowPtgcLeagues]=useState(false);
      const[showUfoLeagues,setShowUfoLeagues]=useState(false);
      const[pfV2,setPfV2]=useState(()=>PF_V2_LIVE||pfV2Saved());   // Portfolio v2 (2026-10-13): hidden preview, see PortfolioV2
      const updateWalletV2=(addr,patch)=>setWallets(prev=>prev.map(w=>w.address.toLowerCase()===addr?{...w,...patch}:w));   // Portfolio v2 round 2: the Edit window
      const togglePfV2=()=>setPfV2(v=>{const n=!v;try{n?localStorage.setItem(LS_PF_V2,'1'):localStorage.removeItem(LS_PF_V2);}catch(e){}try{window.scrollTo(0,0);}catch(e){}return n;});
      
      const ATH_PRICES={ptgc:0.00133,ufo:0.000113,pls:0.00029};
      
      // Display prices: use custom when moonMath active and field has value, else live
      const dp={
        ptgc:moonMathActive&&customPrices.ptgc!==''?parseFloat(customPrices.ptgc)||0:prices.ptgc,
        ufo:moonMathActive&&customPrices.ufo!==''?parseFloat(customPrices.ufo)||0:prices.ufo,
        pls:moonMathActive&&customPrices.pls!==''?parseFloat(customPrices.pls)||0:prices.pls
      };
      
      // Save to localStorage whenever wallets change
      useEffect(()=>{
        try{localStorage.setItem(PORTFOLIO_STORAGE_KEY,JSON.stringify(wallets));}catch{}
      },[wallets]);
      
      // On mount: fetch prices and LP staking address
      useEffect(()=>{
        const init=async()=>{
          // Prices via the robust /tokens/{addr} path; each is null on failure (renders "—", never a fake 0).
          const[pq,uq,wq]=await Promise.all([
            quoteOf(PTGC_TOKEN_ADDR),
            quoteOf(UFO_TOKEN_ADDR),
            quoteOf(WPLS_ADDR)
          ]);
          const ptgcPrice=pq.price,ufoPrice=uq.price,plsPrice=wq.price;
          setPrices({ptgc:ptgcPrice,ufo:ufoPrice,pls:plsPrice});
          setChanges({ptgc:pq.change,ufo:uq.change,pls:wq.change});
          // The new UFO contract has no LP-staking module, so there's nothing to discover here.
          setInitialLoad(false);
        };
        init();
      },[]);
      
      // Auto-fetch data for saved wallets on load
      useEffect(()=>{
        if(initialLoad||wallets.length===0)return;
        wallets.forEach(w=>{
          if(!portfolioData[w.address.toLowerCase()]){
            fetchWalletData(w.address);
          }
        });
      },[wallets,initialLoad]);
      
      const fetchWalletData=async(address)=>{
        const addr=address.toLowerCase();
        const gen=(genRef.current[addr]||0)+1;genRef.current[addr]=gen;
        dropReflScans(addr);
        setLoadingAddrs(prev=>({...prev,[addr]:true}));
        try{
          const data=await fetchPortfolioData(address);
          if(genRef.current[addr]!==gen)return;   // a newer load / refresh / remove won
          data.gen=gen;
          setPortfolioData(prev=>({...prev,[addr]:data}));
          queueReflScan(address,addr,gen,data.ufo.balanceWei);
        }catch(e){
          console.error('Error fetching portfolio for',address,e);
          // a11: remember the failure (so the auto-fetch effect does not hammer the RPC) but as a
          // failure, not as data — the chip shows a red dot + retry and the totals leave it out.
          if(genRef.current[addr]===gen)setPortfolioData(prev=>({...prev,[addr]:{error:String(e&&e.message||e),at:Date.now()}}));
        }finally{
          setLoadingAddrs(prev=>{const n={...prev};delete n[addr];return n;});
        }
      };
      /* a12: queue the wallet's reflections scan; the result lands only if the wallet's gen is unchanged. */
      const queueReflScan=(address,addr,gen,balanceWei)=>{
        setPortfolioData(prev=>prev[addr]&&!prev[addr].error&&prev[addr].gen===gen?{...prev,[addr]:{...prev[addr],ufo:{...prev[addr].ufo,reflections:undefined,reflError:null}}}:prev);
        enqueueReflScan({address,addr,balanceWei,start:()=>setScanningAddr(addr),done:(value,error)=>{
          setScanningAddr(null);
          if(genRef.current[addr]!==gen)return;
          setPortfolioData(prev=>prev[addr]&&!prev[addr].error&&prev[addr].gen===gen?{...prev,[addr]:{...prev[addr],ufo:{...prev[addr].ufo,reflections:value,reflError:error}}}:prev);
        }});
      };
      /* Retry only the reflections scans that failed (the balances are fine) — the "unavailable — Retry" button. */
      const retryFailedReflScans=()=>{
        Object.entries(portfolioData).forEach(([addr,d])=>{
          if(!d||d.error||!(d.ufo&&d.ufo.reflections===null))return;
          const w=wallets.find(x=>x.address.toLowerCase()===addr);if(!w)return;
          queueReflScan(w.address,addr,d.gen,d.ufo.balanceWei);
        });
      };

      const addWallet=()=>{
        const addr=inputAddr.trim();
        if(!addr||!/^0x[0-9a-fA-F]{40}$/.test(addr))return;
        if(wallets.find(w=>w.address.toLowerCase()===addr.toLowerCase()))return;
        const newWallet={address:addr,name:inputName.trim()||'',group:inputGroup||'Default'};
        setWallets(prev=>[...prev,newWallet]);
        setCheckedWallets(prev=>({...prev,[addr.toLowerCase()]:true}));
        setInputAddr('');
        setInputName('');
        fetchWalletData(addr);
      };
      
      const toggleWallet=(addr)=>{
        const key=addr.toLowerCase();
        setCheckedWallets(prev=>{
          const currentlyChecked=prev[key]!==false;
          return{...prev,[key]:!currentlyChecked};
        });
      };
      
      const isWalletChecked=(addr)=>{
        const key=addr.toLowerCase();
        return checkedWallets[key]!==false; // default to true
      };
      
      const selectAllWallets=()=>{
        const updated={};
        wallets.forEach(w=>{updated[w.address.toLowerCase()]=true});
        setCheckedWallets(updated);
      };
      
      const deselectAllWallets=()=>{
        const updated={};
        wallets.forEach(w=>{updated[w.address.toLowerCase()]=false});
        setCheckedWallets(updated);
      };
      
      const removeWallet=(addr)=>{
        genRef.current[addr.toLowerCase()]=(genRef.current[addr.toLowerCase()]||0)+1;   // a12: orphan any in-flight load / scan
        dropReflScans(addr.toLowerCase());
        setWallets(prev=>prev.filter(w=>w.address.toLowerCase()!==addr.toLowerCase()));
        setPortfolioData(prev=>{const n={...prev};delete n[addr.toLowerCase()];return n;});
      };
      
      const saveEditWallet=()=>{
        if(!editingWallet)return;
        setWallets(prev=>prev.map(w=>w.address.toLowerCase()===editingWallet?{...w,name:editWalletName.trim()}:w));
        setEditingWallet(null);
        setEditWalletName('');
      };
      
      const groups=useMemo(()=>{
        const g={};
        wallets.forEach(w=>{
          const gn=w.group||'Default';
          if(!g[gn])g[gn]=[];
          g[gn].push(w);
        });
        return g;
      },[wallets]);
      
      // Aggregate data across checked wallets only
      const agg=useMemo(()=>{
        const result={
          ptgc:{balance:0,reflections:0,staked:0,stakedOnly:0,locked:0,pendingStake:0,pendingLocks:0,totalPending:0,claimed:0,lockClaimed:0,lifetimeEarned:0,walletFree:0,totalHolding:0,locks:[]},
          ufo:{balance:0,reflections:null,reflState:'ok',reflPending:0,reflFailed:0,reflDone:0} // reflState: ok | pending | failed | none (a12)
        };
        let ufoRefSum=0,ufoRefAny=false,ufoRefPending=0,ufoRefFailed=0;
        Object.entries(portfolioData).forEach(([addr,d])=>{
          if(!d||d.error||!isWalletChecked(addr))return;   // a failed read contributes nothing, not 0
          result.ptgc.balance+=d.ptgc.balance;
          result.ptgc.reflections+=d.ptgc.reflections;
          result.ptgc.staked+=d.ptgc.staked;
          result.ptgc.stakedOnly+=d.ptgc.stakedOnly;
          result.ptgc.locked+=d.ptgc.locked;
          result.ptgc.pendingStake+=d.ptgc.pendingStake;
          result.ptgc.pendingLocks+=d.ptgc.pendingLocks;
          result.ptgc.totalPending+=d.ptgc.totalPending;
          result.ptgc.claimed+=d.ptgc.claimed;
          result.ptgc.lockClaimed+=d.ptgc.lockClaimed;
          result.ptgc.lifetimeEarned+=d.ptgc.lifetimeEarned;
          result.ptgc.walletFree+=d.ptgc.walletFree;
          result.ptgc.totalHolding+=d.ptgc.totalHolding;
          result.ptgc.locks=[...result.ptgc.locks,...d.ptgc.locks];
          result.ufo.balance+=(d.ufo.balance||0); // a failed wallet read is null -> contributes 0 to the sum, not NaN
          /* a12: reflections — `undefined` = scan queued / running, `null` = the chain read failed
             (reflError says why), number = done. The TOTAL is only a number when every checked wallet
             has resolved: a sum over three of five wallets is not the portfolio's reflections. */
          if(d.ufo.reflections===undefined)ufoRefPending++;
          else if(d.ufo.reflections===null)ufoRefFailed++;
          else{ufoRefSum+=d.ufo.reflections;ufoRefAny=true;}
        });
        result.ufo.reflPending=ufoRefPending;result.ufo.reflFailed=ufoRefFailed;
        result.ufo.reflDone=ufoRefAny?1:0;
        if(ufoRefPending)result.ufo.reflState='pending';
        else if(ufoRefFailed)result.ufo.reflState='failed';
        else result.ufo.reflState='ok';
        result.ufo.reflections=result.ufo.reflState==='ok'?ufoRefSum:null;
        return result;
      },[portfolioData,checkedWallets]);
      
      const handleGetCode=()=>{
        const code=encodePortfolio(wallets);
        setGeneratedCode(code||'');
        setCodeCopied(false);
        setShowCodeModal(true);
      };
      
      const handleLoadCode=()=>{
        setCodeError('');
        const decoded=decodePortfolio(codeInput.trim());
        if(!decoded){setCodeError('Invalid portfolio code');return}
        if(!decoded.wallets.length){setCodeError(decoded.dropped?'That code holds no valid wallet addresses':'That code is empty');return}
        if(decoded.dropped)console.warn(`Load Code: ${decoded.dropped} entr${decoded.dropped===1?'y':'ies'} without a valid address skipped`);
        setWallets(decoded.wallets);
        setShowLoadModal(false);
        setCodeInput('');
        // Clear old data and refetch
        setPortfolioData({});
      };
      
      const copyCode=()=>{
        try{navigator.clipboard.writeText(generatedCode);setCodeCopied(true);setTimeout(()=>setCodeCopied(false),2000);}catch{}
      };
      
      const refreshAll=()=>{
        dropReflScans(null);   // a12: the queued scans belong to the data we are about to throw away
        setPortfolioData({});
        wallets.forEach(w=>fetchWalletData(w.address));
      };
      
      const truncAddr=a=>a?a.slice(0,6)+'...'+a.slice(-4):'';
      const dataLoaded=Object.keys(portfolioData).length>0;
      const anyLoading=Object.keys(loadingAddrs).length>0;
      
      // PTGC Donut data (non-overlapping segments)
      const ptgcDonut=[
        {label:'Liquid',value:agg.ptgc.walletFree},
        {label:'Staked (not locked)',value:agg.ptgc.stakedOnly},
        {label:'Locked & Staked',value:agg.ptgc.locked},
      ].filter(d=>d.value>0);
      const ptgcDonutColors=['#D9CA5D','#a855f7','#ec4899'];

        if(!endTime)return'—';

        if(endTime<=now)return'Unlockable';
        const diff=endTime-now;
        const days=Math.floor(diff/86400);
        if(days>365)return Math.floor(days/365)+'y '+Math.floor((days%365)/30)+'m';
        if(days>30)return Math.floor(days/30)+'m '+days%30+'d';
        return days+'d';
      };
      
      return(
        <div className="min-h-screen bg-[#0a0a0a]">
          {/* Header */}
          {hdrV2?<PortfolioHeaderV2 prices={prices} changes={changes} loading={initialLoad} onBack={onBack} onGetCode={handleGetCode} onLoadCode={()=>{setShowLoadModal(true);setCodeError('');setCodeInput('')}} onRefresh={refreshAll} hasWallets={wallets.length>0} navTo={pfNavTo}/>:(
          <header className="sticky top-0 z-50 bg-[#0a0a0a]/95 backdrop-blur border-b border-white/10">

                <div className="flex items-center gap-4">

                  <div className="flex items-center gap-3">

                      <img src={TOKENS.PTGC.logo} alt="PTGC" className="w-16 h-16 sm:w-20 sm:h-20" style={{filter:'drop-shadow(0 0 12px rgba(217,202,93,0.7)) drop-shadow(0 0 25px rgba(217,202,93,0.3))'}}/>
                    </div>
                    <div className="relative -ml-6">
                      <img src={TOKENS.UFO.logo} alt="UFO" className="w-16 h-16 sm:w-20 sm:h-20" style={{filter:'drop-shadow(0 0 12px rgba(124,252,0,0.7)) drop-shadow(0 0 25px rgba(124,252,0,0.3))'}}/>
                    </div>
                    <div>
                      <h1 className="font-orbitron text-3xl sm:text-4xl font-bold" style={{background:'linear-gradient(90deg,#D9CA5D,#7CFC00)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>PORTFOLIO</h1>
                      <div className="text-white/40 text-sm sm:text-base">Track your holdings across wallets</div>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  {wallets.length>0&&(
                    <>
                      <div className="relative group">
                        <button onClick={handleGetCode} className="px-4 py-2 rounded-lg border border-white/20 text-white/60 hover:text-white hover:border-white/40 text-base transition-all">{'\u{1F4CB}'} Get Code</button>
                        <div className="absolute top-full left-1/2 -translate-x-1/2 mt-2 px-3 py-2 bg-[#1a1a1a] border border-[#D9CA5D]/20 rounded-lg shadow-xl z-50 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                          <div className="absolute bottom-full left-1/2 -translate-x-1/2 w-0 h-0 border-l-[5px] border-r-[5px] border-b-[5px] border-transparent border-b-[#D9CA5D]/20"></div>
                          <div className="text-[#D9CA5D] font-bold text-xs mb-1">Backup Your Portfolio</div>
                          <div className="text-white/60 text-xs">Generates a unique code you can copy and<br/>save somewhere safe. If you ever clear your<br/>browser cache, use this code to instantly<br/>reload all your wallets.</div>
                        </div>

              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">No Liability:</span> The creators of this dashboard accept no responsibility or liability for any losses, damages, or decisions made based on information displayed here.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">Use at Your Own Risk:</span> By using this dashboard, you acknowledge that you understand these risks and agree to use it at your own discretion.
              </p>
            </div>
            
            <div className="flex flex-col gap-3">
              <button 
                onClick={onAccept}
                className="w-full py-3 px-6 bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-black font-bold rounded-lg transition-all text-lg"
              >
                I Understand & Accept
              </button>
              <p className="text-white/40 text-xs text-center">
                By clicking above, you agree to these terms. This message will not appear again.
              </p>
            </div>
          </div>
        </div>
      );
    };
    
    // ===== Standalone App =====
    const App=()=>{
      const goBack=()=>{
        // If we have browser history, go back naturally (preserves dashboard state)
        if(window.history.length>1){
          window.history.back();
        }else{
          // Fallback: try URL param, sessionStorage, localStorage, then home
          const fromToken=new URLSearchParams(window.location.search).get('from')
            ||(()=>{try{return sessionStorage.getItem('portfolio_from_token')}catch{return null}})()
            ||(()=>{try{return localStorage.getItem('ptgc_last_token')}catch{return null}})();
          window.location.href=fromToken?`index.html?token=${fromToken}`:'index.html';
        }
      };
      
      // Save the from token to sessionStorage as backup
      React.useEffect(()=>{
        const fromToken=new URLSearchParams(window.location.search).get('from');
        if(fromToken){try{sessionStorage.setItem('portfolio_from_token',fromToken)}catch{}}
      },[]);
      
      return <PortfolioBoundary><PortfolioPage onBack={goBack}/></PortfolioBoundary>;
    };

    /* a10: a render error used to unmount the whole tree — a black page with nothing to click.
       The boundary keeps the header and offers the two things that fix it: reload, or clear the saved
       wallet list (the one piece of state that can poison every later visit). */
    class PortfolioBoundary extends React.Component{
      constructor(p){super(p);this.state={error:null};}
      static getDerivedStateFromError(error){return{error};}
      componentDidCatch(error,info){console.error('Portfolio render error:',error,info&&info.componentStack);}
      render(){
        if(!this.state.error)return this.props.children;
        const msg=String(this.state.error&&this.state.error.message||this.state.error);
        return(
          <div className="min-h-screen flex items-center justify-center p-6">
            <div role="alert" className="max-w-md w-full text-center bg-[#111]/80 border border-white/10 rounded-2xl p-8">
              <div className="text-lg text-[#D9CA5D] font-bold mb-2">Something went wrong</div>
              <p className="text-white/60 text-sm mb-1">The portfolio page hit an error while drawing.</p>
              <p className="text-white/35 text-xs font-mono break-all mb-6">{msg}</p>
              <div className="flex flex-wrap justify-center gap-3">
                <button onClick={()=>window.location.reload()} className="px-5 py-2 rounded-xl border border-[#D9CA5D]/40 text-[#D9CA5D] font-semibold hover:bg-white/5">Reload</button>
                <button onClick={()=>{try{localStorage.removeItem(PORTFOLIO_STORAGE_KEY);}catch(e){}window.location.reload();}} className="px-5 py-2 rounded-xl border border-white/15 text-white/70 hover:bg-white/5">Clear saved wallets &amp; reload</button>
              </div>
            </div>
          </div>
        );
      }
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
