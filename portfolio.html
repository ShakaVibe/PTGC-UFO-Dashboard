
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grays Dashboard — Portfolio</title>
  <link rel="icon" type="image/png" href="07_Two_Color_Alien_Transparent.png">
  <link rel="apple-touch-icon" href="07_Two_Color_Alien_Transparent.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Rajdhani',sans-serif;background:#0a0a0a;min-height:100vh}
    .font-orbitron{font-family:'Orbitron',monospace}
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:#1a1a1a}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    .animate-pulse-slow{animation:pulse 1.5s ease-in-out infinite}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useState,useEffect,useMemo}=React;
    
    // ===== Minimal TOKENS config (logos and pair addresses needed by portfolio) =====
    const TOKENS={
      PTGC:{name:'PTGC',logo:'06_PTGC_V1_transparent_bg.png',mainPair:'0xf5A89A6487D62df5308CDDA89c566C5B5ef94C11'},
      UFO:{name:'UFO',logo:'07_Ufo_transparent.png',mainPair:'0xbeA0e55b82Eb975280041f3b49C4D0bD937b72d5'}
    };
    
    // ===== RPC & Helpers =====
    const RPC='https://rpc.pulsechain.com';
    const rpcFetch=async(body,timeout=8000)=>{
      try{
        const controller=new AbortController();
        const timeoutId=setTimeout(()=>controller.abort(),timeout);
        const res=await fetch(RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
        clearTimeout(timeoutId);
        return await res.json();
      }catch(e){
        console.error('RPC error:',e.message);
        return{result:null};
      }
    };
    
    const fmtUSD=n=>n==null||isNaN(n)?'\u2014':'$'+Math.floor(Number(n)).toLocaleString('en-US');
    const fmtComma=(n,dec=2)=>n==null||isNaN(n)?'\u2014':Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    const fmtDollar=(n,dec=2)=>n==null||isNaN(n)?'\u2014':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    const fmtAbbr=n=>{if(n==null||isNaN(n))return'\u2014';const num=Number(n);if(num>=1e12)return(num/1e12).toFixed(2)+'T';if(num>=1e9)return(num/1e9).toFixed(2)+'B';if(num>=1e6)return(num/1e6).toFixed(2)+'M';if(num>=1e3)return(num/1e3).toFixed(2)+'K';return Math.floor(num).toLocaleString('en-US')};
    const getLogo=a=>a?`https://dd.dexscreener.com/ds-data/tokens/pulsechain/${a.toLowerCase()}.png`:null;
    const fetchPLS=async()=>{try{const r=await fetch('https://api.dexscreener.com/latest/dex/pairs/pulsechain/0xe56043671df55de5cdf8459710433c10324de0ae');return parseFloat((await r.json()).pair?.priceUsd)||0.00005}catch{return 0.00005}};
    
    // ===== DonutChart Component =====
    const DonutChart=({data,colors,size=120})=>{
      const total=data.reduce((s,d)=>s+d.value,0);
      if(total===0)return<svg width={size} height={size}><circle cx={size/2} cy={size/2} r={size/2-10} fill="none" stroke="#333" strokeWidth={size*0.17}/></svg>;
      let cumulative=0;
      const r=size/2;
      const strokeWidth=r*0.35;
      const radius=r-strokeWidth/2;
      const circumference=2*Math.PI*radius;
      return(
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          {data.map((d,i)=>{
            const pct=total>0?(d.value/total)*100:0;
            const offset=circumference*(1-cumulative/100);
            const length=circumference*(pct/100);
            cumulative+=pct;
            return<circle key={i} cx={r} cy={r} r={radius} fill="none" stroke={colors[i%colors.length]} strokeWidth={strokeWidth} strokeDasharray={`${length} ${circumference-length}`} strokeDashoffset={offset} transform={`rotate(-90 ${r} ${r})`}/>;
          })}
          <circle cx={r} cy={r} r={radius-strokeWidth/2} fill="#0a0a0a"/>
        </svg>
      );
    };
    
    // ===== Portfolio Constants & Data Fetching =====
    const PORTFOLIO_STORAGE_KEY='ptgc_ufo_portfolio';
    const PTGC_TOKEN_ADDR='0x94534EeEe131840b1c0F61847c572228bdfDDE93';
    const PTGC_STAKING_ADDR='0xC71f597a2AC39E47F07102E849d18489C96f39EF';
    const UFO_TOKEN_ADDR='0x456548A9B56eFBbD89Ca0309edd17a9E20b04018';
    
    const SEL={
      balanceOf:'0x70a08231',totalSend:'0xc64a041b',totalReceived:'0x4df9cfb3',
      mapUserInfo:'0x15612933',lockCount:'0xdf034586',mapUserInfoLock:'0x1ce33368',
      pendingReward:'0xf40f0f52',pendingRewardLock:'0xddeecc24',
      pendingRewardLP:'0x9ced7e76',
      LPStaking:'0xa4731cdc',stakingInfo:'0x5750ec53',claimedReward:'0x1e6f3d8a',
      pairs:'0xb91ac788'
    };
    
    const padAddr=a=>a.slice(2).toLowerCase().padStart(64,'0');
    const padUint=n=>BigInt(n).toString(16).padStart(64,'0');
    const callContract=async(to,data)=>{
      const r=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to,data},'latest'],id:Math.floor(Math.random()*99999)});
      return r.result;
    };
    const parseWord=(hex,i=0)=>{
      if(!hex||hex==='0x'||hex.length<10)return 0n;
      const c=hex.slice(2);
      const s=i*64;
      const chunk=c.slice(s,s+64);
      return chunk?BigInt('0x'+(chunk||'0')):0n;
    };
    const toNum=(bigint,decimals=18)=>Number(bigint)/Math.pow(10,decimals);
    
    // Pair display names for UFO LP
    const UFO_PAIR_NAMES=['WPLS','PTGC','INC','PLSX','HEX','EHEX','DAI'];
    const UFO_PAIR_QUOTES={
      WPLS:{address:'0xA1077a294dDE1B09bB078844df40758a5D0f9a27',decimals:18},
      PTGC:{address:'0x94534EeEe131840b1c0F61847c572228bdfDDE93',decimals:18},
      INC:{address:'0x2fa878Ab3F87CC1C9737Fc071108F904c0B0C95d',decimals:18},
      PLSX:{address:'0x95B303987A60C71504D99Aa1b13B4DA07b0790ab',decimals:18},
      HEX:{address:'0x2b591e99afE9f32eAA6214f7B7629768c40Eeb39',decimals:8},
      EHEX:{address:'0x57fde0a71132198BBeC939B98976993d8D89D225',decimals:8},
      DAI:{address:'0xefD766cCb38EaF1dfd701853BFCe31359239F305',decimals:18}
    };
    
    // Encode portfolio to shareable code
    const encodePortfolio=(wallets)=>{
      try{
        const data=wallets.map(w=>({a:w.address.toLowerCase(),n:w.name||'',g:w.group||'Default'}));
        return'GRAY-'+btoa(JSON.stringify(data));
      }catch{return null}
    };
    
    // Sea Creature League Breakdown (Poseidon down to Turtle)
    const getHoldingCreatures=(tokenCount,tokenName)=>{
      const supply=tokenName==='PTGC'?333333333333:999999999051;
      const tiers=[
        {name:'Poseidon',emoji:'\u{1F531}',threshold:supply*0.10},
        {name:'Whale',emoji:'\u{1F40B}',threshold:supply*0.01},
        {name:'Shark',emoji:'\u{1F988}',threshold:supply*0.001},
        {name:'Dolphin',emoji:'\u{1F42C}',threshold:supply*0.0001},
        {name:'Squid',emoji:'\u{1F991}',threshold:supply*0.00001},
        {name:'Turtle',emoji:'\u{1F422}',threshold:supply*0.000001},
      ];
      let rem=tokenCount;
      const creatures=[];
      for(const tier of tiers){
        const count=Math.floor(rem/tier.threshold);
        if(count>0){
          creatures.push({emoji:tier.emoji,count,name:tier.name});
          rem=rem%tier.threshold;
        }
      }
      return creatures;
    };
    // Decode portfolio code
    const decodePortfolio=(code)=>{
      try{
        if(!code.startsWith('GRAY-'))return null;
        const data=JSON.parse(atob(code.slice(5)));
        return data.map(w=>({address:w.a,name:w.n||'',group:w.g||'Default'}));
      }catch{return null}
    };
    
    // Fetch all portfolio data for a single wallet
    const fetchPortfolioData=async(address,lpStakingAddr,ufoLpPairs)=>{
      const addr=padAddr(address);
      
      // ===== PTGC calls in parallel =====
      const[ptgcBal,ptgcSend,ptgcRecv,ptgcUserInfo,ptgcPendingStake,ptgcLockCountRes]=await Promise.all([
        callContract(PTGC_TOKEN_ADDR,SEL.balanceOf+addr),
        callContract(PTGC_TOKEN_ADDR,SEL.totalSend+addr),
        callContract(PTGC_TOKEN_ADDR,SEL.totalReceived+addr),
        callContract(PTGC_STAKING_ADDR,SEL.mapUserInfo+addr),
        callContract(PTGC_STAKING_ADDR,SEL.pendingReward+addr),
        callContract(PTGC_STAKING_ADDR,SEL.lockCount+addr),
      ]);
      
      const balance=toNum(parseWord(ptgcBal));
      const tSend=toNum(parseWord(ptgcSend));
      const tRecv=toNum(parseWord(ptgcRecv));
      const reflections=Math.max(0,balance+tSend-tRecv);
      
      // Parse mapUserInfo: amount, rewardDebt, startTime, claimed, lockClaimed, locked, pendingToClaimed
      const uiAmount=toNum(parseWord(ptgcUserInfo,0));
      const uiClaimed=toNum(parseWord(ptgcUserInfo,3));
      const uiLockClaimed=toNum(parseWord(ptgcUserInfo,4));
      const uiLocked=toNum(parseWord(ptgcUserInfo,5));
      const uiPendingToClaimed=toNum(parseWord(ptgcUserInfo,6));
      const pendingStake=toNum(parseWord(ptgcPendingStake))+uiPendingToClaimed;
      const staked=uiAmount; // total in staking contract (includes locked)
      const stakedOnly=Math.max(0,uiAmount-uiLocked); // staked but not locked (for donut)
      
      // Fetch lock details
      const lockCountNum=Number(parseWord(ptgcLockCountRes));
      let locks=[];
      let pendingLocks=0;
      if(lockCountNum>0){
        const lockPromises=[];
        for(let i=1;i<=lockCountNum;i++){
          lockPromises.push(
            Promise.all([
              callContract(PTGC_STAKING_ADDR,SEL.mapUserInfoLock+addr+padUint(i)),
              callContract(PTGC_STAKING_ADDR,SEL.pendingRewardLock+addr+padUint(i))
            ]).then(([info,pend])=>{
              const amt=toNum(parseWord(info,0));
              const startTime=Number(parseWord(info,1));
              const endTime=Number(parseWord(info,2));
              const pending=toNum(parseWord(pend));
              if(amt>0)return{id:i,amount:amt,startTime,endTime,pending};
              return null;
            })
          );
        }
        const lockResults=await Promise.all(lockPromises);
        locks=lockResults.filter(Boolean);
        pendingLocks=locks.reduce((s,l)=>s+l.pending,0);
      }
      
      // ===== UFO calls in parallel =====
      const[ufoBal,ufoSend,ufoRecv]=await Promise.all([
        callContract(UFO_TOKEN_ADDR,SEL.balanceOf+addr),
        callContract(UFO_TOKEN_ADDR,SEL.totalSend+addr),
        callContract(UFO_TOKEN_ADDR,SEL.totalReceived+addr),
      ]);
      
      const ufoBalance=toNum(parseWord(ufoBal));
      const ufoTSend=toNum(parseWord(ufoSend));
      const ufoTRecv=toNum(parseWord(ufoRecv));
      const ufoReflections=Math.max(0,ufoBalance+ufoTSend-ufoTRecv);
      
      // ===== UFO LP Staking calls =====
      let lpPositions=[];
      let totalPendingPLS=0;
      let lifetimePLS=0;
      
      if(lpStakingAddr&&ufoLpPairs.length>0){
        const lpPromises=ufoLpPairs.map((pool,i)=>
          Promise.all([
            callContract(lpStakingAddr,SEL.stakingInfo+addr+padAddr(pool)),
            callContract(lpStakingAddr,SEL.pendingRewardLP+addr+padAddr(pool))
          ]).then(([info,pend])=>{
            const stakedLP=toNum(parseWord(info,0));
            const stakedUFO=toNum(parseWord(info,1));
            const storedPending=toNum(parseWord(info,3));
            const calcPending=toNum(parseWord(pend));
            const totalPending=calcPending+storedPending;
            // Convert pending from wei (PLS uses 18 decimals, and these are PLS amounts in wei)
            if(stakedLP>0)return{pool,symbol:UFO_PAIR_NAMES[i]||'Unknown',stakedLP,stakedUFO,pendingPLS:totalPending};
            return null;
          })
        );
        const claimedRes=await callContract(lpStakingAddr,SEL.claimedReward+addr);
        lifetimePLS=toNum(parseWord(claimedRes));
        
        const lpResults=await Promise.all(lpPromises);
        lpPositions=lpResults.filter(Boolean);
        totalPendingPLS=lpPositions.reduce((s,l)=>s+l.pendingPLS,0);
      }
      
      return{
        ptgc:{
          balance,reflections,
          staked,stakedOnly,locked:uiLocked,
          pendingStake,pendingLocks,
          totalPending:pendingStake+pendingLocks,
          claimed:uiClaimed,lockClaimed:uiLockClaimed,
          lifetimeEarned:uiClaimed+uiLockClaimed,
          locks,
          // For donut: wallet free = balance - staked amount shown in staking contract  
          // Actually balance from balanceOf already includes locked/staked tokens (they're locked in the wallet, not transferred)
          // So: walletFree = balance - uiAmount (staked+locked)
          walletFree:Math.max(0,balance-uiAmount),
          totalHolding:balance, // balanceOf gives everything including staked/locked
        },
        ufo:{
          balance:ufoBalance,reflections:ufoReflections,
          lpPositions,totalPendingPLS,lifetimePLS,
          totalStakedUFO:lpPositions.reduce((s,l)=>s+l.stakedUFO,0),
        }
      };
    };
    
    // ===== Portfolio Leagues Modal =====
    const PortfolioLeaguesModal=({token,price,close})=>{
      const isPTGC=token==='PTGC';
      const pc=isPTGC?'#D9CA5D':'#7CFC00';
      const supply=isPTGC?333333333333:999999999051;
      const logo=isPTGC?TOKENS.PTGC.logo:TOKENS.UFO.logo;
      const now=new Date();
      const date=`${now.getMonth()+1}-${now.getDate()}-${String(now.getFullYear()).slice(-2)}`;
      const tiers=[
        {name:'Poseidon',emoji:'\u{1F531}',pct:0.10},
        {name:'Whale',emoji:'\u{1F40B}',pct:0.01},
        {name:'Shark',emoji:'\u{1F988}',pct:0.001},
        {name:'Dolphin',emoji:'\u{1F42C}',pct:0.0001},
        {name:'Squid',emoji:'\u{1F991}',pct:0.00001},
        {name:'Turtle',emoji:'\u{1F422}',pct:0.000001},
        {name:'Shrimp',emoji:'\u{1F990}',pct:0.0000001},
        {name:'Shell',emoji:'\u{1F41A}',pct:0.00000001},
      ];
      const formatTokenPrice=(p)=>{
        if(!p||p===0)return'\u2014';
        if(isPTGC){
          if(p>=1)return'$'+p.toFixed(2);
          return'$'+p.toFixed(6);
        }else{
          if(p>=1)return'$'+p.toFixed(2);
          if(p>=0.01)return'$'+p.toFixed(4);
          const s=p.toExponential(4);
          const[m,e]=s.split('e');
          const exp=Math.abs(parseInt(e));
          return<span>$0.0<sub style={{fontSize:'0.6em'}}>{exp-1}</sub>{parseFloat(m).toFixed(4).replace('.','').slice(0,4)}</span>;
        }
      };
      const formatTablePrice=(val)=>{
        if(!val||isNaN(val)||val===0)return'\u2014';
        if(val>=1)return'$'+Math.floor(val).toLocaleString();
        return'$'+val.toFixed(2);
      };
      return(
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" style={{backdropFilter:'blur(8px)'}} onClick={close}>
          <div className="bg-[#0a0a0a] border-2 rounded-2xl max-w-lg w-full overflow-hidden" style={{borderColor:pc}} onClick={e=>e.stopPropagation()}>
            <div className="p-6 text-center" style={{background:`linear-gradient(180deg, ${pc}20 0%, transparent 100%)`}}>
              <div className="flex justify-center mb-4">
                <div className="w-28 h-28 rounded-full flex items-center justify-center" style={{background:`${pc}20`,border:`4px solid ${pc}`}}>
                  <img src={logo} alt={token} className="w-24 h-24 object-contain"/>
                </div>
              </div>
              <div className="font-orbitron text-2xl font-bold mb-1" style={{color:pc}}>{token} LEAGUES</div>
              <div className="text-white/50 text-base">Price {date}: <span className="font-bold" style={{color:pc}}>{formatTokenPrice(price)}</span></div>
            </div>
            <div className="px-6 pb-2">
              <table className="w-full">
                <thead>
                  <tr className="text-sm uppercase border-b border-white/10">
                    <th className="text-left pb-2 text-white/40"></th>
                    <th className="text-left pb-2 text-white/40"></th>
                    <th className="text-right pb-2" style={{color:pc}}>Tokens</th>
                    <th className="text-right pb-2" style={{color:pc}}>USD Value</th>
                  </tr>
                </thead>
                <tbody>
                  {tiers.map((tier,i)=>{
                    const threshold=supply*tier.pct;
                    return(
                      <tr key={i} className="border-t border-white/10">
                        <td className="py-2 text-2xl">{tier.emoji}</td>
                        <td className="py-2 text-lg font-semibold text-white">{tier.name}</td>
                        <td className="py-2 text-right text-base text-white/70">{fmtAbbr(threshold)}</td>
                        <td className="py-2 text-right text-base text-green-400 font-bold">{formatTablePrice(threshold*price)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div className="p-6 pt-3">
              <button onClick={close} className="w-full py-3 rounded-lg font-bold text-lg text-black transition-colors" style={{background:pc}}>Close</button>
            </div>
          </div>
        </div>
      );
    };

    const PortfolioPage=({onBack})=>{
      const[wallets,setWallets]=useState(()=>{
        try{const s=localStorage.getItem(PORTFOLIO_STORAGE_KEY);return s?JSON.parse(s):[];}catch{return[]}
      });
      const[inputAddr,setInputAddr]=useState('');
      const[inputName,setInputName]=useState('');
      const[inputGroup,setInputGroup]=useState('Default');
      const[portfolioData,setPortfolioData]=useState({});
      const[loading,setLoading]=useState(false);
      const[loadingAddr,setLoadingAddr]=useState(null);
      const[prices,setPrices]=useState({ptgc:0,ufo:0,pls:0});
      const[lpStakingAddr,setLpStakingAddr]=useState(null);
      const[ufoLpPairs,setUfoLpPairs]=useState([]);
      const[lpPoolData,setLpPoolData]=useState({});
      const[codeInput,setCodeInput]=useState('');
      const[showCodeModal,setShowCodeModal]=useState(false);
      const[showLoadModal,setShowLoadModal]=useState(false);
      const[generatedCode,setGeneratedCode]=useState('');
      const[codeCopied,setCodeCopied]=useState(false);
      const[codeError,setCodeError]=useState('');
      const[editGroup,setEditGroup]=useState(null);
      const[newGroupName,setNewGroupName]=useState('');
      const[initialLoad,setInitialLoad]=useState(true);
      const[checkedWallets,setCheckedWallets]=useState({});
      const[editingWallet,setEditingWallet]=useState(null);
      const[editWalletName,setEditWalletName]=useState('');
      const[showWalletBreakdown,setShowWalletBreakdown]=useState(false);
      const[moonMathActive,setMoonMathActive]=useState(false);
      const[customPrices,setCustomPrices]=useState({ptgc:'',ufo:'',pls:''});
      const[showPtgcLeagues,setShowPtgcLeagues]=useState(false);
      const[showUfoLeagues,setShowUfoLeagues]=useState(false);
      
      const ATH_PRICES={ptgc:0.00133,ufo:0.000113,pls:0.00029};
      
      // Display prices: use custom when moonMath active and field has value, else live
      const dp={
        ptgc:moonMathActive&&customPrices.ptgc!==''?parseFloat(customPrices.ptgc)||0:prices.ptgc,
        ufo:moonMathActive&&customPrices.ufo!==''?parseFloat(customPrices.ufo)||0:prices.ufo,
        pls:moonMathActive&&customPrices.pls!==''?parseFloat(customPrices.pls)||0:prices.pls
      };
      
      // Save to localStorage whenever wallets change
      useEffect(()=>{
        try{localStorage.setItem(PORTFOLIO_STORAGE_KEY,JSON.stringify(wallets));}catch{}
      },[wallets]);
      
      // On mount: fetch prices and LP staking address
      useEffect(()=>{
        const init=async()=>{
          // Fetch prices
          const[ptgcRes,ufoRes,plsPrice]=await Promise.all([
            fetch('https://api.dexscreener.com/latest/dex/pairs/pulsechain/'+TOKENS.PTGC.mainPair).then(r=>r.json()).catch(()=>null),
            fetch('https://api.dexscreener.com/latest/dex/pairs/pulsechain/'+TOKENS.UFO.mainPair).then(r=>r.json()).catch(()=>null),
            fetchPLS()
          ]);
          const ptgcPrice=parseFloat(ptgcRes?.pair?.priceUsd)||0;
          const ufoPrice=parseFloat(ufoRes?.pair?.priceUsd)||0;
          setPrices({ptgc:ptgcPrice,ufo:ufoPrice,pls:plsPrice});
          
          // Fetch LP Staking address from UFO token
          try{
            const lpAddr=await callContract(UFO_TOKEN_ADDR,SEL.LPStaking);
            if(lpAddr&&lpAddr!=='0x'&&lpAddr.length>=42){
              const addr='0x'+lpAddr.slice(-40);
              setLpStakingAddr(addr);
              console.log('LP Staking address:',addr);
              
              // Fetch all 7 pair addresses
              const pairPromises=[];
              for(let i=0;i<7;i++){
                pairPromises.push(callContract(addr,SEL.pairs+padUint(i)).then(r=>{
                  if(r&&r!=='0x')return'0x'+r.slice(-40);
                  return null;
                }).catch(()=>null));
              }
              const pairResults=await Promise.all(pairPromises);
              const validPairs=pairResults.filter(Boolean);
              setUfoLpPairs(validPairs);
              console.log('UFO LP pairs:',validPairs);
              
              // Fetch LP pool reserves (UFO + quote token balances + LP total supply)
              try{
                const reservePromises=validPairs.map((pool,i)=>{
                  const sym=UFO_PAIR_NAMES[i];
                  const quote=UFO_PAIR_QUOTES[sym];
                  if(!quote)return Promise.resolve(null);
                  return Promise.all([
                    callContract(UFO_TOKEN_ADDR,SEL.balanceOf+padAddr(pool)),
                    callContract(quote.address,SEL.balanceOf+padAddr(pool)),
                    callContract(pool,'0x18160ddd')
                  ]).then(([ufoRes,quoteRes,supplyRes])=>({
                    symbol:sym,

                                  {hasPosition&&(()=>{
                                    const pool=lpPoolData[sym];
                                    const shareRatio=pool&&pool.totalLPSupply>0?(lp.stakedLP/pool.totalLPSupply):0;
                                    const userUFO=pool?shareRatio*pool.ufoInPool:0;
                                    const userQuote=pool?shareRatio*pool.quoteInPool:0;
                                    return(
                                    <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-4 py-3 bg-[#1a1a1a] border border-[#7CFC00]/20 rounded-lg shadow-xl z-50 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                                      <div className="text-[#7CFC00] font-bold text-sm mb-2">UFO/{pairDisplayNames[sym]} LP Details</div>
                                      <div className="space-y-1">
                                        <div className="text-white/60 text-sm">UFO Share Rate: <span className="text-[#7CFC00] font-medium">{fmtAbbr(lp.stakedUFO)} UFO</span></div>
                                        {userUFO>0&&<div className="text-white/60 text-sm">Your UFO in LP: <span className="text-white font-medium">{fmtAbbr(userUFO)} UFO</span></div>}
                                        {userQuote>0&&<div className="text-white/60 text-sm">Your {pairDisplayNames[sym]} in LP: <span className="text-white font-medium">{fmtAbbr(userQuote)} {pairDisplayNames[sym]}</span></div>}
                                      </div>
                                      <div className="absolute top-full left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-t-[6px] border-transparent border-t-[#7CFC00]/20"></div>
                                    </div>
                                    );
                                  })()}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })()}
                    
                  </div>
                </div>
              </div>
              
              {/* Per-Wallet Breakdown (when multiple wallets) */}
              {wallets.length>1&&(
                <div className="mt-6">
                  <button onClick={()=>setShowWalletBreakdown(!showWalletBreakdown)} className="flex items-center gap-3 w-full text-left mb-3 group">
                    <h3 className="font-orbitron text-xl font-bold group-hover:opacity-80 transition-opacity" style={{background:'linear-gradient(90deg,#D9CA5D,#7CFC00)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>PER-WALLET BREAKDOWN</h3>
                    <span className="text-white/50 text-base">({wallets.filter(w=>isWalletChecked(w.address)).length} wallets)</span>
                    <span className={`text-white/40 text-lg transition-transform ${showWalletBreakdown?'rotate-180':''}`}>{'\u25BC'}</span>
                  </button>
                  {showWalletBreakdown&&(
                  <div className="space-y-3">
                    {wallets.filter(w=>isWalletChecked(w.address)).map(w=>{
                      const addr=w.address.toLowerCase();
                      const d=portfolioData[addr];
                      if(!d)return null;
                      return(
                        <div key={addr} className="bg-[#111]/80 border border-white/10 rounded-xl p-5">
                          <div className="flex items-center gap-3 mb-3">
                            <span className="w-3 h-3 rounded-full bg-green-400"></span>
                            <span className="text-white font-medium text-lg">{w.name||truncAddr(w.address)}</span>
                            <span className="text-white/40 font-mono text-base">{truncAddr(w.address)}</span>
                            <span className="text-white/30 text-sm px-2 py-0.5 rounded bg-white/5">{w.group}</span>
                            <button onClick={()=>{setEditingWallet(addr);setEditWalletName(w.name||'')}} className="text-white/30 hover:text-[#D9CA5D] text-sm ml-auto transition-colors">{'\u270F\uFE0F'} Edit</button>
                          </div>
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <div className="bg-black/30 rounded-lg p-3">
                              <div className="text-[#D9CA5D]/60 text-base">PTGC Total</div>
                              <div className="text-[#D9CA5D] font-bold text-xl">{fmtAbbr(d.ptgc.totalHolding)}</div>
                              <div className="text-white/40 text-base">{fmtDollar(d.ptgc.totalHolding*dp.ptgc)}</div>
                            </div>
                            <div className="bg-black/30 rounded-lg p-3">
                              <div className="text-[#D9CA5D]/60 text-base">PTGC Pending</div>
                              <div className="text-green-400 font-bold text-xl">{fmtAbbr(d.ptgc.totalPending)}</div>
                              <div className="text-white/40 text-base">{fmtDollar(d.ptgc.totalPending*dp.ptgc)}</div>
                            </div>
                            <div className="bg-black/30 rounded-lg p-3">
                              <div className="text-[#7CFC00]/60 text-base">UFO Balance</div>
                              <div className="text-[#7CFC00] font-bold text-xl">{fmtAbbr(d.ufo.balance)}</div>
                              <div className="text-white/40 text-base">{fmtDollar(d.ufo.balance*dp.ufo)}</div>
                            </div>
                            <div className="bg-black/30 rounded-lg p-3">
                              <div className="text-blue-400/60 text-base">PLS Pending</div>
                              <div className="text-blue-400 font-bold text-xl">{fmtComma(d.ufo.totalPendingPLS)}</div>
                              <div className="text-white/40 text-base">{fmtDollar(d.ufo.totalPendingPLS*dp.pls)}</div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  )}
                </div>
              )}
            </div>
          )}
          
          {/* Get Code Modal */}
          {showCodeModal&&(
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" onClick={()=>setShowCodeModal(false)}>
              <div className="bg-[#111] border border-[#D9CA5D]/30 rounded-2xl max-w-lg w-full p-6" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold text-[#D9CA5D]">{'\u{1F4CB}'} Portfolio Code</h2>
                  <button onClick={()=>setShowCodeModal(false)} className="text-white/60 hover:text-white text-2xl">{'\u00D7'}</button>
                </div>
                <p className="text-white/60 text-base mb-3">Save this code to restore your portfolio on any device:</p>
                <div className="bg-black/50 border border-white/10 rounded-lg p-4 mb-4">
                  <code className="text-[#D9CA5D] text-sm font-mono break-all select-all">{generatedCode}</code>
                </div>
                <button onClick={copyCode} className={`w-full py-2.5 rounded-lg font-bold transition-all ${codeCopied?'bg-green-500 text-black':'bg-[#D9CA5D] text-black hover:opacity-90'}`}>
                  {codeCopied?'\u2713 Copied!':'Copy to Clipboard'}
                </button>
              </div>
            </div>
          )}
          
          {/* Load Code Modal */}
          {showLoadModal&&(
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" onClick={()=>setShowLoadModal(false)}>
              <div className="bg-[#111] border border-[#D9CA5D]/30 rounded-2xl max-w-lg w-full p-6" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold text-[#D9CA5D]">{'\u{1F4E5}'} Load Portfolio</h2>
                  <button onClick={()=>setShowLoadModal(false)} className="text-white/60 hover:text-white text-2xl">{'\u00D7'}</button>
                </div>
                <p className="text-white/60 text-base mb-3">Paste your portfolio code below:</p>
                <input value={codeInput} onChange={e=>setCodeInput(e.target.value)} placeholder="GRAY-..." className="w-full bg-black/50 border border-white/20 rounded-lg px-4 py-3 text-white font-mono text-base placeholder-white/30 focus:border-[#D9CA5D]/50 focus:outline-none mb-3" onKeyDown={e=>e.key==='Enter'&&handleLoadCode()}/>
                {codeError&&<div className="text-red-400 text-base mb-3">{codeError}</div>}
                <button onClick={handleLoadCode} className="w-full py-3 rounded-lg font-bold text-lg bg-gradient-to-r from-[#D9CA5D] to-[#7CFC00] text-black hover:opacity-90 transition-all">Load Portfolio</button>
                <p className="text-white/40 text-sm text-center mt-3">This will replace your current portfolio</p>
              </div>
            </div>
          )}
          
          {/* Edit Wallet Modal */}
          {editingWallet&&(
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" onClick={()=>setEditingWallet(null)}>
              <div className="bg-[#111] border border-[#D9CA5D]/30 rounded-2xl max-w-lg w-full p-6" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold text-[#D9CA5D]">{'\u270F\uFE0F'} Edit Wallet</h2>
                  <button onClick={()=>setEditingWallet(null)} className="text-white/60 hover:text-white text-2xl">{'\u00D7'}</button>
                </div>
                <div className="mb-4">
                  <div className="text-white/40 text-sm uppercase mb-1">Wallet Address</div>
                  <div className="bg-black/50 border border-white/10 rounded-lg px-4 py-2.5 text-white/70 font-mono text-sm break-all select-all">{wallets.find(w=>w.address.toLowerCase()===editingWallet)?.address||editingWallet}</div>
                </div>
                <div className="mb-5">
                  <div className="text-white/40 text-sm uppercase mb-1">Label</div>
                  <input value={editWalletName} onChange={e=>setEditWalletName(e.target.value)} placeholder="Enter a name for this wallet..." className="w-full bg-black/50 border border-white/20 rounded-lg px-4 py-3 text-white text-base placeholder-white/30 focus:border-[#D9CA5D]/50 focus:outline-none" autoFocus onKeyDown={e=>e.key==='Enter'&&saveEditWallet()}/>
                </div>
                <div className="flex gap-3">
                  <button onClick={()=>setEditingWallet(null)} className="flex-1 py-2.5 rounded-lg font-bold text-base bg-white/10 text-white hover:bg-white/20 transition-all">Cancel</button>
                  <button onClick={saveEditWallet} className="flex-1 py-2.5 rounded-lg font-bold text-base bg-gradient-to-r from-[#D9CA5D] to-[#7CFC00] text-black hover:opacity-90 transition-all">Save</button>
                </div>
              </div>
            </div>
          )}
          
          {/* PTGC Leagues Modal */}
          {showPtgcLeagues&&(
            <PortfolioLeaguesModal token="PTGC" price={dp.ptgc||prices.ptgc} close={()=>setShowPtgcLeagues(false)}/>
          )}
          
          {/* UFO Leagues Modal */}
          {showUfoLeagues&&(
            <PortfolioLeaguesModal token="UFO" price={dp.ufo||prices.ufo} close={()=>setShowUfoLeagues(false)}/>
          )}
          
          {/* Footer */}
          <footer className="text-center py-6 border-t border-white/10 mt-4">
            <p className="text-white/30 text-sm">Portfolio data is read directly from the PulseChain blockchain. Not financial advice.</p>
            <p className="text-white/25 text-sm mt-1">Your portfolio is saved locally in your browser.</p>
          </footer>
        </div>
      );
    };
    
    // DAO Ledger Page - Hidden Feature
    // Disclaimer Modal Component
    const DisclaimerModal=({onAccept})=>{
      return(
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/95">
          <div className="bg-[#111] border border-yellow-500/30 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <div className="text-center mb-6">
              <div className="text-4xl mb-3">⚠️</div>
              <h2 className="text-2xl font-bold text-yellow-400 font-orbitron">Disclaimer</h2>
            </div>
            
            <div className="space-y-4 text-white/80 text-sm mb-6">
              <p>
                <span className="text-yellow-400 font-semibold">Community Project:</span> This dashboard is built by and for the community. It is not an official product and is not affiliated with or endorsed by any token team or project.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">No Guarantees:</span> While we strive for accuracy, we cannot guarantee that all data displayed is correct, complete, or up-to-date. Data is sourced from third-party APIs and blockchain queries which may contain errors or delays.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">Not Financial Advice:</span> Nothing on this site constitutes financial, investment, legal, or tax advice. Always do your own research (DYOR) before making any investment decisions.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">No Liability:</span> The creators of this dashboard accept no responsibility or liability for any losses, damages, or decisions made based on information displayed here.
              </p>
              
              <p>
                <span className="text-yellow-400 font-semibold">Use at Your Own Risk:</span> By using this dashboard, you acknowledge that you understand these risks and agree to use it at your own discretion.
              </p>
            </div>
            
            <div className="flex flex-col gap-3">
              <button 
                onClick={onAccept}
                className="w-full py-3 px-6 bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-black font-bold rounded-lg transition-all text-lg"
              >
                I Understand & Accept
              </button>
              <p className="text-white/40 text-xs text-center">
                By clicking above, you agree to these terms. This message will not appear again.
              </p>
            </div>
          </div>
        </div>
      );
    };
    
    // ===== Standalone App =====
    const App=()=>{
      const goBack=()=>{
        // If we have browser history, go back naturally (preserves dashboard state)
        if(window.history.length>1){
          window.history.back();
        }else{
          // Fallback: try URL param, sessionStorage, localStorage, then home
          const fromToken=new URLSearchParams(window.location.search).get('from')
            ||(()=>{try{return sessionStorage.getItem('portfolio_from_token')}catch{return null}})()
            ||(()=>{try{return localStorage.getItem('ptgc_last_token')}catch{return null}})();
          window.location.href=fromToken?`index.html?token=${fromToken}`:'index.html';
        }
      };
      
      // Save the from token to sessionStorage as backup
      React.useEffect(()=>{
        const fromToken=new URLSearchParams(window.location.search).get('from');
        if(fromToken){try{sessionStorage.setItem('portfolio_from_token',fromToken)}catch{}}
      },[]);
      
      return <PortfolioPage onBack={goBack}/>;
    };
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
