name: Data Pipeline (hourly)

# ONE scheduled workflow for every data file the site reads (roadmap a29, 2026-09-17).
#
# Why: this repo used to ask GitHub for ~190 scheduled runs a day across nine workflows, and
# GitHub answered by delaying every schedule event by 4–5 hours — the Actions log for Sep 15–17
# shows each "hourly" job actually running about five times a day, and the "every 6 h" jobs
# firing at 04:29 / 11:18 / 16:38. Every run that DID start succeeded; the runs were simply not
# being created. One hourly workflow asks for 24 runs a day instead.
#
# How it works:
#   * Every step runs in the order its data needs (charts before coingecko, treasury before
#     dao-buys). Steps that used to run every 2 h / 6 h are gated on the AGE OF THEIR FILE
#     (scripts/pipeline-gate.mjs) rather than the clock, so a delayed run never skips a window.
#   * A source that is down must not stop the others from landing (scripts/pipeline-run.mjs runs
#     them in three parallel lanes and goes on past a failure). The last step then FAILS the run if
#     anything failed, so the workflow still goes red — the job summary names the step and quotes
#     its last lines.
#   * One commit per run, adding only the files these scripts own.
#   * "Run workflow" (workflow_dispatch) takes `only=` to run a subset by hand after editing a
#     script (the handover's step 4), and `force=true` to ignore the age gates.
#
# Retired by this file (their schedules were the problem): build-charts-data, build-token-
# allocation, build-value-generated, fetch-coingecko-data, fetch-treasury, fetch-ufo-ptgc-burns,
# lv-snapshot, update-burn-history. update-metrics.yml is retired too: data/metrics-history.json
# is read by nothing on the site and the script targets the retired UFO contract (a65).
# deploy.yml is untouched — data commits use GITHUB_TOKEN and never trigger it.

on:
  schedule:
    - cron: '37 * * * *'  # the FALLBACK, at :37 — the real hourly beat is the ptgcapi Worker's cron at :07, which dispatches
                          # this workflow (handover/ptgcapi-worker-v7.js). GitHub creates only ~4 of these a day, but when it
                          # does, the hour used to run twice (same minute as the Worker — three pairs on Oct 6–7, c18); now
                          # it is half an hour off AND the "Fresh enough?" step stands down when the last run is < 45 min old.
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only these steps, comma-separated: charts, charts-intraday, coingecko, value-generated, burn-history, treasury, dao-buys, ufo-ptgc-burns, token-allocation, lv-snapshot, pair-volume, new-holders, swap-volume. Empty = the normal hourly set.'
        required: false
        default: ''
      force:
        description: 'Ignore the file-age gates (run the 2 h / 6 h steps now)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false   # a slow run finishes; the next hour waits behind it

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # three parallel lanes, ~6–7 min on a normal hour (was twelve serial steps, ~22 min)
    env:
      ONLY:  ${{ github.event.inputs.only }}
      FORCE: ${{ github.event.inputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ---------- c18 (Audit III): on GitHub's own schedule, stand down when the Worker's dispatch already ran this hour ----------
      # The last run's stamp is data/pipeline-status.json (c20), else burn-summary.json's lastUpdated. Dispatches and manual
      # runs never stand down.
      - name: Fresh enough? (schedule events only)
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          node -e '
            const fs = require("fs"); let at = null;
            try { at = Date.parse(JSON.parse(fs.readFileSync("data/pipeline-status.json", "utf8")).generatedAt); } catch (e) {}
            if (!at) { try { at = Date.parse(JSON.parse(fs.readFileSync("data/burn-summary.json", "utf8")).lastUpdated); } catch (e) {} }
            const min = at ? Math.round((Date.now() - at) / 60000) : null;
            const skip = min != null && min < 45;
            console.log(skip ? `last run ${min} min ago — the Worker is on the beat, standing down` : `last run ${min == null ? "unknown" : min + " min ago"} — running`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          '

      # ---------- every step, in three parallel lanes (scripts/pipeline-run.mjs, 2026-10-06) ----------
      # The gates (file age, not clock — scripts/pipeline-gate.mjs), `only=` and `force=` are honoured
      # inside; a failing step never stops the others; the summary lands in $RUNNER_TEMP for the report.
      - name: Run the pipeline (coingecko-key lane · rpc lane · pair-volume lane)
        id: run
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/pipeline-run.mjs
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # ---------- one commit, only the files the steps above own ----------
      - name: Commit if changed (rebase + retry)
        if: always() && steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the files the steps above own. A path is included when it exists on disk OR is
          # tracked (so a deletion is staged too); a file that a gated step has not created yet
          # is skipped instead of failing `git add` with "pathspec did not match".
          add=""
          for f in \
            data/charts-data.json data/charts-intraday.json \
            data/coingecko-data.json data/liquidity-history.json data/transaction-history.json data/tokensinlp-history.json \
            data/value-generated.json \
            data/burn-summary.json data/ufo-burns.json data/holder-history.json \
            data/treasury-summary.json data/treasury-wallet1-txns.json data/treasury-wallet1-tokens.json \
            data/treasury-wallet2-txns.json data/treasury-wallet2-tokens.json data/treasury-recent.json \
            data/dao-buys.json \
            data/ufo-ptgc-burns.json data/ufo-ptgc-burns-cache.json \
            data/token-allocation.json \
            data/lv-snapshots.json data/lv-latest.json \
            data/pair-volume-7d.json \
            data/new-holders.json \
            data/swap-volume.json data/swap-volume-cache.json \
            data/pipeline-status.json; do
            if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then add="$add $f"; fi
          done
          # shellcheck disable=SC2086
          git add -A -- $add 'data/ptgc-burns-*.json'   # the quoted glob is matched by git, so a removed period file is staged as a deletion
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "data: hourly pipeline $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          # The remote can still move under us (Shaka's pushes), so rebase our one data commit
          # onto whatever landed and push; retry with jitter. '-X theirs' keeps THIS run's
          # freshly generated files if a data path ever conflicts — nothing else writes them.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" \
              && git push origin "${GITHUB_REF_NAME}" \
              && { echo "pushed on attempt $i"; exit 0; }
            echo "push attempt $i failed; retrying…"
            sleep $((RANDOM % 8 + 2))
          done
          echo "ERROR: could not push after 5 attempts"
          exit 1

      # ---------- go red if any source failed, AFTER the good files have landed ----------
      # The job summary gets a table (step · lane · outcome · time · the failing step's last lines).
      - name: Report step failures
        if: always() && steps.fresh.outputs.skip != 'true'
        run: node scripts/pipeline-run.mjs --report
