name: Deploy to GitHub Pages

on:
  # Deploy only when the SITE ITSELF changes (a human push to main) or on demand.
  #
  # The data files (data/*.json) are read LIVE by the frontend from
  # raw.githubusercontent.com/.../main/data/, so they do NOT need a deploy to
  # refresh. That's why the old per-data-workflow triggers were removed: they
  # republished the exact same static site dozens of times an hour, which made
  # GitHub Pages intermittently reject deployments with "try again later".
  #
  # Note: commits pushed by the data workflows use GITHUB_TOKEN, which by design
  # does NOT re-trigger workflows — so those data commits won't fire this deploy,
  # and they don't need to. Your own code commits (pushed as you) DO fire it.
  push:
    branches: [main]
  workflow_dispatch:
  # Optional safety net: one rebuild a day so the published HTML never drifts
  # from the repo even if a push event is ever missed. Remove if you don't want it.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One Pages deployment at a time; queue a new one behind the running deploy and
  # skip intermediate queued runs. Never cancel an in-progress deploy.
  group: "pages"
  cancel-in-progress: false

jobs:
  # Audit IV e20 (2026-10-23): a page that does not compile is a BLANK site. This compiles every page (~15 s) and the deploy below
  # waits for it — a broken edit never reaches ptgc-ufo.com; the site stays on the last good version and GitHub e-mails the failure.
  # Audit VI item 4 (2026-10-28): compiling is not enough — a page that compiles but throws at mount (a renamed const, a hook
  # misuse) was deployed blank and only Site check e-mailed about it two minutes later. The gate now also MOUNTS index.html's
  # routes (home, #/ptgc, #/ufo, #/affiliates, #/ptgc at 390 px) in headless Chromium with the data APIs stubbed, exactly as
  # site-check.yml does (same Playwright image, same tools/harness). ~2 min instead of ~25 s; the sibling pages stay on Site check.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright:v1.47.0-jammy   # ships the Chromium that playwright-core 1.47.0 drives
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the harness
        working-directory: tools/harness
        run: npm install --no-audit --no-fund

      - name: Compile every page
        working-directory: tools/harness
        run: node compile.js

      - name: Mount the dashboard routes
        working-directory: tools/harness
        run: |
          npx tailwindcss -c tailwind.config.js -i tw.in.css -o tw.out.css > /dev/null 2>&1   # the harness's own stylesheet (tw.css itself is untouched; Site check verifies that one)
          export CHROME="$(ls -d /ms-playwright/chromium-*/chrome-linux/chrome | head -1)"
          ONLY=home,ptgc,ufo,affiliates,ptgc-390 node ci-mount.js

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # a38 (2026-09-17): publish the SITE, not the checkout. Uploading '.' put handover/ (the
      # working notes, including the account-hardening ones), tools/, scripts/ and 200+ MB of
      # burn archive on ptgc-ufo.com. Only what a browser asks for goes into _site/. Every page
      # reads data/*.json from raw.githubusercontent.com, so data/ is shipped only as a courtesy
      # for anyone linking ptgc-ufo.com/data/… — minus the burn archive and the generator cache.
      - name: Assemble site
        run: |
          set -e
          rm -rf _site && mkdir -p _site/data
          cp *.html *.css *.jsx *.png robots.txt sitemap.xml _site/   # h2.css + h2-header.jsx: the v2 header shared by the pages (2026-10-03)
          cp -r logos _site/
          find data -maxdepth 1 -name '*.json' ! -name 'ptgc-burns-*.json' ! -name 'ufo-ptgc-burns-cache.json' ! -name 'swap-volume-cache.json' ! -name 'top-stakers-cache.json' -exec cp {} _site/data/ \;
          echo "site files:"; find _site -type f | wc -l; du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
