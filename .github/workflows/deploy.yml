name: Deploy to GitHub Pages

on:
  # Deploy only when the SITE ITSELF changes (a human push to main) or on demand.
  #
  # The data files (data/*.json) are read LIVE by the frontend from
  # raw.githubusercontent.com/.../main/data/, so they do NOT need a deploy to
  # refresh. That's why the old per-data-workflow triggers were removed: they
  # republished the exact same static site dozens of times an hour, which made
  # GitHub Pages intermittently reject deployments with "try again later".
  #
  # Note: commits pushed by the data workflows use GITHUB_TOKEN, which by design
  # does NOT re-trigger workflows — so those data commits won't fire this deploy,
  # and they don't need to. Your own code commits (pushed as you) DO fire it.
  push:
    branches: [main]
  workflow_dispatch:
  # Optional safety net: one rebuild a day so the published HTML never drifts
  # from the repo even if a push event is ever missed. Remove if you don't want it.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One Pages deployment at a time; queue a new one behind the running deploy and
  # skip intermediate queued runs. Never cancel an in-progress deploy.
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
