name: Fetch UFO PTGC Burns
on:
  workflow_dispatch: # Manual trigger only

permissions:
  contents: write

jobs:
  fetch-ufo-ptgc-burns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch UFO PTGC burns
        run: node scripts/fetch-ufo-ptgc-burns.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ufo-ptgc-burns.json
          git diff --staged --quiet || git commit -m "Update UFO PTGC burn data [manual run]"
          git pull --rebase
          git push
