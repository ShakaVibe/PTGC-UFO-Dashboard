name: Fetch UFO PTGC Burns
on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch: # Allow manual trigger too

permissions:
  contents: write

concurrency:
  group: fetch-ufo-ptgc-burns
  cancel-in-progress: false

jobs:
  fetch-ufo-ptgc-burns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch UFO PTGC burns
        run: node scripts/fetch-ufo-ptgc-burns.js

      - name: Commit if changed (race-proof rebase + retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ufo-ptgc-burns.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "Update UFO PTGC burn data [automated] [skip ci]"
          # RACE-PROOF PUSH: many workflows in this repo commit to main on overlapping
          # schedules, so the remote may move while this job runs. Rebase our single
          # data commit onto whatever landed, then push; retry with jitter in case yet
          # another push lands mid-attempt. During a rebase, '-X theirs' keeps THIS
          # job's freshly generated file if the same path ever conflicts — each
          # pipeline owns its own JSON, so that is always the right resolution.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" \
              && git push origin "${GITHUB_REF_NAME}" \
              && { echo "pushed on attempt $i"; exit 0; }
            echo "push attempt $i failed; retrying…"
            sleep $((RANDOM % 8 + 2))
          done
          echo "ERROR: could not push after 5 attempts"
          exit 1
