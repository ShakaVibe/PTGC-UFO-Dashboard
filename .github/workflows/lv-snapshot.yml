name: LV Snapshot

on:
  schedule:
    # 4x daily: 00:05, 06:05, 12:05, 18:05 UTC
    - cron: '5 0 * * *'
    - cron: '5 6 * * *'
    - cron: '5 12 * * *'
    - cron: '5 18 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture LV Snapshot
        run: |
          cat << 'SCRIPT' > capture.js
          const fs = require('fs');
          const https = require('https');

          // Config
          const TOKENS = {
            PTGC: { address: '0x94534EeEe131840b1c0F61847c572228bdfDDE93' },
            UFO:  { address: '0x456548A9B56eFBbD89Ca0309edd17a9E20b04018' }
          };

          const RH_CORES = new Set([
            '0xa1077a294dde1b09bb078844df40758a5d0f9a27', // WPLS
            '0x95b303987a60c71504d99aa1b13b4da07b0790ab', // PLSX
            '0x2fa878ab3f87cc1c9737fc071108f904c0b0c95d', // INC
            '0x2b591e99afe9f32eaa6214f7b7629768c40eeb39', // HEX
            '0x57fde0a71132198bbec939b98976993d8d89d225'  // EHEX
          ]);

          const PTGC_ADDR = TOKENS.PTGC.address.toLowerCase();
          const UFO_ADDR = TOKENS.UFO.address.toLowerCase();

          function fetch(url) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { 'User-Agent': 'LV-Snapshot/1.0' } }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch (e) { reject(new Error('JSON parse error: ' + e.message)); }
                });
              }).on('error', reject);
            });
          }

          function isPairCore(pair, tokenAddress) {
            const baseAddr = (pair.baseToken?.address || '').toLowerCase();
            const quoteAddr = (pair.quoteToken?.address || '').toLowerCase();
            const tokenAddr = tokenAddress.toLowerCase();
            const otherAddr = baseAddr === tokenAddr ? quoteAddr : baseAddr;
            // Exclude PTGC/UFO pair from core
            if ((otherAddr === PTGC_ADDR || otherAddr === UFO_ADDR) && otherAddr !== tokenAddr) return false;
            return RH_CORES.has(otherAddr);
          }

          function getQuoteSymbol(pair, tokenAddress) {
            const baseAddr = (pair.baseToken?.address || '').toLowerCase();
            const tokenAddr = tokenAddress.toLowerCase();
            return baseAddr === tokenAddr ? pair.quoteToken?.symbol : pair.baseToken?.symbol;
          }

          async function processToken(name) {
            const addr = TOKENS[name].address;
            const url = `https://api.dexscreener.com/latest/dex/tokens/${addr}`;
            const data = await fetch(url);
            const pairs = (data.pairs || []).filter(p => p.chainId === 'pulsechain');

            let coreLiquidity = 0, totalLiquidity = 0, coreVolume = 0, totalVolume = 0;
            const pairDetails = [];

            for (const p of pairs) {
              const liq = parseFloat(p.liquidity?.usd) || 0;
              const vol = parseFloat(p.volume?.h24) || 0;
              const isCore = isPairCore(p, addr);
              const quote = getQuoteSymbol(p, addr);

              totalLiquidity += liq;
              totalVolume += vol;
              if (isCore) { coreLiquidity += liq; coreVolume += vol; }

              pairDetails.push({ quote, isCore, liquidity: liq, volume: vol, dexId: p.dexId || 'unknown' });
            }

            return { coreLiquidity, totalLiquidity, coreVolume, totalVolume, pairCount: pairs.length, pairs: pairDetails };
          }

          async function main() {
            console.log('Capturing LV snapshot...');

            const [ptgc, ufo] = await Promise.all([processToken('PTGC'), processToken('UFO')]);

            const snapshot = {
              timestamp: new Date().toISOString(),
              PTGC: {
                coreLiquidity: ptgc.coreLiquidity,
                totalLiquidity: ptgc.totalLiquidity,
                coreVolume: ptgc.coreVolume,
                totalVolume: ptgc.totalVolume,
                pairCount: ptgc.pairCount
              },
              UFO: {
                coreLiquidity: ufo.coreLiquidity,
                totalLiquidity: ufo.totalLiquidity,
                coreVolume: ufo.coreVolume,
                totalVolume: ufo.totalVolume,
                pairCount: ufo.pairCount
              }
            };

            // Ensure data directory exists
            if (!fs.existsSync('data')) fs.mkdirSync('data');

            // Append to snapshots file
            const snapshotsPath = 'data/lv-snapshots.json';
            let snapshots = [];
            if (fs.existsSync(snapshotsPath)) {
              try { snapshots = JSON.parse(fs.readFileSync(snapshotsPath, 'utf8')); }
              catch (e) { console.warn('Could not parse existing snapshots, starting fresh'); snapshots = []; }
            }
            snapshots.push(snapshot);
            fs.writeFileSync(snapshotsPath, JSON.stringify(snapshots, null, 2));

            // Write latest snapshot
            fs.writeFileSync('data/lv-latest.json', JSON.stringify(snapshot, null, 2));

            console.log('Snapshot captured:');
            console.log(`  PTGC - Core Liq: $${ptgc.coreLiquidity.toFixed(0)} | Core Vol: $${ptgc.coreVolume.toFixed(0)} | Pairs: ${ptgc.pairCount}`);
            console.log(`  UFO  - Core Liq: $${ufo.coreLiquidity.toFixed(0)} | Core Vol: $${ufo.coreVolume.toFixed(0)} | Pairs: ${ufo.pairCount}`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

          node capture.js

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lv-snapshots.json data/lv-latest.json
          git diff --staged --quiet || git commit -m "LV snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
