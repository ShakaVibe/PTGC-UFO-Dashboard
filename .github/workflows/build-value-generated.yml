name: Build Value Generated

# Rebuilds data/value-generated.json every hour so the UFO dashboard's "Value Generated" and
# "PTGC burned by UFO" boxes load from a static file instead of scanning the chain per visitor.
# The builder writes ONLY on a successful scan; a failed run leaves the last good file in place
# (and the dashboard falls back to a live scan if the file is missing or stale).

on:
  schedule:
    - cron: '5 * * * *'   # hourly, at :05 (off the top-of-hour rush)
  workflow_dispatch: {}    # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: build-value-generated
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build value-generated.json
        run: node scripts/build-value-generated.mjs
        env:
          OUT_PATH: data/value-generated.json

      - name: Commit if changed (race-proof rebase + retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/value-generated.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh value-generated.json [skip ci]"
          # RACE-PROOF PUSH: many workflows in this repo commit to main on overlapping
          # schedules, so the remote may move while this job runs. Rebase our single
          # data commit onto whatever landed, then push; retry with jitter in case yet
          # another push lands mid-attempt. During a rebase, '-X theirs' keeps THIS
          # job's freshly generated file if the same path ever conflicts — each
          # pipeline owns its own JSON, so that is always the right resolution.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" \
              && git push origin "${GITHUB_REF_NAME}" \
              && { echo "pushed on attempt $i"; exit 0; }
            echo "push attempt $i failed; retrying…"
            sleep $((RANDOM % 8 + 2))
          done
          echo "ERROR: could not push after 5 attempts"
          exit 1
