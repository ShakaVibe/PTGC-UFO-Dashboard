name: Build Token Allocation

# Rebuilds data/token-allocation.json (holder tiers + allocation for PTGC and UFO) so the
# dashboard reads it instantly instead of live-scanning PulseScan on every visit.

on:
  schedule:
    - cron: '50 */6 * * *'     # every 6 hours at :50 — staggered off the :00 rush (see WORKFLOW-FIXES.md minute map)
  workflow_dispatch:            # allow manual "Run workflow"

permissions:
  contents: write               # needed so the bot can commit the updated file

concurrency:
  group: build-token-allocation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'    # Node 18+ required for global fetch

      - name: Build token-allocation.json
        run: node scripts/build-token-allocation.mjs

      - name: Commit if changed (race-proof rebase + retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/token-allocation.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update token-allocation.json [skip ci]"
          # RACE-PROOF PUSH: many workflows in this repo commit to main on overlapping
          # schedules, so the remote may move while this job runs. Rebase our single
          # data commit onto whatever landed, then push; retry with jitter in case yet
          # another push lands mid-attempt. During a rebase, '-X theirs' keeps THIS
          # job's freshly generated file if the same path ever conflicts — each
          # pipeline owns its own JSON, so that is always the right resolution.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" \
              && git push origin "${GITHUB_REF_NAME}" \
              && { echo "pushed on attempt $i"; exit 0; }
            echo "push attempt $i failed; retrying…"
            sleep $((RANDOM % 8 + 2))
          done
          echo "ERROR: could not push after 5 attempts"
          exit 1
