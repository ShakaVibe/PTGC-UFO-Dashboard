<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Socials Hub — mock v1 (Shaka's art, 2026-10-03)</title>
<style>
@font-face{font-family:Orbitron;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:Orbitron;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Orbitron;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Rajdhani;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Rajdhani;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Rajdhani;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-500-normal.woff2);font-weight:500}
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;font-family:Rajdhani,sans-serif;color:#fff}
/* a stand-in for the sticky tab band, so the hub is seen under the thing it sits under */
.band{height:46px;margin:0 12px;overflow:hidden;white-space:nowrap;border-radius:14px;background:#000 url(../../logos/header/tabs-bg.jpg) center/cover;border:1px solid rgba(232,181,58,.5);display:flex;align-items:center;gap:26px;padding:0 24px;font-weight:600;font-size:15px;color:#fff}
.band .on{padding:4px 12px;border-radius:999px;border:1px solid #E8B53A;color:#F2C94C;box-shadow:0 0 12px -2px rgba(232,181,58,.7)}
.band .new{font-family:Orbitron;font-size:9px;letter-spacing:.14em;color:#F2C94C;border:1px solid rgba(232,181,58,.6);border-radius:999px;padding:3px 8px;margin-left:6px}

/* ===== the hub ===== */
.sh{position:relative;overflow:hidden;background:#030405;padding:36px 18px 44px}
.sh-sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* Shaka's one background (logos/socials/hub-sky.jpg, 1312×1199), once: covers the hub, anchored at the top so the
   mountain ridge sits under the title and the planet along the foot — as his mock-up places it */
.sh-sky img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
/* phones: the hub is many screens tall — the scene's top under the title, its planet at the foot, dark between */
.sh-sky img.ft{display:none}
@media(max-width:900px){.sh-sky img{height:auto;object-fit:unset;top:0;bottom:auto}.sh-sky img.ft{display:block;top:auto;bottom:0;height:auto}}
.sh-sky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a0a0a 0,rgba(10,10,10,.55) 28px,rgba(10,10,10,0) 90px,rgba(3,4,5,0) 70%,rgba(3,4,5,.35) 100%)}
.sh-in{position:relative;max-width:1200px;margin:0 auto}
.sh-title{position:relative;text-align:center;margin:-10px auto 22px;padding:22px 40px 18px;max-width:900px}
.sh-title::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 55% 60% at 50% 48%,rgba(0,0,0,.86) 0%,rgba(0,0,0,.72) 40%,rgba(0,0,0,.35) 70%,rgba(0,0,0,0) 100%);filter:blur(6px);z-index:0}
.sh-title>*{position:relative;z-index:1}
.sh-t{font-family:Orbitron;font-weight:900;font-size:64px;line-height:1;letter-spacing:.01em;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 3px 3px #000) drop-shadow(0 0 22px rgba(0,0,0,.9))}
.sh-t.g{background-image:linear-gradient(180deg,#FFF3B0 0%,#F7D35A 40%,#C9921A 62%,#F2C94C 100%)}
.sh-t.w{background-image:linear-gradient(180deg,#FFF 0%,#E6E6E6 45%,#8C8C8C 60%,#DDD 100%);margin-left:.22em}
.sh-sub{margin-top:10px;font-weight:700;font-size:20px;letter-spacing:.12em;color:#fff;text-shadow:0 2px 4px #000,0 0 14px rgba(0,0,0,.9)}
.sh-tag{margin-top:8px;font-weight:600;font-size:18px;letter-spacing:.06em;color:rgba(255,255,255,.9);text-shadow:0 2px 4px #000,0 0 14px rgba(0,0,0,.9)}
.sh-tag i{font-style:normal;color:rgba(255,255,255,.5);margin:0 10px}
.sh-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
@media(max-width:900px){.sh-cols{grid-template-columns:1fr;max-width:520px;margin:0 auto}.sh-t{font-size:44px}.sh-sub{font-size:16px;letter-spacing:.08em}.sh-tag{font-size:14px}.sh{padding:26px 12px 36px}}
.sh-col{--a:#E8B53A;--rgb:232,181,58;border-radius:18px;border:2px solid rgba(var(--rgb),.85);padding:14px 12px 14px;
  background:linear-gradient(180deg,rgba(var(--rgb),.1) 0%,rgba(4,5,7,.88) 18%,rgba(4,5,7,.9) 100%);
  box-shadow:0 0 34px -10px rgba(var(--rgb),.65),inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.6)}
.sh-col.g{--a:#6CE83A;--rgb:94,234,58}.sh-col.b{--a:#4FA8FF;--rgb:59,130,246}
.sh-hd{display:flex;align-items:center;gap:14px;padding:8px 10px 12px;margin:-4px -2px 12px;border-bottom:1px solid rgba(var(--rgb),.35);border-radius:12px 12px 0 0;
  background:radial-gradient(ellipse 70% 120% at 38% 50%,rgba(0,0,0,.7) 0%,rgba(0,0,0,.5) 45%,rgba(0,0,0,.2) 80%,rgba(0,0,0,0) 100%)}
.sh-hd .lg{width:96px;height:96px;flex:none;border-radius:50%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(var(--rgb),.55))}
.sh-hd .lg2{width:120px;height:96px;flex:none;object-fit:contain;transform:scale(1.55);transform-origin:center;filter:drop-shadow(0 0 18px rgba(var(--rgb),.45))}
.sh-hd .nm{font-family:Orbitron;font-weight:900;font-size:27px;line-height:1;color:var(--a);text-shadow:0 2px 2px #000}
.sh-col.b .sh-hd .nm{color:#fff}
.sh-hd .ln{margin-top:7px;font-weight:600;font-size:15px;line-height:1.25;color:rgba(255,255,255,.78)}
.sh-hd .go{margin-left:auto;width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--a);display:grid;place-items:center;color:var(--a);font-weight:700;box-shadow:0 0 14px -3px rgba(var(--rgb),.9)}
.sh-hd .go svg{width:16px;height:16px}
.sh-rows{display:flex;flex-direction:column;gap:9px}
.sh-row{--c:#F2C94C;--crgb:242,201,76;--bg:#231902;display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  min-height:62px;padding:4px 14px 4px 10px;border-radius:11px;border:1px solid rgba(var(--crgb),.7);color:#fff;font:inherit;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,#fff 0%) 0%,var(--bg) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 0 rgba(var(--crgb),0);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
.sh-row:hover{transform:translateY(-1px);filter:brightness(1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 18px -4px rgba(var(--crgb),.8)}
.sh-row img{width:70px;height:56px;flex:none;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.8))}
.sh-row img.globe{height:60px;width:70px;filter:drop-shadow(0 0 8px rgba(242,201,76,.55)) drop-shadow(0 3px 5px rgba(0,0,0,.8))}
.sh-row img.own{height:54px;filter:drop-shadow(0 0 7px rgba(var(--crgb),.55)) drop-shadow(0 3px 5px rgba(0,0,0,.8))}
.sh-row .t{font-weight:700;font-size:17.5px;line-height:1.1;color:var(--c);text-shadow:0 1px 2px #000}
.sh-row .s{margin-top:3px;font-weight:500;font-size:13.5px;line-height:1.1;color:rgba(255,255,255,.82)}
.sh-row .ch{margin-left:auto;color:var(--c);flex:none}.sh-row .ch svg{width:14px;height:14px}
.sh-row.gold{--c:#F2C94C;--crgb:242,201,76;--bg:#231902}
.sh-row.fire{--c:#FF9A3D;--crgb:255,138,61;--bg:#2C1001}
.sh-row.green{--c:#5EEA7A;--crgb:94,234,122;--bg:#021F16}
.sh-row.lime{--c:#8DFF3A;--crgb:124,252,0;--bg:#0D2503}
.sh-row.purple{--c:#D08BFF;--crgb:192,132,252;--bg:#1E062E}
.sh-row.blue{--c:#5BB8FF;--crgb:59,160,255;--bg:#00152D}
.sh-row.red{--c:#FF7A5C;--crgb:255,96,80;--bg:#2A0D01}
.sh-back{display:flex;justify-content:center;margin-top:30px}
.sh-back a{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.65);color:#fff;font-weight:600;font-size:17px;text-decoration:none;box-shadow:0 0 18px -6px rgba(255,255,255,.4)}
</style></head><body>
<div style="height:14px"></div>
<div class="band"><span>Dashboard</span><span>KPI Report</span><span class="on">Socials</span><span>Calculators</span><span>Charts</span><span>Live Feed<span class="new">NEW</span></span><span>Portfolio</span><span>Affiliates</span></div>
<div style="height:18px"></div>

<section class="sh">
  <div class="sh-sky"><img src="../../logos/socials/hub-sky.jpg" alt=""><img class="ft" src="../../logos/socials/hub-sky.jpg" alt=""></div>
  <div class="sh-in">
    <div class="sh-title">
      <div><span class="sh-t g">Socials</span><span class="sh-t w">Hub</span></div>
      <div class="sh-sub">Shareable Cards &amp; Images for the Community</div>
      <div class="sh-tag">Logos<i>•</i>Stats<i>•</i>Charts<i>•</i>Reports<i>•</i>And More</div>
    </div>

    <div class="sh-cols">
      <!-- PTGC -->
      <div class="sh-col">
        <div class="sh-hd"><img class="lg" src="../../06_PTGC_V1_transparent_bg.png" alt=""><div><div class="nm">PTGC</div><div class="ln">PulseChain<br>The Grays</div></div><span class="go"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span></div>
        <div class="sh-rows" id="ptgc"></div>
      </div>
      <!-- UFO -->
      <div class="sh-col g">
        <div class="sh-hd"><img class="lg" src="../../07_Ufo_transparent.png" alt=""><div><div class="nm">UFO</div><div class="ln">PulseChain<br>The Grays</div></div><span class="go"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span></div>
        <div class="sh-rows" id="ufo"></div>
      </div>
      <!-- Combined -->
      <div class="sh-col b">
        <div class="sh-hd"><img class="lg2" src="../../07_Combined_PTGC_UFO_Transparent.png" alt=""><div><div class="nm">Combined</div><div class="ln">PTGC + UFO<br>The Grays</div></div><span class="go"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span></div>
        <div class="sh-rows" id="combined"></div>
      </div>
    </div>

    <div class="sh-back"><a href="#">&larr;&nbsp; Back to Dashboard</a></div>
  </div>
</section>

<script>
// the real hub's rows, in the real order — the texts are index.html's, the icons Shaka's
// ORDER (2026-10-03, Shaka: "make sure the order of all the buttons make sense"): rows 1-5 are the cards EVERY column
// has, in one order (Logos, Burn, Value Generated, KPI, Holders) so they line up across the page; rows 6-7 are the two
// the token columns share (Token Allocation, Targets) — level between PTGC and UFO — while Combined fills those two rows
// with its own (RH Core Liquidity, Leagues); whatever is left is that column's own, at the foot.
const ROWS={
  ptgc:[['logos','gold','PTGC Logos','Download official logos'],['burn','fire','Burn Stats','Total supply burned'],['valuegen','green','Value Generated','Fee distribution breakdown'],['kpi','gold','KPI Report','Full stats card'],['holders','blue','Holders','PTGC holder analytics'],['alloc','purple','Token Allocation','Supply distribution'],['targets','red','Targets','Price milestone multipliers'],['dao-treasury','blue','DAO Treasury','Treasury breakdown'],['dao-buys','gold','DAO Buys','All time, any period, or the latest buy'],['affiliates','purple','Affiliates Report','Month leaderboard & all-time totals']],
  ufo:[['logos','lime','UFO Logos','Download official logos'],['burn','fire','Burn Stats','Total supply burned'],['valuegen','green','Value Generated','Fee distribution breakdown'],['kpi','lime','KPI Report','Full stats card'],['holders','blue','Holders','UFO holder analytics'],['alloc','purple','Token Allocation','Supply distribution'],['targets','lime','Targets','Price milestone multipliers'],['ptgc-by-ufo','blue','PTGC Burned by UFO','Cross-token burn stats']],
  combined:[['logos','blue','Combined Logos','Download official logos'],['burn','red','Combined Burn Stats','Both tokens burn history & totals'],['valuegen','blue','Combined Value Generated','Fee distribution for both tokens'],['kpi','blue','Combined KPI Report','Both tokens side-by-side'],['holders','blue','Holders','Holder analytics for both tokens'],['rh-cores','blue','RH Core Liquidity','LP breakdown by RH cores'],['leagues','purple','PTGC & UFO Leagues','Combined tier price table'],['grays-cores','gold','The Grays & The Cores','24Hr price comparison']]
};
// icons that are NOT the mock-up's: the PTGC and UFO tokens themselves for the two Logos rows (Shaka), the dashboard's
// droplet (logos/panels/vg-droplet.webp) for RH Core Liquidity; The Grays & The Cores = Shaka's gold globe (hub/combined-grays-cores.png)
const ICON={'ptgc-logos':'../../06_PTGC_V1_transparent_bg.png','ufo-logos':'../../07_Ufo_transparent.png','combined-rh-cores':'../../logos/panels/vg-droplet.webp'};
const chev='<span class="ch"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2l5 5-5 5"/></svg></span>';
for(const col in ROWS){
  document.getElementById(col).innerHTML=ROWS[col].map(([k,c,t,s])=>`<button class="sh-row ${c}"><img class="${ICON[col+'-'+k]?'own':(k==='grays-cores'?'globe':'')}" src="${ICON[col+'-'+k]||`../../logos/socials/hub/${col}-${k}.png`}" alt=""><span><span class="t" style="display:block">${t}</span><span class="s" style="display:block">${s}</span></span>${chev}</button>`).join('');
}
</script>
</body></html>
