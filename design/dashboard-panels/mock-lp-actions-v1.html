<!doctype html><html><head><meta charset="utf-8"><title>LP Pairs — action icons, options</title><style>
@font-face{font-family:Orbitron;font-weight:700;src:url(../dashboard-header/assets/fonts/orbitron-latin-700-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:500;src:url(../dashboard-header/assets/fonts/rajdhani-latin-500-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:600;src:url(../dashboard-header/assets/fonts/rajdhani-latin-600-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:700;src:url(../dashboard-header/assets/fonts/rajdhani-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
:root{--c:212,175,55;--gold:#F1C552}
body{background:#0a0a0a;font-family:Rajdhani,sans-serif;color:#fff;padding:28px;width:1120px}
.tn{font-variant-numeric:tabular-nums}
h2{font-family:Orbitron,monospace;font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.55);margin:26px 0 8px}
h2 b{color:var(--gold)}
.note{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:8px}
.pn{border-radius:14px;overflow:hidden;background:#07060a;border:1.5px solid rgba(var(--c),.55);box-shadow:0 0 28px -8px rgba(var(--c),.45)}
.r{display:grid;grid-template-columns:48px 62px 190px 120px 138px 100px 90px 90px 1fr;align-items:center;min-height:62px;border-bottom:1px solid rgba(255,255,255,.05);padding:0 14px}
.r:nth-child(even){background:rgba(255,255,255,.02)}
.r>div{padding:0 4px}
.rk span{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(var(--c),.8);color:var(--gold);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px -2px rgba(var(--c),.7);background:rgba(0,0,0,.35);margin:auto}
.lg .d{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;background:radial-gradient(circle at 50% 40%,var(--a),var(--b) 75%);box-shadow:0 0 14px -2px var(--a),inset 0 0 0 1px rgba(255,255,255,.18);margin:auto}
.nm .p{font-size:19px;font-weight:700;color:var(--gold);line-height:1.05}.nm .d{font-size:14px;color:rgba(255,255,255,.45);margin-top:3px}
.v{font-size:20px;font-weight:600}.m{font-weight:500}
.ch{font-size:19px;font-weight:700;color:#F87171}.tx{font-size:19px;font-weight:700;display:flex;gap:10px}.tx b{color:#4ADE80}.tx i{font-style:normal;color:#F87171}
.ac{display:flex;justify-content:flex-end;gap:8px;padding-right:8px!important}
.ac a{display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none}
.ac svg{display:block}
/* A — ghost: no boxes, quiet white glyphs, the row's hover would brighten them */
.A .ac a{width:30px;height:30px;color:rgba(255,255,255,.5)}
.A .ac a:hover{color:#fff}
/* B — thin rings: 30 px outline circles, glyph white/70, ring in the token colour at .35 */
.B .ac a{width:30px;height:30px;border-radius:50%;border:1px solid rgba(var(--c),.35);color:rgba(255,255,255,.7);background:rgba(0,0,0,.3)}
/* C — small dark glass squares, 28 px, one quiet tint per glyph */
.C .ac a{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75)}
.C .ac a.i{color:#8FC6FF}.C .ac a.c{color:#F3C64C}.C .ac a.t{color:#6FE3DC}
/* D — today's coloured squares, just smaller and quieter: 26 px, colours at ~60 %, no glow */
.D .ac a{width:26px;height:26px;border-radius:6px;color:#fff}
.D .ac a.i{background:rgba(27,111,232,.6)}.D .ac a.c{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.D .ac a.t{background:rgba(29,143,151,.6)}
</style></head><body>
<div class="note">The same two rows, four ways to draw ⓘ · DexScreener · DEXTools. Everything else as built (round 2 sizes).</div>
<div id="out"></div>
<script>
const I={
 i:'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="4.2" r="1.3"/><rect x="6.9" y="6.6" width="2.2" height="6" rx="1"/></svg>',
 iRing:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="7.2"/><circle cx="9" cy="5.6" r=".9" fill="currentColor" stroke="none"/><path d="M9 8v4.6" stroke-linecap="round"/></svg>',
 c:'<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="2" y="9" width="3" height="7" rx=".8"/><rect x="7.5" y="4" width="3" height="12" rx=".8"/><rect x="13" y="7" width="3" height="9" rx=".8"/></svg>',
 cColor:'<svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="9" width="3" height="7" rx=".8" fill="#F3C64C"/><rect x="7.5" y="4" width="3" height="12" rx=".8" fill="#4ADE80"/><rect x="13" y="7" width="3" height="9" rx=".8" fill="#F87171"/></svg>',
 t:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-5.9 5.7L3.5 17.3a1.8 1.8 0 0 0 2.5 2.5l5.3-5.3a4.5 4.5 0 0 0 5.7-5.9l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6z"/></svg>'};
const rows=[['1','W','#c04bff','#4b1a8a','PTGC/WPLS','PulseX V1','$2,027','$394,039','▼ 3.1%','9','7','0.005'],['2','E','#7aa2ff','#2a3f9a','PTGC/WETH','PulseX V2','$1,663','$98,226','▼ 4.8%','4','6','0.017']];
const opts=[
 ['A','Ghost glyphs — no boxes','white glyphs at 50 %, brighten on hover; the quietest',(k)=>({i:I.iRing,c:I.c,t:I.t})],
 ['B','Thin rings','30 px outline circles in the gold at 35 %, glyphs white/70',()=>({i:I.i,c:I.c,t:I.t})],
 ['C','Dark glass squares','28 px, one soft tint per glyph (blue ⓘ, gold bars, teal wrench), no fill colour',()=>({i:I.i,c:I.c,t:I.t})],
 ['D','Today\'s squares, smaller + quieter','26 px, fills at 60 %, no glow; the DexScreener bars keep their three colours',()=>({i:I.i,c:I.cColor,t:I.t})],
];
document.getElementById('out').innerHTML=opts.map(([k,name,desc,g])=>`<h2><b>${k}</b> — ${name}</h2><div class="note">${desc}</div><div class="pn ${k}">${rows.map(r=>{const s=g();return`<div class="r"><div class="rk"><span>${r[0]}</span></div><div class="lg"><div class="d" style="--a:${r[2]};--b:${r[3]}">${r[1]}</div></div><div class="nm"><div class="p">${r[4]}</div><div class="d">${r[5]}</div></div><div class="v tn">${r[6]}</div><div class="v m tn">${r[7]}</div><div class="ch tn">${r[8]}</div><div class="tx tn"><b>${r[9]}</b><i>${r[10]}</i></div><div class="v m tn">${r[11]}</div><div class="ac"><a class="i" href="#" title="Pool details">${s.i}</a><a class="c" href="#" title="DexScreener">${s.c}</a><a class="t" href="#" title="DEXTools">${s.t}</a></div></div>`}).join('')}</div>`).join('');
</script></body></html>
