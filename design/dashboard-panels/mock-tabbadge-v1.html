<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Live Feed badge — 7 options (2026-10-01)</title>
<link rel="stylesheet" href="../../tools/harness/node_modules/@fontsource/orbitron/700.css">
<link rel="stylesheet" href="../../tools/harness/node_modules/@fontsource/orbitron/900.css">
<link rel="stylesheet" href="../../tools/harness/node_modules/@fontsource/rajdhani/500.css">
<link rel="stylesheet" href="../../tools/harness/node_modules/@fontsource/rajdhani/700.css">
<style>
/* The "NEW" badge on the Live Feed tab, seven ways — each drawn on the real v2 tab band (`logos/header/tabs-bg.jpg`,
   the same veil gradient, the same fire-light pill on the active tab) at the size the band has on a 1440-px desktop
   (1 u = .665 px). Gold row = PTGC, green row = UFO. Pick a letter; the build is the `.h2-tabs .h2-new` rule (+ its
   UFO line) in index.html — markup unchanged except for option F / G. */
:root{--u:.665px;--a-rgb:233,185,73;--tab:#FFE27A;--bar-rgb:255,196,60;--pill:#FFD65A;--hi:#FFF0B0;--lo:#E8A82A}
.ufo{--a-rgb:157,255,58;--tab:#C8FF78;--bar-rgb:140,255,50;--pill:#A8FF4A;--hi:#E6FFC0;--lo:#6ADF00}
body{margin:0;background:#0a0a0a;color:#fff;font-family:'Rajdhani',sans-serif;padding:28px 28px 40px}
h1{font:900 18px/1 'Orbitron',monospace;letter-spacing:.08em;color:#F1C552;margin:0 0 6px}
p.sub{margin:0 0 22px;color:rgba(255,255,255,.55);font-size:16px;max-width:900px}
.opt{display:grid;grid-template-columns:56px 1fr;gap:18px;align-items:center;margin-bottom:22px}
.ltr{font:900 26px/1 'Orbitron',monospace;color:#F1C552;text-align:center}
.ltr small{display:block;font:700 10px/1.3 'Rajdhani',sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.5);margin-top:6px;text-transform:uppercase}
.pair{display:flex;flex-direction:column;gap:8px}
.desc{font:500 13px/1.3 'Rajdhani',sans-serif;color:rgba(255,255,255,.5);letter-spacing:.02em;margin:2px 0 0 4px}
/* --- the band, as built --- */
.tabs{background:#040404;padding:calc(10*var(--u)) calc(16*var(--u))}
.band{position:relative;border-radius:calc(14*var(--u));overflow:hidden;border:1px solid rgba(var(--a-rgb),.55);box-shadow:inset 0 1px 0 rgba(255,220,140,.14),0 0 18px -6px rgba(var(--a-rgb),.55),0 2px 12px rgba(0,0,0,.6);
  background:linear-gradient(90deg,rgba(4,8,8,.95) 0%,rgba(4,8,8,.95) 52%,rgba(4,8,8,.72) 70%,rgba(4,8,8,.3) 86%,rgba(4,8,8,.06) 100%),url(../../logos/header/tabs-bg.jpg) right 46%/auto 170% no-repeat #050a0a}
.row{display:flex;align-items:center;gap:0;padding:0 calc(20*var(--u));min-height:calc(60*var(--u))}
.tab{position:relative;z-index:0;flex:none;display:inline-flex;align-items:center;gap:calc(8*var(--u));padding:calc(21*var(--u)) calc(24*var(--u));font-size:max(calc(24*var(--u)),.875rem);font-weight:500;color:rgba(255,255,255,.92);white-space:nowrap;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.9);background:none;border:0;font-family:inherit;cursor:default}
.tab.on{font-weight:700;color:var(--tab);text-shadow:0 0 12px rgba(var(--bar-rgb),.75),0 1px 3px rgba(0,0,0,.9)}
.tab.on::after{content:'';position:absolute;left:calc(4*var(--u));right:calc(4*var(--u));top:calc(10*var(--u));bottom:calc(10*var(--u));z-index:-1;border-radius:999px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1.5px var(--pill),inset 0 0 12px rgba(var(--bar-rgb),.38),0 0 18px rgba(var(--bar-rgb),.75),0 0 3px var(--pill)}
.rf{margin-left:auto;flex:none;padding:0 calc(14*var(--u)) 0 calc(20*var(--u));font-size:max(calc(19*var(--u)),.6875rem);color:rgba(255,255,255,.55)}
/* --- today (for reference) --- */
.new0{font-family:'Orbitron',monospace;font-size:max(calc(14*var(--u)),.55rem);font-weight:900;letter-spacing:.1em;color:#1A1000;background:linear-gradient(180deg,var(--hi),var(--pill) 55%,var(--lo));padding:calc(4*var(--u)) calc(13*var(--u)) calc(3*var(--u));border-radius:999px;line-height:1.2;box-shadow:0 0 10px rgba(var(--bar-rgb),.6),inset 0 1px 0 rgba(255,255,255,.6)}
/* A — a fire-light dot, top-right of the word, no text */
.newA{width:6px;height:6px;border-radius:50%;background:var(--pill);box-shadow:0 0 6px var(--pill),0 0 12px rgba(var(--bar-rgb),.7);align-self:flex-start;margin:1px 0 0 -3px}
/* B — hairline pill: 1 px gold outline, gold text, no fill, no glow */
.newB{font-family:'Orbitron',monospace;font-size:8.5px;font-weight:700;letter-spacing:.14em;color:var(--pill);border:1px solid rgba(var(--bar-rgb),.7);padding:3px 7px 2px;border-radius:999px;line-height:1;margin-left:2px}
/* C — superscript word: tiny gold caps raised to the cap line, nothing around it */
.newC{font-family:'Orbitron',monospace;font-size:8px;font-weight:700;letter-spacing:.16em;color:var(--pill);text-shadow:0 0 6px rgba(var(--bar-rgb),.55);align-self:flex-start;margin:-1px 0 0 -2px;line-height:1}
/* D — glass chip: the panels' option-A toggle glass (dark pane, gold inner stroke, white caps) */
.newD{font-family:'Orbitron',monospace;font-size:8.5px;font-weight:700;letter-spacing:.14em;color:#fff;padding:4px 7px 3px;border-radius:6px;line-height:1;margin-left:2px;background:linear-gradient(180deg,rgba(var(--bar-rgb),.3),rgba(var(--bar-rgb),.12));box-shadow:inset 0 0 0 1px rgba(var(--bar-rgb),.6),inset 0 1px 0 rgba(255,255,255,.18),0 0 10px -2px rgba(var(--bar-rgb),.55);text-shadow:0 0 6px rgba(var(--bar-rgb),.6)}
/* E — "LIVE" with a breathing dot: it is a live feed, the word says so instead of NEW (keeps the tab label; reduced motion = still dot) */
.newE{display:inline-flex;align-items:center;gap:4px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;letter-spacing:.18em;color:var(--pill);line-height:1;margin-left:2px}
.newE i{width:5px;height:5px;border-radius:50%;background:var(--pill);box-shadow:0 0 5px var(--pill),0 0 10px rgba(var(--bar-rgb),.7);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){.newE i{animation:none}}
/* F — a four-point spark after the word, fire gold, no box, no text */
.newF{color:var(--pill);font-size:11px;line-height:1;text-shadow:0 0 6px rgba(var(--bar-rgb),.8),0 0 12px rgba(var(--bar-rgb),.5);align-self:flex-start;margin:0 0 0 -3px}
/* G — the tab itself in fire gold, no badge: the label is the badge */
.tab.lit{color:var(--pill);text-shadow:0 0 10px rgba(var(--bar-rgb),.55),0 1px 3px rgba(0,0,0,.9)}
</style></head><body>
<h1>LIVE FEED BADGE — 7 OPTIONS</h1>
<p class="sub">The "NEW" next to Live Feed, redrawn on the real band at desktop size. Row one is today's (for reference), gold = PTGC, green = UFO. The active-tab pill and every other tab are as built.</p>

<script>
const tabs=(badge,lit)=>`<div class="row"><span class="tab on">Dashboard</span><span class="tab">KPI Report</span><span class="tab">Socials</span><span class="tab">Calculators</span><span class="tab">Charts</span><span class="tab${lit?' lit':''}">Live Feed${badge}</span><span class="tab">Portfolio</span><span class="tab">Affiliates</span><span class="rf">⟳</span></div>`;
const strip=(cls,badge,lit)=>`<div class="tabs ${cls}"><div class="band">${tabs(badge,lit)}</div></div>`;
const opt=(ltr,name,badge,desc,lit)=>`<div class="opt"><div class="ltr">${ltr}<small>${name}</small></div><div class="pair">${strip('',badge,lit)}${strip('ufo',badge,lit)}<div class="desc">${desc}</div></div></div>`;
document.write(
 opt('0','today','<span class="new0">NEW</span>','As built: solid gold gradient pill, black Orbitron 900, glow.')+
 opt('A','dot','<span class="newA"></span>','A 6 px fire-light dot at the top-right of the word — a notification dot, no text. Quietest option that still says "look".')+
 opt('B','hairline','<span class="newB">NEW</span>','Outline only: 1 px gold hairline, gold caps, no fill, no glow. Reads as a label, not a button.')+
 opt('C','superscript','<span class="newC">NEW</span>','Just the word, 8 px gold caps raised to the cap line, a faint glow. Nothing boxed.')+
 opt('D','glass chip','<span class="newD">NEW</span>','The panels\' toggle glass (the option A you picked): dark lit pane, gold inner stroke, white caps. Matches the rest of v2.')+
 opt('E','live dot','<span class="newE"><i></i>LIVE</span>','Says LIVE instead of NEW, with a slow-breathing dot (still under reduced motion). Stays true after the feature stops being new.')+
 opt('F','spark','<span class="newF">✦</span>','A four-point spark in fire gold after the word — no text, no box.')+
 opt('G','lit label','','No badge at all: "Live Feed" itself is set in the pill\'s fire gold. One colour, nothing added.',true)
);
</script>
</body></html>
