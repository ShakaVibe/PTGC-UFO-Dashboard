<!doctype html><html><head><meta charset="utf-8"><title>Holders single card mock v1</title><style>
@font-face{font-family:Orbitron;font-weight:700;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-700-normal.woff2)}
@font-face{font-family:Orbitron;font-weight:900;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:500;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-500-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:600;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-600-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:700;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Rajdhani,sans-serif;color:#fff}
.card{position:relative;overflow:hidden;background:#04070a}
.sky{position:absolute;inset:0;background:url(../../logos/leagues/lg-atl-split.webp) 50% 30%/cover no-repeat}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 18%,rgba(2,5,12,.15),rgba(2,5,12,0) 70%),linear-gradient(180deg,rgba(3,8,20,.25) 0%,rgba(3,8,20,.45) 30%,rgba(4,6,10,.82) 62%,rgba(4,6,10,.94) 100%)}
.edge{position:absolute;inset:14px;border-radius:26px;border:2px solid transparent;background:linear-gradient(#0000,#0000) padding-box,linear-gradient(90deg,#E8C044 0%,#5DB8FF 50%,#7CFC00 100%) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glow{position:absolute;inset:14px;border-radius:26px;box-shadow:0 0 70px -10px rgba(232,192,68,.5),0 0 70px -10px rgba(124,252,0,.4)}
.in{position:absolute;display:flex;flex-direction:column}
.kick{font-family:Orbitron;font-weight:700;letter-spacing:.32em;font-size:15px;color:rgba(235,242,255,.82);text-transform:uppercase;text-shadow:0 2px 8px #000}
.ttl{font-family:Orbitron;font-weight:900;letter-spacing:.06em;line-height:1;text-transform:uppercase;filter:drop-shadow(0 3px 14px rgba(0,0,0,.85))}
.gg{background:linear-gradient(90deg,#FFF3C4 0%,#E8C044 30%,#C9D96A 50%,#A8FF4A 70%,#7CFC00 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mg{background:linear-gradient(180deg,#FAEAA0 0%,#F0DC78 18%,#E0B843 38%,#D4AF37 55%,#A8841C 78%,#7A5C12 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mgr{background:linear-gradient(180deg,#F4FFE6 0%,#D9FFA6 20%,#A8FF4A 42%,#7CFC00 62%,#4CB800 82%,#276600 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(4,6,10,.62);font-family:Orbitron;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#fff}
.pill .n{font-variant-numeric:tabular-nums}
.up{color:#4ade80}.dn{color:#f87171}.mute{color:rgba(255,255,255,.5)}
.brand{font-family:Orbitron;font-weight:700;letter-spacing:0}
.meta{font-family:Orbitron;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.55)}
/* token panel */
.tp{position:relative;flex:1 1 0;min-width:0;border-radius:22px;background:linear-gradient(180deg,rgba(8,12,18,.78),rgba(4,6,10,.9));border:1.5px solid rgba(var(--c),.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 40px -10px rgba(var(--c),.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.tp .hd{display:flex;align-items:center;justify-content:space-between}
.tp .id{display:flex;align-items:center}
.tp .nm{font-family:Orbitron;font-weight:900;line-height:1}
.tp .big{font-family:Rajdhani;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums;text-align:right}
.tp .sub{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:6px}
.tp .lbl{font-family:Orbitron;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px 2px;font-weight:700;font-variant-numeric:tabular-nums;color:#4ade80;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.45)}
.per{display:flex;border-radius:14px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.08)}
.per>div{flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.08)}
.per>div:first-child{border-left:0}
.per .k{font-family:Orbitron;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.55)}
.per .v{font-weight:700;font-variant-numeric:tabular-nums;color:#4ade80;line-height:1}
.per .a{color:rgba(255,255,255,.5);font-weight:600}
.lgh{display:flex;justify-content:space-between;align-items:baseline;font-family:Orbitron;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.lgg{display:grid;grid-template-columns:repeat(4,1fr)}
.lgt{position:relative;display:flex;align-items:center;border-radius:12px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08)}
.lgt img{flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.8))}
.lgt .c{font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:#fff}
.lgt .t{font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.lgt .fire{position:absolute;right:6px;top:4px}
.lgt.z .c{color:rgba(255,255,255,.35)}
/* B: one row of 8 */
.row8{display:flex;justify-content:space-between;border-radius:16px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08)}
.row8>div{position:relative;display:flex;flex-direction:column;align-items:center;flex:1}
.row8 img{filter:drop-shadow(0 4px 8px rgba(0,0,0,.85))}
.row8 .c{font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.row8 .t{font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase}
.row8 .fire{position:absolute;right:4px;top:-2px}
/* lit coin (index.html .lg-coin) */
.lg-coin{position:relative;width:calc(195*var(--u));height:calc(195*var(--u));flex:none;--halo:255,120,20;--ring:255,190,80}
.lg-coin.g{--halo:110,255,40;--ring:140,255,60}
.lg-coin .halo{position:absolute;inset:calc(-70*var(--u));border-radius:50%;background:radial-gradient(circle,rgba(var(--halo),.22) 45%,rgba(var(--halo),.06) 60%,rgba(0,0,0,0) 72%)}
.lg-coin .corona{position:absolute;left:calc(-162*var(--u));top:calc(-162*var(--u));width:calc(520*var(--u));height:calc(520*var(--u));max-width:none;mix-blend-mode:screen}
.lg-coin .fl{position:absolute;left:calc(104*var(--u));top:calc(-8*var(--u));width:calc(30*var(--u));height:calc(9*var(--u));border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(255,220,130,.7) 45%,rgba(255,180,60,0))}
.lg-coin .flv{position:absolute;left:calc(118*var(--u));top:calc(-18*var(--u));width:calc(2*var(--u));height:calc(30*var(--u));background:linear-gradient(180deg,rgba(255,240,200,0),#fff 50%,rgba(255,240,200,0))}
.lg-coin .flh{position:absolute;left:calc(100*var(--u));top:calc(-4*var(--u));width:calc(40*var(--u));height:calc(1.5*var(--u));background:linear-gradient(90deg,rgba(255,240,200,0),#fff 50%,rgba(255,240,200,0))}
.lg-coin>img.lg{position:relative;width:100%;height:100%;border-radius:50%;filter:brightness(1.08) contrast(1.05);box-shadow:0 0 calc(10*var(--u)) calc(2*var(--u)) rgba(var(--ring),.55)}

.s1{background:var(--art) 50% 35%/cover no-repeat}
.edge1{position:absolute;inset:14px;border-radius:26px;border:2px solid transparent;background:linear-gradient(#0000,#0000) padding-box,linear-gradient(135deg,var(--e1) 0%,var(--e2) 50%,var(--e3) 100%) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glow1{position:absolute;inset:14px;border-radius:26px;box-shadow:0 0 70px -10px rgba(var(--cc),.55)}
.tp-lbl{font-family:Orbitron;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.card .big{font-family:Rajdhani;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.ttl span{-webkit-background-clip:text;background-clip:text}
</style></head><body><div id="root"></div><script>
const tk=new URLSearchParams(location.search).get('tok')||'PTGC';
document.documentElement.style.setProperty('--art',`url(../../logos/leagues/lg-atl-${tk.toLowerCase()}.webp)`);
document.documentElement.style.setProperty('--cc',tk==='UFO'?'124,252,0':'232,192,68');
const E=tk==='UFO'?['#F4FFE6','#7CFC00','#276600']:['#FFF8DC','#E8C044','#6B4E0E'];['--e1','--e2','--e3'].forEach((k,i)=>document.documentElement.style.setProperty(k,E[i]));
const D={
  date:'Oct 26, 2026',
  PTGC:{holders:18218,today:4,p:{d7:26,d30:113,d90:331},people:17134,c:'232,192,68',hex:'#E8C044',cls:'mg',logo:'../../logos/ptgc/logo-512.webp',corona:'../../logos/header/coin-corona.webp',
    lg:{Poseidon:0,Whale:12,Shark:96,Dolphin:696,Squid:2220,Turtle:2929,Shrimp:1848,Shell:9333},burnIn:'Poseidon'},
  UFO:{holders:5332,today:2,p:{d7:11,d30:25,d90:92},people:4995,c:'124,252,0',hex:'#9DFF3A',cls:'mgr',logo:'../../logos/ufo/logo-512.webp',corona:'../../logos/header/coin-corona-green.webp',
    lg:{Poseidon:0,Whale:16,Shark:99,Dolphin:500,Squid:1097,Turtle:1137,Shrimp:477,Shell:1669},burnIn:'Whale'}
};
D.PTGC.series=[18105, 18111, 18115, 18115, 18116, 18114, 18119, 18118, 18122, 18128, 18134, 18135, 18135, 18140, 18143, 18143, 18142, 18143, 18162, 18169, 18171, 18183, 18185, 18192, 18195, 18195, 18200, 18204, 18207, 18216, 18218, 18218];
D.UFO.series=[5307, 5312, 5313, 5310, 5310, 5309, 5309, 5311, 5312, 5312, 5314, 5315, 5314, 5317, 5316, 5316, 5317, 5317, 5317, 5315, 5313, 5313, 5312, 5321, 5324, 5325, 5325, 5325, 5328, 5329, 5332, 5332];

D.PTGC.series=[18105, 18111, 18115, 18115, 18116, 18114, 18119, 18118, 18122, 18128, 18134, 18135, 18135, 18140, 18143, 18143, 18142, 18143, 18162, 18169, 18171, 18183, 18185, 18192, 18195, 18195, 18200, 18204, 18207, 18216, 18218, 18218];
D.UFO.series=[5307, 5312, 5313, 5310, 5310, 5309, 5309, 5311, 5312, 5312, 5314, 5315, 5314, 5317, 5316, 5316, 5317, 5317, 5317, 5315, 5313, 5313, 5312, 5321, 5324, 5325, 5325, 5325, 5328, 5329, 5332, 5332];
const L=[['Poseidon','trident'],['Whale','whale'],['Shark','shark'],['Dolphin','dolphin'],['Squid','squid'],['Turtle','turtle'],['Shrimp','shrimp'],['Shell','shell']];
const sea=k=>`../../logos/panels/sea-${k}.webp?v=4`;
const f=n=>n.toLocaleString('en-US');
const q=new URLSearchParams(location.search),tok=q.get('tok')||'PTGC',tall=q.get('shape')==='tall',days=+(q.get('days')||30);
const T=D[tok],ufo=tok==='UFO';
const W=tall?1080:1200,H=tall?1350:675;
const coin=u=>`<div class="lg-coin${ufo?' g':''}" style="--u:${u}px"><div class="halo"></div><img class="corona" src="${T.corona}"><div class="fl"></div><div class="flv"></div><div class="flh"></div><img class="lg" src="${T.logo}"></div>`;
const spark=(w,h,fs)=>{const s=T.series,mn=Math.min(...s),mx=Math.max(...s),r=mx-mn||1,p=6;
  const pts=s.map((v,i)=>[p+i*(w-2*p)/(s.length-1),p+(1-(v-mn)/r)*(h-2*p-fs-4)]);
  const d=pts.map((x,i)=>(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1)).join(' ');const last=pts[pts.length-1];const base=h-fs-4;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(${T.c},.45)"/><stop offset="1" stop-color="rgba(${T.c},0)"/></linearGradient></defs>
  ${[.25,.5,.75].map(t=>`<line x1="${p}" x2="${w-p}" y1="${p+t*(base-p)}" y2="${p+t*(base-p)}" stroke="rgba(255,255,255,.07)" stroke-dasharray="3 6"/>`).join('')}
  <path d="${d} L${last[0]} ${base} L${p} ${base} Z" fill="url(#g1)"/><path d="${d}" fill="none" stroke="${T.hex}" stroke-width="2.8" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(${T.c},.8))"/>
  <circle cx="${last[0]}" cy="${last[1]}" r="5.5" fill="${T.hex}" stroke="#fff" stroke-width="1.5"/>
  <text x="${p}" y="${h-2}" font-family="Orbitron" font-weight="700" font-size="${fs}" letter-spacing="2" fill="rgba(255,255,255,.45)">${days} DAYS AGO · ${f(s[0])}</text>
  <text x="${w-p}" y="${h-2}" text-anchor="end" font-family="Orbitron" font-weight="700" font-size="${fs}" letter-spacing="2" fill="rgba(255,255,255,.45)">TODAY · ${f(s[s.length-1])}</text></svg>`;};
const Z=tall?{pad:56,top:46,bottom:42,kick:15,title:60,cu:.82,big:104,lb:16,ch:20,sh:200,sf:13,pp:12,pk:14,pv:30,pa:15,lh:15,gg:12,gi:14,gpad:'12px 14px',ia:64,gc:32,gt:13,g:16}
            :{pad:44,top:34,bottom:30,kick:14,title:46,cu:.62,big:84,lb:13,ch:16,sh:150,sf:10,pp:8,pk:11,pv:22,pa:12,lh:12,gg:7,r8p:'10px 6px 8px',r8i:50,r8c:21,gt:10.5,g:12};
const p=T.p,dn={7:p.d7,30:p.d30,90:p.d90}[days],thenV=T.holders-dn,pct=(dn/thenV*100).toFixed(2);
const per=`<div class="per" style="padding:${Z.pp}px 0">${[['7D',p.d7,7],['30D',p.d30,30],['90D',p.d90,90]].map(([k,v,d])=>`<div><div class="k" style="font-size:${Z.pk}px">${k}</div><div class="v" style="font-size:${Z.pv}px;margin-top:5px">▲ +${v}</div><div class="a" style="font-size:${Z.pa}px;margin-top:4px">${f(T.holders-v)} then · +${(v/d).toFixed(1)}/day</div></div>`).join('')}</div>`;
const lgHead=`<div class="lgh" style="font-size:${Z.lh}px"><span style="color:rgba(${T.c},.95)">The Leagues</span><span class="mute">${f(T.people)} people</span></div>`;
const cnt=n=>T.lg[n]+(T.burnIn===n?1:0);
const leagues=tall
 ?`${lgHead}<div class="lgg" style="gap:${Z.gg}px;margin-top:${Z.gg+2}px">${L.map(([n,k])=>{const v=cnt(n);return `<div class="lgt${v?'':' z'}" style="gap:${Z.gi}px;padding:${Z.gpad}"><img src="${sea(k)}" style="width:${Z.ia}px;height:${Z.ia}px"><div><div class="c" style="font-size:${Z.gc}px">${f(v)}</div><div class="t" style="font-size:${Z.gt}px;margin-top:4px">${n}</div></div></div>`;}).join('')}</div>`
 :`${lgHead}<div class="row8" style="margin-top:${Z.gg+2}px;padding:${Z.r8p}">${L.map(([n,k])=>{const v=cnt(n);return `<div><img src="${sea(k)}" style="width:${Z.r8i}px;height:${Z.r8i}px"><div class="c" style="font-size:${Z.r8c}px;margin-top:4px;color:${v?'#fff':'rgba(255,255,255,.35)'}">${f(v)}</div><div class="t" style="font-size:${Z.gt}px;margin-top:3px">${n}</div></div>`;}).join('')}</div>`;
const kick=`<div class="kick" style="font-size:${Z.kick}px">The Grays · Holder Analytics</div>`;
const ttl=`<div class="ttl" style="font-size:${Z.title}px;margin-top:${tall?12:8}px"><span class="${T.cls}">${tok}</span> <span style="color:#fff">Holders</span></div>`;
const pill=`<span class="pill" style="font-size:${tall?16:12}px;padding:${tall?'10px 22px':'8px 16px'}"><span style="color:${T.hex}">Past ${days} days</span></span>`;
const amount=`<div class="tp-lbl" style="font-size:${Z.lb}px">Wallets holding</div><div class="big" style="font-size:${Z.big}px;margin-top:6px;text-align:${tall?'center':'left'}">${f(T.holders)}</div>
 <div style="display:flex;align-items:center;gap:12px;margin-top:10px;justify-content:${tall?'center':'flex-start'}"><span class="chip" style="font-size:${Z.ch}px">▲ +${T.today} today</span><span style="font-size:${Z.ch}px;font-weight:600;color:rgba(255,255,255,.7)">+${dn} in ${days} days · <span class="up">${pct}%</span></span></div>`;
const chartBox=w=>`<div class="tp" style="--c:${T.c};padding:${tall?'16px 18px 12px':'12px 14px 10px'}"><div class="lgh" style="font-size:${Z.lh}px;margin-bottom:8px"><span style="color:rgba(${T.c},.95)">${days}-day holder trend</span></div>${spark(w,Z.sh,Z.sf)}</div>`;
const foot=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:${tall?16:12}px"><span class="brand ${T.cls}" style="font-size:${tall?30:24}px">ptgc-ufo.com</span><span class="meta" style="font-size:${tall?12:10.5}px">${D.date} · Holders = every address · Leagues = people</span></div>`;
const iw=W-2*Z.pad;
let body;
if(tall){
 body=`<div style="text-align:center">${kick}${ttl}<div style="margin-top:14px">${pill}</div></div>
  <div style="display:flex;justify-content:center;margin-top:44px">${coin(Z.cu)}</div>
  <div style="text-align:center;margin-top:34px">${amount}</div><div style="flex:1"></div>
  ${chartBox(iw-36)}<div style="margin-top:${Z.g}px">${per}</div><div style="margin-top:${Z.g+4}px">${leagues}</div>${foot}`;
}else{
 const cw=600;
 body=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div>${kick}${ttl}</div><div style="padding-top:4px">${pill}</div></div>
  <div style="flex:1"></div>
  <div style="display:flex;gap:22px;align-items:center"><div style="display:flex;align-items:center;gap:26px;flex:1;min-width:0;padding-left:18px">${coin(Z.cu)}<div>${amount}</div></div><div style="width:${cw}px">${chartBox(cw-28)}</div></div>
  <div style="margin-top:${Z.g}px">${per}</div><div style="margin-top:${Z.g+2}px">${leagues}</div>${foot}`;
}
document.getElementById('root').innerHTML=`<div class="card" id="card" style="width:${W}px;height:${H}px"><div class="sky s1"></div><div class="shade"></div><div class="glow1"></div><div class="edge1"></div>
 <div class="in" style="left:${Z.pad}px;right:${Z.pad}px;top:${Z.top}px;bottom:${Z.bottom}px">${body}</div></div>`;
</script></body></html>
