<!doctype html>
<html><head><meta charset="utf-8"><title>Affiliate leaderboard mock v1</title>
<style>
@font-face{font-family:Orbitron;font-weight:700;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-700-normal.woff2)}
@font-face{font-family:Orbitron;font-weight:900;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:500;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-500-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:600;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-600-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:700;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020305;font-family:Rajdhani,sans-serif;color:#fff;padding:28px 0}
body.ph{padding:0}
.lbw{--a:#F2C94C;--rgb:242,201,76;--usd:#4ade80;position:relative;margin:0 auto;max-width:1000px;border-radius:20px;overflow:hidden;border:1.5px solid rgba(var(--rgb),.55);background:#06070a;box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 60px -14px rgba(var(--rgb),.55),0 30px 80px -20px #000}
.lbw.mo{--a:#7CFC00;--rgb:124,252,0}
.ph .lbw{border-radius:0;max-width:390px;border-left:0;border-right:0}
/* header plate */
.hd{position:relative;height:300px;overflow:hidden}
.ph .hd{height:250px}
.sky{position:absolute;inset:0;background:url(../../logos/portfolio/rk-plate-nf.webp) center 38%/cover no-repeat}
.mo .sky{filter:hue-rotate(62deg) saturate(1.15)}
.fade{position:absolute;inset:0;background:radial-gradient(ellipse 34% 46% at 50% 48%,rgba(0,0,0,.45),rgba(0,0,0,0)),linear-gradient(180deg,rgba(0,0,0,.25) 0,rgba(0,0,0,0) 30%,rgba(6,7,10,.25) 70%,#06070a 100%)}
.x{position:absolute;right:16px;top:14px;z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.coin{--u:.56px;position:absolute;left:50%;top:40px;transform:translateX(-50%);width:calc(195*var(--u));height:calc(195*var(--u))}
.ph .coin{--u:.44px;top:34px}
.coin .halo{position:absolute;inset:calc(-70*var(--u));border-radius:50%;background:radial-gradient(circle,rgba(255,120,20,.22) 45%,rgba(255,120,20,.06) 60%,rgba(0,0,0,0) 72%)}
.coin .corona{position:absolute;left:calc(-162*var(--u));top:calc(-162*var(--u));width:calc(520*var(--u));height:calc(520*var(--u));mix-blend-mode:screen}
.coin .fl{position:absolute;left:calc(104*var(--u));top:calc(-8*var(--u));width:calc(30*var(--u));height:calc(9*var(--u));border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(255,220,130,.7) 45%,rgba(255,180,60,0))}
.coin .flv{position:absolute;left:calc(118*var(--u));top:calc(-18*var(--u));width:calc(2*var(--u));height:calc(30*var(--u));background:linear-gradient(180deg,rgba(255,240,200,0),#fff 50%,rgba(255,240,200,0))}
.coin>img.lg{position:relative;width:100%;height:100%;border-radius:50%;filter:brightness(1.08) contrast(1.05);box-shadow:0 0 calc(10*var(--u)) calc(2*var(--u)) rgba(255,190,80,.55)}
.ttl{position:absolute;left:0;right:0;top:172px;text-align:center;text-shadow:0 2px 8px #000,0 0 18px rgba(0,0,0,.9)}
.ph .ttl{top:132px}
.ttl h2{font:900 36px Orbitron,monospace;letter-spacing:.08em;line-height:1}
.ph .ttl h2{font-size:22px}
.ttl h2 em{font-style:normal;color:var(--a);text-shadow:0 0 20px rgba(var(--rgb),.7),0 2px 8px #000}
.ttl p{margin-top:10px;font-size:16px;font-weight:600;color:rgba(255,255,255,.82)}
.ph .ttl p{font-size:13px;padding:0 14px}
.ttl p b{color:var(--a)}
/* switches */
.ctl{position:relative;z-index:2;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:-6px;padding:0 16px}
.sw{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(var(--rgb),.45);box-shadow:0 0 18px -6px rgba(var(--rgb),.6)}
.sw span{font:700 11px Orbitron,monospace;letter-spacing:.14em;padding:10px 16px;border-radius:999px;color:rgba(255,255,255,.6);white-space:nowrap;text-transform:uppercase}
.ph .sw span{font-size:9.5px;padding:9px 11px;letter-spacing:.1em}
.sw span.on{color:#1a1200;background:linear-gradient(180deg,#FFE27A,#F2C94C 55%,#D9A520);box-shadow:0 0 14px rgba(242,201,76,.55)}
.sw span.on.g{color:#0b2200;background:linear-gradient(180deg,#F4FFE6,#A8FF4A 55%,#4CB800);box-shadow:0 0 14px rgba(124,252,0,.55)}
/* podium */
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;padding:22px 22px 6px}
.ph .pod{gap:6px;padding:16px 8px 4px}
.pc{position:relative;overflow:hidden;border-radius:16px;border:1.5px solid rgba(255,255,255,.14);background:#06070a;padding:16px 12px 14px;text-align:center;--m:235,120,50}
.pc::before{content:'';position:absolute;inset:0;background:url(../../logos/holders/nh-sky.webp) center/cover;filter:grayscale(1);opacity:.34}
.pc::after{content:'';position:absolute;inset:0;background:rgba(var(--m),.45);mix-blend-mode:color}
.pc>*{position:relative;z-index:1}
.pc.g1{--m:242,190,60;border-color:#F2C94C;box-shadow:0 0 36px -6px rgba(242,201,76,.75);padding-top:22px}
.pc.g2{--m:80,160,255;border-color:rgba(150,200,255,.6)}
.pc.g3{--m:235,120,50;border-color:rgba(235,140,70,.6)}
.pc .md{width:108px;height:108px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.9))}
.pc.g1 .md{width:138px;height:138px}
.ph .pc .md{width:58px;height:58px}.ph .pc.g1 .md{width:72px;height:72px}
.pc .pad{margin-top:8px;border-radius:12px;background:radial-gradient(ellipse at 50% 40%,rgba(3,4,7,.88),rgba(3,4,7,.4));padding:10px 8px 10px}
.pc .nm{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.g1 .nm{font-size:22px}
.pc .big{font-weight:700;font-size:34px;line-height:1.05;color:var(--a);font-variant-numeric:tabular-nums;margin-top:2px;text-shadow:0 0 18px rgba(var(--rgb),.45)}
.pc.g1 .big{font-size:44px}
.pc .big small{font-size:13px;color:rgba(255,255,255,.55);margin-left:4px;text-shadow:none}
.pc .usd{font-weight:700;font-size:21px;color:var(--usd);font-variant-numeric:tabular-nums;margin-top:2px}
.pc.g1 .usd{font-size:25px}
.pc .f{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;font-size:14px;font-weight:600;color:rgba(255,255,255,.65)}
.pc .f img{width:28px;height:28px}
.ph .pc{padding:10px 5px 8px}.ph .pc.g1{padding-top:12px}
.ph .pc .pad{padding:6px 4px}
.ph .pc .nm{font-size:12.5px}.ph .pc.g1 .nm{font-size:13.5px}
.ph .pc .big{font-size:18px}.ph .pc.g1 .big{font-size:22px}.ph .pc .big small{display:block;font-size:9px;margin:0}
.ph .pc .usd{font-size:13px}.ph .pc.g1 .usd{font-size:15px}
.ph .pc .f{font-size:10.5px;gap:3px;flex-wrap:wrap}.ph .pc .f img{width:18px;height:18px}
.crown{position:absolute;left:50%;top:6px;transform:translateX(-50%);font:900 10px Orbitron,monospace;letter-spacing:.3em;color:#1a1200;background:linear-gradient(180deg,#FFE27A,#D9A520);padding:4px 12px;border-radius:999px;box-shadow:0 0 14px rgba(242,201,76,.7)}
.ph .crown{display:none}
/* rows 4-10 */
.rows{padding:14px 22px 6px}
.ph .rows{padding:12px 8px 4px}
.rh{display:flex;justify-content:space-between;align-items:baseline;font:700 11px Orbitron,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);padding:0 4px 8px}
.rh b{color:var(--a)}
.r{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 150px 120px 82px;align-items:center;gap:12px;height:62px;padding:0 14px 6px 10px;margin-top:8px;border-radius:12px;border:1px solid rgba(var(--rgb),.22);background:linear-gradient(90deg,rgba(var(--rgb),.07),rgba(6,7,10,.9) 55%);overflow:hidden}
.r::before{content:'';position:absolute;left:58px;right:14px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.07)}
.r .bar{position:absolute;left:58px;bottom:6px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(var(--rgb),.35),var(--a));box-shadow:0 0 10px rgba(var(--rgb),.8)}
.ph .r::before,.ph .r .bar{left:40px;bottom:5px}
.r>*:not(.bar){position:relative}
.r .rk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 14px Orbitron,monospace;color:var(--a);border:1.5px solid rgba(var(--rgb),.55);background:rgba(0,0,0,.6)}
.r .n{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .n small{display:block;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.5);margin-top:1px}
.r .v{text-align:right;font-weight:700;font-size:23px;color:var(--a);font-variant-numeric:tabular-nums}
.r .v small{font-size:11px;color:rgba(255,255,255,.5);margin-left:3px}
.r .u{text-align:right;font-weight:700;font-size:18px;color:var(--usd);font-variant-numeric:tabular-nums}
.r .c{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-weight:700;font-size:14px;color:rgba(255,255,255,.7)}
.r .c img{width:32px;height:32px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.8))}
.ph .r{grid-template-columns:30px minmax(0,1fr) auto 44px;gap:7px;height:52px;padding:0 8px 0 6px}
.ph .r .rk{width:26px;height:26px;font-size:11px}
.ph .r .n{font-size:15px}.ph .r .n small{font-size:11px}
.ph .r .v{font-size:16px;line-height:1.05}.ph .r .v small{display:none}
.ph .r .v .uu{display:block;font-size:12.5px;color:var(--usd)}
.ph .r .u{display:none}
.ph .r .c img{width:24px;height:24px}.ph .r .c{font-size:11px;gap:1px}
.ft{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 20px;font:700 11px Orbitron,monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.ft b{color:var(--a)}
.ph .ft{flex-direction:column;gap:8px;padding:14px 8px 18px;font-size:9.5px;text-align:center}
</style></head>
<body><div id="root"></div>
<script>
const SUP=333333333333;
const DATA={
 all:{label:'All-time',refs:73,buys:1550,ptgc:8399015819,usd:610606,
  ptgc_:[["@ptgcofficialonboard",218,3184348922,178665],["DomDoos",301,1477587016,127116],["StakerSlade",19,547739728,52482],["PLTGC",111,306989581,18600],["DeFiMission",204,232909470,16035],["PrairieBanana",44,209868099,18662],["@GRAYZLEGION369",25,208840402,15587],["noRAGRETS",8,208238021,19698],["@ptgcfanboy",6,198179791,29563],["@CryptoSeven",57,172408442,17306]],
  buys_:[["DomDoos",301,1477587016,127116],["@ptgcofficialonboard",218,3184348922,178665],["DeFiMission",204,232909470,16035],["PLTGC",111,306989581,18600],["@CryptoSeven",57,172408442,17306],["ThePrairieBanana",54,71347525,4813],["PrairieBanana",44,209868099,18662],["PTGC",33,98502083,5623],["p3tester",30,65257289,5150],["fab",26,41596688,5966]]},
 mo:{label:"October '26",refs:19,buys:110,ptgc:1030000000,usd:30342,
  ptgc_:[["@ptgcofficialonboard",29,500450633,15606],["88Xcuto4",1,90313391,1917],["DeFiMission",21,52303604,1894],["VibraFinance",1,49991813,1299],["PLTGC",7,43123768,1157],["Baba",2,42770825,923],["DomDoos",22,38194967,1877],["Rico",1,27309795,759],["@DirkDiggler",1,26306079,689],["McCloud",2,11465865,406]],
  buys_:[["@ptgcofficialonboard",29,500450633,15606],["DomDoos",22,38194967,1877],["DeFiMission",21,52303604,1894],["PLTGC",7,43123768,1157],["PrairieBanana",5,24246665,390],["HEXican",5,11451713,249],["PTGC",5,20675040,548],["McCloud",2,11465865,406],["Baba",2,42770825,923],["Rico",1,27309795,759]]}
};
const T=[['trident',10],['whale',1],['shark',.1],['dolphin',.01],['squid',.001],['turtle',.0001],['shrimp',.00001],['shell',0]];
const cr=p=>{const pct=p/SUP*100;const t=T.find(([,x])=>pct>=x)||T[7];return{k:t[0],n:t[1]?Math.max(1,Math.floor(pct/t[1])):1};};
const sea=k=>`../../logos/panels/sea-${k}.webp?v=4`;
const abbr=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(2)+'K':String(n);
const usd=n=>'$'+n.toLocaleString('en-US');
const q=new URLSearchParams(location.search),per=q.get('per')||'all',met=q.get('m')||'ptgc',ph=q.get('ph')==='1';
if(ph)document.body.classList.add('ph');
const D=DATA[per],rows=D[met+'_'],isP=met==='ptgc';
const val=r=>isP?r[2]:r[1],lead=val(rows[3]);
const bigV=r=>isP?`${abbr(r[2])}<small>PTGC</small>`:`${r[1]}<small>${r[1]===1?'BUY':'BUYS'}</small>`;
const subF=r=>isP?`${r[1]} ${r[1]===1?'buy':'buys'}`:`${abbr(r[2])} PTGC`;
const pc=(i)=>{const r=rows[i],c=cr(r[2]),g=['g1','g2','g3'][i],md=['t1-1st','t1-2nd','t1-3rd'][i];
 return `<div class="pc ${g}">${i===0?'<span class="crown">CHAMPION</span>':''}<img class="md" src="../../logos/top100/${md}.webp?v=2"><div class="pad"><div class="nm">${r[0]}</div><div class="big">${bigV(r)}</div><div class="usd">${usd(r[3])}</div><div class="f"><span>${subF(r)}</span><img src="${sea(c.k)}"><span>×${c.n}</span></div></div></div>`;};
const row=(r,i)=>{const c=cr(r[2]),w=Math.max(3,val(r)/lead*100)*(ph?0.86:0.9);
 return `<div class="r"><div class="bar" style="width:${w.toFixed(1)}%"></div><div class="rk">${i+1}</div><div class="n">${r[0]}<small>${subF(r)}</small></div><div class="v">${isP?abbr(r[2]):r[1]}<small>${isP?'PTGC':(r[1]===1?'BUY':'BUYS')}</small>${ph?`<span class="uu">${usd(r[3])}</span>`:''}</div><div class="u">${usd(r[3])}</div><div class="c"><img src="${sea(c.k)}">×${c.n}</div></div>`;};
const sw1=`<div class="sw"><span class="${per==='all'?'on':''}">All-time</span><span class="${per==='mo'?'on g':''}">October '26 ▾</span></div>`;
const sw2=`<div class="sw"><span class="${isP?'on'+(per==='mo'?' g':''):''}">Most PTGC bought</span><span class="${!isP?'on'+(per==='mo'?' g':''):''}">Most referrals</span></div>`;
document.getElementById('root').innerHTML=`<div class="lbw ${per==='mo'?'mo':''}">
 <div class="hd"><div class="sky"></div><div class="fade"></div><div class="x">✕</div>
  <div class="coin"><div class="halo"></div><img class="corona" src="../../logos/header/coin-corona.webp"><div class="fl"></div><div class="flv"></div><img class="lg" src="../../logos/ptgc/logo-512.webp"></div>
  <div class="ttl"><h2>AFFILIATE <em>LEADERBOARD</em></h2><p>${per==='all'?'Since the program began':'October 2026 · live'} · <b>${D.refs}</b> referrers · <b>${D.buys.toLocaleString()}</b> buys · <b>${abbr(D.ptgc)}</b> PTGC · <b>${usd(D.usd)}</b></p></div></div>
 <div class="ctl">${sw1}${sw2}</div>
 <div class="pod">${pc(1)}${pc(0)}${pc(2)}</div>
 <div class="rows"><div class="rh"><span>The chase · ranks 4–10</span><span>bar = vs <b>#4</b></span></div>${rows.slice(3).map((r,j)=>row(r,j+3)).join('')}</div>
 <div class="ft"><span>Tap a name to open their referrals</span><span>${per==='all'?'All-time':'October 2026'} · <b>${isP?'most PTGC bought':'most referrals'}</b></span></div>
</div>`;
</script></body></html>
