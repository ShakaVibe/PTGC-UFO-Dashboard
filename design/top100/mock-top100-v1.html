<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top 100 window — mock-up v1 (button + two looks + states) — 2026-10-22</title>
<style>
@font-face{font-family:Orbitron;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:Orbitron;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Orbitron;src:url(../../tools/harness/node_modules/@fontsource/orbitron/files/orbitron-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Rajdhani;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Rajdhani;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Rajdhani;src:url(../../tools/harness/node_modules/@fontsource/rajdhani/files/rajdhani-latin-500-normal.woff2);font-weight:500}

body{margin:0;background:#04060a;color:#fff;font-family:Rajdhani;font-weight:500}
img{display:block}
.wrap{padding:28px 40px 70px}
.opt{font-family:Orbitron;font-weight:900;font-size:13px;letter-spacing:.14em;color:#04060a;background:#F2D35B;display:inline-block;padding:5px 12px;border-radius:5px}
.opt.g{background:#7CFC00}
.note{display:block;margin:8px 0 16px;color:rgba(255,255,255,.74);font-size:16.5px;font-weight:600;max-width:1060px;line-height:1.35}
.note b{color:#F6E98A}
.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(242,211,91,.5),transparent);margin:40px 0 28px;max-width:1100px}
.row2{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}

/* ===== the Token Allocation header strip (button options) ===== */
.ta{width:608px;border-radius:16px;border:1px solid rgba(192,132,252,.45);background:#050505 url(../../logos/panels/bg-alloc.webp) center/cover;position:relative;overflow:hidden;padding:20px 22px 22px}
.ta::before{content:'';position:absolute;inset:0;background:rgba(5,5,5,.55)}
.ta>*{position:relative}
.ta .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ta .t{font:500 17px Orbitron;letter-spacing:.2em;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:10px;white-space:nowrap}
.ta .t img{width:36px;height:36px}
.ta .t .lg{width:24px;height:24px;border-radius:50%}
.ta .bs{margin-left:auto;display:flex;gap:8px}
.pbtn{font:700 10px Orbitron;letter-spacing:.14em;padding:8px 14px;border-radius:8px;color:#E9D5FF;background:rgba(168,85,247,.18);border:1px solid rgba(192,132,252,.55);box-shadow:0 0 12px -4px rgba(168,85,247,.7);text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pbtn.gold{color:#FFF1B8;background:linear-gradient(180deg,rgba(242,201,76,.28),rgba(242,201,76,.10));border-color:rgba(242,211,91,.8);box-shadow:0 0 14px -3px rgba(242,201,76,.8)}
.pbtn.green{color:#E2FFD0;background:linear-gradient(180deg,rgba(124,252,0,.24),rgba(124,252,0,.08));border-color:rgba(124,252,0,.75);box-shadow:0 0 14px -3px rgba(124,252,0,.7)}
.pbtn svg{width:13px;height:13px}
.pbtn .n{font-weight:900}
.ta .body{display:flex;gap:22px;align-items:center;margin-top:18px;opacity:.55}
.ta .ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(#f97316 0 5%,#3b82f6 5% 35%,#a855f7 35% 52%,#ec4899 52% 75%,#EAB308 75% 100%);-webkit-mask:radial-gradient(circle,transparent 46%,#000 47%);mask:radial-gradient(circle,transparent 46%,#000 47%)}
.ta .lines{font:500 15px Rajdhani;color:rgba(255,255,255,.6);line-height:1.75}
.ta.ph{width:358px;padding:16px}
.ta.ph .t{font-size:13px;letter-spacing:.16em}.ta.ph .t img{width:28px;height:28px}
.ta.ph .bs{margin-left:0;width:100%;justify-content:flex-end}

/* ===== the window ===== */
.t1{--a:#F2C94C;--rgb:242,201,76;--hi:#F6E98A;--halo:255,120,20;--ring:255,190,80;container-type:inline-size;position:relative;width:980px;border-radius:20px;border:2px solid var(--a);background:#06070a;overflow:hidden;box-shadow:0 0 60px -10px rgba(var(--rgb),.5);font-family:Rajdhani}
.t1.ufo{--a:#7CFC00;--rgb:124,252,0;--hi:#C8FF9A;--halo:110,255,40;--ring:140,255,60}
.t1.ph{width:390px}
.t1 .x{position:absolute;right:14px;top:14px;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}

/* hero */
.hd{position:relative;height:250px;overflow:hidden}
.hd .sky{position:absolute;inset:0;background:url(../../logos/leagues/lg-sea-wide.webp) center 30%/cover no-repeat}
.B .hd .sky{background:url(../../logos/portfolio/rk-plate-nf.webp) center 40%/cover no-repeat}
.B.ufo .hd .sky{filter:hue-rotate(62deg) saturate(1.15)}
.A.ufo .hd .sky{filter:hue-rotate(-40deg) saturate(1.1)}
.hd .fade{position:absolute;inset:0;background:radial-gradient(ellipse 30% 42% at 50% 52%,rgba(0,0,0,.45),rgba(0,0,0,0)),linear-gradient(180deg,rgba(0,0,0,.25) 0,rgba(0,0,0,0) 30%,rgba(6,7,10,.2) 70%,#06070a 100%)}
.hd .whale{position:absolute;left:-26px;top:70px;width:250px;max-width:none;transform:rotate(14deg);filter:drop-shadow(0 8px 14px rgba(0,0,0,.7))}
.hd .shark{position:absolute;right:-4px;top:72px;width:190px;max-width:none;transform:rotate(-10deg);filter:drop-shadow(0 8px 14px rgba(0,0,0,.7))}
.coin{--u:.5px;position:absolute;left:50%;top:44px;transform:translateX(-50%);width:calc(195*var(--u));height:calc(195*var(--u))}
.coin .halo{position:absolute;inset:calc(-70*var(--u));border-radius:50%;background:radial-gradient(circle,rgba(var(--halo),.24) 45%,rgba(var(--halo),.06) 60%,rgba(0,0,0,0) 72%)}
.coin .corona{position:absolute;left:calc(-162*var(--u));top:calc(-162*var(--u));width:calc(520*var(--u));height:calc(520*var(--u));max-width:none;mix-blend-mode:screen}
.coin>img.lg{position:relative;width:100%;height:100%;border-radius:50%;filter:brightness(1.08) contrast(1.05);box-shadow:0 0 calc(10*var(--u)) calc(2*var(--u)) rgba(var(--ring),.55)}
.ttl{position:absolute;left:0;right:0;top:160px;text-align:center;text-shadow:0 2px 8px #000,0 0 18px rgba(0,0,0,.9)}
.ttl .k{font:900 34px Orbitron;letter-spacing:.08em;color:#fff;line-height:1}
.ttl .k em{font-style:normal;color:var(--a);text-shadow:0 0 18px rgba(var(--rgb),.6),0 2px 8px #000}
.ttl .s{font:600 15px Rajdhani;color:rgba(255,255,255,.78);margin-top:6px}
/* the holders / stakers switch, in the hero like the Leagues basis toggle */
.sw{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:3;display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(var(--rgb),.45);box-shadow:0 0 18px -6px rgba(var(--rgb),.6)}
.sw b{font:700 10.5px Orbitron;letter-spacing:.14em;padding:8px 16px;border-radius:999px;color:rgba(255,255,255,.55);white-space:nowrap}
.sw b.on{color:#1a1200;background:linear-gradient(180deg,#FFE27A,#F2C94C 55%,#D9A520);box-shadow:0 0 14px rgba(242,201,76,.55)}

/* stat tiles */
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px;margin-top:-4px;position:relative;z-index:2}
.tile{border-radius:12px;border:1.5px solid rgba(var(--rgb),.6);background:linear-gradient(180deg,rgba(var(--rgb),.14),rgba(6,7,10,.92) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px -8px rgba(var(--rgb),.6);padding:10px 12px 10px;min-width:0}
.tile.lead{border-color:var(--a);box-shadow:0 0 22px -4px rgba(var(--rgb),.75),inset 0 1px 0 rgba(255,255,255,.14)}
.tile .l{font:700 9.5px Orbitron;letter-spacing:.12em;color:var(--hi);text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tile .l svg{width:13px;height:13px;flex:none;color:var(--a)}
.tile .v{font:700 24px Rajdhani;color:#fff;margin-top:4px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:14px;color:rgba(255,255,255,.6);font-weight:600;margin-left:3px}
.tile .f{font:600 13px Rajdhani;color:rgba(255,255,255,.55);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usd{color:#39E15A!important}

/* check-a-wallet */
.chk{margin:14px 16px 0;border-radius:14px;border:1px solid rgba(var(--rgb),.55);background:rgba(0,0,0,.5);padding:12px 14px 13px;box-shadow:0 0 18px rgba(var(--rgb),.1),inset 0 1px 0 rgba(255,255,255,.06)}
.chk .hh{display:flex;align-items:center;justify-content:space-between;gap:10px;font:900 12.5px Orbitron;letter-spacing:.12em;color:var(--hi)}
.chk .hh span{display:flex;align-items:center;gap:8px}
.chk .hh svg{width:15px;height:15px;color:var(--a)}
.chk .hh .r{font:600 13px Rajdhani;letter-spacing:0;color:rgba(255,255,255,.5)}
.bar1{display:flex;gap:8px;margin-top:9px}
.inp{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:42px;border-radius:10px;border:1.5px solid rgba(var(--rgb),.7);background:rgba(var(--rgb),.06);padding:0 12px;box-shadow:0 0 12px -4px rgba(var(--rgb),.6),inset 0 1px 3px rgba(0,0,0,.6)}
.inp svg{width:16px;height:16px;color:rgba(255,255,255,.45);flex:none}
.inp .tx{font:600 16px Rajdhani;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.inp .tx.ph{color:rgba(255,255,255,.35)}
.go{height:42px;padding:0 18px;border-radius:10px;font:900 12px Orbitron;letter-spacing:.12em;color:#1a1200;background:linear-gradient(180deg,#FFE27A,#F2C94C 50%,#D9A520);box-shadow:0 0 16px -2px rgba(242,201,76,.6);display:flex;align-items:center}
.ufo .go{background:linear-gradient(180deg,#B4FF86,#6DF04A 50%,#3FC71F);color:#07200a;box-shadow:0 0 16px -2px rgba(124,252,0,.55)}
.ufo .sw b.on{background:linear-gradient(180deg,#B4FF86,#6DF04A 50%,#3FC71F);color:#07200a}
.mine{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font:600 13px Rajdhani;color:rgba(255,255,255,.5)}
.mine i{font-style:normal;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.04)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.res .tile{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);box-shadow:none}
.res .tile .l{color:rgba(255,255,255,.62)}
.res .tile .f{white-space:normal}
.res .tile.hot{border-color:rgba(var(--rgb),.85);background:linear-gradient(180deg,rgba(var(--rgb),.16),rgba(0,0,0,.5));box-shadow:0 0 18px -6px rgba(var(--rgb),.7)}
.res .tile.hot .l{color:var(--hi)}
.res .tile.in{border-color:rgba(57,225,90,.8);background:linear-gradient(180deg,rgba(57,225,90,.16),rgba(0,0,0,.5));box-shadow:0 0 18px -6px rgba(57,225,90,.7)}
.res .tile.in .l{color:#9CF5AE}
.lgc{display:inline-flex;align-items:center;gap:5px;font:700 13px Rajdhani;color:rgba(255,255,255,.75);vertical-align:middle}
.lgc img{width:22px;height:22px;display:inline-block}
.ii{display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid rgba(255,255,255,.45);font:700 10px Rajdhani;color:rgba(255,255,255,.7);align-items:center;justify-content:center}
.prog{margin-top:9px;display:flex;align-items:center;gap:10px;font:600 13px Rajdhani;color:rgba(255,255,255,.6)}
.prog .tr{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.prog .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#B8891A,#F2D35B 70%,#FFF2B0);box-shadow:0 0 10px rgba(242,211,91,.55)}
.ufo .prog .tr i{background:linear-gradient(90deg,#2E9E14,#7CFC00 70%,#E2FFC8);box-shadow:0 0 10px rgba(124,252,0,.5)}
.prog b{color:#fff;font-weight:700}

/* podium */
.pod{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:12px;padding:16px 16px 4px;align-items:end}
.pc{position:relative;border-radius:14px;padding:14px 12px 12px;text-align:center;border:1.5px solid var(--m);background:linear-gradient(180deg,rgba(var(--mr),.18),rgba(6,7,10,.95) 62%);box-shadow:0 0 22px -6px rgba(var(--mr),.7),inset 0 1px 0 rgba(255,255,255,.12);min-width:0}
.pc.g{--m:#F2C94C;--mr:242,201,76;padding-top:18px}
.pc.s{--m:#C9D3E0;--mr:201,211,224}
.pc.b{--m:#D98A4E;--mr:217,138,78}
.pc .md{width:54px;height:54px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 22px Orbitron;color:#120d00;background:radial-gradient(circle at 35% 30%,#fff 0,var(--m) 35%,rgba(var(--mr),.6) 100%);box-shadow:0 0 18px rgba(var(--mr),.8),inset 0 -3px 6px rgba(0,0,0,.35)}
.pc.g .md{width:66px;height:66px;font-size:27px}
.pc .cr{position:absolute;top:10px;right:10px;width:34px;height:34px}
.pc .ad{font:700 16px Rajdhani;color:#fff;margin-top:8px;letter-spacing:.02em}
.pc .bl{font:700 26px Rajdhani;color:var(--m);line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.pc.g .bl{font-size:31px}
.pc .bl small{font-size:14px;color:rgba(255,255,255,.6);margin-left:3px}
.pc .uv{font:700 15px Rajdhani;color:#39E15A}
.pc .sh{font:600 13px Rajdhani;color:rgba(255,255,255,.55)}
/* B: #1 in the laurel art */
.B .pc.g{background:#06070a url(../../logos/portfolio/rk-hero.webp) center/120% no-repeat;border:0;box-shadow:0 0 26px -6px rgba(242,201,76,.75)}
.B.ufo .pc.g{filter:hue-rotate(62deg) saturate(1.1)}

/* the list */
.lst{margin:12px 16px 0;border-radius:14px;border:1px solid rgba(var(--rgb),.35);background:rgba(0,0,0,.42);overflow:hidden}
.lst .th,.lst .r{display:grid;grid-template-columns:52px minmax(0,1.25fr) 46px minmax(0,1.9fr) 74px 98px;align-items:center;gap:10px;padding:0 14px}
.lst.stk .th,.lst.stk .r{grid-template-columns:52px minmax(0,1.25fr) minmax(0,1.9fr) 104px 74px 98px}
.lst .th{height:34px;font:700 9.5px Orbitron;letter-spacing:.12em;color:var(--hi);text-transform:uppercase;border-bottom:1px solid rgba(var(--rgb),.25);background:rgba(var(--rgb),.06)}
.lst .th b:nth-child(n+5){text-align:right}
.lst.stk .th b:nth-child(n+4){text-align:right}
.lst .r{height:44px;border-bottom:1px solid rgba(255,255,255,.05);font:600 15px Rajdhani}
.lst .r:nth-child(odd){background:rgba(255,255,255,.015)}
.r .rk{font:900 13px Orbitron;color:var(--a);text-align:center}
.r .ad{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;font-weight:600;letter-spacing:.02em}
.r .ad svg{width:13px;height:13px;color:rgba(255,255,255,.35);flex:none}
.r .ad .tag{font:700 9px Orbitron;letter-spacing:.1em;padding:2px 6px;border-radius:4px;background:rgba(var(--rgb),.2);color:var(--hi);border:1px solid rgba(var(--rgb),.5)}
.r .ad .tag.you{background:rgba(57,225,90,.18);color:#9CF5AE;border-color:rgba(57,225,90,.6)}
.r img.sea{width:32px;height:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
.r .bal{display:flex;align-items:center;gap:10px;min-width:0}
.r .bal .bb{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;min-width:30px;position:relative}
.r .bal .bb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,rgba(var(--rgb),.45),var(--a));box-shadow:0 0 8px rgba(var(--rgb),.45)}
.r .bal .bb i.lk{background:repeating-linear-gradient(135deg,rgba(236,72,153,.95) 0 4px,rgba(190,40,120,.95) 4px 8px);box-shadow:0 0 8px rgba(236,72,153,.5)}
.r .bal .n{font:700 16px Rajdhani;color:#fff;min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
.r .pc2{text-align:right;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.r .uv{text-align:right;color:#39E15A;font-weight:700;font-variant-numeric:tabular-nums}
.r .lk2{text-align:right;color:#F9A8D4;font-variant-numeric:tabular-nums}
.lst .r.me{background:linear-gradient(90deg,rgba(57,225,90,.16),rgba(57,225,90,.03))!important;box-shadow:inset 3px 0 0 #39E15A}
.lst .r.cut{box-shadow:inset 0 -2px 0 rgba(var(--rgb),.75)}
.lst .gap{height:30px;display:flex;align-items:center;justify-content:center;font:700 10px Orbitron;letter-spacing:.14em;color:rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.05);background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px)}
.lst .line{height:30px;display:flex;align-items:center;gap:10px;padding:0 14px;font:700 10px Orbitron;letter-spacing:.14em;color:var(--hi);background:rgba(var(--rgb),.08)}
.lst .line::before,.lst .line::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.8),transparent)}
.lst .scroll{max-height:none}
.ft{padding:12px 18px 6px;font:600 13px Rajdhani;color:rgba(255,255,255,.45);text-align:center;line-height:1.4}
.cl{margin:8px 16px 16px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 15px Orbitron;letter-spacing:.06em;color:#1a1200;background:linear-gradient(180deg,#FFE27A 0%,#F2C94C 50%,#D9A520 100%);box-shadow:0 0 22px -4px rgba(242,201,76,.6)}
.ufo .cl{background:linear-gradient(180deg,#B4FF86 0%,#6DF04A 50%,#3FC71F 100%);color:#07200a}
.tipc{position:absolute;z-index:6;width:300px;border-radius:10px;border:1px solid rgba(242,211,91,.6);background:#0b0c10;padding:10px 12px;font:600 13.5px Rajdhani;color:rgba(255,255,255,.8);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.tipc b{color:#F6E98A}

/* the phone layout — a container query on the window's own width */
@container (max-width:560px){
  .hd{height:206px}.coin{--u:.4px;top:46px}.ttl{top:128px}.ttl .k{font-size:24px}.ttl .s{font-size:13px;padding:0 20px}
  .hd .whale{width:150px;left:-30px;top:66px}.hd .shark{width:112px;right:-14px;top:70px}
  .sw b{font-size:9px;padding:7px 11px}
  .st4{grid-template-columns:1fr 1fr;gap:8px;padding:0 10px}
  .tile{padding:8px 10px}.tile .v{font-size:19px}.tile .l{font-size:8.5px;letter-spacing:.08em}.tile .f{font-size:12px}
  .chk{margin:12px 10px 0;padding:10px}.chk .hh{font-size:11px}.chk .hh .r{display:none}
  .go{padding:0 12px;font-size:10.5px}.inp .tx{font-size:14.5px}
  .res{grid-template-columns:1fr 1fr;gap:8px}
  .pod{grid-template-columns:1fr 1fr 1fr;gap:6px;padding:12px 10px 2px}
  .pc{padding:10px 4px 8px}.pc .md{width:36px;height:36px;font-size:15px}.pc.g .md{width:44px;height:44px;font-size:18px}.pc .cr{display:none}
  .pc .ad{font-size:12px;margin-top:6px}.pc .bl,.pc.g .bl{font-size:18px}.pc .bl small{display:none}.pc .uv{font-size:12.5px}.pc .sh{font-size:11px}
  .lst{margin:10px 10px 0}
  .lst .th,.lst .r,.lst.stk .th,.lst.stk .r{grid-template-columns:34px minmax(0,1fr) 30px 108px;gap:6px;padding:0 8px}
  .lst.stk .th,.lst.stk .r{grid-template-columns:34px minmax(0,1fr) 116px}
  .lst .th b.hp,.lst .r .hp,.lst .th .hp{display:none}
