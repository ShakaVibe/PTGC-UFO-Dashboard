          console.warn(`  Token amount ${tokenAmount.toLocaleString()} seems too high, skipping`);
          return null;
        }
        
        return {
          tokenAmount,
          liquidityUsd

      const fetchMoonReserves=async()=>{
        if(!moonPairs.length)return;

          const mCfg=TOKENS[moonToken]||cfg;

          // 1. Fetch PTGC/UFO pool reserves (for pool price + liquidity weighting)
          for(let i=0;i<moonPairs.length;i++){

            if(!res.result||res.result==='0x'||res.result.length<130)continue;
            const r0=BigInt('0x'+res.result.slice(2,66));
            const r1=BigInt('0x'+res.result.slice(66,130));

                const baseAddr=(p.baseToken?.address||'').toLowerCase();
                const quoteAddr=(p.quoteToken?.address||'').toLowerCase();
                const thisAddr=pair.coreAddress.toLowerCase();
                const otherAddr=baseAddr===thisAddr?quoteAddr:baseAddr;
                if(coreAddressSet.has(otherAddr)&&otherAddr!==thisAddr){
                  const otherSym=coreAddrToSymbol[otherAddr];
                  if(otherSym){
                    // Keep highest-liq pool per core pair (dedup V1/V2)
                    if(!crossLiq[otherSym]||pLiq>crossLiq[otherSym])crossLiq[otherSym]=pLiq;
                  }
                }
              });
              coreLiqResults[pair.coreSymbol]=totalLiq;
              // Convert cross-liq to weights (fraction of this core's total liq)
              if(totalLiq>0){
                const weights={};
                Object.entries(crossLiq).forEach(([sym,liq])=>{weights[sym]=liq/totalLiq;});
                crossWeights[pair.coreSymbol]=weights;
              }
            }catch(e){console.error('Core liq fetch error:',pair.coreSymbol,e);}
          }
          setMoonCoreLiq(coreLiqResults);
          setMoonCrossWeights(crossWeights);
        }catch(e){console.error('Moon data error:',e)}
        setMoonLoading(false);
      };

      // INDIRECT MODEL: Someone buys $X of a core token → core price rises → PTGC price rises
      // BUT dampened by pool weight: the PTGC/core pool is only a fraction of total PTGC liquidity.
      // Arbitrage bots equalize price across all PTGC pools, so PTGC's net USD gain is proportional
      // to how much of its liquidity sits in that core's pool.
      // Formula: tokenXmult = (w * sqrt(coreXmult) + (1 - w))^2  where w = poolLiq / totalTokenLiq
      const calcMoonImpact=(coreTotalLiqUSD,corePriceUSD,injectedUSD,ptgcPoolPrice,circSupply,poolLiqUSD,totalTokenLiqUSD,marketPrice)=>{
        if(!coreTotalLiqUSD||coreTotalLiqUSD<=0||!corePriceUSD||corePriceUSD<=0||!injectedUSD||injectedUSD<=0)return null;
        // Model core token's total DEX liquidity as one aggregated constant-product pool
        const reserveUSD=coreTotalLiqUSD/2;
        const reserveCore=reserveUSD/corePriceUSD;
        // Constant product swap: buy core tokens with $injectedUSD (0.3% fee)
        const amtInWithFee=injectedUSD*997;
        const coreOut=(amtInWithFee*reserveCore)/(reserveUSD*1000+amtInWithFee);
        if(coreOut>=reserveCore*0.999)return null;
        const newReserveUSD=reserveUSD+injectedUSD;
        const newReserveCore=reserveCore-coreOut;
        const newCorePrice=newReserveUSD/newReserveCore;
        const coreXmult=newCorePrice/corePriceUSD;
        // Pool-weight dampening using AMM multi-pool equilibrium formula.
        // When arb bots equalize prices across all constant-product pools,
        // token conservation gives: tokenXmult = (w * sqrt(coreXmult) + (1 - w))^2
        // where w = fraction of token's liquidity in the affected core's pool.
        // This is more accurate than linear dampening (which overestimates impact).
        const poolWeight=(poolLiqUSD>0&&totalTokenLiqUSD>0)?Math.min(poolLiqUSD/totalTokenLiqUSD,1):1;
        const sqrtCore=Math.sqrt(coreXmult);
        const tokenXmult=Math.pow(poolWeight*sqrtCore+(1-poolWeight),2);
        // Use market price (not pool-specific price) as base — pool-weight dampening already accounts for partial exposure
        const basePrice=marketPrice||ptgcPoolPrice;
        const newPriceUSD=basePrice*tokenXmult;
        const newMcap=newPriceUSD*(circSupply||circulatingSupply);
        return{newCorePrice,oldCorePrice:corePriceUSD,coreXmult,tokenXmult,newPriceUSD,xMult:tokenXmult,newMcap,coreTotalLiqUSD,poolWeight};

        const reserveUSD=totalTokenLiqUSD/2;

                        <div className="flex items-center gap-3">
                          <img src={ufoCfg.logo} alt="" className="w-7 h-7 flex-shrink-0"/>
                          <div className="flex-1 h-7 rounded-full overflow-hidden" style={{background:'rgba(255,255,255,0.05)'}}>
                            <div className="h-full rounded-full flex items-center justify-end px-3 transition-all" style={{width:`${maxAPY>0?Math.max((ufoAPY/maxAPY)*100,8):0}%`,background:'linear-gradient(90deg,rgba(124,252,0,0.3),rgba(124,252,0,0.6))'}}>
                              <span className="text-black text-lg font-bold whitespace-nowrap" style={{textShadow:'0 0 6px rgba(255,255,255,0.8), 0 0 12px rgba(255,255,255,0.4)'}}>{ufoAPY.toFixed(2)}%</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    );
                  })()}
                </div>
              </div>
              )}
              
              {/* Disclaimer */}
              <div className="rounded-xl bg-white/[0.02] border border-white/[0.05] px-5 py-4">
                <div className="flex items-start gap-3">
                  <span className="text-yellow-500/60 text-lg mt-0.5">{'\u26A0\uFE0F'}</span>
                  <div className="text-white/35 text-sm leading-relaxed">
                    <span className="text-yellow-500/60 font-bold uppercase text-xs">Educational Tool — Not Financial Advice</span>
                    <p className="mt-2">The New Capital Simulator calculator provides <strong className="text-white/50">rough estimates for entertainment and educational purposes only</strong>. All projections shown are hypothetical and based on current conditions at the time of calculation. Token amounts are calculated using live prices and account for buy fees (PTGC {(ptgcCfg.taxRate*100)}%, UFO {(ufoCfg.taxRate*100)}%).</p>
                    <p className="mt-2"><strong className="text-yellow-500/50">Results will NOT match reality.</strong> There are countless real-world factors that will cause actual outcomes to differ significantly from these projections, including but not limited to: changes in trading volume (which fluctuates constantly and can drop to near zero), price volatility and market crashes, changes in the number of holders and their proportional share of supply, staking pool size changes as other users stake or unstake, LP pool composition changes, arbitrage bot activity, MEV and front-running, slippage on large trades, sell pressure from other holders, overall crypto market cycles and sentiment, regulatory changes, smart contract risks, liquidity additions and removals, token burns affecting supply, whale activity, exchange listings or delistings, and general macroeconomic conditions.</p>
                    <p className="mt-2"><strong className="text-white/50">Past performance does not guarantee future results.</strong> Historical volume averages shown here reflect past activity and should not be interpreted as a prediction of future volume. A token that had $5M daily volume last month could have $50K daily volume next month, or vice versa. Reward projections scale linearly with volume — if volume drops 90%, your rewards drop 90%.</p>
                    <p className="mt-2">For UFO LP rewards, your share rate equals the UFO tokens you deposit. LP requires matching value on the other side of the pair, which is <strong className="text-white/50">not included</strong> in the investment calculation above. LP providers are also exposed to impermanent loss, which can reduce the total value of your position. Holder reflections exclude tokens locked in LP contracts from the eligible supply calculation.</p>
                    <p className="mt-2 text-yellow-500/40">This tool does not constitute financial advice. Always do your own research (DYOR), consult with a qualified financial advisor before making investment decisions, and <strong className="text-white/50">never invest more than you can afford to lose</strong>. Cryptocurrency investments carry significant risk including the potential loss of your entire investment.</p>
                  </div>
                </div>
              </div>
            </div>
            );
          })()}          
          {/* ====== LV ANALYSER TAB ====== */}
          {calcTab==='lv'&&(
            <LVAnalyserTab />
          )}

          {/* ====== GROWTH PROJECTION (hidden, dot-triggered) ====== */}
          {calcTab==='growth'&&(
            <GrowthProjectionTab cfg={cfg} theme={theme} />
          )}



          <div className="mt-10 text-center">
            <button onClick={onBack} className="px-6 py-2.5 rounded-lg border border-white/10 text-white/40 hover:text-white/70 hover:border-white/20 transition-all text-base">
              {'\u2190'} Back to Dashboard
            </button>
          </div>
        </div>
      );
    };

    // ===== CALCULATORS PAGE WRAPPER =====
    const CalculatorsPage=()=>{
      const[token,setToken]=useState(()=>{
        const p=new URLSearchParams(window.location.search).get('from');
        if(p==='PTGC'||p==='UFO')return p;
        try{const t=localStorage.getItem('ptgc_last_token');if(t==='PTGC'||t==='UFO')return t}catch(e){}
        return'PTGC';
      });
      const cfg=TOKENS[token];
      const isGold=cfg.color==='gold';
      const theme={text:isGold?'text-[#D9CA5D]':'text-[#7CFC00]',border:isGold?'border-[#D9CA5D]/30':'border-[#7CFC00]/30',bg:isGold?'bg-[#D9CA5D]':'bg-[#7CFC00]',card:'bg-[#111]/80'};
      
      const[data,setData]=useState(null);
      const[burn,setBurn]=useState({total:0,pct:0,supply:0});
      const[pls,setPls]=useState(0.00005);
      const[stakingData,setStakingData]=useState({totalInContract:0,staked:0,stakedPct:0,locked:0,lockedPct:0});
      const[volumeByPeriod,setVolumeByPeriod]=useState({vol24h:0,vol7d:0,vol30d:0,vol90d:0});
      const[totalUFOShareRate,setTotalUFOShareRate]=useState(0); // total UFO share rate from staking contract
      const[stakingPairs,setStakingPairs]=useState([]); // pair addresses from staking contract
      const[loading,setLoading]=useState(true);
      const[copied,setCopied]=useState(false);
      
      useEffect(()=>{
        setData(null);
        setBurn({total:0,pct:0,supply:0});
        setLoading(true);
        setStakingData({totalInContract:0,staked:0,stakedPct:0,locked:0,lockedPct:0});
        setVolumeByPeriod({vol24h:0,vol7d:0,vol30d:0,vol90d:0});
        
        const load=async()=>{
          await fetchCoingeckoData();
          const[d,b,p]=await Promise.all([
            fetchDex(cfg.address,cfg.mainPair),
            fetchBurn(cfg.address,cfg.decimals),
            fetchPLS()
          ]);
          setData(d);setBurn(b);setPls(p);setLoading(false);
          
          if(cfg.stakingContract){
            fetchStakingData(cfg.stakingContract,cfg.address,cfg.decimals,cfg.totalSupply).then(s=>setStakingData(s));
          }
          
          // Fetch total UFO share rate from LP staking contract
          if(token==='UFO'){
            try{
              const ufoStakedRes=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:UFO_LP_STAKING,data:'0x46c003ac'},'latest'],id:50});
              if(ufoStakedRes.result&&ufoStakedRes.result!=='0x'){
                const totalShares=Number(BigInt(ufoStakedRes.result))/Math.pow(10,18);
                console.log('UFO total share rate:',totalShares.toLocaleString());
                setTotalUFOShareRate(totalShares);
              }
              // Fetch staking pair addresses: pairs(0) through pairs(6)
              const pairAddrs=[];
              for(let i=0;i<7;i++){
                try{
                  const idx=BigInt(i).toString(16).padStart(64,'0');
                  const pRes=await rpcFetch({jsonrpc:'2.0',method:'eth_call',params:[{to:UFO_LP_STAKING,data:'0xb91ac788'+idx},'latest'],id:51+i});
                  if(pRes.result&&pRes.result!=='0x'){
                    const addr='0x'+pRes.result.slice(-40);
                    if(addr!=='0x0000000000000000000000000000000000000000')pairAddrs.push(addr);
                  }
                }catch(e){break}
              }
              console.log('Staking pairs found:',pairAddrs.length,pairAddrs);
              setStakingPairs(pairAddrs);
            }catch(e){console.error('UFOStaked fetch error:',e)}
          }
          
          if(coingeckoDataCache&&coingeckoDataCache[token]){
            const v24=d?.vol||0;
            setVolumeByPeriod({
              vol24h:v24,
              vol7d:coingeckoDataCache[token].volume?.vol7d||0,
              vol30d:coingeckoDataCache[token].volume?.vol30d||0,
              vol90d:coingeckoDataCache[token].volume?.vol90d||0
            });
          } else {
            setVolumeByPeriod({vol24h:d?.vol||0,vol7d:null,vol30d:null,vol90d:null});
          }
        };
        load();
      },[token]);
      
      const goBack=()=>{
        try{localStorage.setItem('ptgc_last_token',token)}catch(e){}
        window.location.href='./index.html';
      };
      
      const navTo=(page)=>{
        try{localStorage.setItem('ptgc_last_token',token)}catch(e){}
        if(page==='dashboard'||page==='kpi'||page==='social'){
          try{localStorage.setItem('ptgc_nav_tab',page)}catch(e){}
          window.location.href='./index.html?token='+token;
        } else if(page==='charts'){
          window.location.href='./charts.html';
        } else if(page==='portfolio'){
          window.location.href='./portfolio.html?from='+token;
        } else if(page==='affiliates'){
          try{localStorage.setItem('ptgc_nav_view','affiliates')}catch(e){}
          window.location.href='./index.html?token='+token;
        }
      };
      
      const switchToken=()=>{
        const next=token==='PTGC'?'UFO':'PTGC';
        try{localStorage.setItem('ptgc_last_token',next)}catch(e){}
        setToken(next);
      };
      
      const copyAddress=()=>{navigator.clipboard.writeText(cfg.address);setCopied(true);setTimeout(()=>setCopied(false),2000)};
      
      // Header computed values
      const plsRatio=data?.price&&pls?(data.price/pls).toFixed(2):'\u2014';
      const priceUp=(data?.change||0)>=0;
      const athPrice=coingeckoDataCache?.[token]?.ath||ATH_PRICES[token]||0;
      const xToATH=data?.price>0&&athPrice>data.price?(athPrice/data.price).toFixed(1):'\u2014';
      const xToPenny=data?.price>0&&data.price<0.01?(0.01/data.price).toFixed(1):'\u2014';
      const hdrFmtX=v=>{if(v==='\u2014')return'\u2014';const n=parseFloat(v);if(isNaN(n))return'\u2014';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e4)return(n/1e3).toFixed(0)+'K';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n>=100?Math.round(n)+'x':n.toFixed(1)+'x';};
      
      if(loading){
        return(
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className={`text-2xl font-bold ${theme.text} animate-pulse-slow font-orbitron`}>Loading Calculators...</div>
              <div className="text-white/30 text-sm mt-2">Fetching {cfg.name} data</div>
            </div>
          </div>
        );
      }
      
      return(
        <div className="min-h-screen bg-[#0a0a0a]">
          <header className="sticky top-0 z-50 bg-[#0a0a0a]/95 backdrop-blur border-b border-white/10">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-5">
              <div className="flex items-center justify-between flex-wrap gap-3">
                <div className="flex items-center gap-4 sm:gap-6">
                  <button onClick={goBack} className="text-white/40 hover:text-white/70 flex flex-col items-center leading-none transition-colors"><span className="text-xl">{'\u2190'}</span><span className="text-[9px] uppercase">Home</span></button>
                  <img src={cfg.logo} alt={token} className="w-20 h-20 sm:w-24 sm:h-24"/>
                  <div>
                    <span className={`font-orbitron text-3xl sm:text-4xl lg:text-5xl font-bold ${theme.text}`}>{token}</span>
                    <div className="flex items-center gap-1">
                      <span className="text-white/40 text-xs font-mono">{cfg.address.slice(0,6)}...{cfg.address.slice(-4)}</span>
                      <button onClick={copyAddress} className="text-white/40 hover:text-white/70 text-xs">{copied?'\u2713':'\u{1F4CB}'}</button>
                    </div>
                  </div>
                  <div className={`${theme.card} border ${theme.border} rounded-xl px-5 py-3 flex items-center gap-3`}>
                    <Price p={data?.price} c={`text-3xl sm:text-4xl font-bold ${theme.text}`}/>
                    <span className={`text-3xl font-bold ${priceUp?'text-green-400':'text-red-400'}`}>{priceUp?'\u25B2':'\u25BC'}{Math.abs(data?.change||0).toFixed(2)}%</span>
                  </div>
                  <div className={`${theme.card} border ${theme.border} rounded-xl px-4 py-2 flex items-center gap-3`}>
                    <div className="text-center"><div className="text-white text-xs uppercase leading-tight">PLS Ratio</div><div className={`text-2xl sm:text-3xl font-bold ${theme.text}`}>{plsRatio}</div></div>
                    <div className="w-px self-stretch bg-white/15"></div>
                    <div className="text-center"><div className="text-white text-xs uppercase leading-tight">X's to ATH</div><div className={`text-2xl sm:text-3xl font-bold ${theme.text}`}>{hdrFmtX(xToATH)}</div></div>
                    <div className="w-px self-stretch bg-white/15"></div>
                    <div className="text-center"><div className="text-white text-xs uppercase leading-tight">X's to a Penny</div><div className={`text-2xl sm:text-3xl font-bold ${theme.text}`}>{hdrFmtX(xToPenny)}</div></div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <a href={token==='PTGC'?'https://goptgc.com/#/ptgc-onboarding':'https://goptgc.com/#/ufo-onboarding'} target="_blank" rel="noopener noreferrer" className="buy-btn flex items-center gap-2 px-5 py-2 rounded-xl" style={{background:isGold?'linear-gradient(135deg, rgba(217,202,93,0.35), rgba(217,202,93,0.15))':'linear-gradient(135deg, rgba(124,252,0,0.35), rgba(124,252,0,0.15))',border:isGold?'1px solid rgba(217,202,93,0.5)':'1px solid rgba(124,252,0,0.5)',boxShadow:isGold?'0 0 20px rgba(217,202,93,0.2), inset 0 1px 0 rgba(255,255,255,0.15)':'0 0 20px rgba(124,252,0,0.2), inset 0 1px 0 rgba(255,255,255,0.15)'}}>
                    <img src={cfg.logo} alt={token} className="w-10 h-10"/>
                    <span className={`font-orbitron font-bold text-base ${theme.text}`}>BUY</span>
                  </a>
                  <button onClick={switchToken} className="flex items-center gap-2 px-4 py-2 rounded-xl border border-white/20 hover:border-white/40 hover:bg-white/5 transition-all">
                    <img src={token==='PTGC'?TOKENS.UFO.logo:TOKENS.PTGC.logo} alt="Switch" className="w-8 h-8"/>
                    <span className="text-white/70 text-sm font-medium">Switch</span>
                  </button>
                </div>
              </div>
              {/* Page Navigation */}
              <div className="flex justify-end -mt-1 -mb-3">
                <div className="flex items-center gap-1">
                  <button onClick={()=>navTo('dashboard')} className={`px-3 py-1 text-sm rounded font-medium transition-all border ${theme.border} ${theme.text} hover:bg-white/5`}>Dashboard</button>
                  <button onClick={()=>navTo('kpi')} className={`px-3 py-1 text-sm rounded font-medium transition-all border ${theme.border} ${theme.text} hover:bg-white/5`}>KPI Report</button>
                  <button onClick={()=>navTo('social')} className={`px-3 py-1 text-sm rounded font-medium transition-all border ${theme.border} ${theme.text} hover:bg-white/5`}>Social</button>
                  <span className={`px-3 py-1 text-sm rounded font-medium ${theme.bg} text-black`}>Calculators</span>
                  <button onClick={()=>navTo('charts')} className={`px-3 py-1 text-sm rounded font-medium transition-all border ${theme.border} ${theme.text} hover:bg-white/5`}>Charts</button>
                  <button onClick={()=>navTo('portfolio')} className="px-3 py-1 text-sm rounded font-medium transition-all border border-[#D9CA5D]/40 hover:bg-[#D9CA5D]/10"><span style={{background:'linear-gradient(to right,#D9CA5D,#7CFC00)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Portfolio</span></button>
                  <button onClick={()=>navTo('affiliates')} className="px-3 py-1 text-sm rounded font-medium transition-all border border-purple-500/40 text-purple-300 hover:bg-purple-500/20">Affiliates</button>
                </div>
              </div>
            </div>
          </header>
          <CalculatorsTab token={token} cfg={cfg} data={data} burn={burn} pls={pls} theme={theme} stakingData={stakingData} volumeByPeriod={volumeByPeriod} totalUFOShareRate={totalUFOShareRate} stakingPairs={stakingPairs} onBack={goBack}/>
        </div>
      );
    };
    
    ReactDOM.createRoot(document.getElementById('root')).render(<CalculatorsPage/>);
  </script>
</body>
</html>
